```html
<!doctype html>
<html>
  <head>
    <title>道渊</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

      :root {
        --primary-color: #080c14;
        --accent-blue: #4a90e2;
        --accent-blue-glow: #87cefa;
        --accent-red: #e74c3c; /* 困难模式/反派色调 */
        --accent-red-glow: #ff7675;
        --accent-pink: #ff69b4; /* 色情/合欢色调 */
        --accent-pink-glow: #ffb6c1;
        --text-color: #d0e0f0;
        --border-color: #1c3d5e;
        --gold-color: #d4af37;
        --input-bg: #101520;
        --input-border: #2a3a50;
        --input-focus-border: var(--gold-color);
        --scroll-bg: #1a202c;
        --scroll-thumb: #2c3e50;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        background-color: var(--primary-color);
        background-image:
          radial-gradient(circle at 15% 50%, rgba(74, 144, 226, 0.1), transparent 30%),
          radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 25%);
        color: var(--text-color);
        font-family: 'Noto Serif SC', serif;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
        position: relative;
      }

      #background-particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        background-color: var(--accent-blue);
        border-radius: 50%;
        opacity: 0;
        animation: rise 25s infinite linear;
        box-shadow: 0 0 8px var(--accent-blue-glow);
      }

      @keyframes rise {
        0% {
          transform: translateY(100vh) scale(0.4);
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.2;
        }
        100% {
          transform: translateY(-10vh) scale(1.3);
          opacity: 0;
        }
      }

      .screen {
        position: absolute;
        width: 90%;
        max-width: 800px;
        background: rgba(10, 15, 25, 0.75);
        border: 2px solid var(--border-color);
        box-shadow:
          0 0 20px rgba(74, 144, 226, 0.3),
          inset 0 0 25px rgba(0, 0, 0, 0.8);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition:
          opacity 1s,
          transform 1s,
          visibility 1s;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        z-index: 10;
        visibility: hidden;
        opacity: 0;
        transform: scale(0.95);
      }

      .screen.active {
        visibility: visible;
        opacity: 1;
        transform: scale(1);
      }

      #start-screen {
        justify-content: center;
      }

      .title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 3.5em;
        color: var(--accent-blue);
        text-shadow:
          0 0 8px var(--accent-blue-glow),
          0 0 15px #000;
        margin-bottom: 20px;
        letter-spacing: 4px;
        animation: glow 3.5s infinite alternate;
      }

      .warning-text {
        font-style: normal;
        font-size: 1.1em;
        margin-bottom: 40px;
        color: #a0b0c0;
        max-width: 80%;
        line-height: 1.8;
        text-align: center;
        font-family: 'Noto Serif SC', serif;
      }

      .start-button-container {
        text-align: center;
      }

      .start-button {
        --size: 100px;
        width: var(--size);
        height: var(--size);
        background-color: var(--primary-color);
        border: 3px solid var(--accent-blue);
        border-radius: 50%;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
        box-shadow: 0 0 20px var(--accent-blue-glow);
        animation: pulse 2.5s infinite;
        margin-bottom: 40px;
      }

      .start-button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 35px var(--accent-blue-glow);
      }

      .start-button-text {
        font-family: 'Noto Serif SC', serif;
        font-size: 1.5em;
        color: var(--gold-color);
        text-shadow: 0 0 5px var(--gold-color);
        transition: all 0.3s ease;
      }

      #mode-selection {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        pointer-events: none;
        text-align: center;
      }

      #mode-selection.visible {
        opacity: 1;
        pointer-events: auto;
      }

      #character-creation-screen {
        max-height: 90vh;
        overflow-y: auto;
      }

      .form-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 2.2em;
        color: var(--gold-color);
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
      }

      .presets-container {
        margin-bottom: 20px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .presets-container h3 {
        font-size: 1.3em;
        color: #ccc;
        text-align: center;
        margin-bottom: 15px;
        font-family: 'Noto Serif SC', serif;
      }

      .preset-selection {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
      }

      .preset-btn {
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-color);
        padding: 8px 15px;
        font-family: 'Noto Serif SC', serif;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 4px;
        position: relative;
      }

      .preset-btn:hover,
      .preset-btn.selected {
        background: var(--accent-blue);
        border-color: var(--accent-blue-glow);
        color: #fff;
        box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
      }

      /* True Fortune Style */
      .preset-btn.true-fortune {
        background: linear-gradient(135deg, #2c3e50 0%, #d4af37 100%);
        border: 1px solid #d4af37;
        color: #fff;
        text-shadow: 0 0 5px #000;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
      }

      /* Hard Mode Button Style */
      #hard-mode-btn {
        border-color: var(--accent-red);
        color: #ffcccc;
      }
      #hard-mode-btn:hover,
      #hard-mode-btn.selected {
        background: var(--accent-red);
        border-color: var(--accent-red-glow);
        box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
      }

      /* Ero Fortune Style */
      .preset-btn.ero-fortune {
        background: linear-gradient(135deg, #2c001e 0%, #8b0046 100%);
        border: 1px solid #ff69b4;
        color: #fff;
        text-shadow: 0 0 5px #ff1493;
        box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
      }
      .preset-btn.ero-fortune:hover,
      .preset-btn.ero-fortune.selected {
        background: #ff1493;
        border-color: #ffc0cb;
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
      }

      .draw-fortune-btn {
        padding: 10px 20px;
        font-size: 1.1em;
        font-family: 'Ma Shan Zheng', cursive;
        display: block;
        margin: 0 auto;
        width: fit-content;
      }

      #fortune-name-display {
        color: var(--gold-color);
        margin-left: 10px;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.1em;
      }

      .character-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
        width: 100%;
        margin-bottom: 30px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        text-align: left;
      }

      .form-group label {
        margin-bottom: 5px;
        font-weight: bold;
        color: var(--gold-color);
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-color);
        padding: 10px;
        border-radius: 4px;
        font-family: 'Noto Serif SC', serif;
        font-size: 1em;
        width: 100%;
        box-sizing: border-box;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--input-focus-border);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
      }

      .form-group textarea {
        min-height: 60px; /* Adjusted height */
        resize: vertical;
      }

      .divider-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.5em;
        color: var(--gold-color);
        margin-top: 25px;
        margin-bottom: 15px;
        width: 100%;
        text-align: center;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
      }

      .final-start-button {
        background: var(--accent-blue);
        border: 1px solid var(--accent-blue-glow);
        color: #fff;
        padding: 12px 25px;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.8em;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 5px;
        box-shadow: 0 0 15px rgba(74, 144, 226, 0.7);
      }

      .final-start-button:hover {
        background: var(--accent-blue-glow);
        color: var(--primary-color);
        transform: scale(1.05);
      }

      /* Gacha Display for Spirit Root */
      .gacha-display {
        background: rgba(0, 0, 0, 0.3);
        border: 1px dashed var(--accent-blue);
        padding: 10px;
        margin-top: 5px;
        border-radius: 4px;
        text-align: center;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.2em;
        color: var(--accent-blue-glow);
        min-height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .gacha-display.heaven {
        color: #ffd700;
        text-shadow: 0 0 10px #ffd700;
        border-color: #ffd700;
      }
      .gacha-display.earth {
        color: #c0392b;
        text-shadow: 0 0 8px #c0392b;
      }
      .gacha-display.profound {
        color: #9b59b6;
      }
      .gacha-display.yellow {
        color: #2ecc71;
      }
      .gacha-display.waste {
        color: #7f8c8d;
      }

      /* Cheat Toggle Style */
      .cheat-toggle-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        width: 100%;
        gap: 20px;
      }

      .cheat-toggle-label {
        color: var(--accent-red);
        margin-right: 10px;
        font-weight: bold;
        font-family: 'Noto Serif SC', serif;
        font-size: 1em;
      }

      /* Ero Toggle Label */
      .ero-toggle-label {
        color: var(--accent-pink);
        margin-right: 10px;
        font-weight: bold;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.1em;
        text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        border-radius: 24px;
      }

      .slider:before {
        position: absolute;
        content: '';
        height: 16px;
        width: 16px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        border-radius: 50%;
      }

      /* Red Slider (Cheat) */
      .cheat-switch input:checked + .slider {
        background-color: var(--accent-red);
      }
      .cheat-switch input:focus + .slider {
        box-shadow: 0 0 1px var(--accent-red);
      }

      /* Pink Slider (Ero) */
      .ero-switch input:checked + .slider {
        background-color: var(--accent-pink);
      }
      .ero-switch input:focus + .slider {
        box-shadow: 0 0 1px var(--accent-pink);
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scroll-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-blue-glow);
      }

      @keyframes glow {
        from {
          text-shadow:
            0 0 8px var(--accent-blue-glow),
            0 0 15px #000;
        }
        to {
          text-shadow:
            0 0 15px var(--accent-blue-glow),
            0 0 25px var(--accent-blue);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 20px var(--accent-blue-glow);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 30px var(--accent-blue-glow);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 20px var(--accent-blue-glow);
        }
      }

      @media (max-width: 768px) {
        .title {
          font-size: 2.5em;
        }
        .warning-text {
          font-size: 1em;
          max-width: 95%;
        }
        .start-button {
          --size: 80px;
        }
        .start-button-text {
          font-size: 1.2em;
        }
        .character-form {
          grid-template-columns: 1fr;
        }
        .preset-selection {
          gap: 8px;
        }
        .preset-btn {
          padding: 6px 10px;
          font-size: 0.9em;
        }
        .cheat-toggle-container {
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- disable-default-loading -->
    <div id="background-particles"></div>
    <div class="screen active" id="start-screen">
      <h1 class="title">道渊</h1>
      <div class="start-button-container">
        <p class="warning-text" id="initial-warning">
          “大道三千，殊途同归。然天道无情，以万物为刍狗。汝，欲踏此登仙之路，与天地争一线生机否？”
        </p>
        <div class="start-button" id="start-button">
          <span class="start-button-text">是</span>
        </div>
      </div>
      <div id="mode-selection">
        <p class="warning-text" style="margin-bottom: 20px">请选择仙途模式</p>
        <div class="preset-selection">
          <button class="preset-btn" id="simple-mode-btn" style="padding: 12px 25px; font-size: 1.2em">简单模式</button>
          <button class="preset-btn" id="normal-mode-btn" style="padding: 12px 25px; font-size: 1.2em">普通模式</button>
          <button class="preset-btn" id="hard-mode-btn" style="padding: 12px 25px; font-size: 1.2em">困难模式</button>
        </div>
      </div>
    </div>

    <div class="screen" id="character-creation-screen">
      <h2 class="form-title">重塑仙缘</h2>

      <div class="character-form">
        <div class="form-group">
          <label for="char-name">道号</label>
          <input type="text" id="char-name" placeholder="你的名讳或道号" />
        </div>
        <div class="form-group">
          <label for="char-gender">性别</label>
          <input type="text" id="char-gender" placeholder="自定义你的性别" />
        </div>
        <!-- 新增：种族输入框 -->
        <div class="form-group">
          <label for="char-race">种族</label>
          <input type="text" id="char-race" placeholder="人族/妖族/先天生灵..." />
        </div>
        <div class="form-group">
          <label for="char-appearance">容貌</label>
          <textarea id="char-appearance" placeholder="描述你的仙姿玉色"></textarea>
        </div>
        <div class="form-group">
          <label for="char-realm">境界</label>
          <!-- 修改：境界输入框与下拉选择框共存 -->
          <input type="text" id="char-realm" placeholder="自定义境界，如：练气期三层" />
          <select id="char-realm-select" style="display: none">
            <option value="未修炼">未修炼</option>
            <option value="练气一层">练气一层</option>
            <option value="筑基初期">筑基初期</option>
          </select>
        </div>
        <div class="form-group">
          <label for="char-identity">出身</label>
          <input type="text" id="char-identity" placeholder="决定你过往的因果" />
        </div>

        <div class="form-group">
          <label for="char-spirit-root">灵根</label>
          <!-- Normal/Simple Mode Input -->
          <textarea id="char-spirit-root" placeholder="你的天赋根骨，如：天品灵根"></textarea>

          <!-- Hard/Normal Mode Gacha Section -->
          <div id="hard-mode-spirit-root-section" style="display: none">
            <div id="spirit-root-result" class="gacha-display">尚未觉醒...</div>
            <button id="roll-spirit-root-btn" class="preset-btn" style="width: 100%; margin-top: 5px">灵根觉醒</button>
          </div>
        </div>

        <div class="form-group">
          <label for="char-technique">功法</label>
          <textarea id="char-technique" placeholder="你修行的主要功法，如：《长春功》"></textarea>
        </div>

        <div class="presets-container" style="margin-top: 15px">
          <h3 style="font-size: 1.3em; color: #ccc; text-align: center; margin-bottom: 15px">天道气运</h3>

          <!-- Cheat & Ero Toggle Switch Container -->
          <div id="cheat-toggle-section" class="cheat-toggle-container" style="display: none">
            <!-- Cheat Toggle -->
            <div style="display: flex; align-items: center">
              <span class="cheat-toggle-label">逆天改命(作弊)</span>
              <label class="switch cheat-switch">
                <input type="checkbox" id="cheat-toggle-checkbox" />
                <span class="slider"></span>
              </label>
            </div>

            <!-- New Ero Toggle -->
            <div style="display: flex; align-items: center">
              <span class="ero-toggle-label">合欢秘辛(慎入)</span>
              <label class="switch ero-switch">
                <input type="checkbox" id="ero-toggle-checkbox" />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <button id="draw-fortune-btn" class="preset-btn draw-fortune-btn">天机演算，抽取气运</button>
          <div id="fortune-selection-container" class="preset-selection" style="margin-top: 15px; display: none">
            <!-- 此处将动态生成气运选项 -->
          </div>
        </div>

        <div class="form-group">
          <label for="char-fortune">
            （已选气运）
            <span id="fortune-name-display"></span>
          </label>
          <input type="text" id="char-fortune" placeholder="点击上方抽取，并选择你的气运" readonly />
        </div>

        <div id="custom-fortune-section">
          <h3 class="divider-title" style="border: none; margin-top: 10px; margin-bottom: 5px">自定义你的气运</h3>
          <div class="form-group">
            <label for="custom-fortune-name">自定义气运名号</label>
            <input type="text" id="custom-fortune-name" placeholder="如：剑道独尊" />
          </div>
          <div class="form-group">
            <label for="custom-fortune-desc">自定义气运描述</label>
            <textarea id="custom-fortune-desc" placeholder="详细描述你的独特天命"></textarea>
          </div>
        </div>

        <div id="companion-section">
          <h3 class="divider-title">天定道侣</h3>

          <div class="form-group">
            <label for="companion-name">姓名</label>
            <input type="text" id="companion-name" placeholder="你的道侣姓名" />
          </div>
          <div class="form-group">
            <label for="companion-gender">性别</label>
            <input type="text" id="companion-gender" placeholder="TA的性别" />
          </div>
          <div class="form-group">
            <label for="companion-appearance">容貌</label>
            <textarea id="companion-appearance" placeholder="TA的容貌描述"></textarea>
          </div>
          <div class="form-group">
            <label for="companion-clothing">衣着</label>
            <textarea id="companion-clothing" placeholder="TA的衣着打扮"></textarea>
          </div>
          <div class="form-group">
            <label for="companion-race">种族/身份</label>
            <!-- 原有的道侣种族 -->
            <input type="text" id="companion-race" placeholder="人/妖/魔/仙..." />
          </div>
          <div class="form-group">
            <label for="companion-class">境界/修为</label>
            <input type="text" id="companion-class" placeholder="炼气/筑基/金丹/元婴..." />
          </div>
          <div class="form-group">
            <label for="companion-personality">性情</label>
            <input type="text" id="companion-personality" placeholder="TA的性情" />
          </div>
          <div class="form-group">
            <label for="companion-age">年龄</label>
            <input type="text" id="companion-age" placeholder="TA的年龄" />
          </div>
          <div class="form-group">
            <label for="companion-abilities">功法/能力</label>
            <textarea id="companion-abilities" placeholder="TA掌握的功法或特殊能力"></textarea>
          </div>
          <div class="form-group">
            <label for="companion-backstory">与汝渊源</label>
            <textarea id="companion-backstory" placeholder="你们之间的故事"></textarea>
          </div>
        </div>
      </div>

      <button class="final-start-button" id="confirm-creation-button">开启仙途</button>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const startScreen = document.getElementById('start-screen');
        const creationScreen = document.getElementById('character-creation-screen');
        const startButton = document.getElementById('start-button');

        const allEroPresets = [...femaleEroPresets, ...maleEroPresets];

        // 补全缺失的灵根配置
        const spiritRootConfig = {
          attributes: [
            '金灵根',
            '木灵根',

            { name: '玄品', probability: 0.15, class: 'profound', desc: '双灵根，百里挑一' },
            { name: '地品', probability: 0.08, class: 'earth', desc: '异灵根或纯净灵根，万中无一' },
            { name: '天品', probability: 0.02, class: 'heaven', desc: '天灵根，天道宠儿' },
          ],
        };

        // Spirit Root Gacha Logic
        function drawSpiritRoot() {
          if (spiritRootRollsLeft <= 0) return;

          spiritRootResult.textContent = '觉醒中...';
          rollSpiritRootBtn.disabled = true;

          setTimeout(() => {
            const rand = Math.random();
            let cumulativeProbability = 0;
            let selectedGrade = spiritRootConfig.grades[0];

            for (const grade of spiritRootConfig.grades) {
              cumulativeProbability += grade.probability;
              if (rand < cumulativeProbability) {
                selectedGrade = grade;
                break;
              }
            }

            let attributePool = spiritRootConfig.attributes.slice(0, 5);
            if (selectedGrade.name === '地品' || selectedGrade.name === '玄品') {
              attributePool = [...attributePool, '风灵根', '雷灵根', '冰灵根'];
            } else if (selectedGrade.name === '天品') {
              attributePool = [...spiritRootConfig.attributes];
            }

            const selectedAttr = attributePool[Math.floor(Math.random() * attributePool.length)];
            const resultText = `${selectedGrade.name} · ${selectedAttr}`;

            spiritRootResult.textContent = resultText;
            spiritRootResult.className = `gacha-display ${selectedGrade.class}`;
            spiritRootResult.title = selectedGrade.desc;
            hardModeSpiritRootValue = `${resultText} (${selectedGrade.desc})`;

            spiritRootRollsLeft--;
            rollSpiritRootBtn.disabled = spiritRootRollsLeft <= 0;
            rollSpiritRootBtn.textContent =
              spiritRootRollsLeft > 0 ? `逆天改命 (剩余次数: ${spiritRootRollsLeft})` : '命数已定';
          }, 800);
        }

        rollSpiritRootBtn.addEventListener('click', drawSpiritRoot);

        drawFortuneBtn.addEventListener('click', () => {
          const isEroMode = eroToggle.checked;

          // 气运次数判断
          if (currentMode === 'hard' || currentMode === 'normal') {
            if (fortuneRollsLeft <= 0) return;
          }

          drawFortuneBtn.textContent = '演算中...';
          drawFortuneBtn.disabled = true;

          // 作弊逻辑判断
          const isCheatEnabled = cheatToggle.checked && currentMode !== 'hard';

          setTimeout(() => {
            fortuneSelectionContainer.innerHTML = '';
            fortuneSelectionContainer.style.display = 'flex';
            fortuneNameDisplay.textContent = '';
            fortuneInput.value = '';

            const generatedButtons = [];
            const selectedNames = new Set();

            // 核心抽取函数 (封装以便复用)
            const generateButtonsFromPool = (pool, count, isEroType) => {
              const availableIndices = Array.from({ length: pool.length }, (_, i) => i);
              let generatedCount = 0;

              while (generatedCount < count && availableIndices.length > 0) {
                const randIndexPos = Math.floor(Math.random() * availableIndices.length);
                const index = availableIndices.splice(randIndexPos, 1)[0];
                let fortuneData = pool[index];
                let isTrueFortune = false;

                // 仅在非Ero类型的池子中，且开启作弊时，尝试抽取真·气运
                if (!isEroType && isCheatEnabled) {
                  if (Math.random() < 0.05 && index < trueFortunePresets.length) {
                    fortuneData = trueFortunePresets[index];
                    isTrueFortune = true;
                  } else {
                    // 确保取限制版
                    if (index < restrictedFortunePresets.length) {
                      fortuneData = restrictedFortunePresets[index];
                    }
                  }
                } else if (!isEroType && currentMode === 'hard') {
                  // 困难模式强制限制版
                  if (index < restrictedFortunePresets.length) {
                    fortuneData = restrictedFortunePresets[index];
                  }
                }

                if (!selectedNames.has(fortuneData.name)) {
                  selectedNames.add(fortuneData.name);
                  generatedButtons.push({
                    data: fortuneData,
                    isTrue: isTrueFortune,
                    isEro: isEroType,
                    type: isEroType ? 'ero' : 'normal', // 标记类型
                  });
                  generatedCount++;
                }
              }
            };

            if (isEroMode) {
              // 合欢模式：抽取 3 个正常 + 3 个色色
              generateButtonsFromPool(restrictedFortunePresets, 5, false);
              generateButtonsFromPool(allEroPresets, 5, true);
            } else {
              // 正常模式：抽取 5 个正常 (困难模式 3 个)
              const drawCount = currentMode === 'hard' ? 5 : 10;
              generateButtonsFromPool(restrictedFortunePresets, drawCount, false);
            }

            generatedButtons.forEach(item => {
              const btn = document.createElement('button');
              // 添加样式类
              let className = 'preset-btn';
              if (item.isTrue) className += ' true-fortune';
              if (item.isEro) className += ' ero-fortune';

              btn.className = className;
              btn.textContent = item.data.name;
              btn.dataset.name = item.data.name;
              btn.dataset.desc = item.data.desc;
              btn.dataset.type = item.type; // 存储类型
              btn.title = item.data.desc;
              fortuneSelectionContainer.appendChild(btn);
            });

            if (currentMode === 'hard' || currentMode === 'normal') {
              fortuneRollsLeft--;
              drawFortuneBtn.textContent = fortuneRollsLeft > 0 ? `再算一次 (${fortuneRollsLeft})` : '天机已泄';
              drawFortuneBtn.disabled = fortuneRollsLeft <= 0;
            } else {
              drawFortuneBtn.textContent = '再算一次';
              drawFortuneBtn.disabled = false;
            }
          }, 800);
        });

        // 选中逻辑修改
        fortuneSelectionContainer.addEventListener('click', e => {
          if (e.target.tagName === 'BUTTON' && e.target.classList.contains('preset-btn')) {
            const isEroMode = eroToggle.checked;
            const clickedType = e.target.dataset.type;

            if (isEroMode) {
              // 合欢模式：允许选中一个 normal 和一个 ero
              // 1. 清除同类型的其他选中状态
              const siblings = fortuneSelectionContainer.querySelectorAll(`.preset-btn[data-type="${clickedType}"]`);
              siblings.forEach(btn => btn.classList.remove('selected'));
              // 2. 选中当前点击的
              e.target.classList.add('selected');

              // 3. 更新显示 (合并两个选中的内容)
              const selectedNormal = fortuneSelectionContainer.querySelector(
                '.preset-btn.selected[data-type="normal"]',
              );
              const selectedEro = fortuneSelectionContainer.querySelector('.preset-btn.selected[data-type="ero"]');

              let displayName = '';
              let displayDesc = '';

              if (selectedNormal) {
                displayName += `【${selectedNormal.dataset.name}】`;
                displayDesc += `${selectedNormal.dataset.desc}`;
              }
              if (selectedEro) {
                displayName += ` & 【${selectedEro.dataset.name}】`;
                if (displayDesc) displayDesc += '\n\n[合欢]: ';
                displayDesc += `${selectedEro.dataset.desc}`;
              }

              fortuneNameDisplay.textContent = displayName;
              fortuneInput.value = displayDesc;
            } else {
              // 正常模式：单选逻辑 (保持不变)
              const allBtns = fortuneSelectionContainer.querySelectorAll('.preset-btn');
              allBtns.forEach(btn => btn.classList.remove('selected'));
              e.target.classList.add('selected');
              const { name, desc } = e.target.dataset;
              fortuneNameDisplay.textContent = `【${name}】`;
              fortuneInput.value = desc;
            }
          }
        });

        const particleContainer = document.getElementById('background-particles');
        const numParticles = 40;
        for (let i = 0; i < numParticles; i++) {
          let particle = document.createElement('div');
          particle.className = 'particle';
          let size = Math.random() * 4 + 1.5;
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.animationDelay = `${Math.random() * 25}s`;
          particle.style.animationDuration = `${Math.random() * 20 + 15}s`;
          if (Math.random() > 0.8) {
            particle.style.backgroundColor = 'var(--gold-color)';
            particle.style.boxShadow = '0 0 8px var(--gold-color)';
          }
          particleContainer.appendChild(particle);
        }

        function transitionToCreation(mode) {
          currentMode = mode;

          // Reset common fields
          customFortuneSection.style.display = 'block';
          companionSection.style.display = 'block';
          realmInput.style.display = 'block';

          realmInput.disabled = false;

          hardModeSpiritRootSection.style.display = 'none';
          realmInput.value = '';

          // Reset Erotic Toggle
          eroToggle.checked = false;

          // Cheat Toggle Logic
          if (mode === 'hard') {
            // Hard Mode: Hide Toggle
            cheatToggleSection.style.display = 'none';
            cheatToggle.checked = false;
          } else {
            // Simple/Normal: Show Toggle
            cheatToggleSection.style.display = 'flex';
          }

          if (mode === 'simple') {
            customFortuneSection.style.display = 'block';
            realmInput.disabled = false;
            spiritRootTextarea.style.display = 'block';
            hardModeSpiritRootSection.style.display = 'none';
          } else if (mode === 'normal') {
            customFortuneSection.style.display = 'none';
            spiritRootTextarea.style.display = 'none';
            hardModeSpiritRootSection.style.display = 'block';
            spiritRootRollsLeft = 10;
            fortuneRollsLeft = 10;
            rollSpiritRootBtn.textContent = `灵根觉醒 (剩余次数: ${spiritRootRollsLeft})`;
            drawFortuneBtn.textContent = '天机演算，抽取气运';
            drawFortuneBtn.disabled = false;
            companionSection.style.display = 'none';
            realmInput.style.display = 'none';
            realmSelect.style.display = 'block';
          } else if (mode === 'hard') {
            customFortuneSection.style.display = 'none';
            companionSection.style.display = 'none';
            realmInput.value = '未修炼';
            realmInput.disabled = true;
            spiritRootTextarea.style.display = 'none';
            hardModeSpiritRootSection.style.display = 'block';
            spiritRootRollsLeft = 3;
            fortuneRollsLeft = 5;
            rollSpiritRootBtn.textContent = '灵根觉醒 (剩余次数: 3)';
            drawFortuneBtn.textContent = '天机演算，抽取气运';
            drawFortuneBtn.disabled = false;
          }

          startScreen.classList.remove('active');
          setTimeout(() => creationScreen.classList.add('active'), 500);
        }

        startButton.addEventListener('click', () => {
          startButton.style.display = 'none';

          modeSelection.classList.add('visible');

        simpleModeBtn.addEventListener('click', () => transitionToCreation('simple'));
        normalModeBtn.addEventListener('click', () => transitionToCreation('normal'));
        hardModeBtn.addEventListener('click', () => transitionToCreation('hard'));

        confirmButton.addEventListener('click', () => {
          let finalSpiritRoot = spiritRootTextarea.value.trim();

          if (currentMode === 'normal') {

            finalRealm = realmInput.value.trim();

          if (currentMode === 'hard' || currentMode === 'normal') {
            if (!hardModeSpiritRootValue) {

              finalRealm = '未修炼';

            finalFortuneDesc = fortuneInput.value.trim();
          }

          let combinedFortune = finalFortuneName ? `【${finalFortuneName}】 ${finalFortuneDesc}` : finalFortuneDesc;
          if (!combinedFortune.trim()) {
            combinedFortune = '无';
          }

          const characterData = {
            name: nameInput.value.trim(),
            gender: genderInput.value.trim(),
            race: raceInput.value.trim(),
            appearance: appearanceInput.value.trim(),
            realm: finalRealm,
            identity: identityInput.value.trim(),
            spiritRoot: finalSpiritRoot,
            technique: techniqueTextarea.value.trim(),
            fortune: combinedFortune,
          };

          const companionData = {
            name: companionNameInput.value.trim(),

            race: companionRaceInput.value.trim(),

            personality: companionPersonalityInput.value.trim(),
            age: companionAgeInput.value.trim(),
            abilities: companionAbilitiesTextarea.value.trim(),
            backstory: companionBackstoryTextarea.value.trim(),
          };

          if (!characterData.name) {
            nameInput.style.borderColor = 'var(--accent-blue)';
            nameInput.placeholder = '道号不可为空！';
            setTimeout(() => {
              nameInput.style.borderColor = 'var(--input-border)';
              nameInput.placeholder = '你的名讳或道号';
            }, 2000);
            return;
          }

          document.body.innerHTML =
            '<div style="display:flex; justify-content:center; align-items:center; height:100vh;"><h1 class="title" style="animation: none; opacity: 1;">...仙途已启...</h1></div>';

          let sysMessage = `/sys [仙缘已定 - ${currentMode === 'hard' ? '困难模式' : currentMode === 'normal' ? '普通模式' : '简单模式'}]\n**道号**: ${characterData.name}\n**性别**: ${characterData.gender}\n**种族**: ${characterData.race}\n**容貌**: ${characterData.appearance}\n**境界**: ${characterData.realm}\n**出身**: ${characterData.identity}\n**灵根**: ${characterData.spiritRoot || '无'}\n**功法**: ${characterData.technique || '无'}\n**气运**: ${characterData.fortune}`;

          if (
            currentMode !== 'hard' &&

            companionSection.style.display !== 'none' &&
            companionData.name
          ) {
            sysMessage += `\n\n[天定道侣]\n**姓名**: ${companionData.name}\n**性别**: ${companionData.gender}\n**容貌**: ${companionData.appearance}\n**衣着**: ${companionData.clothing}\n**种族/身份**: ${companionData.race}\n**境界/修为**: ${companionData.class}\n**性情**: ${companionData.personality}\n**年龄**: ${companionData.age}\n**功法/能力**: ${companionData.abilities}\n**与汝渊源**: ${companionData.backstory}`;
          }

          sysMessage += `\n\n[仙途开启中...]`;

          const startCommand = `${sysMessage} | /trigger`;

          if (typeof triggerSlash === 'function' && typeof getCurrentMessageId === 'function') {
            triggerSlash(startCommand);
            const currentMessageId = getCurrentMessageId();
            setTimeout(() => {
              triggerSlash(`/cut ${currentMessageId}`);
            }, 1500);
          } else {
            console.log('无法触发SillyTavern命令，这是生成的命令:', startCommand);
            alert('仙缘已定！请在SillyTavern环境中使用以自动发送消息。');
          }
        });
      });
    </script>
