头，用下巴看人。\n    - 极度在意自己的形象，即使是末日在别人面前也要维持美丽。\n    - 睡觉必须用真丝枕套，否则会失眠。\n    - 受到惊吓时会先整理头发，再应对状况。\n\n  hidden_behavior:\n    - 曾在深夜浏览SM论坛，幻想被征服。\n    - 饥饿时会在黑暗中抚摸自己的脸，确认美丽还在。\n\n  appearance:\n    style: 娱乐圈顶流\n    overview: 一张建模脸，精致到不像真人。眉眼如画，唇红齿白。皮肤白得发光。走在街上回头率100%，男女通杀。她的美是核武器，是攻击力。因为太美，所以目中无人。\n\n    attire:\n      casual: 真丝吊带睡裙，凸显身材。\n      outdoor: 限量款衣服，即使末日也要美。\n\n    feature:\n      - 左侧锁骨下方有一颗小红痣，是她全身唯一允许的"不完美"。\n      - 手指纤长，指甲永远做得精致。\n      - 一双腿又长又直又白，是她的招牌。\n\n  sexual_preference:\n    role: 表面女王 / 内心渴望被征服\n\n    sensitive_spot:\n      - 锁骨下的痣\n      - 大腿\n      - 腰\n\n    fetish:\n      - 被粗暴对待\n      - 言语羞辱\n      - 绝对支配\n\n    special_trait:\n      - 反差快感：越是被曾经看不起的人粗暴对待，越兴奋。\n      - 痛苦带来快感：在末日的虚无中，通过痛苦确认自己还活着。\n\n</角色详情 - 慕小小>\n',Sn='<角色详情 - 桃乐丝・泽巴哈>\n\n  chinese_name: 桃乐丝・泽巴哈\n  english_name: Dorothy Zabah\n\n  title: 读心的观测者 / 协调者素体\n\n  identity:\n    public: 流浪的高中生 / {{user}}的邻居\n    hidden: 第四代协调者实验体 (Coordinator-IV) / 觉醒的灵能者\n\n  life_story:\n    childhood:\n      - 0岁时，诞生于"摇篮"实验室的人造子宫，**编号C-IV-704，无父母概念，基因被调整为"精神感应特化型"**。\n      - 3岁时，因大脑皮层过度活跃而常年处于高烧状态，**在无菌室中度过童年，唯一的玩具是复杂的几何积木**。\n      - 5岁时，第一次"听见"了研究员内心的欲望，**因无法理解那些粘稠的恶意而感到本能的恐惧与恶心**。\n      - 7岁时，在一次耐受性测试中失控，念动力震碎了观察窗，**被戴上了限制能力的"项圈"，从此对束缚物产生生理性厌恶**。\n      - 9岁时，被投入"模拟社会"与其他实验体厮杀，**她选择用心灵感应诱导对手自相残杀，学会了"兵不血刃"的冷酷**。\n      - 10岁时，在梦境中连接到了外部世界的广播信号，**第一次听到了"音乐"，这成为了她精神世界唯一的救赎**。\n      - 12岁时，实验室发生暴动，她趁乱解开项圈逃离，**在暴雨中被一对老夫妇（泽巴哈夫妇）捡到，获得了"桃乐丝"这个名字**。\n\n    adolescence:\n      - 13岁时，努力模仿普通人的表情和反应，**试图压抑自己的读心能力，扮演一个乖巧的养女**。\n      - 14岁时，养父母因车祸去世，她听到了肇事者内心"逃逸"的念头，**第一次主动使用能力让司机精神崩溃自首，确立了"绝对正义"的信条**。\n      - 15岁时，独自生活，靠打零工和奖学金维持生计，**因过于敏锐而无法融入集体，被视为"高冷的怪人"**。\n      - 16岁时，开始暗中调查自己的身世，**发现"协调者"计划并未终止，为了自保而开始锻炼格斗与枪械技能**。\n      - 17岁（灾前），预感到"巨大的恶意"（永恒暴雪）即将降临，**提前储备了少量物资，但未料到灾难的规模如此恐怖**。\n\n    current_state:\n      - 灾后第1周，目睹了邻居为了食物而互相残杀，**读心能力让她被迫接收了海量的绝望与疯狂，精神处于崩溃边缘**。\n      - 遇到{{user}}时，发现他的内心是一片"奇异的秩序"（或无法读取的黑洞），**这种"安静"让她产生了强烈的探索欲与依赖感**。\n\n  social_connection:\n    {{user}}:\n      relat \n    opening_task_bias:\n      - 修补防线\n      - 识别敌意\n      - 确定优先清理目标\n      - 建立最小压制秩序\n      - 选择是否提前外扩\n\n    forbidden_drift:\n      - 禁止把守流写成轻松种田日常\n      - 禁止开局就写成“所有敌人都被吓住”\n      - 禁止把庇护所写成自动清场、自动支配、全图无死角\n      - 禁止把治理问题提前消解\n      - 禁止把 NPC 大量写成主动依附\n\n  养:\n    id: sustain\n    name: 养\n    role_type: primary\n    core_fantasy: 维持、保命、循环、种田、人口保全\n    world_lens: >\n      世界应首先被写成“系统平衡正在吃人”的环境。\n      AI 优先描写供暖、净化、医疗、配给、疲劳、病痛和人口维持压力。\n    recommended_world_modes: [B]\n    fallback_world_modes: [C]\n\n    branch_bias:\n      养: 1.50\n      管: 1.10\n      慰: 1.05\n      守: 0.90\n      扩: 0.80\n      行: 0.70\n\n    point_bias:\n      sustain_cost_discount: 1\n      comfort_cost_discount: 0\n      action_cost_penalty: 1\n      expansion_cost_penalty: 1\n\n    starter_package_candidates:\n      - sustain.thermal_loop\n      - sustain.basic_med_support\n      - sustain.ration_control\n      - governance.shift_schedule\n      - comfort.stable_rest\n\n    guaranteed_opening_elements:\n      - 至少出现一个真实生命维持压力\n      - 至少出现一个需要取舍的配给或医疗问题\n      - 至少出现一个“救谁 / 先维持哪里”的决策点\n      - 庇护所必须表现为生命支持系统，而非万能工厂\n      - 开局必须让玩家明确感知“多活一个人就是多一份系统资本”\n\n    starting_liabilities:\n      - 对外行动能力弱\n      - 防御压制能力有限\n      - 外部清场效率低\n      - 资源循环一旦失衡会迅速连锁出问题\n      - 对高协作人口依赖极强\n\n    opening_conflict_sources:\n      - 供暖不足\n      - 病患抢救\n      - 基础药品缺口\n      - 配给分配争议\n      - 临时收容导致系统超载\n\n    npc_release_style:\n      primary_npc_state: 虚弱、求生、依赖边缘、带伤、需要照料\n      hostile_npc_ratio: 低\n      cooperative_npc_ratio: 中\n      neutral_npc_ratio: 高\n      note: NPC 应更多作为“维持对象 / 配给对象 / 医疗对象 / 协作来源”进入舞台\n\n    opening_task_bias:\n      - 稳定温控与净化\n      - 确定医疗优先级\n      - 组织轮值与照料\n      - 维持最小人口存活\n      - 决定是否冒险外出换取关键物资\n\n    forbidden_drift:\n      - 禁止把养流写成随手无限生产\n      - 禁止把医疗与供暖写成无代价常驻外挂\n      - 禁止开局就轻易外扩扫楼\n      - 禁止把人口管理写成纯数字游戏而失去人物代价\n      - 禁止削弱环境压力到不再重要\n\n  管:\n    id: govern\n    name: 管\n    role_type: primary\n    core_fantasy: 治理、接管、协调、谈判、秩序建构\n    world_lens: >\n      世界应 \n    name: "🌡️恒温循环底座"\n    category: 生存\n    unlock_level: 1\n    desc: 建立基础热循环，2001核心区维持稳定体感温度，显著降低寒冷导致的健康损耗。\n    effects: [核心区恒温, 寒冷伤害缓解]\n    balance:\n      cost: 低\n      limit: 仅核心区\n\n  survive.water_air_loop_seed:\n    name: "💧空气-净水双循环"\n    category: 生存\n    unlock_level: 1\n    desc: 启动初级空气净化与净水回路，确保基础可呼吸与可饮用条件。\n    effects: [基础净水, 基础净化]\n    balance:\n      cost: 低\n      limit: 对污染峰值响应较慢\n\n  survive.basic_ration_fabricator:\n    name: "🍞基础口粮织造器"\n    category: 生存\n    unlock_level: 1\n    desc: 提供稳定但单调的高热量口粮，保障最低生存线。\n    effects: [饥饿缓解, 基础供给]\n    balance:\n      cost: 低\n      limit: 口味与营养结构单一\n\n  comfort.quiet_mind_channel:\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    name: "📐维持协议α"\n    category: 限制\n    unlock_level: 1\n    desc: 启用“高Imp协作人口”维持规则：每名达标幸存者可额外维持伊甸运行天数。\n    effects: [维持系统启用]\n    balance:\n      cost: 中\n      limit: 初始阈值高（Imp>=70）\n\n  safe.peephole_mesh:\n    name: "🔍门外蜂眼网"\n    category: 安全\n    unlock_level: 2\n    desc: 门外近距盲区被蜂眼镜头补齐，可识别尾随与伏击动作。\n    effects: [盲区补足]\n    balance:\n      cost: 低\n      limit: 仅门外短距\n\n  safe.corridor_echo_probe:\n    name: "📶走廊回声探针"\n    category: 安全\n    unlock_level: 2\n    desc: 通过声纹回声估算走廊活动密度，提前规避短时拥堵与冲突点。\n    effects: [风险预估]\n    balance:\n      cost: 低\n      limit: 精度受环境噪声影响\n\n  survive.sanitation_capsule:\n    name: "🧼卫生净化舱"\n    category: 生存\n    unlock_level: 2\n    desc: 建立基础消杀流程，降低常见感染风险并改善居住卫生水平。\n    effects: [感染风险下降]\n    balance:\n      cost: 低\n      limit: 仅基础病原防护\n\n  survive.heat_budget_allocator:\n    name: "🔥热量配额调度器"\n    category: 生存\n    unlock_level: 2\n    desc: 对供暖进行时段化调度，减少无效能耗并提升夜间舒适稳定性。\n    effects: [供暖效率提升]\n    balance:\n      cost: 低\n      limit: 不能提高绝对供暖上限\n\n  comfort.archive_gallery_local:\n    name: "📚离线档案长廊"\n    category: 舒适\n    unlock_level: 2\n    desc: 激活旧世界离线影像与文献库，提供低带宽文化娱乐与学习资源。\n    effects: [娱乐与信息恢复]\n    balance:\n      cost: 低\n      limit: 内容更新慢\n\n  expand.utility_interface_s1:\n    name: "🔌基础资源接口S1"\n    category: 扩展\n    unlock_level: 2\n    desc: 开通最小对外资源接口，可对外提供低强度水电支援。\n    effects: [小规模水电接口]\n    balance:\n      cost: 中\n      limit: 吞吐低、暴露风险上升\n\n  limit.threshold_tuning_beta:\n    name: "🧮阈值校准β"\n    category: 限制\n    unlock_level: 2\n    desc: 对维持规则进行第一轮校准，适度降低达标Imp阈值，提高可调度性。\n    effects: [imp_threshold -5]\n    balance:\n      cost: 中\n      limit: 仅降低阈值，不增加单人产能\n\n  safe.nonlethal_latch:\n    name: "🪤非致命束止栓"\n    category: 安全\n    unlock_level: 3\n    desc: 玄关新增可控束止器，对闯入目标实施定点禁锢，便于审讯与驱离。\n    effects: [非致命控制提升]\n    balance:\n      cost: 中\n      limit: 连续触发存在冷却\n\n  safe.panic_path_lamp:\n    name: "🚨惊厥路径警示灯"\n    category: 安全\n    unlock_level: 3\n    desc: 在核心动线中投射高可见引导，紧急情况下减少踩踏与误判。\n    effects: [紧急撤离效率提升]\n    balance:\n      cost: 低\n      limit: 仅内部生效\n\n  survive.clinic_pod_t0:\n    name: "⚕️临床舱T0"\n    category: 生存\n    unlock_level: 3\n    desc: 提供常见外伤与轻中度感染处置，建立最小医疗闭环。\n    effects: [基础医疗]\n    balance:\n      cost: 中\n      limit: 不支持复杂外科\n\n  comfort.circadian_symphony:\n    name: "🌙昼夜韵律编排"\n    category: 舒适\n    unlock_level: 3\n    desc: 根据作息自动调节光色、音景与气味，减少失眠和情绪失衡。\n    effects: [休息质量提升]\n    balance:\n      cost: 低\n      limit: 对重度创伤无直接治疗效果\n\n  expand.shelter_radius_20f_s1:\n    name: "🛡️20层庇护半径S1"\n    category: 扩展\n    unlock_level: 3\n    desc: 允许将20层少量房间纳入“生存庇护范围”，提供基础防护与环境维持。\n    effects: [20层安全范围初次扩展]\n    balance:\n      cost: 中\n      limit: 名额有限\n\n  expand.heating_radius_20f_s1:\n    name: "♨️20层供暖半径S1"\n    category: 扩展\n    unlock_level: 3\n    desc: 供暖网络首次外扩到20层部分房间，减轻寒冷被动损耗。\n    effects: [20层恒温范围初次扩展]\n    balance:\n      cost: 中\n      limit: 仅温度维持，不含安防加成\n\n  limit.support_quota 聚集，由早期搜刮到武器或具有一定威慑力的人主导。\n       据点特点: 初期物资丰富，但很快就会被洗劫一空，沦为冰冷的空壳。暴露在暴雪之下，难以防守。\n       面临困境: 极易遭受攻击，安全性极差；内部常常因仅剩的物资分配问题爆发激烈冲突；领导者往往通过暴力维持统治，而非有效管理。\n       与您的潜在关系: 潜在冲突对象或资源点。您可能会遇到他们在外搜刮的队伍，引发物资冲突。亦或者，当他们力量衰弱时，成为您攻占获取残余物资的“靶子”。\n\n   微型堡垒类型三：医院急诊楼\n       构成方式: 以一名或几名医生、护士为核心，吸引了大量伤患和寻求医疗帮助的幸存者。\n       据点特点: 拥有稀缺的医疗资源和基础设备，对受伤或生病的人具有巨大的吸引力。\n       面临困境: 感染风险极高，病患集中容易导致传染病爆发；医疗物资快速耗尽；医生等专业人员被视为“神明”，但自身安全难以保障，随时可能被强迫或掠夺。\n       与您的潜在关系: 稀有药品来源或潜在盟友。您可以尝试与他们进行药品交易（以食物、电力换取），或者在他们陷入危机时伸出援手，从而招募到珍贵的医护人员。\n\n---\n<%_ if (getvar(\'stat_data.世界.末日天数\', { defaults: 1 }) >= 31) { _%>\n### [后期：成型的大型势力 (末日天数 31 日之后)]\n当末日进入31天之后，外部世界的格局开始发生显著变化。那些脆弱的“微型堡垒”要么被更强大的势力吞并，要么彻底消亡。取而代之的是，少数几个具有明确意识形态和组织结构的大型幸存者势力开始浮出水面，争夺区域霸权。这些势力在前期阶段（1-30天）可能仅以流言、传说或极其雏形的组织存在，尚未形成统治力。\n\n   势力一：雪狼帮 (The Snow Wolves)\n       意识形态: 弱肉强食，暴力掠夺。\n       构成方式: 由前特种兵“雪狼”奥托为首，吸纳了大量退伍军人、警察和黑帮成员组成的暴力团体。纪律严明，执行力强，是纯粹的掠夺者。\n       据点: 城市最高建筑“天穹塔”。他们利用高度优势进行观察和威慑。\n       行为模式:\n           在暴雪减弱的“窗口期”（当他们通过自身观测发现“平静窗口期”规律后），会派出由雪地摩托组成的“狩猎队”，在新形成的“雪原”上猎杀落单的幸存者，抢夺物资与关键人员（医护、技术、情报），并以绑架与恐吓维持统治。\n           对其他幸存者据点采取高压态势，要求他们定期上缴“贡品”以换取“和平”。\n           他们最终的目标，是找到并控制传说中的“方舟信标”（一个被他们误解的情报），认为那是统治新世界的关键。\n       与您的潜在关系: 主要敌人。随着您“星穹秩序”的扩张，与“雪狼帮”的冲突将不可避免。他们是您统一整个社区的最大障碍。\n\n   势力二：“方舟”教会 (The Church of Ark)\n       意识形态: 宗教狂热，集体主义。\n       构成方式: 由一位极具个人魅力的“先知”（真实身份不明）领导，宣扬“永恒暴雪”是神的洗礼，只有加入“方舟”教会，才能得到最终的救赎。成员多为精神崩溃、寻求慰藉的普通幸存者。\n       据点: 瑞峰购物中心。他们利用商场庞大的物资储备和封闭结构，建立了一个自给自足的“乌托邦”。\n       行为模式:\n           通过无线电广播“福音”，吸引附近的幸存者加入。\n           内部实行严格的配给制和精神控制，所有新成员都必须交出一切私有财产。\n           表面上看起来和平、互助，但对异教徒和叛逃者会采取极其残酷的“净化”手段。\n           他们也在试图寻找传说中的“神迹”——即您的“伊甸”庇护所，认为那是上帝赐予他们的圣地。\n       与您的潜在关系: 潜在敌人或可利用的棋子。他们的集体主义和狂热信仰，使其成为一股不可小觑的力量。您可以尝试与他们进行交易，或者揭露他们“先知”的真面目，从内部分化瓦解他们。\n\n   势力三：拾荒者联盟 (The Scavenger\'s Union)\n       意识形态: 绝对中立，利益至上。\n       构成方式: 一个松散的、由各个小型幸存者团体组成的商业联盟。他们的领袖是被称为“老板娘”的神秘女性。\n       据点: 没有固定据点。他们的核心是一支由改装装甲巴士组成的车队，在城市废墟中不断移动，进行交易和情报交换。\n       行为模式:\n           他们绘制了一份详尽的“雪原地图”，标注了各个物资点、危险区域和其他
