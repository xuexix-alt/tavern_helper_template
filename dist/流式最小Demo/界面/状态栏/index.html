    unprotected_minutes: [60, 180]\n          protected_hours: [4, 12]\n        description: 皮肤和身体裸露室外有冻伤风险，无防寒护具外出无法生存，交通、电力、生产设施在持续严寒下逐渐瘫痪\n      中:\n        score_range: [40, 59]\n        outdoor_survival:\n          unprotected_minutes: [20, 60]\n          protected_hours: [2, 6]\n        description: 无防寒护具外出30分钟后失温，无法室外逗留和长距离（徒步1公里半径内移动）\n      中高:\n        score_range: [60, 74]\n        outdoor_survival:\n          unprotected_minutes: [5, 20]\n          protected_hours: [1, 3]\n        description: 极端低温下金属暴露风雪中也会失去坚韧，人无防护无法室外生存\n      极高:\n        score_range: [75, 89]\n        outdoor_survival:\n          unprotected_minutes: [1, 5]\n          protected_hours: [0.5, 2]\n        description: 除经过伊甸等特殊改造的护具和装备防护外，基本无法在室外存活，无天气窗口\n\n  行动窗口:\n    unit: hours_per_7_days\n    labels:\n      极短:\n        hours_range: [0, 6]\n        occurrences_per_7_days: [0, 1]\n        description: 几乎没有外出机会，需伊甸特制护具\n      短:\n        hours_range: [6, 18]\n        occurrences_per_7_days: [1, 2]\n        description: 需要抢窗口（每周有1-2天晴天中午有1小时左右升温10度），需要防寒护具\n      中:\n        hours_range: [18, 36]\n        occurrences_per_7_days: [2, 4]\n        description: 窗口期变长（每周有3-4天晴天中午有2小时左右升温15度），可规划无护具短行动（徒步1公里范围），\n      长:\n        hours_range: [36, 72]\n        occurrences_per_7_days: [4, 7]\n        description: 暴风雪每日间歇性来临，无法长期室外逗留，可以短暂巡逻、清剿、接触与回收\n      稳定:\n        hours_range: [72, 168]\n        occurrences_per_7_days: [7, 14]\n        description: 有概率遇到暴风雪天气，摧毁修好的基础设施、电力，积雪仍瘫痪大规模大范围交通\n\n  社会残存度:\n    unit: score_0_100\n    labels:\n      极低:\n        score_range: [0, 19]\n        structured_groups_ratio: [0.0, 0.1]\n        trade_activity: [0.0, 0.1]\n        description: 组织性几乎消失，只剩零散苟活，无电力、无生产、无交通\n      低:\n        score_range: [20, 39]\n        structured_groups_ratio: [0.1, 0.25]\n        trade_activity: [0.1, 0.25]\n        description: 少量据点存在，但社会联系脆弱，无电力、无交通\n      中:\n        score_range: [40, 64]\n        structured_groups_ratio: [0.25, 0.5]\n        trade_activity: [0.25, 0.5
