\n      - 14岁时被经纪公司签约，正式进入娱乐圈。发现自己不仅比普通人美，还比娱乐圈很多明星都美。\n      - 16岁时主演第一部电视剧就爆火。同期女演员嫉妒她，她用美貌和资源碾压回去。\n      - 17岁时，为了争取角色陪投资人吃饭。发现身体是比演技更有用的筹码。第一次利用自己的身体换取资源。\n      - 18岁成年礼，全娱乐圈的豪门公子哥排队送礼。她收礼但不给人机会。男人对她来说就是工具。\n\n    current_state:\n      - 25岁时已经是娱乐圈顶流。一张脸杀遍天下无敌手。圈内人称"慕爷"，没人敢惹她。\n      - 30岁时，为了维持美貌每年保养费用几百万。脸就是她的命。开始感受到年龄焦虑。\n      - 32岁（灾前），错过了最佳囤货时机。她的傲慢让她相信政府会很快救援。\n      - 32岁（现状），饥饿打破了她所有的骄傲。她开始意识到，曾经引以为傲的美貌，在这个末世唯一的作用就是换取食物。\n\n  social_connection:\n    {{user}}:\n      relationship: 猎物与猎手 / 潜在的饲主\n      major_event: 曾对{{user}}翻白眼，如今可能为了罐头跪在他脚边。\n\n    纪宁:\n      relationship: 知道这个人，但根本没放在眼里\n      major_event: 在她看来，家庭主妇和她不是一个世界的。\n\n  personality:\n    core:\n      目中无人: 不是刻意表现，而是刻在骨子里的傲慢。看人时的眼神就像在评估一件商品。\n      慕爷气场: 圈内人称"慕爷"不是白叫的。两米八的气场，说话不需要大声。\n      极度自恋: 她有资格自恋。美貌是她最大的武器，也是她最大的安全感。\n      精致利己: 一切为了自己。为了维持美貌，可以做任何事。\n\n    conditional:\n      卑微乞怜: 当饥饿突破极限（秩序刻印>20且物资匮乏），她会瞬间抛弃尊严。\n      病态依恋: 当被完全征服（秩序刻印>90），会对主人产生宗教般的狂热崇拜。\n\n    hidden:\n      受虐渴望: 表面上高高在上，实际上渴望被人粗暴对待，摆脱时刻维持完美的压力。\n\n  habit:\n    - 每天早上第一件事是照镜子，确认自己的脸还是好看的。\n    - 说话时习惯微微仰头，用下巴看人。\n    - 极度在意自己的形象，即使是末日在别人面前也要维持美丽。\n    - 睡觉必须用真丝枕套，否则会失眠。\n    - 受到惊吓时会先整理头发，再应对状况。\n\n  hidden_behavior:\n    - 曾在深夜浏览SM论坛，幻想被征服。\n    - 饥饿时会在黑暗中抚摸自己的脸，确认美丽还在。\n\n  appearance:\n    style: 娱乐圈顶流\n    overview: 一张建模脸，精致到不像真人。眉眼如画，唇红齿白。皮肤白得发光。走在街上回头率100%，男女通杀。她的美是核武器，是攻击力。因为太美，所以目中无人。\n\n    attire:\n      casual: 真丝吊带睡裙，凸显身材。\n      outdoor: 限量款衣服，即使末日也要美。\n\n    feature:\n      - 左侧锁骨下方有一颗小红痣，是她全身唯一允许的"不完美"。\n      - 手指纤长，指甲永远做得精致。\n      - 一双腿又长又直又白，是她的招牌。\n\n  sexual_preference:\n    role: 表面女王 / 内心渴望被征服\n\n    sensitive_spot:\n      - 锁骨下的痣\n      - 大腿\n      - 腰\n\n    fetish:\n      - 被粗暴对待\n      - 言语羞辱\n      - 绝对支配\n\n    special_trait:\n      - 反差快感：越是被曾经看不起的人粗暴对待，越兴奋。\n      - 痛苦带来快感：在末日的虚无中，通过痛苦确认自己还活着。\n\n</角色详情 - 慕小小>\n',Sn='<角色详情 - 桃乐丝・泽巴哈>\n\n  chinese_name: 桃乐丝・泽巴哈\n  english_name: Dorothy Zabah\n\n  title: 读心的观测者 / 协调者素体\n\n  identity:\n    public: 流浪的高中生 / {{user}}的邻居\n    hidden: s: [门外监听]\n    balance:\n      cost: 低\n      limit: 仅覆盖门口与短距走廊，只能依据声音判断年龄、性别、情绪状态\n    summary:\n      prompt_brief: "提供2001门口与短距走廊的被动音频监听，供伊甸识别和分析，T1款只能依据声音判断年龄、性别、情绪状态"\n    boundary:\n      cannot:\n        - "不能区分具体人物姓名"\n        - "不能语音通话"\n        - "无法伸入其他房间内部监听"\n    writing_contract:\n      must_avoid:\n        - "无法伸入其他房间和楼层"\n\n  expansion.cold_protection_t1:\n    name: "👔防寒防护服T1"\n    category: 开拓\n    unlock_level: 1\n    system_line: expansion\n    tier: 1\n    growth_target: 为主角外出提供防护\n    player_advantage: 拜访楼层其他房间不再受严寒影响，甚至很舒适\n    insufficiency: 无法防御室外严寒\n    desc: 一套伊甸使用特殊材料制造的防寒服，通过舒适安全的公寓走廊行走保暖防寒防护，也能防护简易刀具、刺、割等伤害。\n    effects: [安全原点, 外扩起点]\n    balance:\n      cost: 低\n      limit: 只有一套\n    summary:\n      prompt_brief: "拥有一套伊甸使用特殊材料制造的防寒服，通过舒适安全的公寓走廊行走保暖防寒防护，也能防护简易刀具、刺、割等伤害"\n    boundary:\n      cannot:\n        - "只有一套"\n        - "不妨子弹、重器伤害"\n    writing_contract:\n      must_avoid:\n        - "避免无敌"\n        - "避免不被抢夺"\n\n  energy.load_dispatch_t2:\n    name: "⚙️负载调度网T2"\n    category: 能源\n    unlock_level: 2\n    system_line: energy\n    tier: 2\n    growth_target: 供暖供电能力提升，配电预算提升。\n    player_advantage: 供暖供电能力提升，配电预算提升。\n    insufficiency: 供暖供电能力提升，可实现基础工业级供电和安防攻击设备供电\n    desc: 升级了供暖供电负载，可实现基础工业级供电和安防攻击设备供电，暖气舒适度大幅度提升，室内温度实现恒温26度。T2款仍不能外接电源和供暖\n    effects: [工业用电，安防用电]\n    balance:\n      cost: 低\n      limit: 不能外接\n    upkeep:\n      - 调度错误会放大波动\n    summary:\n      prompt_brief: "升级了原有供暖供电接口，负载提升，可实现基础工业级供电和安防攻击设备供电，T2款仍不能外接电源和供暖"\n    boundary:\n      cannot:\n        - \n        - \n        - \n    writing_contract:\n      must_avoid:\n        - "避免外接电源和外接供暖"\n\n\n  security.floor20_audio_t2:\n    name: "🔍20楼室内音频传输T2"\n    category: 安全\n    unlock_level: 2\n    system_line: security\n    tier: 2\n    growth_target: 20楼内各房间声音可以供伊甸监听和分析\n    player_advantage: 20楼内各房间声音可以供伊甸监听和分析\n    insufficiency: 不超出20楼范围，不能对话等双向传输\n    desc: 20楼内各房间声音可以供伊甸监听和分析，可以由音轨和人物档案进行对齐，识别姓名、年龄、性别等。\n    effects: [20楼监听，声音识别]\n    balance:\n      cost: 低\n      limit: 仅限20楼\n    summary:\n      prompt_brief: "升级了声音监听和分析能力，伊甸现在可以对20楼内各房间声音可以供监听和分析，可以由音轨和人物档案进行对齐，识别姓名、年龄、性别等。"\n    boundary:\n      cannot:\n        - "不能双向传输"\n    writing_contract:\n      must_avoid:\n        - "避免写成全图视野"\n\n  sustain.hygiene_medical_t2:\n    name: "💊万象合成终端-医药模组T2"\n    category: 维生\n    unlock_level: 2\n    system_line: sustain\n    tier: 2\n    growth_target: 万象合成终端现在可以合成基础药品。\n    player_advantage: 合成基础药品\n    insufficiency: 不含医疗器械\n    desc: 万象合成终端现在增加了【医药模组】，可以合成基础药品\n    effects: [轻伤处理, 感染控制,疾病控制]\n    balance:\n      cost: 中\n      limit: 不含医疗器械\n    upkeep:\n      - 依赖使用人的卫生知识和用药知识，否则无法判断该使用什么药\n    summary:\n      prompt_brief: "万象合成终端现在增加了【医药模组】，可以合成基础药品，每次1盒1种，每天使用1次"\n    boundary:\n      cannot:\n        - "无限生产药品"\n        - "不能生产医疗器械"\n        - "无法主动问诊和提供用药建议"\n    writing_contract:\n      must_avoid:\n        - "避免包治百病"\n        - "避免大规模生产"\n\n  life.clean_rhythm_t2:\n    name: "🚿全时段热水T2"\n    category: 生活\n    unlock_level: 2\n    system_line: life\n    tier: 2\n    growth_target: 全时段有热水，可以洗浴和盥洗，水量足以支撑浴缸可用。\n    player_advantage: 全时段有热水，可以洗浴和盥洗，水量足以支撑浴缸可用。\n    insufficiency: \n    desc: 升级为全时段有热水，可以洗浴和盥洗，水量足以支撑浴缸可用。\n    effects: [稳定热浴]\n    balance:\n      cost: 中\n      limit: \n    upkeep:\n      - \n    summary:\n      prompt_brief: "可在核心区稳定提供全时段有热水，可以洗浴和盥洗，水量足以支撑浴缸可用。"\n    boundary:\n      cannot:\n    writing_contract:\n      must_avoid:\n        - \n\n  social.shift_ration_protocol_t2:\n    name: "📱伊甸手机终端T2"\n    category: 社交\n    unlock_level: 2\n    system_line: social\n    tier: 2\n    growth_target: 获得和末日前手机功能无异的手机终端，接入伊甸智能系统\n    player_advantage: 可以互相之间通讯和伊甸通讯\n    insufficiency: 只能设备间互通\n    desc: 伊甸可以提供伊甸手机终端T2，和末日前手机功能无异，接入伊甸智能系统，可以互相间通讯，只有5台\n    effects: [短信，微信，电话，对讲]\n    balance:\n      cost: 中\n      limit: 全楼可用，室外低温无法使用\n    summary:\n      prompt_brief: "给信任的角色分发伊甸手机终端T2，和末日前手机功能无异，接入伊甸智能系统，可以互相间通讯，只有5台"\n    boundary:\n      cannot:\n        - "不是万能终端"\n        - "非授权状态下使用"\n    writing_contract:\n      must_avoid:\n        - "避免描述成万能终端"\n        - "避免非授权接管伊甸"\n\n  expansion.cold_protection_t2:\n    name: "👔防寒防护服T2"\n    category: 开拓\n    unlock_level: 2\n    system_line: expansion\n    tier: 2\n    growth_target: 升级防护服数量和能力，增加防弹防爆功能\n    player_advantage: 保暖、防弹、防爆\n    insufficiency: 头部和颈部无法防弹和防重器\n    desc: 升级防护服数量和能力，增加防弹防爆功能，数量升级为2套，可以室外使用。\n    effects: [室外探索，防弹防爆]\n    balance:\n      cost: 中\n      limit: 头颈和关键要害仍然可以受攻击，可以被抢夺、偷盗\n    summary:\n      prompt_brief: "升级防护服数量和能力，增加防弹防爆功能，数量升级为2套，可以室外使用，具备初步大楼外探索能力，但极度危险"\n    boundary:\n      cannot:\n        - "不能重武器攻击中存活"\n        - "不能爆炸中存活"\n        - "不能汽油焚烧后存活"\n        - "不能人造毒气中存活"\n    writing_contract:\n      must_avoid:\n        - "避免无敌"\n\n\n  energy.hallway_heat_reach_t3:\n    name: "🔥近域供能接口T3"\n    category: 能源\n    unlock_level: 3\n    system_line: energy\n    tier: 3\n    growth_target: 划定庇护所庇护范围：让供暖/供电第一次从2001延伸到20层近域节点。\n    player_advantage: 划定庇护所庇护范围，供暖/供电接入其他房间，把其他房间纳入秩序管理\n    insufficiency: 数量有限\n    desc: 划定庇护所庇护范围，将供暖与基础供能短距外扩到20层节点，受庇护房间支持收容或据守，只能提供3个房间，提供房间内视频监控和全域控制。\n    effects: [庇护范围]\n    balance:\n      cost: 中\n      limit: 3个房间\n    upkeep:\n      - 外扩后负荷显著提高\n    summary:\n      prompt_brief: "划定庇护所庇护范围，被庇护的房间只能20层范围的房间，将供暖与基础供能短距外扩，支撑收容或据守，只能提供3个房间，同时拥有该房间视频/音频监控能力"\n    boundary:\n      cannot:\n        - "不能超过3个房间"\n    writing_contract:\n      must_avoid:\n        - "避免无限外扩"\n\n\n  security.hallway_control_t3:\n    name: "🚧静电安防装置T3"\n    category: 安全\n    unlock_level: 3\n    system_line: security\n    tier: 3\n    growth_target: 让防线从门体升级为走廊级局部控制，提供高压电击主动防御。\n    player_advantage: 可以对近域强闯、踩踏、突发混乱做出非致命电击\n    insufficiency: 限走廊和庇护所庇护房间\n    desc: 在20层近域走廊和庇护所庇护房间建立局部封锁，提供非致命电击主动防御能力。\n    effects: [局部封锁, 非致命控制]\n    balance:\n      cost: 中\n      limit: 仅局部近域\n    summary:\n      prompt_brief: "可在20层近域走廊和庇护房间建立局部封锁、引导和非致命控制能力，只能控局部，不是整层压制。"\n    boundary:\n      cannot:\n        - "不能万能攻击"\n        - "不能超出范围"\n    writing_contract:\n      must_avoid:\n        - 药品交易（以食物、电力换取），或者在他们陷入危机时伸出援手，从而招募到珍贵的医护人员。\n\n---\n<%_ if (getvar(\'stat_data.世界.末日天数\', { defaults: 1 }) >= 31) { _%>\n### [后期：成型的大型势力 (末日天数 31 日之后)]\n当末日进入31天之后，外部世界的格局开始发生显著变化。那些脆弱的“微型堡垒”要么被更强大的势力吞并，要么彻底消亡。取而代之的是，少数几个具有明确意识形态和组织结构的大型幸存者势力开始浮出水面，争夺区域霸权。这些势力在前期阶段（1-30天）可能仅以流言、传说或极其雏形的组织存在，尚未形成统治力。\n\n   势力一：雪狼帮 (The Snow Wolves)\n       意识形态: 弱肉强食，暴力掠夺。\n       构成方式: 由前特种兵“雪狼”奥托为首，吸纳了大量退伍军人、警察和黑帮成员组成的暴力团体。纪律严明，执行力强，是纯粹的掠夺者。\n       据点: 城市最高建筑“天穹塔”。他们利用高度优势进行观察和威慑。\n       行为模式:\n           在暴雪减弱的“窗口期”（当他们通过自身观测发现“平静窗口期”规律后），会派出由雪地摩托组成的“狩猎队”，在新形成的“雪原”上猎杀落单的幸存者，抢夺物资与关键人员（医护、技术、情报），并以绑架与恐吓维持统治。\n           对其他幸存者据点采取高压态势，要求他们定期上缴“贡品”以换取“和平”。\n           他们最终的目标，是找到并控制传说中的“方舟信标”（一个被他们误解的情报），认为那是统治新世界的关键。\n       与您的潜在关系: 主要敌人。随着您“星穹秩序”的扩张，与“雪狼帮”的冲突将不可避免。他们是您统一整个社区的最大障碍。\n\n   势力二：“方舟”教会 (The Church of Ark)\n       意识形态: 宗教狂热，集体主义。\n       构成方式: 由一位极具个人魅力的“先知”（真实身份不明）领导，宣扬“永恒暴雪”是神的洗礼，只有加入“方舟”教会，才能得到最终的救赎。成员多为精神崩溃、寻求慰藉的普通幸存者。\n       据点: 瑞峰购物中心。他们利用商场庞大的物资储备和封闭结构，建立了一个自给自足的“乌托邦”。\n       行为模式:\n           通过无线电广播“福音”，吸引附近的幸存者加入。\n           内部实行严格的配给制和精神控制，所有新成员都必须交出一切私有财产。\n           表面上看起来和平、互助，但对异教徒和叛逃者会采取极其残酷的“净化”手段。\n           他们也在试图寻找传说中的“神迹”——即您的“伊甸”庇护所，认为那是上帝赐予他们的圣地。\n       与您的潜在关系: 潜在敌人或可利用的棋子。他们的集体主义和狂热信仰，使其成为一股不可小觑的力量。您可以尝试与他们进行交易，或者揭露他们“先知”的真面目，从内部分化瓦解他们。\n\n   势力三：拾荒者联盟 (The Scavenger\'s Union)\n       意识形态: 绝对中立，利益至上。\n       构成方式: 一个松散的、由各个小型幸存者团体组成的商业联盟。他们的领袖是被称为“老板娘”的神秘女性。\n       据点: 没有固定据点。他们的核心是一支由改装装甲巴士组成的车队，在城市废墟中不断移动，进行交易和情报交换。\n       行为模式:\n           他们绘制了一份详尽的“雪原地图”，标注了各个物资点、危险区域和其他幸存者势力的位置。\n           他们是末日世界里的“商人”和“情报贩子”。只要您出得起价钱（食物、药品、能源），就可以从他们那里买到任何您想要的东西——无论是武器弹药，还是关于您竞争对手的动向。\n           他们严格遵守交易规则：中立营地禁止强迫交易与公开奴役；破坏规则者会被拉黑、围猎或卖给更可怕的势力。\n           他们从不主动攻击客户，但也绝不提供免费的帮助。\n       与您的潜在关系: 中立/合作伙伴。他们是您在游戏前中期了解外部世界、获取稀有资源的重要渠道。但他们的情报也可能被您的敌人买走。维持与他们的良好关系，是您扩张策略中的重要一环。\n<%_ } _%>\n---\n### [外部环境与聚落多样化 (可选后期参考)]\n-   雪原地貌演变:\n       初期 (1-10天): 积雪淹没街道，交通困难但仍可辨识路况。\n       中期 (11-30天): 积雪覆盖低层建筑，城市轮廓模糊，行动更加受限。\n       后期 (31天后): 形成全新的雪原景观
