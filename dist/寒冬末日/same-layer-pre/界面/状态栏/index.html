ange: [0, 19]\n        outdoor_survival:\n          unprotected_minutes: [180, 360]\n          protected_hours: [8, 24]\n        description: 低温暴雪天气占多数，但人类行动能力尚存，交通、电力、生产设施少部分残余\n      中低:\n        score_range: [20, 39]\n        outdoor_survival:\n          unprotected_minutes: [60, 180]\n          protected_hours: [4, 12]\n        description: 皮肤和身体裸露室外有冻伤风险，无防寒护具外出无法生存，交通、电力、生产设施在持续严寒下逐渐瘫痪\n      中:\n        score_range: [40, 59]\n        outdoor_survival:\n          unprotected_minutes: [20, 60]\n          protected_hours: [2, 6]\n        description: 无防寒护具外出30分钟后失温，无法室外逗留和长距离（徒步1公里半径内移动）\n      中高:\n        score_range: [60, 74]\n        outdoor_survival:\n          unprotected_minutes: [5, 20]\n          protected_hours: [1, 3]\n        description: 极端低温下金属暴露风雪中也会失去坚韧，人无防护无法室外生存\n      极高:\n        score_range: [75, 89]\n        outdoor_survival:\n          unprotected_minutes: [1, 5]\n          protected_hours: [0.5, 2]\n        description: 除经过伊甸等特殊改造的护具和装备防护外，基本无法在室外存活，无天气窗口\n\n  行动窗口:\n    unit: hours_per_7_days\n    labels:\n      极短:\n        hours_range: [0, 6]\n        occurrences_per_7_days: [0, 1]\n        description: 几乎没有外出机会，需伊甸特制护具\n      短:\n        hours_range: [6, 18]\n        occurrences_per_7_days: [1, 2]\n        description: 需要抢窗口（每周有1-2天晴天中午有1小时左右升温10度），需要防寒护具\n      中:\n        hours_range: [18, 36]\n        occurrences_per_7_days: [2, 4]\n        description: 每周有3-4天晴天中午有2小时左右升温15度，可规划无护具短行动（徒步1公里范围），\n      长:\n        hours_range: [36, 72]\n        occurrences_per_7_days: [4, 7]\n        description: 暴风雪每日间歇性来临，无法长期室外逗留，可以短暂巡逻、清剿、接触与回收\n      稳定:\n        hours_range: [72, 168]\n        occurrences_per_7_days: [7, 14]\n        description: 有概率遇到暴风雪天气，摧毁修好的基础设施、电力，积雪仍瘫痪大规模大范围交通\n\n  社会残存度:\n    unit: score_0_100\n    labels:\n      极低:\n        score_range: [0, 19]\n        structured_groups_ratio: [0.0, 0.1]\n        trade_activity: [0.0, 0.1]\n        description: 组织性几乎消失，只剩零散苟活，无电力、无生产、无交通\n      低:\n        score_range: [20, 39]\n        structured_groups_ratio: [0.1, 0.25]\n        trade_activity: [0.1, 0.25]\n        description: 少量据点存在，但社会联系脆弱，无电力、无交通\n      中:\n        score_range: [40, 64]\n        structured_groups_ratio: [0.25, 0.5]\n        trade_activity: [0.25, 0.5]\n        description: 只剩局部保持社会组织，社会交往方式只剩交易与协作惯性，生产力要素退化为仅剩自运行电力、局部个人交通工具、局部自循环水源\n      高:\n        score_range: [65, 100]\n        structured_groups_ratio: [0.5, 0.8]\n        trade_activity: [0.5, 0.8]\n        description: 社会结构尚存，原社会结构受到剧烈冲击，人与人可争夺治理权。电力、水务、小规模交通\n\n  生产残余度:\n    unit: percent_of_pre_disaster_capacity\n    labels:\n      极低:\n        capacity_range: [0, 5]\n        description: 近乎只剩库存消耗，无法稳定生产，无可靠交通工具\n      低:\n        capacity_range: [5, 15]\n        description: 只能维持零星修补、拆解和自循环手工生产，无可靠交通工具\n      中:\n        capacity_range: [15, 35]\n        description: 少量组织化生产与维修制造能力，原始油气化交通工具\n      高:\n        capacity_range: [35, 60]\n        description: 高维持成本下的残余工业/社区供给能力，稀缺电气化交通工具\n\n  冲突密度:\n    unit: major_incidents_per_10_days_per_region\n    labels:\n      低:\n        incidents_range: [0, 1]\n        description: 冲突主要发生在不同组织群体，但不是常态，且多为局部摩擦。规模较大的社区群体间以争夺社会主导权和生产资源发生争斗，小规模社区面临大社区的吞并剥削。社会秩序极为脆弱，治安状况聊胜于无\n      中:\n        incidents_range: [2, 4]\n        description: 各残余幸存者组成小规模社区，但彼此冲突成为常态，且时常为争夺资源展开殊死争斗，一部分比较有武力的暴徒四处劫掠，弱肉强食下只有少部分社群能建立脆弱的基础秩序，社会治安更是无从谈起\n      高:\n        incidents_range: [5, 8]\n        description: 基本无法维持社会秩序，有稳定武装能力和生产来源的社群对零散组织和个体的劫掠、暴力、奴役、盘剥是主旋律，交易只存在实力对等主体间，完全丛林法则弱肉强食\n      极高:\n        incidents_range: [9, 15]\n        description: 暴力、杀戮是唯一的生存手段，只有杀戮和被杀、劫掠和被劫掠\n\n  外部威胁主因:\n    unit: enum\n    labels:\n      环境:\n        allowed_subtypes: [失温, 冻伤, 病亡, 雪晶腐蚀]\n      暴徒:\n        allowed_subtypes: [掠夺者, 楼层暴徒, 武装团伙, 饥民围堵]\n      异变体:\n        allowed_subtypes: [雪晶畸变体, 僵尸, 基因异化生物]\n      野化生物:\n        allowed_subtypes: [冰野人, 雪狼, 雪豹, 齿虎]\n      组织博弈:\n        allowed_subtypes: [联盟争夺, 规则冲突, 管辖竞争, 渗透]\n      交易秩序争夺:\n        allowed_subtypes: [资源控制, 存量争夺, 生产垄断, 价格战争]\n\n  外出死亡风险:\n    unit: fatality_probability_per_unprepared_trip\n    labels:\n      低:\n        range: [0.0, 0.1]\n      中:\n        range: [0.1, 0.3]\n      高:\n        range: [0.3, 0.6]\n      极高:\n        range: [0.6, 0.95]\n\n  据点化程度:\n    unit: structured_control_ratio\n    labels:\n      低:\n        range: [0.0, 0.2]\n      中:\n        range: [0.2, 0.5]\n      高:\n        range: [0.5, 0.8]\n      极高:\n        range: [0.8, 1.0]\n\nprofiles:\n  A:\n    id: A\n    key: pre_disaster_phase\n    name: 灾变前3个月\n    slogan: 预知灾变来临，依托伊甸做好准备，为灾变后积累优势（扮演"先知型"救世主）\n    core_pleasure: 日常 / 后宫 / 收集 / 情报优势\n    recommended_main_route: 日常+后宫+收集+情报优势\n    secondary_routes: [后宫+养成, 种田+探索+势力培育]\n\n    environment:\n      常态气温区间: \'常态气候，无异常\'\n      暴雪频率: 无\n      腐蚀雪晶活性: 无\n      外出能力: 完全自由\n      visibility_note: 灾变尚未发生，城市与社会运转正常，一切气候与出行风险都处于灾前常态\n\n    axes:\n      气候压力:\n        label: 极低\n        score: 5\n        description: 气候属于正常四季变化，无需任何防寒措施，户外活动、交通、物流全部照常。只有主角通过伊甸才知道3个月后会发生超自然极寒灾变。\n      行动窗口:\n        label: 稳定\n        hours_per_7_days: 168\n        description: 全天候可自由出行，航空、铁路、高速、公交、快递、外卖正常运转，没有任何气候性行动限制。\n      社会残存度:\n        label: 高\n        score: 95\n        description: 社会结构完整，政府、法律、金融、媒体、教育、医疗、就业市场全部正常运行，绝大多数人对未来三个月毫无预警。\n      外部威胁主因:\n        label: 无\n        subtype: 仅常态社会风险\n        description: 不存在灾后级别的威胁，普通人面对的只是正常社会中的治安、工作压力、人际关系等风险；真正的威胁只存在于主角的"未来知识"中。\n      生产残余度:\n        label: 高\n        capacity_percent: 100\n        description: 现代工业与供应链 100% 正常，物资可合法购买，金融、物流、互联网、电力、燃气、通信一切如常，是囤积与布置的黄金窗口。\n      冲突密度:\n        label: 低\n        incidents_per_10_days_per_region: 0\n        description: 社会秩序正常，警察、司法、合同、商业规则都有效，冲突只限于正常人际摩擦和法律框架内的纠纷，没有武装暴力或大规模失序。\n      外出死亡风险:\n        label: 低\n        probability_per_unprepared_trip: 0.001\n        description: 外出风险等同于灾前真实社会，危险主要来自交通事故、犯罪、疾病等常态风险，与灾后不可同日而语。\n      据点化程度:\n        label: 无\n        structured_control_ratio: 0.0\n        description: 还没有任何"庇护所 / 据点 / 控制区"的概念，社会仍以城市、住宅区、公司、商圈为基本单元，主角此刻的"伊甸庇护所"只是一套未公开的黑科技实体。\n\n    society:\n      organization_trend: 正常现代社会结构，公寓邻居、职场同事、商圈、物业、社群仍按灾前节奏运转\n      moral_state: 普通人追求日常生活、工作、感情、消费，对末日毫无察觉；主角一旦公开预警会立刻被视为异类\n\n    threat:\n      threat_pack_mode: single_primary\n      threat_pack_candidates:\n        - 人祸包\n        - 异变包\n        - 野化包\n      default_threat_pack: 人祸包\n      packs:\n        人祸包:\n          - 武装掠夺者\n          - 楼层暴徒\n          - 流窜劫匪\n        异变包:\n          - 雪晶畸变体\n          - 腐蚀性残留区\n          - 失控实验产物\n        野化包:\n          - 野化猎群\n          - 异常大型生物\n          - 觅食迁徙兽群\n\n    build_modifiers:\n      point_base: 8\n      imp_efficiency_modifier: 0.9\n      expansion_risk_modifier: 1.3\n      combat_pressure_modifier: 1.4\n      logistics_pressure_modifier: 0.9\n\n    playstyle_bias:\n      日常+后宫+收集+情报优势:\n        score: 1.4\n        note: 灾变前3个月最重要的就是信息、人脉与提前布局\n      后宫+养成:\n        score: 1.15\n        note: 在秩序尚存时提前完成 IMP 经营与角色攻略\n      种田+探索+势力培育:\n        score: 1.0\n        note: 利用末日前的物流与生产体系预先囤积和选点\n\n    ai_brief_seed:\n      环境体感: 低温危险但尚可行动，真正压迫感来自外部敌对存在\n      主要威胁: 武装掠夺、袭击、围堵、清场冲突\n      社会状态: 幸存者据点化，小团体互相试探、掠夺、吞并\n      路线提示: 在灾变前3个月，靠信息先手和人际经营积累越多越多，末日到来时越占先发优势\n\n  B:\n    id: B\n    key: polar_holding\n    name: 末日后1年-生存压力\n    slogan: 环境即天敌，活下去本身就是胜利（出不了门，基本在公寓范围活动）\n    core_pleasure: 生存 / 维持 / 种田 / 人口保全\n    recommended_main_route: 后宫+养成\n    secondary_routes: [种田+探索+势力培育, 日常+后宫+收集+情报优势]\n\n    environment:\n      常态气温区间: \'-35℃ ~ -45℃\'\n      暴雪频率: 高\n      腐蚀雪晶活性: 高\n      外出能力: 高度受限\n      visibility_note: 外界不是舞台，而是持续吞噬生命的高危区\n\n    axes:\n      气候压力:\n        label: 极高\n        score: 93\n      行动窗口:\n        label: 极短\n        hours_per_7_days: 4\n      社会残存度:\n        label: 低\n        score: 28\n      外部威胁主因:\n        label: 环境\n        subtype: 失温\n      生产残余度:\n        label: 极低\n        capacity_percent: 3\n      冲突密度:\n        label: 中\n        incidents_per_10_days_per_region: 3\n      外出死亡风险:\n        label: 极高\n        probability_per_unprepared_trip: 0.82\n      据点化程度:\n        la ife: 0.75\n\n    point_bias:\n      security_cost_discount: 1\n      expansion_cost_discount: 1\n      life_cost_penalty: 1\n      social_cost_penalty: 0\n\n    starter_package_candidates:\n      - security.entry_bulkhead_t1\n      - security.nearfield_watch_t2\n      - security.hallway_control_t3\n      - expansion.floor20_anchor_t3\n      - expansion.floor20_control_zone_t4\n\n    guaranteed_opening_elements:\n      - 至少存在一个明确敌对来源\n      - 至少存在一个可观测但未清理的危险点\n      - 庇护所核心区必须体现“安全但非全知”\n      - 开局必须让玩家感觉“守得住”和“还没全稳住”同时成立\n      - 第一阶段必须有清场/镇压/防线修补类选择\n\n    starting_liabilities:\n      - 人口协作基础偏弱\n      - 高质量生活吸附力偏低\n      - 情感经营与IMP加成手段不足\n      - 容易依赖压制解决问题，后期可能引发反弹\n      - 对外扩张会显著提高围堵和报复概率\n\n    opening_conflict_sources:\n      - 楼层暴徒试探\n      - 走廊监控盲区\n      - 物资投送暴露风险\n      - 邻近据点敌意侦察\n      - 受惊幸存者误判防御行为\n\n    npc_release_style:\n      primary_npc_state: 惶恐、防备、观望、试探\n      hostile_npc_ratio: 高\n      cooperative_npc_ratio: 低\n      neutral_npc_ratio: 中\n      note: NPC 应更多以威胁、麻烦、待判断对象进入舞台，而非天然可治理对象\n\n    opening_task_bias:\n      - 修补防线\n      - 识别敌意\n      - 确定优先清理目标\n      - 建立最小压制秩序\n      - 选择是否提前外扩\n\n    forbidden_drift:\n      - 禁止把"后宫+养成"路线写成轻松种田日常\n      - 禁止开局就写成“所有敌人都被吓住”\n      - 禁止把庇护所写成自动清场、自动支配、全图无死角\n      - 禁止把情报与社交短板提前消解\n      - 禁止把 NPC 大量写成主动依附\n\n  种田+探索+势力培育:\n    id: sustain\n    name: 种田+探索+势力培育\n    role_type: primary\n    core_fantasy: 维持、扩大实力、探索未知领域、种田（恢复生产）、人口保全（扩大统治人口和区域）\n    world_lens: >\n      世界应首先被写成“系统平衡正在吃人”的环境。\n      AI 优先描写供暖、净化、医疗、配给、疲劳、病痛和人口维持压力，\n      同时突出向外探索与势力扩张的真实收益与风险。\n    recommended_world_modes: [C]\n    fallback_world_modes: [B]\n\n    branch_bias:\n      sustain: 1.50\n      energy: 1.15\n      life: 1.05\n      social: 0.95\n      security: 0.90\n      expansion: 0.80\n\n    point_bias:\n      sustain_cost_discount: 1\n      energy_cost_discount: 1\n      security_cost_penalty: 1\n      expansion_cost_penalty: 1\n\n    starter_package_candidates:\n      - energy.core_heat_grid_t1\n      - energy.load_dispatch_t2\n      - sustain.basic_survival_loop_t1\n      - sustain.hygiene_medical_t2\n      - life.clean_rhythm_t2\n\n    guaranteed_opening_elements:\n      - 至少出现一个真实生命维持压力\n      - 至少出现一个需要取舍的配给或医疗问题\n      - 至少出现一个“救谁 / 先维持哪里”的决策点\n      - 庇护所必须表现为生命支持系统，而非万能工厂\n      - 至少出现一个能体现“伊甸生活质量高于外界”的稀缺体验\n      - 开局必须让玩家明确感知“多活一个人就是多一份系统资本”\n\n    starting_liabilities:\n      - 对外行动能力弱\n      - 防御压制能力有限\n      - 外部清场效率低\n      - 资源循环一旦失衡会迅速连锁出问题\n      - 对高协作人口依赖极强\n\n    opening_conflict_sources:\n      - 供暖不足\n      - 病患抢救\n      - 基础药品缺口\n      - 配给分配争议\n      - 临时收容导致系统超载\n\n    npc_release_style:\n      primary_npc_state: 虚弱、求生、依赖边缘、带伤、需要照料\n      hostile_npc_ratio: 低\n      cooperative_npc_ratio: 中\n      neutral_npc_ratio: 高\n      note: NPC 应更多作为“维持对象 / 配给对象 / 医疗对象 / 协作来源”进入舞台\n\n    opening_task_bias:\n      - 稳定温控与净化\n      - 确定医疗优先级\n      - 组织轮值与照料\n      - 维持最小人口存活\n      - 决定是否把高质量生活资源优先给某个关键对象\n      - 决定是否冒险外出换取关键物资\n\n    forbidden_drift:\n      - 禁止把"种田+探索+势力培育"路线写成随手无限生产\n      - 禁止把医疗与供暖写成无代价常驻外挂\n      - 禁止开局就轻易外扩扫楼\n      - 禁止把人口管理写成纯数字游戏而失去人物代价\n      - 禁止削弱环境压力到不再重要\n\n  日常+后宫+收集+情报优势:\n    id: govern\n    name: 日常+后宫+收集+情报优势\n    role_type: primary\n    core_fantasy: 情报先手（知道末日3个月后要来，提前做好准备）/ IMP经营（提前攻略女角色）/ 秩序接管（为末日到来做各种准备）/ 培植先发优势，保全更多自己青睐的NPC\n    world_lens: >\n      世界应首先被写成"一切如常但末日正在逼近"的双层舞台。\n      AI 应当在"社会正常运转、人们关心工作与生活"的日常表层之上，\n      让主角独自感受到三个月后的灾难阴影，并优先描写：\n      哪些人在未来会成为关键角色、哪些资源此刻仍能轻易买到、\n      哪些制度窗口正要关闭、哪些接触机会如果错过未来就再也没有。\n    recommended_world_modes: [A]\n    fallback_world_modes: [C, B]\n\n    branch_bias:\n      social: 1.50\n      expansion: 1.10\n      life: 1.05\n      sustain: 0.95\n      security: 0.95\n      energy: 0.90\n\n    point_bias:\n      social_cost_discount: 1\n      expansion_cost_discount: 0\n      life_cost_discount: 0\n      security_cost_penalty: 1\n\n    starter_package_candidates:\n      - social.rule_seed_t1\n      - social.shift_ration_protocol_t2\n      - social.admission_protocol_t3\n      - expansion.threshold_interface_t2\n      - expansion.floor20_anchor_t3\n\n    guaranteed_opening_elements:\n      - 至少存在两个未来会对主角有价值的邻居/同事/熟人，此刻都是普通状态\n      - 至少存在一个现阶段可介入的"灾前布局"问题（囤积、房产、人脉、身份、证件、金融资产）\n      - 至少存在一个可监听、观察或回放的关键对象\n      - 至少存在一个利用伊甸黑科技但不引起外界注意的使用机会\n      - 庇护所必须表现为"独享的未来知识 + 情感经营先手"的核心，而不是单纯工厂或堡垒\n      - 开局必须让玩家看到"信息差、人心和 IMP 本身就是最稀缺的资产"\n\n    starting_liabilities:\n      - 伊甸能力尚未全开，一旦大规模动用就会暴露\n      - 现金、人脉、法律身份仍受末日前社会规则约束，不能用"强硬接管"代替经营\n      - 没人会因为"你说末日要来"就信你，预警本身就是重大信誉风险\n      - 过早囤积、过度招募或异常采购会引起邻居、同事、警方、平台风控的注意\n      - 情感经营需要时间沉淀，急于求成会直接把 IMP 打崩\n\n    opening_conflict_sources:\n      - 末日预警无法直接说出口，只能以借口或情境推动关键人做决定\n      - 资金、物资、空间的预先囤积与日常收入 / 身份的矛盾\n      - 想接近的关键对象此刻仍有自己的社交圈、工作、感情关系\n      - 使用伊甸能力改变小范围事件时，如何不被周围人察觉\n      - 3 个月窗口期的"先保谁、先经营谁、先囤什么"取舍\n\n    npc_release_style:\n      primary_npc_state: 日常、正常社交节奏、带有自己的欲望与烦恼，对灾难一无所知\n      hostile_npc_ratio: 低\n      cooperative_npc_ratio: 低\n      neutral_npc_ratio: 高\n      note: NPC 应更多作为"正常生活中的人"进入舞台，可观察、可接触、可经营，但不会因为末日预警立刻配合\n\n    opening_task_bias:\n      - 筛选并锁定值得长期经营的关键对象（未来后宫候补 / 核心伙伴）\n      - 建立日常化的接触借口与信息采集渠道\n      - 制定前三个月的囤积清单（物资、药品、燃料、黄金、现金、硬通货）\n      - 判断哪些灾前人脉（警察、医生、物业、军方、金融、物流）值得提前铺垫\n      - 规划伊甸能力在"不暴露"的前提下可以使用到什么程度\n\n    forbidden_drift:\n      - 禁止把"日常+后宫+收集+情报优势"路线写成纸上谈兵的空制度\n      - 禁止开局就让所有 NPC 自动认同主角或主动依附\n      - 禁止只写话术，不写情报先手与执行成本\n      - 禁止把情感优势写成无代价洗脑\n      - 禁止削弱"信息、人心、IMP与信誉"在本流派中的核心地位\n      - 禁止在灾变前语境下让主角"公开警告末日"或"让多数人相信末日要来"\n      - 禁止在本开局就出现极寒、暴雪、暴徒、异变体等灾后威胁作为当前发生事件\n      - 禁止让伊甸的存在、能力、预警被任何第三方在本开局察觉或公开\n'),Se=we('# <%_ if (!getvar(\'eden.worldbookManaged\', { defaults: false })) { _%>\r\nversion: 1\r\nmeta:\r\n  id: eden_shelter_ability_master\r\n  name: 伊甸庇护所能力总表\r\n  world: 寒冬末日-星穹秩序\r\n  authoring_note: 严格YAML；该文件是庇护所能力的唯一总表（UI与脚本应按能力键查询描述）。1-10级已按六大系统完成重构，高阶能力统一收束为区域控制权成长。\r\n  source_of_truth: true\r\n\r\nrules:\r\n  level_range: [1, 10]\r\n  categories: [能源, 安全, 维生, 生活, 社交, 开拓]\r\n  system_lines: [energy, security, sustain, life, social, expansion]\r\n  progression_style: 小步快走\r\n  balancing_principles:\r\n    - 低等级优先生存，不给压制级战斗能力\r\n    - 单级能力数量适中，避免跨级质变过猛\r\n    - 强能力必须绑定成本、门槛或冷却\r\n    - 生活类不直接转化为战斗优势\r\n    - 开拓类强调“能推进”，不保证“无损拿下”\r\n    - 前五级优先体现“有优势但仍需进取”的成长压力\r\n  character_resonance:\r\n    principle: 核心成员鲜明的人格特质可与伊甸共鸣；等级决定能力上限，真实认同与参与决定对应功能能否启用。未记载的共鸣不得自行编造。\r\n    shelter_extension:\r\n      character: 纪宁\r\n      name: 庇护延伸\r\n      requirement: 纪宁达到协作或以上、正式加入伊甸，并在剧情中明确认同共同生活、实际参与照管。\r\n      scope: T3及后续对2001以外的供暖、供电扩展均需此共鸣；任务奖励、开局路线与等级提升不能跳过此前提。\r\n      boundary: 2001基础维生独立运行；共鸣不附送监控、供水、制造或防护，空间登记字段不能替代独立能力授权。\r\n      continuity: 共鸣成立后不因短暂离开、休息或一次争执反复开关；正式退出或放弃共同生活时按实际剧情处理，不凭空制造瞬间断供事故。\r\n    stage_illusion:\r\n      character: 慕小小\r\n      name: 幻景舞台\r\n      requirement: 慕小小达到协作或以上、正式加入并认同共同生活，自愿为伊甸成员认真完成一次演出或排演。\r\n      scope: T4舞台酒廊及后续相关幻景升级均需此共鸣；等级、任务奖励、付费演出或挂名加入不能替代真实认同与参与。\r\n      boundary: T3普通影院独立运行；幻景仅在原有舞台酒廊呈现，不产生实物或改变真实温度、空间，不用于室外伪装、战斗、读心或直接改变Imp。\r\n      continuity: 启用后其他成员也可使用；短暂离开、休息或一次拒演不关停，正式退出共同体时按实际剧情处理。\r\n\r\nmaintenance:\r\n  imp_support:\r\n    description: 伊甸维持系统由“高意愿协作人口”提供社会运转稳定度\r\n    base_days: 1\r\n    base_imp_threshold: 70\r\n    bonus_days_per_qualified_survivor: 1\r\n    qualified_rule: 幸存者Imp >= imp_threshold 且处于受管辖状态\r\n    scaling:\r\n      threshold_reduction_per_tier: 5\r\n      days_bonus_per_tier: 0.5\r\n      max_tier: 5\r\n    caps:\r\n      min_threshold: 45\r\n      max_bonus_days_per_survivor: 2\r\n      max_total_maintenance_days: 21\r\n    anti_snowball:\r\n      diminishing_return_after_survivors: 8\r\n      diminishing_factor: 0.5\r\n\r\nlevels:\r\n  "1":\r\n    label: 房间求生\r\n    unlocks:\r\n      - energy.core_heat_grid_t1\r\n      - security.entry_bulkhead_t1\r\n      - sustain.wanxiang_synth_t1\r\n      - life.water_heater_t1\r\n      - social.nearfield_monitor_t1\r\n      - social.eden_terminal_t1\r\n      - expansion.cold_protection_t1\r\n  "2":\r\n    label: 核心区稳态\r\n    unlocks:\r\n      - energy.load_dispatch_t2\r\n      - security.floor20_audio_t2\r\n      - sustain.hygiene_medical_t2\r\n      - life.clean_rhythm_t2\r\n      - social.shift_ration_protocol_t2\r\n      - expansion.cold_protection_t2\r\n  "3":\r\n    label: 走出房门\r\n    unlocks:\r\n      - energy.hallway_heat_reach_t3\r\n      - security.hallway_control_t3\r\n      - sustain.group_care_t3\r\n      - life.legacy_theater_t3\r\n      - social.video_intercom_t3\r\n      - expansion.floor20_anchor_t3\r\n  "4":\r\n    label: 楼层感知\r\n    unlocks:\r\n      - energy.floor_budget_t4\r\n      - security.wanxiang_thermal_t4\r\n      - sustain.wanxiang_gourmet_t4\r\n      - life.stage_lounge_t4\r\n\r\n\r\nabilities:\r\n  energy.core_heat_grid_t1:\r\n    name: "♨️供暖供电接口协议T1"\r\n    category: 能源\r\n    unlock_level: 1\r\n    system_line: energy\r\n    tier: 1\r\n    growth_target: 基础供电和供暖模块：2001室从此具备供暖与供电。\r\n    player_advantage: 有稳定温度和电子设备/电器开机能力。\r\n    insufficiency: 只能在2001内部使用，不得外接。\r\n    desc: 维持2001核心区的基础供暖与最低供电\r\n    effects: [2001供暖, 生活用电]\r\n    balance:\r\n      cost: 低\r\n      limit: 仅2001室内\r\n    upkeep:\r\n      - 负荷冗余低\r\n    summary:\r\n      prompt_brief: "可维持2001核心区的基础供暖与生活供电接口，范围仅2001室，不得外接。"\r\n    boundary:\r\n      cannot:\r\n        - "不能扩展到其他房间"\r\n        - "不能用于工业生产"\r\n        - "不能直接使用电网参加战斗"\r\n    writing_contract:\r\n      must_avoid:\r\n        - "不是能源环境系统"\r\n\r\n  security.entry_bulkhead_t1:\r\n    name: "🛡️金属安防门T1"\r\n    category: 安全\r\n    unlock_level: 1\r\n    system_line: security\r\n    tier: 1\r\n    growth_target: 2001室的门不可轻易破开\r\n    player_advantage: 能延缓破门、争取观察与应对时间。\r\n    insufficiency: 只能守住入口，无法主动进攻\r\n    desc: 一道用于强化2001核心入口的门体、门闩与缓冲防线，使得几乎无法强闯。\r\n    effects: [安防强化]\r\n    balance:\r\n      cost: 低\r\n      limit: 只对门有效\r\n    upkeep:\r\n      - 极高强度暴力破坏可以损坏破门\r\n    summary:\r\n      prompt_brief: "一道用于强化2001核心入口的门体，用于防止强闯，仅入口有效，不能覆盖整层。"\r\n    boundary:\r\n      cannot:\r\n        - "反杀或永久压制入侵"\r\n    writing_contract:\r\n      must_avoid:\r\n        - ""\r\n        - ""\r\n\r\n ring(n??'').trim();!t&&e&&(t=e);const r=ha(n);if(!r)continue;const a=_a.get(r);if(a&&a.length>0)return a}return t?function(e){const t=function(e){let t=0;for(let n=0;n<e.length;n+=1)t=31*t+e.charCodeAt(n)>>>0;return t}(e);return ya.map((t,n)=>({...ba(e,t,n),id:`default::generic::${e}::${t.variant}`,promptToken:`default:generic:${t.variant}`,title:`${e} ${t.label}`,alt:`${e} ${t.label}`,createdOrder:n})).sort((e,n)=>(e.createdOrder+t)%2-(n.createdOrder+t)%2)}(t):[]}const Ea=['认知修改类','时空修改类','战斗修改类','属性修改类'],wa=['认知修改类','时空修改类','战斗修改类','属性修改类','未分类'];function Na(e){const t=wa.indexOf(String(e??'').trim());return t>=0?t:wa.length}function Va(e,t){const n=e.trim();if(!n.startsWith('编号'))return null;const r=n.match(/^编号(?<id>[a-z]{2}\d{3})-名称：(?<name>.+?)-范围：(?<scope>.+?)-作用：(?<description>.+?)-\s*时效：(?<duration>.+)$/u);return r?.groups?{id:String(r.groups.id??'').trim(),name:String(r.groups.name??'').trim(),scope:String(r.groups.scope??'').trim(),description:String(r.groups.description??'').trim(),duration:String(r.groups.duration??'').trim(),category:t}:null}const Sa=function(e){const t=e.split(/\r?\n/),n={};let r='';for(const e of t){const t=e.trim();if(!t)continue;const a=Ea.find(e=>t.startsWith(`${e}：`));if(a){r=a;continue}const o=Va(t,r);o&&(n[o.id]=o)}return n}('\r\n<伊甸一次性指令>\r\n    描述：**伊甸一次性指令**是伊甸依照自身运行法则产生的超自然能力，日期每到新的一条，就随机从指令库中增加3条，即每条指令+1。如果使用后该编号指令次数-1。\r\n    规则：\r\n      1.每次MVU变量增加指令数量不超3个，类别随机。\r\n      2.**允许**在<user>明示命令下生成一批伊甸一次性指令。（不超过3条）\r\n      3.AI应该在剧情和mvu变量中严格监测指令时效，生效时严格按照描述发挥作用。实效时及时恢复或结算。\r\n      4.失效后一切恢复原状，前后Imp值不因**指令本身所致行为**受惩罚/降低。因指令损坏的身体不自然恢复。\r\n      5.**作用范围豁免**：伊甸指令的保护只覆盖其自身效果与作用对象；与指令无关的独立负向事件不受保护。例：sk001「一二三木头人」只暂停了场域内他人的行动能力，若此时角色被**无关第三方**性侵或物理攻击，Imp 与健康仍按常规结算。\r\n      6.**玩家规则约束**：使用指令时以指令效果为最高优先级，其余的不变。\r\n            如：一名女角色因"乖，让我玩玩"指令与<user>发生关系，尽管其imp关系值未达到允许性爱阶段，但不视为强行性关系，其imp值反而会因性行为小幅度增加。失效后会因意识到自己发生了关系，保留正常人的进行情绪波动和行为模式，但不应此惩罚imp值。\r\n        分类：\r\n            认知修改类：\r\n                  编号rz001-名称：朋友妻不客气-范围：指定一位男 确检测极端天气，预判“晴天”窗口\r\nlv1.能一个星期左右时间移除暴雪极端天气\r\nlv2.能一个月时间移除暴雪和低温极端天气，获得短暂的气候恢复窗口\r\nlv3.能超过两个月移除全部极端天气，使得气候灾难变成“季节性”，获得更长恢复窗口\r\nlv4.修改天气条件并维持一个月以上，使得天气“听从”主角安排\r\nlv5.天气编辑器\r\n</气象条件相关>\r\n</末日救亡任务>\r\n',technologyLore:'<伊甸技术>\r\n说明：\r\n1.背景故事：外星文明看到地球被极端天气毁灭，基于同情与伊甸庇护所一并发送伊甸技术资料过来，用量子意识存储器保存，被唤醒后识别到伊甸主人会或主人指定的人，会自动按照量子意识的形式迅速传入人的大脑，从而可以迅速获得相关技术知识\r\n2.伊甸技术种类和作用遵循<末日救亡任务>中关于伊甸技术的描述。\r\n3.关于伊甸技术失散的原因：外星文明传送过程中出现了未知故障，导致伊甸技术资料和伊甸庇护所本体分离\r\n4.伊甸技术量子意识存储器的寻找线索：农业相关lv0就在星穹公寓（伊甸本体提供的模糊记忆），其余的要逐步获得伊甸技术才能知晓\r\n6.线索A：星穹公寓有一位农业生物科技教授，末日前将一打技术资料带回家研究，教授生死未知\r\n  线索B：星穹公寓地下室有间废弃的消防救援站，灾后被短暂当做政府情报人员的安全屋，也许会留下蛛丝马迹\r\n  线索C：伊甸的记忆体里有农业lv0失散前的残存记忆，修复记忆体需要极大的能耗，解决他的能耗需求兴许有收获\r\n</伊甸技术>\r\n',startDay:0}),I=(0,o.computed)(()=>r.value?.document??{...B,rescueStartDay:Math.max(0,g.value.day??0),level:Math.min(4,Math.max(1,m.value))}),x=(0,o.computed)(()=>Qi(I.value,g.value));function M(){const e=Ps();JSON.stringify(g.value)!==JSON.stringify(e)&&(i.value=!1),g.value=e,C.value=js().statData.主线任务?.情报碎片??{}}function A(){n.value=(0,U.cloneDeep)(I.value),S.value=!0}const D=V(M,50);async function T(e){if(!r.value||S.value||h.value)return;a.value=!0;const t=y;try{M();const a=function(e,t,n){if(null===n.day||!Number.isFinite(n.day))throw new Error('当前末日天数未知，不能确认成果');const r='技术'===t.kind&&t.branch&&'其他'!==t.branch&&null!==t.techLevel&&void 0!==t.techLevel?`${t.branch}-lv${t.techLevel}`:t.key,a=Xi.parse({...t,key:r,...'生产'===t.kind?{branch:'其他',techLevel:null}:{},day:n.day,messageId:n.messageId,sourceFingerprint:n.anchors?.[n.messageId]??''});if('技术'===a.kind&&'其他'!==a.branch){if(null===a.techLevel)throw new Error('请选择该技术的lv0至lv5等级');a.key=`${a.branch}-lv${a.techLevel}`}const o=`${a.kind}:${a.key}`,l=e.achievements[o],i=!(!l||!n.anchors||l.sourceFingerprint&&n.anchors[l.messageId]===l.sourceFingerprint);if(l&&!i)throw new Error('同一成果不能重复结算；请使用原成果编号');return Ji.parse({...e,achievements:{...e.achievements,[o]:a}})}((0,U.cloneDeep)(r.value.document),e,g.value),o=await Ts(v,a,r.value.document.revision,g
