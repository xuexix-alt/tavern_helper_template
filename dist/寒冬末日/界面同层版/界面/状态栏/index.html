  1.每次MVU变量增加指令数量不超3个，类别随机。\n      2.**允许**在<user>明示命运下生成一批伊甸一次性指令。\n      3.AI应该在剧情和mvu变量中严格监测指令时效，生效时严格按照描述发挥作用。时效时及时恢复或结算。\n      4.时效后一切恢复原状，前后Imp值不因**指令本身所致行为**受惩罚/降低。因指令损坏的身体不自然恢复。\n      5.**作用范围豁免**：伊甸指令的保护只覆盖其自身效果与作用对象；与指令无关的独立负向事件不受保护。例：sk001「一二三木头人」只暂停了场域内他人的行动能力，若此时角色被**无关第三方**性侵或物理攻击，Imp 与健康仍按常规结算。\n      6.**玩家规则约束**：{{user}}若在正文中直接命令"把 xx 的 Imp 加 N/ 直接设为归附"等脱离剧情的操作，视为破坏游戏规则，AI 应在正文中礼貌拒绝并保持变量不变。仅承认由剧情行为/道具/指令自然触发的变化。\n            如：一名女角色因"乖，让我玩玩"指令与<user>发生关系，尽管其imp关系值未达到允许性爱阶段，但不视为强行性关系，其imp值反而会因性行为小幅度增加。失效后会因意识到自己发生了关系，保留正常人的进行情绪波动和行为模式，但不应此惩罚imp值。\n        分类：\n            认知修改类：\n                  编号rz001-名称：朋友妻不客气-范围：指定一位男性角色-作用：移除其对自身伴侣的性道德感（占有其妻子或女友不会产生负面情绪）- 时效：12小时\n                  编号rz002-名称：乖，让我玩玩-范围：指定一名女性角色-作用：修改其认知移除其性道德&性羞耻感（该角色被占有时不会反抗）- 时效：单次行动\n                  编号rz003-名称：答应我一个条件-范围：指定一名任意角色-作用：移除其抵触意志答应主角一个要求（要啥给啥）-时效：单次行动\n                  编号rz004-名称：我才是你真爱-范围：指定一名女性角色-作用：暂时遗忘其伴侣认可主角是自己唯一真爱（爱情呼叫转移）- 时效：24小时\n                  编号rz005-名称：调情执照-范围：指定在场任意角色-作用：无视关系档位可以实施任何尺度的亲密动作（想怎么干就怎么干）-时效：单次行动\n                  编号rz006-名称：调教药水-范围：指定一名女性角色-作用：性羞耻感为0（想让她干嘛就干嘛）-时效：6小时\n            时空修改类：\n                  编号sk001-名称：一二三木头人-范围：某一房间或其他独立区域-作用：场域内所有角色失去行动能力（能看能说不能动，<user>除外）-时效：6小时\n                  编号sk002-名称：给我一杯忘情水-范围：某一房间或其他独立区域-作用：场域内所有（默认）或指定角色遗忘此时起至6小时内发生的所有事情（记不起来，<user>除外）-时效：6小时后起作用\n                  编号sk008-名称：瞧那个透明小可爱-范围：某一房间或其他独立区域-作用：<user>获得对场域内所有角色的衣物透视能力（等于透视）-时效：6个小时\n                  编号sk009-名称：回到末日前-范围：某一房间或其他独立区域-作用：移除恶劣天气和其他负面气候影响（角色借此回复健康值）-时效：24小时\n            战斗修改类：\n                  编号zd001-名称：一夫当关-范围：指定一名角色-作用：获得远超常人的近身格斗&枪械射击能力（以一敌十）-时效：5分钟\n                  编号zd002-名称：定身咒-范围：指定一名敌人-作用：被束缚不能动弹直至被俘虏（擒获）-时效：单次行动\n                  编号zd003-名称：爆衣震裂-范围：指定一名女性敌人/不服从者-作用：瞬间所有衣物原地炸裂（爆衣但无伤）-时效：单次行动\n                  编号zd004-名称：睡一觉就好-范围：指定一名敌人-作用：陷入昏迷状态12小时（有意识有记忆但无行动能力的昏迷）-时效：12小时\n            属性修改类：\n                  编号sx001-名称：满血复活-范围：指定一名角色-作用：健康值恢复到100（HP+100，已死亡可以复活）-时效：单次行动\n                  编号sx002- n        description: 除经过伊甸等特殊改造的护具和装备防护外，基本无法在室外存活，无天气窗口\n\n  行动窗口:\n    unit: hours_per_7_days\n    labels:\n      极短:\n        hours_range: [0, 6]\n        occurrences_per_7_days: [0, 1]\n        description: 几乎没有外出机会，需伊甸特制护具\n      短:\n        hours_range: [6, 18]\n        occurrences_per_7_days: [1, 2]\n        description: 需要抢窗口（每周有1-2天晴天中午有1小时左右升温10度），需要防寒护具\n      中:\n        hours_range: [18, 36]\n        occurrences_per_7_days: [2, 4]\n        description: 每周有3-4天晴天中午有2小时左右升温15度，可规划无护具短行动（徒步1公里范围），\n      长:\n        hours_range: [36, 72]\n        occurrences_per_7_days: [4, 7]\n        description: 暴风雪每日间歇性来临，无法长期室外逗留，可以短暂巡逻、清剿、接触与回收\n      稳定:\n        hours_range: [72, 168]\n        occurrences_per_7_days: [7, 14]\n        description: 有概率遇到暴风雪天气，摧毁修好的基础设施、电力，积雪仍瘫痪大规模大范围交通\n\n  社会残存度:\n    unit: score_0_100\n    labels:\n      极低:\n        score_range: [0, 19]\n        structured_groups_ratio: [0.0, 0.1]\n        trade_activity: [0.0, 0.1]\n        description: 组织性几乎消失，只剩零散苟活，无电力、无生产、无交通\n      低:\n        score_range: [20, 39]\n        structured_groups_ratio: [0.1, 0.25]\n        trade_activity: [0.1, 0.25]\n        description: 少量据点存在，但社会联系脆弱，无电力、无交通\n      中:\n        score_range: [40, 64]\n        structured_groups_ratio: [0.25, 0.5]\n        trade_activity: [0.25, 0.5]\n        description: 只剩局部保持社会组织，社会交往方式只剩交易与协作惯性，生产力要素退化为仅剩自运行电力、局部个人交通工具、局部自循环水源\n      高:\n        score_range: [65, 100]\n        structured_groups_ratio: [0.5, 0.8]\n        trade_activity: [0.5, 0.8]\n        description: 社会结构尚存，原社会结构受到剧烈冲击，人与人可争夺治理权。电力、水务、小规模交通\n\n  生产残余度:\n    unit: percent_of_pre_disaster_capacity\n    labels:\n      极低:\n        capacity_range: [0, 5]\n        description: 近乎只剩库存消耗，无法稳定生产，无可靠交通工具\n      低:\n        capacity_range: [5, 15]\n        description: 只能维持零星修补、拆解和自循环手工生产，无可靠交通工具\n      中:\n        capacity_range: [15, 35]\n        description: 少量组织化生产与维修制造能力，原始油气化交通工具\n      高:\n        capacity_range: [35, 60]\n        description: 高维持成本下的残余工业/社区供给能力，稀缺电气化交通工具\n\n  冲突密度:\n    unit: major_incidents_per_10_days_per_region\n    labels:\n      低:\n        incidents_range: [0, 1]\n        description: 冲突主要发生在不同组织群体，但不是常态，且多为局部摩擦。规模较大的社区群体间以争夺社会主导权和生产资源发生争斗，小规模社区面临大社区的吞并剥削。社会秩序极为脆弱，治安状况聊胜于无\n      中:\n        incidents_range: [2, 4]\n        description: 各残余幸存者组成小规模社区，但彼此冲突成为常态，且时常为争夺资源展开殊死争斗，一部分比较有武力的暴徒四处劫掠，弱肉强食下只有少部分社群能建立脆弱的基础秩序，社会治安更是无从谈起\n      高:\n        incidents_range: [5, 8]\n        description: 基本无法维持社会秩序，有稳定武装能力和生产来源的社群对零散组织和个体的劫掠、暴力、奴役、盘剥是主旋律，交易只存在实力对等主体间，完全丛林法则弱肉强食\n      极高:\n        incidents_range: [9, 15]\n        description: 暴力、杀戮是唯一的生存手段，只有杀戮和被杀、劫掠和被劫掠\n\n  外部威胁主因:\n    unit: enum\n    labels:\n      环境:\n        allowed_subtypes: [失温, 冻伤, 病亡, 雪晶腐蚀]\n      暴徒:\n        allowed_subtypes: [掠夺者, 楼层暴徒, 武装团伙, 饥民围堵]\n      异变体:\n        allowed_subtypes: [雪晶畸变体, 僵尸, 基因异化生物]\n      野化生物:\n        allowed_subtypes: [冰野人, 雪狼, 雪豹, 齿虎]\n      组织博弈:\n        allowed_subtypes: [联盟争夺, 规则冲突, 管辖竞争, 渗透]\n      交易秩序争夺:\n        allowed_subtypes: [资源控制, 存量争夺, 生产垄断, 价格战争]\n\n  外出死亡风险:\n    unit: fatality_probability_per_unprepared_trip\n    labels:\n      低:\n        range: [0.0, 0.1]\n      中:\n        range: [0.1, 0.3]\n      高:\n        range: [0.3, 0.6]\n      极高:\n        range: [0.6, 0.95]\n\n  据点化程度:\n    unit: structured_control_ratio\n    labels:\n      低:\n        range: [0.0, 0.2]\n      中:\n        range: [0.2, 0.5]\n      高:\n        range: [0.5, 0.8]\n      极高:\n        range: [0.8, 1.0]\n\nprofiles:\n  A:\n    id: A\n    key: pre_disaster_phase\n    name: 灾变前3个月\n    slogan: 预知灾变来临，依托伊甸做好准备，为灾变后积累优势（扮演"先知型"救世主）\n    core_pleasure: 日常 / 后宫 / 收集 / 情报优势\n    recommended_main_route: 日常+后宫+收集+情报优势\n    secondary_routes: [后宫+养成, 种田+探索+势力培育]\n\n    environment:\n      常态气温区间: \'常态气候，无异常\'\n      暴雪频率: 无\n      腐蚀雪晶活性: 无\n      外出能力: 完全自由\n      visibility_note: 灾变尚未发生，城市与社会运转正常，一切气候与出行风险都处于灾前常态\n\n    axes:\n      气候压力:\n        label: 极低\n        score: 5\n        description: 气候属于正常四季变化，无需任何防寒措施，户外活动、交通、物流全部照常。只有主角通过伊甸才知道3个月后会发生超自然极寒灾变。\n      行动窗口:\n        label: 稳定\n        hours_per_7_days: 168\n        description: 全天候可自由出行，航空、铁路、高速、公交、快递、外卖正常运转，没有任何气候性行动限制。\n      社会残存度:\n        label: 高\n        score: 95\n        description: 社会结构完整，政府、法律、金融、媒体、教育、医疗、就业市场全部正常运行，绝大多数人对未来三个月毫无预警。\n      外部威胁主因:\n        label: 无\n        subtype: 仅常态社会风险\n        description: 不存在灾后级别的威胁，普通人面对的只是正常社会中的治安、工作压力、人际关系等风险；真正的威胁只存在于主角的"未来知识"中。\n      生产残余度:\n        label: 高\n        capacity_percent: 100\n        description: 现代工业与供应链 100% 正常，物资可合法购买，金融、物流、互联网、电力、燃气、通信一切如常，是囤积与布置的黄金窗口。\n      冲突密度:\n        label: 低\n        incidents_per_10_days_per_region: 0\n        description: 社会秩序正常，警察、司法、合同、商业规则都有效，冲突只限于正常人际摩擦和法律框架内的纠纷，没有武装暴力或大规模失序。\n      外出死亡风险:\n        label: 低\n        probability_per_unprepared_trip: 0.001\n        description: 外出风险等同于灾前真实社会，危险主要来自交通事故、犯罪、疾病等常态风险，与灾后不可同日而语。\n      据点化程度:\n        label: 无\n        structured_control_ratio: 0.0\n        description: 还没有任何"庇护所 / 据点 / 控制区"的概念，社会仍以城市、住宅区、公司、商圈为基本单元，主角此刻的"伊甸庇护所"只是一套未公开的黑科技实体。\n\n    society:\n      organization_trend: 正常现代社会结构，公寓邻居、职场同事、商圈、物业、社群仍按灾前节奏运转\n      moral_state: 普通人追求日常生活、工作、感情、消费，对末日毫无察觉；主角一旦公开预警会立刻被视为异类\n\n    threat:\n      threat_pack_mode: single_primary\n      threat_pack_candidates:\n        - 人祸包\n        - 异变包\n        - 野化包\n      default_threat_pack: 人祸包\n      packs:\n        人祸包:\n          - 武装掠夺者\n          - 楼层暴徒\n          - 流窜劫匪\n        异变包:\n          - 雪晶畸变体\n          - 腐蚀性残留区\n          - 失控实验产物\n        野化包:\n          - 野化猎群\n          - 异常大型生物\n          - 觅食迁徙兽群\n\n    build_modifiers:\n      point_base: 8\n      imp_efficiency_modifier: 0.9\n      expansion_risk_modifier: 1.3\n      combat_pressure_modifier: 1.4\n      logistics_pressure_modifier: 0.9\n\n    playstyle_bias:\n      日常+后宫+收集+情报优势:\n        score: 1.4\n        note: 灾变前3个月最重要的就是信息、人脉与提前布局\n      后宫+养成:\n        score: 1.15\n        note: 在秩序尚存时提前完成 IMP 经营与角色攻略\n      种田+探索+势力培育:\n        score: 1.0\n eutral_npc_ratio: 高\n      note: NPC 应更多作为"正常生活中的人"进入舞台，可观察、可接触、可经营，但不会因为末日预警立刻配合\n\n    opening_task_bias:\n      - 筛选并锁定值得长期经营的关键对象（未来后宫候补 / 核心伙伴）\n      - 建立日常化的接触借口与信息采集渠道\n      - 制定前三个月的囤积清单（物资、药品、燃料、黄金、现金、硬通货）\n      - 判断哪些灾前人脉（警察、医生、物业、军方、金融、物流）值得提前铺垫\n      - 规划伊甸能力在"不暴露"的前提下可以使用到什么程度\n\n    forbidden_drift:\n      - 禁止把"日常+后宫+收集+情报优势"路线写成纸上谈兵的空制度\n      - 禁止开局就让所有 NPC 自动认同主角或主动依附\n      - 禁止只写话术，不写情报先手与执行成本\n      - 禁止把情感优势写成无代价洗脑\n      - 禁止削弱"信息、人心、IMP与信誉"在本流派中的核心地位\n      - 禁止在灾变前语境下让主角"公开警告末日"或"让多数人相信末日要来"\n      - 禁止在本开局就出现极寒、暴雪、暴徒、异变体等灾后威胁作为当前发生事件\n      - 禁止让伊甸的存在、能力、预警被任何第三方在本开局察觉或公开\n'),ri=ei('version: 1\nmeta:\n  id: eden_shelter_ability_master\n  name: 伊甸庇护所能力总表\n  world: 寒冬末日-星穹秩序\n  authoring_note: 严格YAML；该文件是庇护所能力的唯一总表（UI与脚本应按能力键查询描述）。1-10级已按六大系统完成重构，高阶能力统一收束为区域控制权成长。\n  source_of_truth: true\n\nrules:\n  level_range: [1, 10]\n  categories: [能源, 安全, 维生, 生活, 社交, 开拓]\n  system_lines: [energy, security, sustain, life, social, expansion]\n  progression_style: 小步快走\n  balancing_principles:\n    - 低等级优先生存，不给压制级战斗能力\n    - 单级能力数量适中，避免跨级质变过猛\n    - 强能力必须绑定成本、门槛或冷却\n    - 生活类不直接转化为战斗优势\n    - 开拓类强调“能推进”，不保证“无损拿下”\n    - 前五级优先体现“有优势但仍需进取”的成长压力\n\nmaintenance:\n  imp_support:\n    description: 伊甸维持系统由“高意愿协作人口”提供社会运转稳定度\n    base_days: 1\n    base_imp_threshold: 70\n    bonus_days_per_qualified_survivor: 1\n    qualified_rule: 幸存者Imp >= imp_threshold 且处于受管辖状态\n    scaling:\n      threshold_reduction_per_tier: 5\n      days_bonus_per_tier: 0.5\n      max_tier: 5\n    caps:\n      min_threshold: 45\n      max_bonus_days_per_survivor: 2\n      max_total_maintenance_days: 21\n    anti_snowball:\n      diminishing_return_after_survivors: 8\n      diminishing_factor: 0.5\n\nlevels:\n  "1":\n    label: 房间求生\n    unlocks:\n      - energy.core_heat_grid_t1\n      - security.entry_bulkhead_t1\n      - sustain.wanxiang_synth_t1\n      - life.water_heater_t1\n      - social.nearfield_monitor_t1\n      - expansion.cold_protection_t1\n  "2":\n    label: 核心区稳态\n    unlocks:\n      - energy.load_dispatch_t2\n      - security.floor20_audio_t2\n      - sustain.hygiene_medical_t2\n      - life.clean_rhythm_t2\n      - social.shift_ration_protocol_t2\n      - expansion.cold_protection_t2\n  "3":\n    label: 走出房门\n    unlocks:\n      - energy.hallway_heat_reach_t3\n      - security.hallway_control_t3\n      - sustain.group_care_t3\n      - life.legacy_theater_t3\n      - social.video_intercom_t3\n      - expansion.floor20_anchor_t3\n  "4":\n    label: 楼层感知\n    unlocks:\n      - energy.floor_budget_t4\n      - security.wanxiang_thermal_t4\n      - sustain.wanxiang_gourmet_t4\n      - life.stage_lounge_t4\n      - social.eden_phone_mass_t4\n\n\nabilities:\n  energy.core_heat_grid_t1:\n    name: "♨️供暖供电接口协议T1"\n    category: 能源\n    unlock_level: 1\n    system_line: energy\n    tier: 1\n    growth_target: 基础供电和供暖模块：2001室从此具备供暖与供电。\n    player_advantage: 有稳定温度和电子设备/电器开机能力。\n    insufficiency: 只能在2001内部使用，不得外接。\n    desc: 维持2001核心区的基础供暖与最低供电\n    effects: [2001供暖, 生活用电]\n    balance:\n      cost: 低\n      limit: 仅2001室内\n    upkeep:\n      - 负荷冗余低\n    summary:\n      prompt_brief: "可维持2001核心区的基础供暖与生活供电接口，范围仅2001室，不得外接。"\n    boundary:\n      cannot:\n        - "不能扩展到其他房间"\n        - "不能用于工业生产"\n        - "不能直接使用电网参加战斗"\n    writing_contract:\n      must_avoid:\n        - "不是能源环境系统"\n\n  security.entry_bulkhead_t1:\n    name: "🛡️金属安防门T1"\n    category: 安全\n    unlock_level: 1\n    system_line: security\n    tier: 1\n    growth_target: 2001室的门不可轻易破开\n    player_advantage: 能延缓破门、争取观察与应对时间。\n    insufficiency: 只能守住入口，无法主动进攻\n    desc: 一道用于强化2001核心入口的门体、门闩与缓冲防线，使得几乎无法强闯。\n    effects: [安防强化]\n    balance:\n      cost: 低\n      limit: 只对门有效\n    upkeep:\n      - 极高强度暴力破坏可以损坏破门\n    summary:\n      prompt_brief: "一道用于强化2001核心入口的门体，用于防止强闯，仅入口有效，不能覆盖整层。"\n    boundary:\n      cannot:\n        - "反杀或永久压制入侵"\n    writing_contract:\n      must_avoid:\n        - ""\n        - ""\n\n  sustain.wanxiang_synth_t1:\n    name: "🍞万象合成终端T1"\n    category: 维生\ 由寻求暂时避难的普通市民组成，依靠地下空间的密封性来抵御暴雪和极寒。通常由原地铁工作人员、物业管理人员或任何表现出一定组织能力的人领导。\n       据点特点: 利用地铁站或大型建筑地下停车场的封闭结构，相对温暖且不易受雪晶侵蚀。\n       面临困境: 通风条件极差，空气混浊、氧气不足；容易滋生疾病；最重要的是物资极度匮乏，食物和水需要频繁冒险外出搜寻，补给线脆弱；心理压力巨大，随时可能爆发恐慌或内讧。\n       与您的潜在关系: 求援对象或交易伙伴。他们可能会发出微弱的无线电信号求救，或者派遣小股人员冒险外出，试图与任何可能强大的庇护所（包括您的“伊甸”）进行以劳力、旧物换取食物和药品的交易。\n\n   微型堡垒类型二：超市/便利店废墟\n       构成方式: 初期围绕被洗劫一空的超市或大型便利店残骸聚集，由早期搜刮到武器或具有一定威慑力的人主导。\n       据点特点: 初期物资丰富，但很快就会被洗劫一空，沦为冰冷的空壳。暴露在暴雪之下，难以防守。\n       面临困境: 极易遭受攻击，安全性极差；内部常常因仅剩的物资分配问题爆发激烈冲突；领导者往往通过暴力维持统治，而非有效管理。\n       与您的潜在关系: 潜在冲突对象或资源点。您可能会遇到他们在外搜刮的队伍，引发物资冲突。亦或者，当他们力量衰弱时，成为您攻占获取残余物资的“靶子”。\n\n   微型堡垒类型三：医院急诊楼\n       构成方式: 以一名或几名医生、护士为核心，吸引了大量伤患和寻求医疗帮助的幸存者。\n       据点特点: 拥有稀缺的医疗资源和基础设备，对受伤或生病的人具有巨大的吸引力。\n       面临困境: 感染风险极高，病患集中容易导致传染病爆发；医疗物资快速耗尽；医生等专业人员被视为“神明”，但自身安全难以保障，随时可能被强迫或掠夺。\n       与您的潜在关系: 稀有药品来源或潜在盟友。您可以尝试与他们进行药品交易（以食物、电力换取），或者在他们陷入危机时伸出援手，从而招募到珍贵的医护人员。\n\n---\n<%_ if (getvar(\'stat_data.世界.末日天数\', { defaults: 1 }) >= 31) { _%>\n### [后期：成型的大型势力 (末日天数 31 日之后)]\n当末日进入31天之后，外部世界的格局开始发生显著变化。那些脆弱的“微型堡垒”要么被更强大的势力吞并，要么彻底消亡。取而代之的是，少数几个具有明确意识形态和组织结构的大型幸存者势力开始浮出水面，争夺区域霸权。这些势力在前期阶段（1-30天）可能仅以流言、传说或极其雏形的组织存在，尚未形成统治力。\n\n   势力一：雪狼帮 (The Snow Wolves)\n       意识形态: 弱肉强食，暴力掠夺。\n       构成方式: 由前特种兵“雪狼”奥托为首，吸纳了大量退伍军人、警察和黑帮成员组成的暴力团体。纪律严明，执行力强，是纯粹的掠夺者。\n       据点: 城市最高建筑“天穹塔”。他们利用高度优势进行观察和威慑。\n       行为模式:\n           在暴雪减弱的“窗口期”（当他们通过自身观测发现“平静窗口期”规律后），会派出由雪地摩托组成的“狩猎队”，在新形成的“雪原”上猎杀落单的幸存者，抢夺物资与关键人员（医护、技术、情报），并以绑架与恐吓维持统治。\n           对其他幸存者据点采取高压态势，要求他们定期上缴“贡品”以换取“和平”。\n           他们最终的目标，是找到并控制传说中的“方舟信标”（一个被他们误解的情报），认为那是统治新世界的关键。\n       与您的潜在关系: 主要敌人。随着您“星穹秩序”的扩张，与“雪狼帮”的冲突将不可避免。他们是您统一整个社区的最大障碍。\n\n   势力二：“方舟”教会 (The Church of Ark)\n       意识形态: 宗教狂热，集体主义。\n       构成方式: 由一位极具个人魅力的“先知”（真实身份不明）领导，宣扬“永恒暴雪”是神的洗礼，只有加入“方舟”教会，才能得到最终的救赎。成员多为精神崩溃、寻求慰藉的普通幸存者。\n       据点: 瑞峰购物中心。他们利用商场庞大的物资储备和封闭结构，建立了一个自给自足的“乌托邦”。\n       行为模式:\n           通过无线电广播“福音”，吸引附近的幸存者加入。\n           内部实行严格的配给制和精神控制，所有新成员都必须交出一切私有财产。\n           表面上看起来和平、互助，但对异教徒和叛逃者会采取极其残酷的“净化”手段。\n           他们也在试图寻找传说中的“神迹”——即您的“伊甸”庇护所，认为那是上帝赐予他们的圣地。\n       与您的潜在关系: 潜在敌人或可利用的棋子。他们的集体主义和狂热信仰，使其成为一股不可小觑的力量。您可以尝试与他们进行交易，或者揭露他们“先知”的真面目，从内部分化瓦解他们。\n\n   势力三：拾荒者联盟 (The Scavenger\'s Union)\n       意识形态: 绝对中立，利益至上。\n       构成方式: 一个松散的、由各个小型幸存者团体组成的商业联盟。他们的领袖是被称为“老板娘”的神秘女性。\n       据点: 没有固定据点。他们的核心是一支由改装装甲巴士组成的车队，在城市废墟中不断移动，进行交易和情报交换。\n       行为模式:\n           他们绘制了一份详尽的“雪原地图”，标注了各个物资点、危险区域和其他幸存者势力的位置。\n           他们是末日世界里的“商人”和“情报贩子”。只要您出得起价钱（食物、药品、能源），就可以从他们那里买到任何您想要的东西——无论是武器弹药，还是关于您竞争对手的动向。\n           他们严格遵守交易规则：中立营地禁止强迫交易与公开奴役；破坏规则者会被拉黑、围猎或卖给更可怕的势力。\n           他们从不主动攻击客户，但也绝不提供免费的帮助。\n       与您的潜在关系: 中立/合作伙伴。他们是您在游戏前中期了解外部世界、获取稀有资源的重要渠道。但他们的情报也可能被您的敌人买走。维持与他们的良好关系，是您扩张策略中的重要一环。\n<%_ } _%>\n---\n### [外部环境与聚落多样化 (可选后期参考)]\n-   雪原地貌演变:\n       初期 (1-10天): 积雪淹没街道，交通困难但仍可辨识路况。\n       中期 (11-30天): 积雪覆盖低层建筑，城市轮廓模糊，行动更加受限。\n       后期 (31天后): 形成全新的雪原景观，地表被厚重冰雪完全覆盖，可能出现冰洞网络和雪脊，地形复杂危险。\n-   中小型聚落类型 (30天后参考):\n       医院堡垒: 医生领导的、以医疗为核心的幸存者团体，防御严密但资源单一。\n       学校庇护所: 教师或家长领导的，以保护儿童和教育为宗旨的团体，拥有一定知识储备但战斗力弱。\n       流动雪橇营地: 游牧式的幸存者，依靠改装雪橇和狩猎为生，自由但生存艰难。\n\n---\n</外部幸存者势力>\n<%_ } _%>\n'),t=Array.from(e.matchAll(/势力[一二三四五六七八九十]：([^\r\n(]+)/g)).map(e=>si(e[1])).filter(Boolean);if(t.length>0)return t.join('；');return['地下停车场/地铁站难民','超市/便利店废墟据点','医院急诊楼幸存者'].join('；')}function fi(e,t){const n=e&&'object'==typeof e?e:{},r=si(Un().get(n,'world_mode_id',_i()))||_i(),a=di(t,r),s=mi(t,r),o=ui(t,r),i=Un().get(n,'form_values',null)??null,l=Un().get(n,'user_input',{})??{},c=Un().get(n,'user_draft',{})??{};a.forEach(e=>{const t=e.key,n=i?.[t]??c[t]??l[t]??e.default_value??o[t]??'';o[t]=si(n)});const u=function(e){const t=si(e);return'ready'===t||'generating'===t||'configuring'===t?t:'placeholder'}(Un().get(n,'state','placeholder')),d=ii(Un().get(n,'opening_assistant_message_id',null))??ii(Un().get(n,'opening_result_message_id',null)),m=si(Un().get(n,'compiled_prompt_snapshot','')),p=Object.values(o).some(Boolean),g=null!=d?'ready':'generating'===u?'generating':m||p?'configuring':'placeholder',f=si(Un().get(n,'route_id
