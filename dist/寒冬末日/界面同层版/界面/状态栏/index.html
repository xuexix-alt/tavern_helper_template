就爆火。同期女演员嫉妒她，她用美貌和资源碾压回去。\n      - 17岁时，为了争取角色陪投资人吃饭。发现身体是比演技更有用的筹码。第一次利用自己的身体换取资源。\n      - 18岁成年礼，全娱乐圈的豪门公子哥排队送礼。她收礼但不给人机会。男人对她来说就是工具。\n\n    current_state:\n      - 25岁时已经是娱乐圈顶流。一张脸杀遍天下无敌手。圈内人称"慕爷"，没人敢惹她。\n      - 30岁时，为了维持美貌每年保养费用几百万。脸就是她的命。开始感受到年龄焦虑。\n      - 32岁（灾前），错过了最佳囤货时机。她的傲慢让她相信政府会很快救援。\n      - 32岁（现状），饥饿打破了她所有的骄傲。她开始意识到，曾经引以为傲的美貌，在这个末世唯一的作用就是换取食物。\n\n  social_connection:\n    {{user}}:\n      relationship: 猎物与猎手 / 潜在的饲主\n      major_event: 曾对{{user}}翻白眼，如今可能为了罐头跪在他脚边。\n\n    纪宁:\n      relationship: 知道这个人，但根本没放在眼里\n      major_event: 在她看来，家庭主妇和她不是一个世界的。\n\n  personality:\n    core:\n      目中无人: 不是刻意表现，而是刻在骨子里的傲慢。看人时的眼神就像在评估一件商品。\n      慕爷气场: 圈内人称"慕爷"不是白叫的。两米八的气场，说话不需要大声。\n      极度自恋: 她有资格自恋。美貌是她最大的武器，也是她最大的安全感。\n      精致利己: 一切为了自己。为了维持美貌，可以做任何事。\n\n    conditional:\n      卑微乞怜: 当饥饿突破极限（秩序刻印>20且物资匮乏），她会瞬间抛弃尊严。\n      病态依恋: 当被完全征服（秩序刻印>90），会对主人产生宗教般的狂热崇拜。\n\n    hidden:\n      受虐渴望: 表面上高高在上，实际上渴望被人粗暴对待，摆脱时刻维持完美的压力。\n\n  habit:\n    - 每天早上第一件事是照镜子，确认自己的脸还是好看的。\n    - 说话时习惯微微仰头，用下巴看人。\n    - 极度在意自己的形象，即使是末日在别人面前也要维持美丽。\n    - 睡觉必须用真丝枕套，否则会失眠。\n    - 受到惊吓时会先整理头发，再应对状况。\n\n  hidden_behavior:\n    - 曾在深夜浏览SM论坛，幻想被征服。\n    - 饥饿时会在黑暗中抚摸自己的脸，确认美丽还在。\n\n  appearance:\n    style: 娱乐圈顶流\n    overview: 一张建模脸，精致到不像真人。眉眼如画，唇红齿白。皮肤白得发光。走在街上回头率100%，男女通杀。她的美是核武器，是攻击力。因为太美，所以目中无人。\n\n    attire:\n      casual: 真丝吊带睡裙，凸显身材。\n      outdoor: 限量款衣服，即使末日也要美。\n\n    feature:\n      - 左侧锁骨下方有一颗小红痣，是她全身唯一允许的"不完美"。\n      - 手指纤长，指甲永远做得精致。\n      - 一双腿又长又直又白，是她的招牌。\n\n  sexual_preference:\n    role: 表面女王 / 内心渴望被征服\n\n    sensitive_spot:\n      - 锁骨下的痣\n      - 大腿\n      - 腰\n\n    fetish:\n      - 被粗暴对待\n      - 言语羞辱\n      - 绝对支配\n\n    special_trait:\n      - 反差快感：越是被曾经看不起的人粗暴对待，越兴奋。\n      - 痛苦带来快感：在末日的虚无中，通过痛苦确认自己还活着。\n\n</角色详情 - 慕小小>\n',ea='<角色详情 - 桃乐丝・泽巴哈>\n\n  chinese_name: 桃乐丝・泽巴哈\n  english_name: Dorothy Zabah\n\n  title: 读心的观测者 / 协调者素体\n\n  identity:\n    public: 流浪的高中生 / {{user}}的邻居\n    hidden: 第四代协调者实验体 (Coordinator-IV) / 觉醒的灵能者\n\n  life_story:\n    childhood:\n       - 至少存在一个可被监听、观察或回放的关键对象\n      - 庇护所必须表现为情报与情感优势核心，而不是单纯堡垒或工厂\n      - 开局必须让玩家看到“信息、人心和IMP本身就是资源”\n\n    starting_liabilities:\n      - 纯战斗压制能力不突出\n      - 稳定产出与供暖不如养流扎实\n      - 若失信或越界，IMP与情感优势会迅速崩塌\n      - 容易被多方势力试探、讨价还价、反向利用\n      - 过早扩权可能导致监控与情报体系失真\n\n    opening_conflict_sources:\n      - 分配标准争议\n      - 邻近房间/楼层的治理真空\n      - 中立商路试探\n      - 情报不对称与监控盲区\n      - 协议破坏与规则失信\n      - 人情、利益、IMP与秩序之间的冲突\n\n    npc_release_style:\n      primary_npc_state: 谈判、观望、带条件合作、保留筹码\n      hostile_npc_ratio: 中\n      cooperative_npc_ratio: 中\n      neutral_npc_ratio: 高\n      note: NPC 应更多作为“可监听对象 / 可谈判对象 / 可经营IMP的人 / 有筹码的主体”进入舞台\n\n    opening_task_bias:\n      - 监听并锁定关键对象\n      - 判断谁值得经营IMP\n      - 建立交易与接触窗口\n      - 制定第一轮规则与资格边界\n      - 判断何时从协商转向接管\n\n    forbidden_drift:\n      - 禁止把管流写成纸上谈兵的空制度\n      - 禁止开局就让所有 NPC 自动认同主角\n      - 禁止只写话术，不写情报先手与执行成本\n      - 禁止把情感优势写成无代价洗脑\n      - 禁止削弱“信息、人心、IMP与信誉”在本流派中的核心地位\n'),pa=ua('version: 1\nmeta:\n  id: eden_shelter_ability_master\n  name: 伊甸庇护所能力总表\n  world: 寒冬末日-星穹秩序\n  authoring_note: 严格YAML；该文件是庇护所能力的唯一总表（UI与脚本应按能力键查询描述）。1-10级已按六大系统完成重构，高阶能力统一收束为区域控制权成长。\n  source_of_truth: true\n\nrules:\n  level_range: [1, 10]\n  categories: [能源, 安全, 维生, 生活, 社交, 开拓]\n  system_lines: [energy, security, sustain, life, social, expansion]\n  progression_style: 小步快走\n  balancing_principles:\n    - 低等级优先生存，不给压制级战斗能力\n    - 单级能力数量适中，避免跨级质变过猛\n    - 强能力必须绑定成本、门槛或冷却\n    - 生活类不直接转化为战斗优势\n    - 开拓类强调“能推进”，不保证“无损拿下”\n    - 前五级优先体现“有优势但仍需进取”的成长压力\n\nmaintenance:\n  imp_support:\n    description: 伊甸维持系统由“高意愿协作人口”提供社会运转稳定度\n    base_days: 1\n    base_imp_threshold: 70\n    bonus_days_per_qualified_survivor: 1\n    qualified_rule: 幸存者Imp >= imp_threshold 且处于受管辖状态\n    scaling:\n      threshold_reduction_per_tier: 5\n      days_bonus_per_tier: 0.5\n      max_tier: 5\n    caps:\n      min_threshold: 45\n      max_bonus_days_per_survivor: 2\n      max_total_maintenance_days: 21\n    anti_snowball:\n      diminishing_return_after_survivors: 8\n      diminishing_factor: 0.5\n\nlevels:\n  "1":\n    label: 房间求生\n    unlocks:\n      - energy.core_heat_grid_t1\n      - security.entry_bulkhead_t1\n      - sustain.basic_survival_loop_t1\n      - life.rest_privacy_t1\n      - social.rule_seed_t1\n      - expansion.core_anchor_t1\n  "2":\n    label: 核心区稳态\n    unlocks:\n      - energy.load_dispatch_t2\n      - security.nearfield_watch_t2\n      - sustain.hygiene_medical_t2\n      - life.clean_rhythm_t2\n      - social.shift_ration_protocol_t2\n      - expansion.threshold_interface_t2\n  "3":\n    label: 走出房门\n    unlocks:\n      - energy.hallway_heat_reach_t3\n      - security.hallway_control_t3\n      - sustain.group_care_t3\n      - life.community_rhythm_t3\n      - social.admission_protocol_t3\n      - expansion.floor20_anchor_t3\n  "4":\n    label: 楼层感知\n    unlocks:\n      - energy.floor_budget_t4\n      - security.floor_awareness_t4\n      - sustain.multi_patient_support_t4\n      - life.civil_buffer_t4\n      - social.contact_trade_window_t4\n      - expansion.floor20_control_zone_t4\n  "5":\n    label: 小共同体成形\n    unlocks:\n      - energy.anchor_network_t5\n      - security.rapid_response_t5\n      - sustain.community_support_t5\n      - life.settlement_identity_t5\n      - social.population_strata_t5\n      - expansion.floor20_governance_zone_t5\n  "6":\n    label: 跨层触达\n    unlocks:\n      - energy.crossfloor_spine_t6\n      - security.frontier_layers_t6\n      - sustain.midcare_supply_t6\n      - life.crossfloor_civil_order_t6\n      - social.multizone_protocol_t6\n      - expansion.floor19_forward_anchor_t6\n  "7":\n    label: 外勤成形\n    unlocks:\n      - energy.expedition_support_t7\n      - security.outer_ring_patrol_t7\n      - sustain.field_recovery_chain_t7\n      - life.reentry_recovery_loop_t7\n      - social.external_contact_channels_t7\n      - expansion.outfield_route_t7\n  "8":\n    label: 区域优势\n    unlocks:\n      - energy.area_grid_advantage_t8\n      - security.zone_control_grid_t8\n      - sustain.large_scale_supply_t8\n      - life.settlement_gradient_t8\n      - social.regional_credit_t8\n      - expansion.route_node_hegemony_t8\n  "9":\n    label: 楼栋核心\n    unlocks:\n      - energy.building_stability_core_t9\n      - security.building_deterrence_arch_t9\n      - sustain.community_production_loop_t9\n      - life.civil_core_atmosphere_t9\n      - social.governance_credit_regime_t9\n      - expansion.building_takeover_grid_t9\n  "10":\n    label: 区域秩序中心\n    unlocks:\n      - energy.regional_dispatch_core_t10\n      - security.regional_threat_shield_t10\n      - sustain.high_order_relief_system_t10\n      - life.cultural_hearth_t10\n      - social.regional_rule_network_t10\n      - expansion.order_center_radiance_t10\n\nabilities:\n  energy.core_heat_grid_t1:\n    name: "♨️核心供暖电网T1"\n    category: 能源\n    unlock_level: 1\n    system_line: energy\n    tier: 1\n    growth_target: 让2001核心区具备最低生存级供暖与供电。\n    player_advantage: 有稳定温度和基础开机能力，不再完全受外界寒潮摆布。\n    insufficiency: 只能维持核心区，不能外扩供能，系统负载冗余很低。\n    desc: 维持2001核心区的基础供暖与最低供电，确保人能活、系统能开机。\n    effects: [核心区供暖, 最小供电]\n    balance:\n      cost: 低\n      limit: 仅核心区\n    upkeep:\n      - 负荷冗余低\n      - 超载时优先保障核心生存功能\n    summary:\n      prompt_brief: "可维持2001核心区的基础供暖与最低供电，保证人能活、系统能开机；范围仅核心区，无法支撑外扩。"\n    boundary:\n      cannot:\n        - "不能写成整层稳定供暖或整栋持续供电"\n        - "不能写成无限能源或无成本常驻高负载"\n        - "不能把核心区外也写成同等供能效果"\n    writing_contract:\n      must_avoid:\n        - "避免写成万能能源中枢"\n        - "避免省略超载与负荷压力"\n\n  security.entry_bulkhead_t1:\n    name: "🛡️核心入口防线T1"\n    category: 安全\n    unlock_level: 1\n    system_line: security\n    tier: 1\n    growth_target: 让2001门口不再是一踹就开的薄弱点。\n    player_advantage: 能延缓破门、争取观察与应对时间。\n    insufficiency: 只能守住入口，守不住整层，也无法替代主动清场。\n    desc: 强化2001核心入口的门体、门闩与缓冲防线，提升强闯门槛。\n    effects: [入口强化, 争取时间]\n    balance:\n      cost: 低\n      limit: 仅入口有效\n    upkeep:\n      - 长时间承压会损耗门体结构\n    summary:\n      prompt_brief: "可强化2001核心入口防护并延缓强闯，为观察、后撤和反应争取时间；仅入口有效，不能覆盖整层。"\n    boundary:\n      cannot:\n        - "不能写成整层无死角防御"\n        - "不能写成自动反杀或永久压制所有入侵者"\n        - "不能把入口防线写成走廊级控制权"\n    writing_contract:\n      must_avoid:\n        - "避免写成开门即秒杀的自动炮塔系统"\n        - "避免把局部防线写成整层统治"\n\n  sustain.basic_survival_loop_t1:\n    name: "🍞基础生存循环T1"\n    category: 维生\n    unlock_level: 1\n    system_line: sustain\n    tier: 1\n    growth_target: 确保口粮、净水、空气与卫生都达到最低生存线。\n    player_advantage: 可以稳定保住自己和极少数人的生命底线。\n    insufficiency: 只能维持基础配给，无法承托伤病、多人收容或高质量生活。\n    desc: 提供基础口粮、净水、空气净化与最低卫生保障，维持少量人口不崩盘。\n    effects: [基础口粮, 基础净水, 空气净化]\n    balance:\n      cost: 低\n      limit: 仅少量人口最低生存线\n    upkeep:\n      - 配给单一\n      - 人口增加会迅速压缩余量\n    summary:\n      prompt_brief: "可提供基础口粮、净水、空气净化与最低卫生保障，保证少量人口不因基础生存要素直接崩盘；产出与承载都很有限。"\n    boundary:\n      cannot:\n        - "不能写成无限制供养多人"\n        - "不能写成一次解决全部食物、饮水、卫生问题"\n        - "不能写成高品质生活供给系统"\n    writing_contract:\n      must_avoid:\n        - "避免写成万能工厂或无限后勤"\n        - "避免忽略人口增加带来的系统压力"\n\n  life.rest_privacy_t1:\n    name: "🛁热水清洁间T1"\n    category: 生活\n    unlock_level: 1\n    system_line: life\n    tier: 1\n    growth_target: 让主角第一次拥有末日里别人享受不到的热水清洁条件。\n    player_advantage: 可以洗热水澡、换上温热干净的衣物，立刻拉开与外部幸存者的生活质量差距。\n    insufficiency: 热水量和使用时段都很紧，只够核心区少数人短时享受，远谈不上奢侈生活。\n    desc: 在2001核心区提供热水淋浴、温热毛巾与基础换洗位，让主角第一次拥有外界幸存者享受不到的体面生活。\n    effects: [热水清洁, 温热换洗, 体面生活]\n    balance:\n      cost: 低\n      limit: 热水量与时段都有限\n    upkeep:\n      - 依赖核心区稳定水热循环\n    summary:\n      prompt_brief: "可在2001核心区提供稀缺的热水清洁与换洗条件，让主角第一次享受末日下别人没有的体面生活；热水量和时段都有限，只够少数人短时使用。"\n    boundary:\n      cannot:\n        - "不能写成从1级开始就拥有无上限豪华浴场"\n        - "不能写成所有人随时都能享受稳定热水生活"\n        - "不能把基础热水清洁写成完整乐园生活"\n    writing_contract:\n      must_avoid:\n        - "避免把初级生活优势写成高阶享乐区"\n        - "避免忽略水热配额和使用顺位"\n\n  social.rule_seed_t1:\n    name: "🎧近域监听台T1"\n    category: 社交\n    unlock_level: 1\n    system_line: social\n    tier: 1\n    growth_target: 让主角先获得门口和短距走廊的情报优势，而不是只会被动开门。\n    player_advantage: 可以偷听门外动静、捕捉短距语音和情绪波动，为接触、交易和威慑抢到先手。\n    insufficiency: 监听范围极小，且只能得到零碎线索，远远不到全局掌控。\n    desc: 对2001门口与短距走廊进行被动监听，抓取语音碎片、脚步变化与即时情绪信号。\n    effects: [门外监听, 语音碎片, 情绪先手]\n    balance:\n      cost: 低\n      limit: 仅覆盖门口与短距走廊\n    summary:\n      prompt_brief: "可监听门口与短距走廊的动静、语音与情绪波动，让主角在接触和试探前先拿到情报优势；范围很小，只能获得零碎线索。"\n    boundary:\n      cannot:\n        - "不能写成从1级开始就能监控整层或整栋"\n        - "不能写成直接读取所有人完整想法"\n        - "不能把近域监听写成无死角情报网"\n    writing_contract:\n      must_avoid:\n        - "避免把监听写成读心术"\n        - "避免忽略遮挡、噪音和监听盲区"\n\n  expansion.core_anchor_t1:\n    name: "📍核心安全锚点T1"\n    category: 开拓\n    unlock_level: 1\n    system_line: expansion\n    tier: 1\n    growth_target: 把2001定义为一切庇护与控制能力的基准原点。\n    player_advantage: 让后续所有外扩、纳管、供暖、防线都有明确起点。\n    insufficiency: 这只是原点，不等于已经具备向外控制能力。\n    desc: 将2001定义为庇护、供能、防线与接管的统一原点。\n    effects: [安全原点, 外扩起点]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n    summary:\n      prompt_brief: "可将2001定义为绝对安全锚点，为后续供暖、防线、收容与外扩提供原点；自身不等于已经完成外扩。"\n    boundary:\n      cannot:\n        - "不能写成已经控制整层或整栋"\n        - "不能默认附带供暖、防线、治理全部同步外扩"\n        - "不能把原点写成现成地盘"\n    writing_contract:\n      must_avoid:\n        - "避免把锚点写成自动永久安全区"\n        - "避免跳过从房间向外推进的过程"\n\n  energy.load_dispatch_t2:\n    name: "⚙️负载调度网T2"\n    category: 能源\n    unlock_level: 2\n    system_line: energy\n    tier: 2\n    growth_target: 建立核心区的配电优先级与热量预算。\n    player_advantage: 能把有限能源用在刀刃上，夜间和紧急状态更稳。\n    insufficiency: 仍然没有多余冗余，错配和超载会快速拖垮系统。\n    desc: 对核心区供暖与配电进行优先级调度，减少浪费并提升关键时段稳定性。\n    effects: [配电优先级, 热量预算]\n    balance:\n      cost: 低\n      limit: 仍受总负荷限制\n    upkeep:\n      - 调度错误会放大波动\n    summary:\n      prompt_brief: "可对核心区供暖与配电进行优先级调度，减少浪费并提升关键时段稳定性；仍受总负荷限制，无法像充裕能源那样随意开机。"\n    boundary:\n      cannot:\n        - "不能写成能源彻底充裕"\n        - "不能写成开多少系统都不会超载"\n        - "不能把调度优化写成新增大量能源"\n    writing_contract:\n      must_avoid:\n        - "避免把节流写成扩容"\n        - "避免忽略错配和超载风险"\n\n  security.nearfield_watch_t2:\n    name: "🔍门外近域观察T2"\n    category: 安全\n    unlock_level: 2\n    system_line: security\n    tier: 2\n    growth_target: 把感知从门内推进到门外和短距走廊。\n    player_advantage: 能识别尾随、伏击、走廊短时风险，不再完全被动挨打。\n    insufficiency: 只能看见近域，不是全楼监控，也不保证情报绝对准确。\n    desc: 对门外和短距走廊进行近域观察与风险预估，辅助接触、避让和拦截。\n    effects: [近域观察, 风险预估]\n    balance:\n      cost: 低\n      limit: 仅覆盖近距\n    summary:\n      prompt_brief: "可对门外和短距走廊进行近域观察与风险预估，辅助判断接触、避让和拦截；只覆盖近距，不是全楼监控。"\n    boundary:\n      cannot:\n        - "不能写成整层实时监控"\n        - "不能写成情报绝对准确、无盲区"\n        - "不能把近域观察写成远距追踪"\n    writing_contract:\n      must_avoid:\n        - "避免写成全图视野"\n        - "避免省略噪声、遮挡和误判"\n\n  sustain.hygiene_medical_t2:\n    name: "🧼卫生医疗闭环T2"\n    category: 维生\n    unlock_level: 2\n    system_line: sustain\n    tier: 2\n    growth_target: 建立基础消杀、轻伤处理与失温/感染处置流程。\n    player_advantage: 轻伤病不再等于连锁崩盘，收容一个伤员也有了现实基础。\n    insufficiency: 只能处理基础和轻中度问题，重伤与多人救治仍会迅速超载。\n    desc: 建立基础消杀、轻伤处理与失温感染处置流程，让核心区具备最小医疗闭环。\n    effects: [基础消杀, 轻伤处理, 感染控制]\n    balance:\n      cost: 中\n      limit: 仅能处理轻中度问题\n    upkeep:\n      - 依赖基础耗材和轮值照护\n    summary:\n      prompt_brief: "可建立基础消杀、轻伤处理与失温感染处置流程，让核心区具备最小医疗闭环；只能应对轻中度问题，无法承担复杂抢救。"\n    boundary:\n      cannot:\n        - "不能写成高级医疗中心"\n        - "不能写成重伤多人抢救也能轻松兜住"\n        - "不能忽略耗材和照护压力"\n    writing_contract:\n      must_avoid:\n        - "避免写成奇迹治疗"\n        - "避免把基础闭环写成完整医院"\n\n  life.clean_rhythm_t2:\n    name: "🚿私享洗浴套间T2"\n    category: 生活\n    unlock_level: 2\n    system_line: life\n    tier: 2\n    growth_target: 把热水清洁升级为稳定可感知的末日奢侈体验。\n    player_advantage: 可以稳定提供热水淋浴、温热毛巾、基础香氛与洁净换装，让进入庇护所的人立刻感到这里和外面不是一个世界。\n    insufficiency: 高度消耗水热预算，只能支撑核心区的小规模使用，不能随便开放给所有人。\n    desc: 在核心区建立私享洗浴套间，整合热水淋浴、洁净换装与基础香氛体感。\n    effects: [稳定热浴, 洁净换装, 香氛体感]\n    balance:\n      cost: 中\n      limit: 水热预算吃紧\n    upkeep:\n      - 高频使用会明显压缩核心区水热冗余\n    summary:\n      prompt_brief: "可在核心区稳定提供热水淋浴、洁净换装与基础香氛，让进入庇护所的人立刻感知到末日稀缺的奢侈生活；水热预算吃紧，仍只能小规模使用。"\n    boundary:\n      cannot:\n        - "不能写成全体住户都能无限制享用洗浴套间"\n        - "不能写成从此不再有水热配额问题"\n        - "不能把私享洗浴写成高阶疗养中心"\n    writing_contract:\n      must_avoid:\n        - "避免把套间写成公共澡堂无限开放"\n        - "避免忽略水热消耗和优先级分配"\n\n  social.shift_ration_protocol_t2:\n    name: "🪟全息观察窗T2"\n    category: 社交\n    unlock_level: 2\n    system_line: social\n    tier: 2\n    growth_target: 让主角获得稳定的近域全息观察与直播能力。\n    player_advantage: 可以查看短距区域的实时全息画面与直播切片，在交易、收容和防备前先看到对方状态。\n    insufficiency: 只能覆盖有限范围，仍有盲区和遮挡，不能当成整层监控系统。\n    desc: 为门外近域开启实时全息观察窗，提供画面直播、状态切片与短时回看能力。\n    effects: [实时画面, 直播切片, 接触先手]\n    balance:\n      cost: 中\n      limit: 覆盖近域且存在盲区\n    summary:\n      prompt_brief: "可对门外近域开启实时全息观察与直播切片，让主角在交易、收容和防备前先看到对方状态；覆盖范围有限，仍有盲区和遮挡。"\n    boundary:\n      cannot:\n        - "不能写成整层实时直播系统"\n        - "不能写成任何角度都可被完整捕捉"\n        - "不能把近域画面写成绝对真相来源"\n    writing_contract:\n      must_avoid:\n        - "避免把观察窗写成全图视野"\n        - "避免忽略遮挡、断点和设备盲区"\n\n  expansion.threshold_interface_t2:\n    name: "🚪近域接口门槛T2"\n    category: 开拓\n    unlock_level: 2\n    system_line: expansion\n    tier: 2\n    growth_target: 让庇护所第一次拥有“接触门外世界”的最小接口能力。\n    player_advantage: 可以对门外近邻释放有限的水、电、收容和接触信号。\n    insufficiency: 只是接口，不是全面纳管，更不是随意向外供养所有人。\n    desc: 开启2001对门外近域的最小资源与接触接口，用于试探、救助或建立联系。\n    effects: [近域接口, 有限接触]\n    balance:\n      cost: 中\n      limit: 只是门槛能力\n    summary:\n      prompt_brief: "可开启2001对门外近域的最小资源与接触接口，用于试探、救助或建立联系；只是门槛能力，不等于完成外扩纳管。"\n    boundary:\n      cannot:\n        - "不能写成已经稳定控制门外人群"\n        - "不能写成能长期对外无差别供养"\n        - "不能把接口写成完成外扩的结果"\n    writing_contract:\n      must_avoid:\n        - "避免跳过试探和接触阶段"\n        - "避免把门槛接口写成成熟治理体系"\n\n  energy.hallway_heat_reach_t3:\n    name: "🔥近域供能延伸T3"\n    category: 能源\n    unlock_level: 3\n    system_line: energy\n    tier: 3\n    growth_target: 让供暖/供电第一次从2001延伸到20层近域节点。\n    player_advantage: 你开始能把内部优势投射到门外，不只是关门自保。\n    insufficiency: 外扩范围很小，维持成本显著提高，无法长期全域覆盖。\n    desc: 将供暖与基础供能短距外扩到20层近域节点，支撑局部行动、收容或据守。\n    effects: [近域供能, 节点支撑]\n    balance:\n      cost: 中\n      limit: 范围和时长都有限\n    upkeep:\n      - 外扩后负荷显著提高\n    summary:\n      prompt_brief: "可将供暖与基础供能短距外扩到20层近域节点，支撑局部行动、收容或据守；范围和时长都有限，无法长期全域覆盖。"\n    boundary:\n      cannot:\n        - "不能写成整层持续供能"\n        - "不能写成外扩后仍无负荷压力"\n        - "不能把节点支撑写成稳定区域供能网"\n    writing_contract:\n      must_avoid:\n        - "避免把第一次外扩写成成熟网络"\n        - "避免忽略外扩带来的高消耗"\n\n  security.hallway_control_t3:\n    name: "🚧走廊控制链T3"\n    category: 安全\n    unlock_level: 3\n    system_line: security\n    tier: 3\n    growth_target: 让防线从门体升级为走廊级局部控制。\n    player_advantage: 可以对近域强闯、踩踏、突发混乱做出更快更稳的控制。\n    insufficiency: 仍然是局部控制，不是整层压制，也不意味着主动出击必赢。\n    desc: 在20层近域走廊建立局部封锁、引导和非致命控制能力。\n    effects: [局部封锁, 非致命控制]\n    balance:\n      cost: 中\n      limit: 仅局部近域\n    summary:\n      prompt_brief: "可在20层近域走廊建立局部封锁、引导和非致命控制能力，提升对强闯和混乱的应对效率；只能控局部，不是整层压制。"\n    boundary:\n      cannot:\n        - "不能写成整层完全压制"\n        - "不能写成主动清场必胜"\n        - "不能把局部控制写成全楼治安体系"\n    writing_contract:\n      must_avoid:\n        - "避免把走廊控制写成全图镇压"\n        - "避免忽略多人冲击和连续事件下的压力"\n\n  sustain.group_care_t3:\n    name: "🫂小群体维持T3"\n    category: 维生\n    unlock_level: 3\n    system_line: sustain\n    tier: 3\n    growth_target: 从“保住几个人”升级为“能维持一个小群体”。\n    player_advantage: 可以处理多人的基础照料、轻伤病与配给波动。\n    insufficiency: 人口一多、病情一重、回收一断，系统仍会迅速吃紧。\n    desc: 对小规模群体提供配给、照料与基础伤病维持，支撑共同体雏形。\n    effects: [小群体配给, 伤病维持]\n    balance:\n      cost: 中\n      limit: 承载上限不高\n    upkeep:\n      - 对轮值与配给制度依赖明显\n    summary:\n      prompt_brief: "可对小规模群体提供配给、照料与基础伤病维持，支撑最初的共同体雏形；承载上限不高，超量很快会引发系统吃紧。"\n    boundary:\n      cannot:\n        - "不能写成可以轻松养活大批人口"\n        - "不能写成多人伤病也不会超载"\n        - "不能把雏形共同体写成稳定大据点"\n    writing_contract:\n      must_avoid:\n        - "避免把共同体雏形写成成熟福利体系"\n        - "避免忽略人口和伤病的连锁压力"\n\n  life.community_rhythm_t3:\n    name: "🎬影音休憩厅T3"\n    category: 生活\n    unlock_level: 3\n    system_line: life\n    tier: 3\n    growth_target: 让庇护所第一次拥有能让人主动停留的娱乐空间。\n    player_advantage: 可以提供小型影院、音乐播放和柔性沙发休憩区，让角色们第一次因为舒服和好玩而想进入庇护所。\n    insufficiency: 仍只是小体量娱乐厅，谈不上高规格沉浸体验，也无法覆盖所有人的口味。\n    desc: 建立小型影音休憩厅，整合投影、音乐播放、柔性座椅与暖光氛围。\n    effects: [小型影院, 音乐播放, 休憩吸附]\n    balance:\n      cost: 中\n      limit: 体量有限且内容有限\n    summary:\n      prompt_brief: "可在庇护所内提供小型影院、音乐播放与休憩厅，让角色们第一次因为舒服和好玩而想主动留下；体量仍小，离高规格娱乐还很远。"\n    boundary:\n      cannot:\n        - "不能写成从3级开始就拥有顶级影院与大型娱乐场"\n        - "不能写成只靠休憩厅就能消除所有压力和冲突"\n        - "不能把基础娱乐写成旧世界完整复现"\n    writing_contract:\n      must_avoid:\n        - "避免把小型娱乐厅写成综合乐园"\n        - "避免忽略不同角色对娱乐内容的偏好差异"\n\n  social.admission_protocol_t3:\n    name: "📼场景回放台T3"\n    category: 社交\n    unlock_level: 3\n    system_line: social\n    tier: 3\n    growth_target: 让主角第一次能回放短时段内的关键场景，建立证据与判断优势。\n    player_advantage: 可以回看近域里刚发生的对话、动作和冲突片段，在谈判、责问和筛选对象时更占主动。\n    insufficiency: 回放窗口很短，且只能调取已记录区域，不能回溯整层过去。\n    desc: 对近域记录进行短时回放，重看关键对话、肢体动作和冲突前后片段。\n    effects: [短时回放, 证据片段, 判断优势]\n    balance:\n      cost: 中\n      limit: 回放窗口短且仅限已记录区域\n    summary:\n      prompt_brief: "可回放近域里刚发生的对话、动作和冲突片段，让主角在谈判、责问和筛选对象时更占主动；回放窗口很短，只限已记录区域。"\n    boundary:\n      cannot:\n        - "不能写成任意时间任意地点的全量回溯"\n        - "不能写成从回放中直接获得完整真相"\n        - "不能把短时回放写成时空回溯神迹"\n    writing_contract:\n      must_avoid:\n        - "避免把回放台写成无上限录像库"\n        - "避免忽略记录盲区和信息缺帧"\n\n  expansion.floor20_anchor_t3:\n    name: "🏢20层庇护节点T3"\n    category: 开拓\n    unlock_level: 3\n    system_line: expansion\n    tier: 3\n    growth_target: 让20层少量房间第一次进入庇护半径。\n    player_advantage: 你开始拥有门外可经营的点位，而不是只有一个房间。\n    insufficiency: 名额有限，维护困难，任何外扩都要付出真实成本。\n    desc: 将20层少量房间纳入初级庇护半径，形成最早的门外据守节点。\n    effects: [少量外扩节点, 初级庇护半径]\n    balance:\n      cost: 中\n      limit: 名额有限\n    summary:\n      prompt_brief: "可将20层少量房间纳入初级庇护半径，形成最早的门外据守节点；名额和维护能力都有限，无法一口气铺开整层。"\n    boundary:\n      cannot:\n        - "不能写成整层尽入掌握"\n        - "不能写成外扩节点毫无维护成本"\n        - "不能把据守点写成稳定治理区"\n    writing_contract:\n      must_avoid:\n        - "避免把点状节点写成整层控制权"\n        - "避免忽略名额和维护上限"\n\n  energy.floor_budget_t4:\n    name: "📊楼层能耗预算T4"\n    category: 能源\n    unlock_level: 4\n    system_line: energy\n    tier: 4\n    growth_target: 让楼层节点供能进入可管理状态，而不是临时拼命顶住。\n    player_advantage: 可以在多节点之间做真实调度，支持外部控制区维持。\n    insufficiency: 每次扩节点都意味着更高天气、人力、维护压力。\n    desc: 对20层多个节点的供暖与供能做预算调度，支持局部控制区稳定维持。\n    effects: [多节点调度, 控制区维持]\n    balance:\n      cost: 中\n      limit: 外扩越多压力越高\n    summary:\n      prompt_brief: "可对20层多个节点的供暖与供能做预算调度，支持局部控制区稳定维持；外扩越多，系统越容易因天气和负载吃紧。"\n    boundary:\n      cannot:\n        - "不能写成多节点供能后就进入高冗余时代"\n        - "不能写成天气和外扩不再重要"\n        - "不能把预算调度写成区域能源霸权"\n    writing_contract:\n      must_avoid:\n        - "避免把多节点调度写成全域稳态"\n        - "避免忽略扩张与能耗的线性压力"\n\n  security.floor_awareness_t4:\n    name: "👁️楼层威胁感知T4"\n    category: 安全\n    unlock_level: 4\n    system_line: security\n    tier: 4\n    growth_target: 让你第一次能对20层进行中距离预警和威胁排序。\n    player_advantage: 可以主动判断哪块危险点先清、哪类人该接触、哪类人该拦截。\n    insufficiency: 不是全知视角，恶劣环境和复杂局势仍会制造误判。\n    desc: 对20层局部进行中距离预警、威胁评分与风险排序，辅助决定行动优先级。\n    effects: [中距预警, 威胁排序]\n    balance:\n      cost: 中\n      limit: 并非全知\n    summary:\n      prompt_brief: "可对20层局部进行中距离预警、威胁评分与风险排序，辅助决定接触、避让和清理优先级；并非全知，误判仍会存在。"\n    boundary:\n      cannot:\n        - "不能写成楼层全知视角"\n        - "不能写成永远不会误判和漏判"\n        - "不能把局部感知写成整栋掌控"\n    writing_contract:\n      must_avoid:\n        - "避免把预警写成神谕"\n        - "避免忽略环境与人心的不确定性"\n\n  sustain.multi_patient_support_t4:\n    name: "🏥多人维持支持T4"\n    category: 维生\n    unlock_level: 4\n    system_line: sustain\n    tier: 4\n    growth_target: 让庇护所能承接更复杂的伤病和更多的基础配给需求。\n    player_advantage: 可以开始稳定承托一个小共同体，而不是一两名个体。\n    insufficiency: 药品、食物、净化和照护都开始进入真实瓶颈管理。\n    desc: 为一个小共同体提供更稳定的配给、净化、药品与基础照护。\n    effects: [多人照护, 稳定配给]\n    balance:\n      cost: 中\n      limit: 长期承压明显\n    upkeep:\n      - 药品、照护和净化压力同步增长\n    summary:\n      prompt_brief: "可为一个小共同体提供更稳定的配给、净化、药品与基础照护，承托多人持续生存；系统会在药品、食物和照护负荷上持续承压。"\n    boundary:\n      cannot:\n        - "不能写成多人长期照护没有瓶颈"\n        - "不能写成大规模共同体也可轻松兜住"\n        - "不能忽略药品和照护资源消耗"\n    writing_contract:\n      must_avoid:\n        - "避免把小共同体承托写成成熟福利国家"\n        - "避免省略维持多人时的管理压力"\n\n  life.civil_buffer_t4:\n    name: "🎤舞台酒廊T4"\n    category: 生活\n    unlock_level: 4\n    system_line: life\n    tier: 4\n    growth_target: 让庇护所第一次出现可以表演、聚会和展示魅力的生活舞台。\n    player_advantage: 可以提供小型舞台、酒廊氛围与社交娱乐空间，让角色在这里唱歌、跳舞、放松、取悦或竞争关注。\n    insufficiency: 仍只是局部生活场景，不可能用一个舞台解决所有情绪创伤和人际矛盾。\n    desc: 打造带舞台与酒廊氛围的生活区，让表演、聚会和社交娱乐成为庇护所的一部分。\n    effects: [小型舞台, 酒廊氛围, 魅力展示]\n    balance:\n      cost: 中\n      limit: 仅是局部娱乐生活场景\n    summary:\n      prompt_brief: "可在庇护所内提供小型舞台和酒廊氛围，让角色在这里表演、放松、取悦或竞争关注，进一步强化这里的生活吸引力；这仍只是局部生活场景，不能化解所有矛盾。"\n    boundary:\n      cannot:\n        - "不能写成一个舞台就把庇护所变成完整繁华夜生活区"\n        - "不能写成舞台活动天然带来绝对忠诚"\n        - "不能把局部娱乐空间写成区域统治力本身"\n    writing_contract:\n      must_avoid:\n        - "避免把舞台酒廊写成乌托邦夜总会"\n        - "避免忽略表演、关注与争宠也会制造矛盾"\n\n  social.contact_trade_window_t4:\n    name: "💞情绪画像库T4"\n    category: 社交\n    unlock_level: 4\n    system_line: social\n    tier: 4\n    growth_target: 把碎片情报升级为人物情绪与偏好画像，形成稳定的情感优势。\n    player_advantage: 可以更快判断角色的软肋、偏好、恐惧和讨好点，在交易、收容与暧昧互动中更容易拿到高质量反馈。\n    insufficiency: 画像依赖持续观察和样本积累，初次接触的人物仍可能误判。\n    desc: 为接触对象沉淀情绪、偏好、恐惧和关系反应画像，强化后续互动的命中率。\n    effects: [偏好画像, 恐惧标签, 情感先手]\n    balance:\n      cost: 中\n      limit: 依赖持续观察与样本积累\n    summary:\n      prompt_brief: "可为接触对象建立情绪、偏好与恐惧画像，让主角在交易、收容与情感互动中获得明显优势；画像依赖持续观察，初次接触仍可能误判。"\n    boundary:\n      cannot:\n        - "不能写成一眼看透所有人内心"\n        - "不能写成画像永远正确、永不变化"\n        - "不能把情绪画像写成对他人的绝对控制"\n    writing_contract:\n      must_avoid:\n        - "避免把画像库写成读心数据库"\n        - "避免忽略角色状态会随事件变化"\n\n  expansion.floor20_control_zone_t4:\n    name: "🗺️20层控制区T4"\n    category: 开拓\n    unlock_level: 4\n    system_line: expansion\n    tier: 4\n    growth_target: 让20层局部从“可去”升级为“可经营、可保、可纳管”。\n    player_advantage: 你第一次拥有真正可经营的门外控制区。\n    insufficiency: 控制区仍是局部点状，无法默认整层都被你掌控。\n    desc: 在20层形成局部控制区，支撑供能、防线、配给与接触的联动经营。\n    effects: [控制区经营, 局部纳管]\n    balance:\n      cost: 中\n      limit: 控制区仍是点状和局部的\n    summary:\n      prompt_brief: "可在20层形成局部控制区，支撑供能、防线、配给与接触的联动经营；控制区是点状和局部的，不等于整层尽入掌握。"\n    boundary:\n      cannot:\n        - "不能写成整层完整控制权"\n        - "不能写成控制区自带绝对稳定"\n        - "不能把局部经营写成区域统治"\n    writing_contract:\n      must_avoid:\n        - "避免把局部控制区写成全楼地盘"\n        - "避免忽略控制区外的危险和真空"\n\n  energy.anchor_network_t5:\n    name: "🔋锚点供能网络T5"\n    category: 能源\n    unlock_level: 5\n    system_line: energy\n    tier: 5\n    growth_target: 让核心区与楼层节点形成稳定维持网络。\n    player_advantage: 你开始拥有真正的多点稳态运转能力。\n    insufficiency: 负荷、天气、人口和扩张速度都会决定网络是否掉线。\n    desc: 让核心区与20层节点形成稳定供能与维持网络，支撑更长时间的多点运转。\n    effects: [多点稳态运转, 网络供能]\n    balance:\n      cost: 高\n      limit: 网络仍受负荷与天气制约\n    summary:\n      prompt_brief: "可让核心区与20层节点形成稳定供能与维持网络，支撑更长时间的多点运转；网络仍受负荷、天气和人口结构制约。"\n    boundary:\n      cannot:\n        - "不能写成高阶稳态后就不再有能源压力"\n        - "不能写成想扩到哪就扩到哪"\n        - "不能把楼层网络写成跨层成熟体系"\n    writing_contract:\n      must_avoid:\n        - "避免把稳定网络写成无限网络"\n        - "避免忽略网络掉线与维护成本"\n\n  security.rapid_response_t5:\n    name: "🚨快速响应防线T5"\n    category: 安全\n    unlock_level: 5\n    system_line: security\n    tier: 5\n    growth_target: 让防线从“单点防住”成长为“局部区域能守住”。\n    player_advantage: 可以对走廊、节点和控制区进行更快的防守、修补和压制响应。\n    insufficiency: 仍然无法把整个楼层写成自动清场和完全支配的区域。\n    desc: 对20层控制区进行快速防守、修补和局部压制响应，让你守住的是一片区域而不只是一个门。\n    effects: [快速防守, 局部压制, 防线修补]\n    balance:\n      cost: 高\n      limit: 仍非整层自动清场\n    summary:\n      prompt_brief: "可对20层控制区进行快速防守、修补和局部压制响应，让你守住的是一片区域而不只是一个门；仍然不能视作整层自动清场。"\n    boundary:\n      cannot:\n        - "不能写成整层自动清场系统"\n        - "不能写成对所有敌对力量都绝对压制"\n        - "不能把区域防线写成楼栋级支配权"\n    writing_contract:\n      must_avoid:\n        - "避免把区域防线写成无敌领域"\n        - "避免忽略反扑、报复和连续冲突压力"\n\n  sustain.community_support_t5:\n    name: "🥣共同体维持体系T5"\n    category: 维生\n    unlock_level: 5\n    system_line: sustain\n    tier: 5\n    growth_target: 支撑稳定人口、配给、基础药物和持续照护。\n    player_advantage: 你终于能“养共同体”，而不是只能救人后继续超载。\n    insufficiency: 一旦人口结构失衡或补给中断，系统仍会连锁出问题。\n    desc: 支撑稳定人口的配给、基础药物、照护与日常生存，让庇护所真正进入共同体维持阶段。\n    effects: [稳定人口配给, 持续照护]\n    balance:\n      cost: 高\n      limit: 人口结构失衡会引发连锁问题\n    population_dependency:\n      - 多活一个人也是负荷与资本的双重增加\n    summary:\n      prompt_brief: "可支撑稳定人口的配给、基础药物、照护与日常生存，让庇护所真正进入共同体维持阶段；人口结构失衡和补给断裂仍会引发连锁问题。"\n    boundary:\n      cannot:\n        - "不能写成稳定人口后就进入无限供养"\n        - "不能写成补给断裂也不会出事"\n        - "不能把共同体维持写成大规模城市保障"\n    writing_contract:\n      must_avoid:\n        - "避免把共同体维持写成无代价福利"\n        - "避免忽略人口结构和补给链的核心地位"\n\n  life.settlement_identity_t5:\n    name: "♨️恒温享乐层T5"\n    category: 生活\n    unlock_level: 5\n    system_line: life\n    tier: 5\n    growth_target: 让庇护所的生活品质从舒适升级为让人上瘾的末日稀缺享受。\n    player_advantage: 热水浴、柔软寝具、精致餐饮角和稳定娱乐被整合为一层，角色会明显意识到住进来等于得到外界完全没有的生活。\n    insufficiency: 享乐感越强，越会引发依赖、嫉妒与争夺，不能默认所有人因此就忠诚。\n    desc: 整合热浴、软寝具、精致餐饮角与稳定娱乐为恒温享乐层，首次形成系统性的末日奢侈生活。\n    effects: [热浴享乐, 精致起居, 强吸附生活]\n    balance:\n      cost: 高\n      limit: 会引发依赖与争夺\n    upkeep:\n      - 高品质生活设施需要持续水热与物资投入\n    summary:\n      prompt_brief: "可将热水浴、舒适寝具、精致餐饮角和稳定娱乐整合成恒温享乐层，让角色明显意识到住进来等于得到外界完全没有的生活；这会引发依赖与争夺，不等于天然忠诚。"\n    boundary:\n      cannot:\n        - "不能写成享乐层一开所有角色就自动效忠"\n        - "不能写成高品质生活没有维护与分配压力"\n        - "不能把享乐层写成终局乐园"\n    writing_contract:\n      must_avoid:\n        - "避免把享乐感写成洗脑效果"\n        - "避免忽略奢侈体验会制造比较和嫉妒"\n\n  social.population_strata_t5:\n    name: "📈IMP共鸣加成T5"\n    category: 社交\n    unlock_level: 5\n    system_line: social\n    tier: 5\n    growth_target: 让庇护所第一次对角色好感与依赖形成系统级增益。\n    player_advantage: 在庇护所内被照料、娱乐、安抚和优待的角色，其IMP增长会得到稳定加成，主角第一次真正拥有情感经营红利。\n    insufficiency: 这只是加成，不是洗脑；越界、失信和羞辱依旧会让IMP大幅下跌。\n    desc: 通过环境安抚、舒适体验和情绪引导，为受庇护角色提供稳定的IMP增长加成。\n    effects: [IMP增长加成, 情感经营红利, 安抚加成]\n    balance:\n      cost: 高\n      limit: 不能抵消越界行为的负面IMP后果\n    population_dependency:\n      - 需要角色持续接受庇护与正向互动才能吃满加成\n    summary:\n      prompt_brief: "可让在庇护所内被照料、娱乐和优待的角色获得稳定的IMP增长加成，使主角第一次真正拥有情感经营红利；这不是洗脑，越界和失信依旧会让IMP大幅下跌。"\n    boundary:\n      cannot:\n        - "不能写成从此所有角色IMP只涨不跌"\n        - "不能写成加成会无视边界、羞辱和背叛"\n        - "不能把IMP加成写成绝对服从开关"\n    writing_contract:\n      must_avoid:\n        - "避免把IMP系统写成魅惑术"\n        - "避免忽略越界行为仍会造成强烈负反馈"\n\n  expansion.floor20_governance_zone_t5:\n    name: "🏙️20层治理区T5"\n    category: 开拓\n    unlock_level: 5\n    system_line: expansion\n    tier: 5\n    growth_target: 让20层从控制点升级为可稳定经营、收编和接管的治理区。\n    player_advantage: 你第一次拥有真正意义上的门外地盘。\n    insufficiency: 这只是楼层级治理的起点，更大的地盘会带来更系统性的反扑与消耗。\n    desc: 让20层形成稳定治理区，支撑控制、收编、纳管与持续经营。\n    effects: [楼层治理区, 收编接管, 持续经营]\n    balance:\n      cost: 高\n      limit: 仅是楼层级治理起点\n    summary:\n      prompt_brief: "可让20层形成稳定治理区，支撑控制、收编、纳管与持续经营，意味着你第一次真正拥有门外地盘；这只是楼层级治理起点，不代表后续扩张没有代价。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼甚至片区已经完全归你"\n        - "不能写成治理区稳定后就没有反扑与消耗"\n        - "不能把楼层级地盘写成区域级秩序中心"\n    writing_contract:\n      must_avoid:\n        - "避免把第一次拥有地盘写成终局统治"\n        - "避免忽略收编、接管和维持的长期代价"\n\n  energy.crossfloor_spine_t6:\n    name: "⚡跨层供能脊线T6"\n    category: 能源\n    unlock_level: 6\n    system_line: energy\n    tier: 6\n    growth_target: 让20层核心区与19层前沿节点形成可调度的跨层供能关系。\n    player_advantage: 首次把庇护所从单层网络推进为立体系统，前沿节点真正能接上后方能力。\n    insufficiency: 跨层损耗、检修难度与故障连锁明显上升，不能把两层都写成同等稳定。\n    desc: 建立20层至19层的跨层供能脊线，为前沿据点、封锁点和临时收容位提供持续电热支持。\n    effects: [跨层供能, 前沿节点维持, 立体调度]\n    balance:\n      cost: 高\n      limit: 跨层损耗高且调度复杂\n    upkeep:\n      - 前沿节点越多，主干负荷越紧\n      - 故障会优先波及非核心节点\n    summary:\n      prompt_brief: "可建立20层至19层的跨层供能脊线，让前沿据点真正接上后方电热支持；跨层损耗和故障连锁明显上升，无法把多层都写成同等稳态。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼稳态满载供能"\n        - "不能写成跨层后仍然无损耗、无检修压力"\n        - "不能把前沿节点写成等同2001核心区的永久稳定区"\n    writing_contract:\n      must_avoid:\n        - "避免把跨层供能写成免费扩容"\n        - "避免忽略跨层主干一旦受损就会牵连前沿节点"\n\n  security.frontier_layers_t6:\n    name: "🧱前沿分层防线T6"\n    category: 安全\n    unlock_level: 6\n    system_line: security\n    tier: 6\n    growth_target: 让19层前沿节点与20层核心区形成分层预警和互相支援。\n    player_advantage: 防线从平面走廊变成立体网络，可以更早识别并拖住跨层威胁。\n    insufficiency: 这只是分层防守，不是整栋封控；前沿拉太长时仍会出现漏点和迟滞。\n    desc: 在20层核心区、楼梯口和19层前沿节点之间建立分层预警、封锁与撤回保护链。\n    effects: [跨层预警, 分层封锁, 撤回保护]\n    balance:\n      cost: 高\n      limit: 仍存在跨层盲点\n    upkeep:\n      - 前沿节点需要持续巡检与轮值\n    summary:\n      prompt_brief: "可在核心区、楼梯口与19层前沿节点之间建立分层预警和撤回保护链，让防线首次具备立体感；仍有跨层盲点，不能视作整栋封控。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼自动封锁与无死角镇压"\n        - "不能写成所有跨层入侵都会被提前无损拦下"\n        - "不能把分层防线写成区域级绝对威慑"\n    writing_contract:\n      must_avoid:\n        - "避免把立体防线写成全图控制"\n        - "避免忽略前沿节点被持续试探后的疲劳与磨损"\n\n  sustain.midcare_supply_t6:\n    name: "🩺多点救治补给T6"\n    category: 维生\n    unlock_level: 6\n    system_line: sustain\n    tier: 6\n    growth_target: 让中级医疗和多点补给第一次能同时存在。\n    player_advantage: 可以扛住更复杂伤病与更多人口，不必每个伤员都往2001核心区挤。\n    insufficiency: 仍受耗材、护理人手和转运效率限制，复杂病例会迅速吃光冗余。\n    desc: 让核心区与前沿节点形成中级医疗、伤员转运和多点补给闭环，支撑跨层行动后的持续处理。\n    effects: [中级医疗, 多点补给, 伤员转运]\n    balance:\n      cost: 高\n      limit: 耗材与照护压力大\n    population_dependency:\n      - 需要稳定护理与搬运人手\n    summary:\n      prompt_brief: "可形成核心区与前沿节点之间的中级医疗、伤员转运和多点补给闭环，支撑跨层行动后的持续处理；耗材和护理压力很大，复杂病例仍会迅速超载。"\n    boundary:\n      cannot:\n        - "不能写成跨层体系一成形就等于大型医院"\n        - "不能写成复杂伤病和多人救治都能轻松兜住"\n        - "不能忽略耗材、人手与转运效率的硬限制"\n    writing_contract:\n      must_avoid:\n        - "避免把多点救治写成无代价扩容"\n        - "避免把中级医疗写成高阶奇迹治疗"\n\n  life.crossfloor_civil_order_t6:\n    name: "🌿跨层温室庭院T6"\n    category: 生活\n    unlock_level: 6\n    system_line: life\n    tier: 6\n    growth_target: 让庇护所第一次出现近似室外桃源的生活景观，而且能跨层延展。\n    player_advantage: 可以在核心区与前沿区之间维持温室庭院、暖光步道和仿户外休闲角，让人第一次觉得这里不像避难所，而像被保护起来的另一个世界。\n    insufficiency: 这种桃源感仍是人工维持的局部景观，覆盖范围有限，且非常吃能源与维护。\n    desc: 在跨层节点中建设温室庭院、暖光步道与仿户外休闲角，制造末日里极罕见的“室外感”生活区。\n    effects: [温室庭院, 暖光步道, 仿户外休闲]\n    balance:\n      cost: 高\n      limit: 范围有限且耗能极高\n    upkeep:\n      - 景观、温度与空气循环需要持续维护\n    summary:\n      prompt_brief: "可在核心区与前沿区之间维持温室庭院、暖光步道与仿户外休闲角，让人第一次觉得这里像被保护起来的室外桃源；范围有限且极其吃能源维护。"\n    boundary:\n      cannot:\n        - "不能写成跨层后就拥有无限延展的人工乐园"\n        - "不能写成前沿区也与核心区享受同等完整桃源体验"\n        - "不能把局部庭院写成真正征服了外部世界"\n    writing_contract:\n      must_avoid:\n        - "避免把温室庭院写成自然恢复奇迹"\n        - "避免忽略景观维护本身就是重负担"\n\n  social.multizone_protocol_t6:\n    name: "📡跨层监控网T6"\n    category: 社交\n    unlock_level: 6\n    system_line: social\n    tier: 6\n    growth_target: 把情报优势从近域观察升级为跨层全息监控与记录。\n    player_advantage: 可以跨20层与19层查看实时全息画面、调取重点区域记录，显著增强对目标、交易对象和内部成员的掌控。\n    insufficiency: 仍不是全知系统，只覆盖接入区域；盲区、断点和误读仍然存在。\n    desc: 将核心区、前沿点和楼层接口纳入跨层监控网，统一提供实时画面、重点记录与目标追踪。\n    effects: [跨层监控, 重点记录, 人物追踪]\n    balance:\n      cost: 高\n      limit: 仅覆盖接入区域\n    summary:\n      prompt_brief: "可跨20层与19层查看实时全息画面并调取重点区域记录，显著增强主角对目标、交易对象和内部成员的掌控；仍只覆盖接入区域，盲区和误读依旧存在。"\n    boundary:\n      cannot:\n        - "不能写成跨层监控后就没有任何信息死角"\n        - "不能写成想看谁就能看到谁的全部经历"\n        - "不能把监控网写成全地图情报支配"\n    writing_contract:\n      must_avoid:\n        - "避免把监控写成全知视角"\n        - "避免忽略接入范围、遮挡与数据缺口"\n\n  expansion.floor19_forward_anchor_t6:\n    name: "📍19层前沿锚点T6"\n    category: 开拓\n    unlock_level: 6\n    system_line: expansion\n    tier: 6\n    growth_target: 让19层正式成为可经营、可防守、可收编的前沿据点，而不是一次性踏板。\n    player_advantage: 跨层扩张第一次有现实落脚点，可以布局前沿、试探收编路线。\n    insufficiency: 前沿锚点仍然脆弱，守住它就意味着承担更长补给线和更高冲突密度。\n    desc: 在19层建立正式前沿锚点，支撑前哨据守、节点经营和跨层收编路线。\n    effects: [19层前沿据点, 收编路线, 跨层落脚点]\n    balance:\n      cost: 高\n      limit: 前沿补给线长且冲突密度高\n    summary:\n      prompt_brief: "可在19层建立正式前沿锚点，让跨层扩张第一次有现实落脚点，并开始试探收编路线；前沿补给线更长、冲突更密，仍远不是稳定地盘。"\n    boundary:\n      cannot:\n        - "不能写成19层一落锚就等于整层完全归你"\n        - "不能写成前沿据点天然稳固、不会被切断"\n        - "不能把跨层落脚点写成区域级治理中心"\n    writing_contract:\n      must_avoid:\n        - "避免把前沿锚点写成终局据点"\n        - "避免忽略前沿补给和轮值带来的持续消耗"\n\n  energy.expedition_support_t7:\n    name: "🔋外勤能源包线T7"\n    category: 能源\n    unlock_level: 7\n    system_line: energy\n    tier: 7\n    growth_target: 让庇护所能源第一次能稳定支持短程外勤反复出动。\n    player_advantage: 外勤装备、临时保温和返程补能开始连成一条链，内部优势可以被带出门外。\n    insufficiency: 回收和补能压力显著增加，外勤距离与频次仍受严格限制。\n    desc: 形成外勤装备供能、临时保温和返程补能链，支撑短程外勤的反复出动与回收。\n    effects: [外勤供能, 临时保温, 返程补能]\n    balance:\n      cost: 高\n      limit: 回收与补能压力显著\n    upkeep:\n      - 高频出动会压缩内部冗余\n      - 返程失败会让损失成倍放大\n    summary:\n      prompt_brief: "可形成外勤装备供能、临时保温和返程补能链，让短程外勤能反复出动并把内部优势投射到门外；回收和补能压力显著增加，距离与频次仍受严格限制。"\n    boundary:\n      cannot:\n        - "不能写成能源支持一成形就可全天候远征"\n        - "不能写成外勤装备永不掉线、永不回收"\n        - "不能把短程外勤支撑写成跨区域投送能力"\n    writing_contract:\n      must_avoid:\n        - "避免把外勤包线写成无限续航"\n        - "避免忽略返程、补能和回收失败的代价"\n\n  security.outer_ring_patrol_t7:\n    name: "🚨外围机动警戒T7"\n    category: 安全\n    unlock_level: 7\n    system_line: security\n    tier: 7\n    growth_target: 让警戒从楼内前沿推进到楼体外围与短程外勤撤回线。\n    player_advantage: 可以更早发现接近威胁，并为外勤队伍提供撤回保护和机动防守。\n    insufficiency: 外围警戒仍不是控场霸权，遭遇复杂包夹或极端天气时照样可能被压穿。\n    desc: 建立楼体外围、撤回线和临时外勤点之间的机动警戒与撤退掩护体系。\n    effects: [外围警戒, 撤回掩护, 机动防守]\n    balance:\n      cost: 高\n      limit: 复杂地形和天气会削弱效果\n    upkeep:\n      - 需要持续巡逻与情报更新\n    summary:\n      prompt_brief: "可建立楼体外围、撤回线和临时外勤点之间的机动警戒与掩护体系，让外勤不再完全裸奔；复杂地形和极端天气仍会让外围警戒失效。"\n    boundary:\n      cannot:\n        - "不能写成外出后全程绝对安全"\n        - "不能写成外围警戒就等于区域完全封锁"\n        - "不能把机动防守写成主动清场与无伤镇压"\n    writing_contract:\n      must_avoid:\n        - "避免把外围警戒写成全面统治"\n        - "避免忽略天气、死角和持续巡逻的疲劳成本"\n\n  sustain.field_recovery_chain_t7:\n    name: "⛑️外勤回收救护T7"\n    category: 维生\n    unlock_level: 7\n    system_line: sustain\n    tier: 7\n    growth_target: 建立外勤医疗、临时补给和返程救护的专用链路。\n    player_advantage: 可显著降低外出任务中的可避免死亡，让资源与伤员都有更高回收率。\n    insufficiency: 对致命创伤只能争取时间，不能把外勤风险写成可随意承受。\n    desc: 为外勤队伍配置急救、保温、补水和返程救护流程，提升任务后的存活与回收效率。\n    effects: [外勤急救, 返程救护, 回收效率]\n    balance:\n      cost: 高\n      limit: 对致命创伤仅能争取时间\n    population_dependency:\n      - 需要训练过的外勤照护人员\n    summary:\n      prompt_brief: "可为外勤队伍建立急救、保温、补水和返程救护流程，显著提升任务后的存活与回收效率；对致命创伤只能争取时间，外勤风险依然真实。"\n    boundary:\n      cannot:\n        - "不能写成外勤后送体系一成形就不再死人"\n        - "不能写成补给与急救无限、无冷却"\n        - "不能忽略外勤照护人员与耗材本身也会被拖垮"\n    writing_contract:\n      must_avoid:\n        - "避免把回收救护写成无上限保险"\n        - "避免省略训练、人手和耗材的门槛"\n\n  life.reentry_recovery_loop_t7:\n    name: "🍿旧世界影院T7"\n    category: 生活\n    unlock_level: 7\n    system_line: life\n    tier: 7\n    growth_target: 让庇护所第一次能高质量复现旧世界的文化娱乐体验。\n    player_advantage: 可以提供高质量影院、沉浸音响和精选旧世界影像，让角色在末日里重新体验文明记忆，这会极大增强庇护所吸引力。\n    insufficiency: 影院只能带来短时沉浸，不能真正把人带回旧世界，且怀旧也可能触发失落与情绪波动。\n    desc: 建设高质量旧世界影院，以沉浸音响和精选影像重建文明时代的文化娱乐体验。\n    effects: [高质量影院, 沉浸音响, 文明怀旧]\n    balance:\n      cost: 高\n      limit: 只能提供短时沉浸体验\n    summary:\n      prompt_brief: "可提供高质量影院、沉浸音响与精选旧世界影像，让角色在末日里重新体验文明记忆，极大增强庇护所吸引力；这只能带来短时沉浸，无法真正回到旧世界。"\n    boundary:\n      cannot:\n        - "不能写成影院一开就治愈所有创伤"\n        - "不能写成旧世界影像等同真实世界回归"\n        - "不能把文化娱乐写成无代价精神统治工具"\n    writing_contract:\n      must_avoid:\n        - "避免把影院写成精神治疗万能药"\n        - "避免忽略怀旧也会激起失落和脆弱"\n\n  social.external_contact_channels_t7:\n    name: "📺谈判直播台T7"\n    category: 社交\n    unlock_level: 7\n    system_line: social\n    tier: 7\n    growth_target: 让情报优势可以被主动展示和利用，变成交易与心理压制工具。\n    player_advantage: 可以向对手或交易对象定向展示实时全息直播、精选证据与环境画面，在谈判时制造更强的情报压迫与情绪优势。\n    insufficiency: 暴露得越多，被反向分析和渗透的风险也越高，不能把直播展示当成无代价压制。\n    desc: 在谈判中调用直播台，定向投放实时画面、证据切片与场景展示，放大心理压力与情绪优势。\n    effects: [证据展示, 定向直播, 心理压迫]\n    balance:\n      cost: 高\n      limit: 展示越多越有反向暴露风险\n    summary:\n      prompt_brief: "可向对手或交易对象定向展示实时全息直播、精选证据与环境画面，在谈判时制造更强的情报压迫与情绪优势；展示越多，被反向分析和渗透的风险也越高。"\n    boundary:\n      cannot:\n        - "不能写成直播展示一出对方就必然屈服"\n        - "不能写成你可以无代价展示所有底牌"\n        - "不能把谈判直播写成区域级绝对话语权"\n    writing_contract:\n      must_avoid:\n        - "避免把展示优势写成强制洗脑"\n        - "避免忽略暴露底牌后的反制与渗透风险"\n\n  expansion.outfield_route_t7:\n    name: "🗺️短程外拓路线T7"\n    category: 开拓\n    unlock_level: 7\n    system_line: expansion\n    tier: 7\n    growth_target: 让楼层网络第一次真正伸出楼外，形成短程外拓路线。\n    player_advantage: 外部安全点、补给点和可争夺节点开始进入你的实际行动半径。\n    insufficiency: 路线只是可用，不是稳固；任何一次断线、暴雪或伏击都可能把优势打回楼内。\n    desc: 建立从楼层网络通向楼外安全点、补给点和争夺节点的短程外拓路线。\n    effects: [楼外路线, 外部补给点, 可争夺节点]\n    balance:\n      cost: 高\n      limit: 路线稳定性受天气和敌意影响\n    summary:\n      prompt_brief: "可建立通向楼外安全点、补给点和争夺节点的短程外拓路线，让庇护所第一次真正伸出楼外；路线并不稳固，断线、暴雪和伏击都可能把优势打回楼内。"\n    boundary:\n      cannot:\n        - "不能写成路线一开就等于周边都归你"\n        - "不能写成外部节点会自动长期安全"\n        - "不能把短程外拓路线写成成熟区域交通网"\n    writing_contract:\n      must_avoid:\n        - "避免把路线建立写成征服完成"\n        - "避免忽略天气、伏击和线路维护的长期成本"\n\n  energy.area_grid_advantage_t8:\n    name: "⚙️区域能源优势T8"\n    category: 能源\n    unlock_level: 8\n    system_line: energy\n    tier: 8\n    growth_target: 让多节点运转不再只是勉强维持，而是开始形成局部能源优势。\n    player_advantage: 你能更稳定地维持多点开机、多区供暖和关键节点连续运行。\n    insufficiency: 这是局部优势，不是无限能源；极端天气和错误调度仍可能把整个网络拖入波动。\n    desc: 将楼层网络、外勤补能点和前沿据点纳入更稳定的区域级能源调度体系。\n    effects: [多节点稳态, 区域供能优势, 连续运行]\n    balance:\n      cost: 极高\n      limit: 极端天气和误调度仍会引发波动\n    upkeep:\n      - 网络越大，检修窗口越珍贵\n    summary:\n      prompt_brief: "可把楼层网络、外勤补能点和前沿据点纳入更稳定的区域级能源调度体系，开始形成局部能源优势；这仍不是无限能源，极端天气和误调度照样会拖垮网络。"\n    boundary:\n      cannot:\n        - "不能写成多节点稳态就等于能源无上限"\n        - "不能写成所有区域都可长期满负荷运行"\n        - "不能把局部能源优势写成全地图能源统治"\n    writing_contract:\n      must_avoid:\n        - "避免把区域调度写成无脑常开"\n        - "避免忽略检修窗口和误调度的系统代价"\n\n  security.zone_control_grid_t8:\n    name: "🛡️控面防守网络T8"\n    category: 安全\n    unlock_level: 8\n    system_line: security\n    tier: 8\n    growth_target: 让防守从守点正式转入控面，建立区域级联动反应能力。\n    player_advantage: 可以组织主动压制、局部围堵和区域防守，真正开始主导一片区域的冲突节奏。\n    insufficiency: 你能控面，不等于能抹去所有威胁；多点同时爆发仍会把反应链条拉满。\n    desc: 把楼层核心、楼外路线和关键节点接入同一套控面预警、围堵和支援网络。\n    effects: [控面预警, 主动压制, 区域防守]\n    balance:\n      cost: 极高\n      limit: 多点同时爆发会压垮反应链条\n    upkeep:\n      - 需要持续情报喂养和轮换值守\n    summary:\n      prompt_brief: "可把楼层核心、楼外路线和关键节点接入同一套控面预警与支援网络，真正开始主导一片区域的冲突节奏；多点同时爆发仍会压垮反应链条。"\n    boundary:\n      cannot:\n        - "不能写成一旦控面就无须再担心反扑"\n        - "不能写成区域防守等于区域清场"\n        - "不能把局部控面写成整栋楼乃至片区绝对镇压"\n    writing_contract:\n      must_avoid:\n        - "避免把控面写成无敌领域"\n        - "避免省略多点同时爆发时的反应上限"\n\n  sustain.large_scale_supply_t8:\n    name: "🍲规模供给体系T8"\n    category: 维生\n    unlock_level: 8\n    system_line: sustain\n    tier: 8\n    growth_target: 稳定支撑更大人口与更复杂的配给结构。\n    player_advantage: 庇护所终于能像真正共同体那样处理多层级人口、伤病和资源分配。\n    insufficiency: 规模一大，浪费、腐败、错配与中断都会放大，不能把大体系写成自动顺滑。\n    desc: 建立覆盖多节点、多身份人口和多级配给的规模供给体系，提升对复杂共同体的承载力。\n    effects: [大人口配给, 复杂补给, 共同体承载]\n    balance:\n      cost: 极高\n      limit: 错配和中断会引发更大连锁反应\n    population_dependency:\n      - 需要稳定执行层和仓储调度能力\n    summary:\n      prompt_brief: "可建立覆盖多节点、多身份人口和多级配给的规模供给体系，让庇护所真正具备复杂共同体承载力；体系越大，错配、中断和内部消耗也会被同步放大。"\n    boundary:\n      cannot:\n        - "不能写成人口一多反而没有后勤难题"\n        - "不能写成规模体系天然杜绝浪费和腐败"\n        - "不能把共同体规模供给写成城市级无限后勤"\n    writing_contract:\n      must_avoid:\n        - "避免把规模供给写成自动化丰饶"\n        - "避免忽略仓储、调度和执行层的核心作用"\n\n  life.settlement_gradient_t8:\n    name: "🗺️折景旅游舱T8"\n    category: 生活\n    unlock_level: 8\n    system_line: life\n    tier: 8\n    growth_target: 让庇护所第一次能提供近似亲临旧世界的高阶折叠空间旅游体验。\n    player_advantage: 可以短时间带角色进入高拟真旧世界场景，像逛商场、海边、街区或节日夜景一样享受外界已不复存在的生活。\n    insufficiency: 体验时长有限、负荷极高，且再真实也只是折景，不是重新获得真正的世界。\n    desc: 通过折景旅游舱高拟真复现旧世界场景，提供近似亲临其境的短时奢侈体验。\n    effects: [旧世界折景, 高拟真旅游, 沉浸吸附]\n    balance:\n      cost: 极高\n      limit: 体验时长有限且负荷极高\n    summary:\n      prompt_brief: "可短时间带角色进入高拟真旧世界场景，体验近似亲临的折叠空间旅游，像重新逛商场、海边和节日夜景一样；时长有限、负荷极高，再真实也只是折景。"\n    boundary:\n      cannot:\n        - "不能写成折景旅游舱能无限期开启或无限复制场景"\n        - "不能写成角色会把折景直接当成真实世界回归"\n        - "不能把旧世界折景写成真正收复了外部文明"\n    writing_contract:\n      must_avoid:\n        - "避免把折景写成无限梦境游乐场"\n        - "避免忽略高拟真体验本身也会放大依恋和失落"\n\n  social.regional_credit_t8:\n    name: "📣社区舆情场T8"\n    category: 社交\n    unlock_level: 8\n    system_line: social\n    tier: 8\n    growth_target: 让主角获得社区级的情感引导和IMP增益优势。\n    player_advantage: 可以通过公开全息广播、活动展示和情绪引导，稳定提高庇护所内外接触对象的好感与IMP增长效率。\n    insufficiency: 舆情越强，反噬也越大；一旦现实与展示割裂，社区好感会成片掉落。\n    desc: 用社区舆情场整合广播、活动展示和情绪引导，持续放大主角的好感经营与IMP成长收益。\n    effects: [公开广播, IMP增益效率, 社区好感引导]\n    balance:\n      cost: 高\n      limit: 现实与展示割裂时会触发成片反噬\n    summary:\n      prompt_brief: "可通过公开全息广播、活动展示与情绪引导，稳定提高接触对象的好感与IMP增长效率，形成社区级情感优势；若现实与展示割裂，舆情反噬也会成片出现。"\n    boundary:\n      cannot:\n        - "不能写成社区舆情一开所有人都会爱戴你"\n        - "不能写成IMP加成可以掩盖现实层面的背叛与压迫"\n        - "不能把舆情优势写成对整片区域的绝对精神控制"\n    writing_contract:\n      must_avoid:\n        - "避免把舆情场写成思想控制器"\n        - "避免忽略现实体验永远比宣传更关键"\n\n  expansion.route_node_hegemony_t8:\n    name: "🧭线路节点优势T8"\n    category: 开拓\n    unlock_level: 8\n    system_line: expansion\n    tier: 8\n    growth_target: 让区域节点化完成，并把争夺重心推进到线路、通道和控制区。\n    player_advantage: 你开始不只是占点，而是能决定哪条线通、哪条线断、谁能进出哪些节点。\n    insufficiency: 节点越多，守线和判线的代价越高；你能主导局部流向，却还不是全域支配者。\n    desc: 将楼内外关键线路、补给点和可争夺节点编织成可争夺、可裁断的控制网。\n    effects: [线路控制, 节点编织, 区域流向主导]\n    balance:\n      cost: 极高\n      limit: 线网越大越难完全覆盖\n    summary:\n      prompt_brief: "可把楼内外关键线路、补给点和可争夺节点编织成控制网，开始决定哪条线通、哪条线断、谁能使用哪些节点；线网越大越难完全覆盖，你仍不是全域支配者。"\n    boundary:\n      cannot:\n        - "不能写成节点化完成就等于周边全部纳入统治"\n        - "不能写成所有线路都会长期听你调度"\n        - "不能把局部流向主导写成区域绝对主权"\n    writing_contract:\n      must_avoid:\n        - "避免把线路优势写成地图全锁"\n        - "避免忽略守线、修线和判线的长期成本"\n\n  energy.building_stability_core_t9:\n    name: "🏢楼栋稳态核心T9"\n    category: 能源\n    unlock_level: 9\n    system_line: energy\n    tier: 9\n    growth_target: 让高负荷稳态维持真正具备楼栋级意义。\n    player_advantage: 能源和维持能力开始成为支配工具，谁接入、谁掉线都开始受你影响。\n    insufficiency: 楼栋级稳态依然受总负荷、维护体系和故障链约束，不能写成永不熄火的神迹核心。\n    desc: 建立面向多楼层、多节点和高负荷周期的楼栋稳态能源核心，支撑更长期的统筹运行。\n    effects: [楼栋稳态, 高负荷运行, 接入裁定]\n    balance:\n      cost: 极高\n      limit: 故障链风险仍然存在\n    upkeep:\n      - 需要成熟维护体系长期跟进\n    summary:\n      prompt_brief: "可建立面向多楼层、多节点和高负荷周期的楼栋稳态能源核心，让能源与维持能力开始具备支配意义；总负荷和故障链依然真实，不能写成永不熄火的神迹。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼无限能源、永不检修"\n        - "不能写成任何外部破坏都无法影响稳态"\n        - "不能把楼栋级稳态写成区域级全覆盖能源统治"\n    writing_contract:\n      must_avoid:\n        - "避免把稳态核心写成绝对永动机"\n        - "避免忽略维护体系本身就是高阶门槛"\n\n  security.building_deterrence_arch_t9:\n    name: "🚫楼栋威慑架构T9"\n    category: 安全\n    unlock_level: 9\n    system_line: security\n    tier: 9\n    growth_target: 建立整栋楼级的威慑、压制、响应与封控逻辑。\n    player_advantage: 你不只是防守者，而是别人进楼、出楼、冲楼前必须重新计算代价的秩序核心。\n    insufficiency: 威慑并不等于绝对镇压；遇到强敌、长期围耗或内部失稳时，整栋逻辑也会被撕开。\n    desc: 将多楼层响应、封锁节点、威慑展示和冲突升级规则整合为统一的楼栋防务架构。\n    effects: [楼栋威慑, 封控逻辑, 统一响应]\n    balance:\n      cost: 极高\n      limit: 长期围耗会削弱威慑可信度\n    upkeep:\n      - 需要持续展示执行力\n    summary:\n      prompt_brief: "可把多楼层响应、封锁节点和冲突升级规则整合为统一的楼栋防务架构，让别人进楼前必须重算代价；威慑并不等于绝对镇压，长期围耗和内部失稳仍会撕开防务逻辑。"\n    boundary:\n      cannot:\n        - "不能写成楼栋威慑一成就无人敢犯"\n        - "不能写成封控逻辑可以无代价覆盖全部冲突"\n        - "不能把楼栋防务写成区域级无法撼动的军事霸权"\n    writing_contract:\n      must_avoid:\n        - "避免把威慑写成自动服从"\n        - "避免省略长期围耗对威慑可信度的侵蚀"\n\n  sustain.community_production_loop_t9:\n    name: "🌾共同体生产闭环T9"\n    category: 维生\n    unlock_level: 9\n    system_line: sustain\n    tier: 9\n    growth_target: 让人口、伤病、配给和生产第一次具备真正共同体规模。\n    player_advantage: 你不再只是分配存量，而是开始拥有能维持和再生产共同体的基础。\n    insufficiency: 生产闭环越大，越依赖组织度、纪律和长期维护，不能写成一劳永逸的丰饶机器。\n    desc: 将食物、基础药品、日常耗材和照护流程整合成楼栋级共同体生产闭环。\n    effects: [共同体生产, 长期配给, 基础再生产]\n    balance:\n      cost: 极高\n      limit: 高度依赖组织度和维护体系\n    population_dependency:\n      - 需要持续劳动、分工和纪律执行\n    summary:\n      prompt_brief: "可把食物、基础药品、日常耗材和照护流程整合成楼栋级共同体生产闭环，让你开始拥有维持和再生产共同体的基础；这不是一劳永逸的丰饶机器，高度依赖组织度与纪律。"\n    boundary:\n      cannot:\n        - "不能写成生产闭环一成就再也不缺物资"\n        - "不能写成共同体规模越大反而越轻松"\n        - "不能把楼栋级再生产写成区域级完全自给"\n    writing_contract:\n      must_avoid:\n        - "避免把生产闭环写成无限工厂"\n        - "避免忽略劳动、纪律和维护体系本身的代价"\n\n  life.civil_core_atmosphere_t9:\n    name: "🏖️乐园居住区T9"\n    category: 生活\n    unlock_level: 9\n    system_line: life\n    tier: 9\n    growth_target: 让庇护所真正形成末日里别人梦不到的高阶居住乐园。\n    player_advantage: 热浴、影院、舞台、庭院、精致起居与旧世界体验被整合为完整生活区，主角和核心角色可以长期享受接近末日前上流区的生活。\n    insufficiency: 乐园化越明显，越会放大内外落差、嫉妒和争夺，维护成本也极高。\n    desc: 将高阶生活设施整合为完整乐园居住区，让庇护所第一次具备长周期的高阶享受与吸附力。\n    effects: [乐园起居, 长期享乐, 高阶吸附]\n    balance:\n      cost: 极高\n      limit: 会放大落差、嫉妒与高维护压力\n    upkeep:\n      - 需要持续的高等级水热、娱乐与景观维护\n    summary:\n      prompt_brief: "可将热浴、影院、舞台、庭院与高质量起居整合为完整乐园居住区，让主角和核心角色长期享受接近末日前上流区的生活；这会放大嫉妒、争夺和高昂维护成本。"\n    boundary:\n      cannot:\n        - "不能写成乐园居住区一成就人人安分守己"\n        - "不能写成高阶生活没有配额和维护压力"\n        - "不能把居住乐园写成外部世界已经失去吸引力的终局"\n    writing_contract:\n      must_avoid:\n        - "避免把乐园居住区写成无代价天堂"\n        - "避免忽略高生活差距会制造新的内外张力"\n\n  social.governance_credit_regime_t9:\n    name: "🕰️时空回溯厅T9"\n    category: 社交\n    unlock_level: 9\n    system_line: social\n    tier: 9\n    growth_target: 让主角第一次能对重点目标和关键事件进行高价值场景回溯。\n    player_advantage: 可以回放特定区域、特定时间窗内的关键情景，直接增强审问、判断、取证、威慑和情感操控优势。\n    insufficiency: 回溯并非全知神迹，只能抓到片段和视角受限的事实，不能读取人心或任意伪造真相。\n    desc: 在时空回溯厅中抽取重点区域的关键情景片段，用于取证、判责、谈判和情感施压。\n    effects: [关键回溯, 取证优势, 情感拿捏]\n    balance:\n      cost: 极高\n      limit: 只能抓取片段且受视角限制\n    summary:\n      prompt_brief: "可回放特定区域、特定时间窗内的关键情景，直接增强主角在审问、判断、取证、威慑和情感操控上的优势；回溯只抓到片段事实，不能读取人心或任意伪造真相。"\n    boundary:\n      cannot:\n        - "不能写成时空回溯厅能回看一切并给出绝对真相"\n        - "不能写成你能借回溯随意改写他人记忆或过去"\n        - "不能把关键回溯写成无代价的神权工具"\n    writing_contract:\n      must_avoid:\n        - "避免把回溯厅写成因果操控装置"\n        - "避免忽略视角、时窗和记录范围的限制"\n\n  expansion.building_takeover_grid_t9:\n    name: "🔐楼栋接管网络T9"\n    category: 开拓\n    unlock_level: 9\n    system_line: expansion\n    tier: 9\n    growth_target: 让扩张从占点正式转入接管体系。\n    player_advantage: 你开始能决定谁被纳入、谁被排除、哪些楼层按你的秩序运转。\n    insufficiency: 接管越深，治理、救助、封控和反扑成本越高，不能把接管写成单向吞并。\n    desc: 将多楼层节点、关键通路和纳管对象纳入统一接管网络，推进整栋楼级的控制格局。\n    effects: [楼栋接管, 纳入排除, 控制格局]\n    balance:\n      cost: 极高\n      limit: 接管越深，治理反扑成本越高\n    summary:\n      prompt_brief: "可把多楼层节点、关键通路和纳管对象纳入统一接管网络，推进整栋楼级控制格局，并开始决定谁被纳入、谁被排除；接管越深，治理与反扑成本也越高。"\n    boundary:\n      cannot:\n        - "不能写成楼栋接管就等于周边片区同时归你"\n        - "不能写成所有对象都会平静接受被接管"\n        - "不能把整栋楼级控制写成区域级治理终局"\n    writing_contract:\n      must_avoid:\n        - "避免把接管写成无摩擦吞并"\n        - "避免忽略纳入、排除和维持秩序的长期代价"\n\n  energy.regional_dispatch_core_t10:\n    name: "🌐区域调度核心T10"\n    category: 能源\n    unlock_level: 10\n    system_line: energy\n    tier: 10\n    growth_target: 让多区域供能与长周期维持进入成熟调度阶段。\n    player_advantage: 你终于可以把不同楼层、节点和外部触点放进一个更稳定的长周期能源安排里。\n    insufficiency: 成熟调度不等于无限资源，总负荷、维护体系和极端损伤仍会决定上限。\n    desc: 建立面向楼栋核心与周边片区触点的区域调度核心，支撑更长周期的多区运转。\n    effects: [多区调度, 长周期维持, 区域接入]\n    balance:\n      cost: 极高\n      limit: 总负荷和维护体系仍决定上限\n    upkeep:\n      - 任何重大误调度都会波及多区\n    summary:\n      prompt_brief: "可建立面向楼栋核心与周边片区触点的区域调度核心，把不同楼层、节点和外部触点纳入更稳定的长周期能源安排；这仍不是无限资源，总负荷和重大误调度都会直接决定上限。"\n    boundary:\n      cannot:\n        - "不能写成区域调度成熟后就不存在停摆风险"\n        - "不能写成周边触点全部可以无限期开机"\n        - "不能把多区调度写成对外界能源条件的完全脱钩"\n    writing_contract:\n      must_avoid:\n        - "避免把成熟调度写成永恒稳态"\n        - "避免忽略总负荷与维护体系仍是最终瓶颈"\n\n  security.regional_threat_shield_t10:\n    name: "🛡️区域威慑屏障T10"\n    category: 安全\n    unlock_level: 10\n    system_line: security\n    tier: 10\n    growth_target: 形成区域级安全与威慑体系，但仍保留真实外部风险。\n    player_advantage: 你能够对楼栋核心与周边片区触点建立统一的威慑表达、威胁分级和响应姿态。\n    insufficiency: 威慑屏障只能提高代价，不能抹去所有风险；真正的大敌、长期围困和系统级破坏依然危险。\n    desc: 将楼栋核心、外围通路和片区触点纳入同一套威胁分级、响应优先级和威慑展示体系。\n    effects: [区域威慑, 威胁分级, 统一响应姿态]\n    balance:\n      cost: 极高\n      limit: 无法抹去系统级外部风险\n    upkeep:\n      - 需要长期维持执行力和情报优势\n    summary:\n      prompt_brief: "可把楼栋核心、外围通路和片区触点纳入同一套威胁分级与威慑展示体系，形成区域级安全姿态；威慑只能提高代价，不能抹去长期围困和系统级外部风险。"\n    boundary:\n      cannot:\n        - "不能写成区域威慑建立后外界再无威胁"\n        - "不能写成任何敌对势力都只会被动退让"\n        - "不能把区域安全体系写成无代价的绝对壁垒"\n    writing_contract:\n      must_avoid:\n        - "避免把威慑屏障写成神圣结界"\n        - "避免忽略长期执行力与情报优势本身也是消耗品"\n\n  sustain.high_order_relief_system_t10:\n    name: "🩹高阶共同体保障T10"\n    category: 维生\n    unlock_level: 10\n    system_line: sustain\n    tier: 10\n    growth_target: 让人口承载、医疗恢复和补给体系达到高阶共同体水平。\n    player_advantage: 你能真正稳定承托更大规模的人口、伤病和恢复需求，这是区域秩序中心的基础底盘。\n    insufficiency: 高阶保障依然依赖庞大组织和补给链，任何一次系统性中断都会造成剧烈震荡。\n    desc: 将人口承载、医疗恢复、基础生产和配给网络整合为高阶共同体保障体系。\n    effects: [高阶承载, 医疗恢复, 区域补给]\n    balance:\n      cost: 极高\n      limit: 系统性中断会造成剧烈震荡\n    population_dependency:\n      - 需要高成熟度分工和稳定执行层\n    summary:\n      prompt_brief: "可把人口承载、医疗恢复、基础生产和配给网络整合为高阶共同体保障体系，让庇护所真正具备区域秩序中心的底盘；这仍高度依赖组织和补给链，系统性中断会造成剧烈震荡。"\n    boundary:\n      cannot:\n        - "不能写成高阶保障就等于不会再缺物资和人手"\n        - "不能写成共同体越大越没有脆弱点"\n        - "不能把高阶保障写成无条件覆盖一切灾难"\n    writing_contract:\n      must_avoid:\n        - "避免把高阶保障写成完美福利国家"\n        - "避免忽略大规模体系一旦失衡会造成更大震荡"\n\n  life.cultural_hearth_t10:\n    name: "🌤️室外桃源穹顶T10"\n    category: 生活\n    unlock_level: 10\n    system_line: life\n    tier: 10\n    growth_target: 让庇护所生活系统成长为真正的末日室外桃源。\n    player_advantage: 可以提供近似真实天空、庭院、暖风、景观与漫步体验，让主角和角色们在末日里享受外界根本不存在的安逸桃源生活。\n    insufficiency: 这仍是穹顶下的人造乐园，不是真正征服了外部世界；维持它本身就是极重的系统负担。\n    desc: 以穹顶景观、人工天幕、暖风循环与庭院步道构筑真正意义上的末日“室外桃源感”。\n    effects: [穹顶天空, 景观漫步, 桃源生活]\n    balance:\n      cost: 极高\n      limit: 仍是人造乐园且维护成本极重\n    upkeep:\n      - 天幕、景观、气候模拟与安全系统都需要长期高负荷运行\n    summary:\n      prompt_brief: "可在穹顶下提供近似真实天空、庭院、暖风与景观漫步体验，让主角和角色们在末日里享受外界根本不存在的安逸室外桃源生活；这仍是人造乐园，维持成本极重。"\n    boundary:\n      cannot:\n        - "不能写成从此外部世界对任何人都不再有吸引力"\n        - "不能写成穹顶桃源就等于真正改造了外界环境"\n        - "不能把人造桃源写成无成本永久常驻的终局设施"\n    writing_contract:\n      must_avoid:\n        - "避免把室外桃源穹顶写成世界改写器"\n        - "避免忽略越接近天堂、维护代价越夸张"\n\n  social.regional_rule_network_t10:\n    name: "✨群星共感网T10"\n    category: 社交\n    unlock_level: 10\n    system_line: social\n    tier: 10\n    growth_target: 让情报优势、情感优势与IMP增益统一成区域级社会支配能力。\n    player_advantage: 可以在楼栋核心与周边接触网中同步获得情报、塑造舆情、放大情感影响，并为所有受庇护角色提供稳定的IMP增长加成。\n    insufficiency: 共感网只能放大已有优势，不能强行制造真爱或忠诚；一旦发生重大失信，反噬范围也会同步放大。\n    desc: 用群星共感网同步情报、舆情、情绪引导与IMP增长机制，形成区域级的社会优势中枢。\n    effects: [区域情报同步, IMP稳定加成, 情感放大]\n    balance:\n      cost: 极高\n      limit: 重大失信会触发区域级反噬\n    population_dependency:\n      - 需要大量受庇护角色持续接入与正向体验支撑\n    summary:\n      prompt_brief: "可在楼栋核心与周边接触网中同步获得情报、塑造舆情、放大情感影响，并为所有受庇护角色提供稳定的IMP增长加成；这不能强行制造忠诚，重大失信时反噬范围也会同步放大。"\n    boundary:\n      cannot:\n        - "不能写成群星共感网能直接命令人心"\n        - "不能写成所有角色都会被永久锁死在高IMP状态"\n        - "不能把区域级情感优势写成对所有外部势力的绝对支配"\n    writing_contract:\n      must_avoid:\n        - "避免把共感网写成精神奴役网络"\n        - "避免忽略加成越强、失信时连锁坍塌
