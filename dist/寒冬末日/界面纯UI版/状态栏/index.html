al\n      - expand.utility_interface_s1\n      - limit.threshold_tuning_beta\n  "3":\n    label: 玄关前哨\n    unlocks:\n      - safe.nonlethal_latch\n      - safe.panic_path_lamp\n      - survive.clinic_pod_t0\n      - comfort.circadian_symphony\n      - expand.shelter_radius_20f_s1\n      - expand.heating_radius_20f_s1\n      - limit.support_quota_beta\n  "4":\n    label: 楼层洞察\n    unlocks:\n      - safe.nightglass_swarm\n      - safe.hallway_threat_score\n      - survive.nutri_variety_primer\n      - comfort.digital_arcadia_v1\n      - expand.resource_interface_20f_s1\n      - expedition.signal_scout_pack\n      - limit.threshold_tuning_gamma\n  "5":\n    label: 合作化秩序\n    unlocks:\n      - safe.response_drill_grid\n      - survive.clinic_pod_t1\n      - survive.pharma_replicator_t0\n      - comfort.social_hearth_room\n      - expand.shelter_radius_20f_s2\n      - expedition.relay_cache_box\n      - limit.support_quota_gamma\n  "6":\n    label: 跨层联结\n    unlocks:\n      - safe.tactical_jammer_node\n      - survive.surgery_table_t0\n      - comfort.holo_stage_chamber\n      - expand.shelter_radius_19f_s1\n      - expand.heating_radius_19f_s1\n      - expedition.weather_trace_array\n      - limit.threshold_tuning_delta\n  "7":\n    label: 远征启步\n    unlocks:\n      - safe.perimeter_drone_ring\n      - survive.field_med_kit_line\n      - comfort.deep_rest_suite\n      - expand.resource_interface_19f_s1\n      - expedition.pioneer_vehicle_mk1\n      - expedition.mobile_relief_pod\n      - limit.support_quota_delta\n  "8":\n    label: 机动堡垒\n    unlocks:\n      - safe.heavy_nonlethal_turret\n      - survive.pharma_replicator_t1\n      - comfort.virtual_biome_voyage\n      - expand.shelter_radius_20f_s3\n      - expedition.long_range_sensor_mast\n      - expedition.convoy_dock_node\n      - limit.threshold_tuning_epsilon\n  "9":\n    label: 自持方舟\n    unlocks:\n      - safe.counterstrike_doctrine_lock\n      - survive.eco_farm_vertical\n      - survive.surgery_table_t1\n      - comfort.hydro_thermal_pool\n      - expand.shelter_radius_19f_s2\n      - expedition.pioneer_vehicle_mk2\n      - limit.support_quota_epsilon\n  "10":\n    label: 行走伊甸\n    unlocks:\n      - safe.optic_veil_field\n      - survive.genesis_core_regulator\n      - comfort.ark_theatre_infinite\n      - expand.omni_interface_network\n      - expedition.stratos_probe_lance\n      - expedition.frontier_command_hub\n      - limit.maintenance_compact_omega\n\nabilities:\n  safe.sealed_bulkhead:\n    name: "🛡️密封霜墙门闩"\n    category: 安全\n    unlock_level: 1\n    desc: 核心入口获得双层气密门闩与合金滑轨，能抵御大多数暴力破门与低温冲击。\n    effects: [入口防护+1, 破门延迟]\n    balance:\n      cost: 低\n      limit: 仅核心入口生效\n\n  safe.foyer_aegis_grid:\n    name: "⚡玄关静电裁断网"\n    category: 安全\n    unlock_level: 1\n    desc: 玄关地板植入低致伤静电网，识别敌意动作后触发麻痹性击退。\n    effects: [非致命制止, 入侵减速]\n    balance:\n      cost: 低\n      limit: 对重装目标效果有限\n\n  survive.thermal_loop_seed:\n    name: "🌡️恒温循环底座"\n    category: 生存\n    unlock_level: 1\n    desc: 建立基础热循环，2001核心区维持稳定体感温度，显著降低寒冷导致的健康损耗。\n    effects: [核心区恒温, 寒冷伤害缓解]\n    balance:\n      cost: 低\n      limit: 仅核心区\n\n  survive.water_air_loop_seed:\n    name: "💧空气-净水双循环"\n    category: 生存\n    unlock_level: 1\n    desc: 启动初级空气净化与净水回路，确保基础可呼吸与可饮用条件。\n    effects: [基础净水, 基础净化]\n    balance:\n      cost: 低\n      limit: 对污染峰值响应较慢\n\n  survive.basic_ration_fabricator:\n    name: "🍞基础口粮织造器"\n    category: 生存\n    unlock_level: 1\n    desc: 提供稳定但单调的高热量口粮，保障最低生存线。\n    effects: [饥饿缓解, 基础供给]\n    balance:\n      cost: 低\n      limit: 口味与营养结构单一\n\n  comfort.quiet_mind_channel:\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    n
