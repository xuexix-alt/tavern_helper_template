\n      - limit.threshold_tuning_delta\n  "7":\n    label: 远征启步\n    unlocks:\n      - safe.perimeter_drone_ring\n      - survive.field_med_kit_line\n      - comfort.deep_rest_suite\n      - expand.resource_interface_19f_s1\n      - expedition.pioneer_vehicle_mk1\n      - expedition.mobile_relief_pod\n      - limit.support_quota_delta\n  "8":\n    label: 机动堡垒\n    unlocks:\n      - safe.heavy_nonlethal_turret\n      - survive.pharma_replicator_t1\n      - comfort.virtual_biome_voyage\n      - expand.shelter_radius_20f_s3\n      - expedition.long_range_sensor_mast\n      - expedition.convoy_dock_node\n      - limit.threshold_tuning_epsilon\n  "9":\n    label: 自持方舟\n    unlocks:\n      - safe.counterstrike_doctrine_lock\n      - survive.eco_farm_vertical\n      - survive.surgery_table_t1\n      - comfort.hydro_thermal_pool\n      - expand.shelter_radius_19f_s2\n      - expedition.pioneer_vehicle_mk2\n      - limit.support_quota_epsilon\n  "10":\n    label: 行走伊甸\n    unlocks:\n      - safe.optic_veil_field\n      - survive.genesis_core_regulator\n      - comfort.ark_theatre_infinite\n      - expand.omni_interface_network\n      - expedition.stratos_probe_lance\n      - expedition.frontier_command_hub\n      - limit.maintenance_compact_omega\n\nabilities:\n  safe.sealed_bulkhead:\n    name: "🛡️密封霜墙门闩"\n    category: 安全\n    unlock_level: 1\n    desc: 核心入口获得双层气密门闩与合金滑轨，能抵御大多数暴力破门与低温冲击。\n    effects: [入口防护+1, 破门延迟]\n    balance:\n      cost: 低\n      limit: 仅核心入口生效\n\n  safe.foyer_aegis_grid:\n    name: "⚡玄关静电裁断网"\n    category: 安全\n    unlock_level: 1\n    desc: 玄关地板植入低致伤静电网，识别敌意动作后触发麻痹性击退。\n    effects: [非致命制止, 入侵减速]\n    balance:\n      cost: 低\n      limit: 对重装目标效果有限\n\n  survive.thermal_loop_seed:\n    name: "🌡️恒温循环底座"\n    category: 生存\n    unlock_level: 1\n    desc: 建立基础热循环，2001核心区维持稳定体感温度，显著降低寒冷导致的健康损耗。\n    effects: [核心区恒温, 寒冷伤害缓解]\n    balance:\n      cost: 低\n      limit: 仅核心区\n\n  survive.water_air_loop_seed:\n    name: "💧空气-净水双循环"\n    category: 生存\n    unlock_level: 1\n    desc: 启动初级空气净化与净水回路，确保基础可呼吸与可饮用条件。\n    effects: [基础净水, 基础净化]\n    balance:\n      cost: 低\n      limit: 对污染峰值响应较慢\n\n  survive.basic_ration_fabricator:\n    name: "🍞基础口粮织造器"\n    category: 生存\n    unlock_level: 1\n    desc: 提供稳定但单调的高热量口粮，保障最低生存线。\n    effects: [饥饿缓解, 基础供给]\n    balance:\n      cost: 低\n      limit: 口味与营养结构单一\n\n  comfort.quiet_mind_channel:\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    name: "📐维持协议α"\n    category: 限制\n    unlock_level: 1\n    desc: 启用“高Imp协作人口”维持规则：每名达标幸存者可额外维持伊甸运行天数。\n    effects: [维持系统启用]\n    balance:\n      cost: 中\n      limit: 初始阈值高（Imp>=70）\n\n  safe.peephole_mesh:\n    name: "🔍门外蜂眼网"\n    category: 安全\n    unlock_level: 2\n    desc: 门外近距盲区被蜂眼镜头补齐，可识别尾随与伏击动作。\n    effects: [盲区补足]\n    balance:\n      cost: 低\n      limit: 仅门外短距\n\n  safe.corridor_echo_probe:\n    name: "📶走廊回声探针"\n    category: 安全\n    unlock_level: 2\n    desc: 通过声纹回声估算走廊活动密度，提前规避短时拥堵与冲突点。\n    effects: [风险预估]\n    balance:\n      cost: 低\n      limit: 精度受环境噪声影响\n\n  survive.sanitation_capsule:\n    name: "🧼卫生净化舱"\n    category: 生存\n    unlock_level: 2\n    desc: 建立基础消杀流程，降低常见感染风险并改善居住卫生水平。\n    effects: [感染风险下降]\n    balance:\n      cost: 低\n      limit: 仅基础病原防护\n\n  survive.heat_budget_allocator:\n    name: "🔥热量配额调度器"\n    category: 生存\n    unlock_level: 2\n    desc: 对供暖进行时段化调度，减少无效能耗并提升夜间舒适稳定性。\n    effects: [供暖效率提升]\n    balance:\n      cost: 低\n      limit: 不能提高绝对供暖上限\n\n  comfort.archive_gallery_local:\n    name: "📚离线档案长廊"\n    category: 舒适\n    unlock_level: 2\n    desc: 激活旧世界离线影像与文献库，提供低带宽文化娱乐与学习资源。\n    effects: [娱乐与信息恢复]\n    balance:\n      cost: 低\n      limit: 内容更新慢\n\n  expand.utility_interface_s1:\n    name: "🔌基础资源接口S1"\n    category: 扩展\n    unlock_level: 2\n    desc: 开通最小对外资源接口，可对外提供低强度水电支援。\n    effects: [小规模水电接口]\n    balance:\n      cost: 中\n      limit: 吞吐低、暴露风险上升\n\n  limit.threshold_tuning_beta:\n    name: "🧮阈值校准β"\n    category: 限制\n    unlock_level: 2\n    desc: 对维持规则进行第一轮校准，适度降低达标Imp阈值，提高可调度性。\n    effects: [imp_threshold -5]\n    balance:\n      cost: 中\n      limit: 仅降低阈值，不增加单人产能\n\n  safe.nonlethal_latch:\n    name: "🪤非致命束止栓"\n    category: 安全\n    unlock_level: 3\n    desc: 玄关新增可控束止器，对闯入目标实施定点禁锢，便于审讯与驱离。\n    effects: [非致命控制提升]\n    balance:\n      cost: 中\n      limit: 连续触发存在冷却\n\n  safe.panic_path_lamp:\n    name: "🚨惊厥路径警示灯"\n    category: 安全\n    unlock_level: 3\n    desc: 在核心动线中投射高可见引导，紧急情况下减少踩踏与误判。\n    effects: [紧急撤离效率提升]\n    balance:\n      cost: 低\n      limit: 仅内部生效\n\n  survive.clinic_pod_t0:\n    name: "⚕️临床舱T0"\n    category: 生存\n    unlock_level: 3\n    desc: 提供常见外伤与轻中度感染处置，建立最小医疗闭环。\n    effects: [基础医疗]\n    balance:\n      cost: 中\n      limit: 不支持复杂外科\n\n  comfort.circadian_symphony:\n    name: "🌙昼夜韵律编排"\n    category: 舒适\n    unlock_level: 3\n    desc: 根据作息自动调节光色、音景与气味，减少失眠和情绪失衡。\n    effects: [休息质量提升]\n    balance:\n      cost: 低\n      limit: 对重度创伤无直接治疗效果\n\n  expand.shelter_radius_20f_s1:\n    name: "🛡️20层庇护半径S1"\n    category: 扩展\n    unlock_level: 3\n    desc: 允许将20层少量房间纳入“生存庇护范围”，提供基础防护与环境维持。\n    effects: [20层安全范围初次扩展]\n    balance:\n      cost: 中\n      limit: 名额有限\n\n  expand.heating_radius_20f_s1:\n    name: "♨️20层供暖半径S1"\n    category: 扩展\n    unlock_level: 3\n    desc: 供暖网络首次外扩到20层部分房间，减轻寒冷被动损耗。\n    effects: [20层恒温范围初次扩展]\n    balance:\n      cost: 中\n      limit: 仅温度维持，不含安防加成\n\n  limit.support_quota_beta:\n    name: "📊维持配额β"\n    category: 限制\n    unlock_level: 3\n    desc: 改善调度后勤，每名达标协作幸存者的维持贡献轻微提高。\n    effects: [bonus_days_per_qualified_survivor +0.5]\n    balance:\n      cost: 中\n      limit: 受总天数上限约束\n\n  safe.nightglass_swarm:\n    name: "👁️夜晶侦巡群"\n    category:
