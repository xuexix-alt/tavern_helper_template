unlock_level: 1\n    desc: 启动初级空气净化与净水回路，确保基础可呼吸与可饮用条件。\n    effects: [基础净水, 基础净化]\n    balance:\n      cost: 低\n      limit: 对污染峰值响应较慢\n\n  survive.basic_ration_fabricator:\n    name: "🍞基础口粮织造器"\n    category: 生存\n    unlock_level: 1\n    desc: 提供稳定但单调的高热量口粮，保障最低生存线。\n    effects: [饥饿缓解, 基础供给]\n    balance:\n      cost: 低\n      limit: 口味与营养结构单一\n\n  comfort.quiet_mind_channel:\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    name: "📐维持协议α"\n    category: 限制\n    unlock_level: 1\n    desc: 启用“高Imp协作人口”维持规则：每名达标幸存者可额外维持伊甸运行天数。\n    effects: [维持系统启用]\n    balance:\n      cost: 中\n      limit: 初始阈值高（Imp>=70）\n\n  safe.peephole_mesh:\n    name: "🔍门外蜂眼网"\n    category: 安全\n    unlock_level: 2\n    desc: 门外近距盲区被蜂眼镜头补齐，可识别尾随与伏击动作。\n    effects: [盲区补足]\n    balance:\n      cost: 低\n      limit: 仅门外短距\n\n  safe.corridor_echo_probe:\n    name: "📶走廊回声探针"\n    category: 安全\n    unlock_level: 2\n    desc: 通过声纹回声估算走廊活动密度，提前规避短时拥堵与冲突点。\n    effects: [风险预估]\n    balance:\n      cost: 低\n      limit: 精度受环境噪声影响\n\n  survive.sanitation_capsule:\n    name: "🧼卫生净化舱"\n    category: 生存\n    unlock_level: 2\n    desc: 建立基础消杀流程，降低常见感染风险并改善居住卫生水平。\n    effects: [感染风险下降]\n    balance:\n      cost: 低\n      limit: 仅基础病原防护\n\n  survive.heat_budget_allocator:\n    name: "🔥热量配额调度器"\n    category: 生存\n    unlock_level: 2\n    desc: 对供暖进行时段化调度，减少无效能耗并提升夜间舒适稳定性。\n    effects: [供暖效率提升]\n    balance:\n      cost: 低\n      limit: 不能提高绝对供暖上限\n\n  comfort.archive_gallery_local:\n    name: "📚离线档案长廊"\n    category: 舒适\n    unlock_level: 2\n    desc: 激活旧世界离线影像与文献库，提供低带宽文化娱乐与学习资源。\n    effects: [娱乐与信息恢复]\n    balance:\n      cost: 低\n      limit: 内容更新慢\n\n  expand.utility_interface_s1:\n    name: "🔌基础资源接口S1"\n    category: 扩展\n    unlock_level: 2\n    desc: 开通最小对外资源接口，可对外提供低强度水电支援。\n    effects: [小规模水电接口]\n    balance:\n      cost: 中\n      limit: 吞吐低、暴露风险上升\n\n  limit.threshold_tuning_beta:\n    name: "🧮阈值校准β"\n    category: 限制\n    unlock_level: 2\n    desc: 对维持规则进行第一轮校准，适度降低达标Imp阈值，提高可调度性。\n    effects: [imp_threshold -5]\n    balance:\n      cost: 中\n      limit: 仅降低阈值，不增加单人产能\n\n  safe.nonlethal_latch:\n    name: "🪤非致命束止栓"\n    category: 安全\n    unlock_level: 3\n    desc: 玄关新增可控束止器，对闯入目标实施定点禁锢，便于审讯与驱离。\n    effects: [非致命控制提升]\n    balance:\n      cost: 中\n      limit: 连续触发存在冷却\n\n  safe.panic_path_lamp:\n    name: "🚨惊厥路径警示灯"\n    category: 安全\n    unlock_level: 3\n    desc: 在核心动线中投射高可见引导，紧急情况下减少踩踏与误判。\n    effects: [紧急撤离效率提升]\n    balance:\n      cost: 低\n      limit: 仅内部生效\n\n  survive.clinic_pod_t0:\n    name: "⚕️临床舱T0"\n    category: 生存\n    unlock_level: 3\n    desc: 提供常见外伤与轻中度感染处置，建立最小医疗闭环。\n    effects: [基础医疗]\n    balance:\n      cost: 中\n      limit: 不支持复杂外科\n\n  comfort.circadian_symphony:\n    name: "🌙昼夜韵律编排"\n    category: 舒适\n    unlock_level: 3\n    desc: 根据作息自动调节光色、音景与气味，减少失眠和情绪失衡。\n    effects: [休息质量提升]\n    balance:\n      cost: 低\n      limit: 对重度创伤无直接治疗效果\n\n  expand.shelter_radius_20f_s1:\n    name: "🛡️20层庇护半径S1"\n    category: 扩展\n    unlock_level: 3\n    desc: 允许将20层少量房间纳入“生存庇护范围”，提供基础防护与环境维持。\n    effects: [20层安全范围初次扩展]\n    balance:\n      cost: 中\n      limit: 名额有限\n\n  expand.heating_radius_20f_s1:\n    name: "♨️20层供暖半径S1"\n    category: 扩展\n    unlock_level: 3\n    desc: 供暖网络首次外扩到20层部分房间，减轻寒冷被动损耗。\n    effects: [20层恒温范围初次扩展]\n    balance:\n      cost: 中\n      limit: 仅温度维持，不含安防加成\n\n  limit.support_quota_beta:\n    name: "📊维持配额β"\n    category: 限制\n    unlock_level: 3\n    desc: 改善调度后勤，每名达标协作幸存者的维持贡献轻微提高。\n    effects: [bonus_days_per_qualified_survivor +0.5]\n    balance:\n      cost: 中\n      limit: 受总天数上限约束\n\n  safe.nightglass_swarm:\n    name: "👁️夜晶侦巡群"\n    category: 安全\n    unlock_level: 4\n    desc: 侦查无人机升级夜视与热成像，在低能见度环境维持中距离预警。\n    effects: [中距侦查]\n    balance:\n      cost: 中\n      limit: 恶劣暴雪下有效半径衰减\n\n  safe.hallway_threat_score:\n    name: "📈走廊威胁评分"\n    category: 安全\n    unlock_level: 4\n    desc: 基于轨迹与行为片段给出威胁评分，辅助决定接触、避让或拦截。\n    effects: [决策辅助]\n    balance:\n      cost: 低\n      limit: 属概率判断，不保证绝对正确\n\n  survive.nutri_variety_primer:\n    name: "🥣营养谱系引擎·初型"\n    category: 生存\n    unlock_level: 4\n    desc: 从单一口粮过渡到多营养配比，降低长期缺乏导致的隐性损耗。\n    effects: [营养结构改善]\n    balance:\n      cost: 中\n      limit: 高级食材尚未解锁\n\n  comfort.digital_arcadia_v1:\n    name: "🌐数字乐园V1"\n    category: 舒适\n    unlock_level: 4\n    desc: 解锁稳定影音与互动娱乐，恢复“像末日前那样消磨夜晚”的体验。\n    effects: [中等娱乐恢复]\n    balance:\n      cost: 低\n      limit: 不提供实体享乐设施\n\n  expand.resource_interface_20f_s1:\n    name: "🚰20层资源接口S1"\n    category: 扩展\n    unlock_level: 4\n    desc: 对20层开放第一档资源接口，支持小规模供水、供电与应急燃气调配。\n    effects: [20层资源接口初次扩展]\n    balance:\n      cost: 中\n      limit: 吞吐受限，频繁调用会暴露秩序中心\n\n  expedition.signal_scout_pack:\n    name: "📡信标侦搜包"\n    category: 远征\n    unlock_level: 4\n    desc: 可部署短时信标与回传节点，为楼内外探索建立最小闭环导航。\n    effects: [短程远征辅助]\n    balance:\n      cost: 中\n      limit: 续航有限，需要回收维护\n\n  limit.threshold_tuning_gamma:\n    name: "🧠阈值校准γ"\n    category: 限制\n    unlock_level: 4\n    desc: 进一步降低维持阈值，让中高协作人群也可稳定贡献运行时长。\n    effects: [imp_threshold -5]\n    balance:\n      cost: 中\n      limit: 仍需满足秩序归属与管辖条件\n\n  safe.response_drill_grid:\n    name: "🧱响应演训网格"\n    category: 安全\n    unlock_level: 5\n    desc: 内部应急动作标准化，遭遇突发时减少决策迟滞与误伤。\n    effects: [团队响应效率提升]\n    balance:\n      cost: 中\n      limit: 依赖人员执行度\n\n  survive.clinic_pod_t1:\n    name: "🏥临床舱T1"\n    category: 生存\n    unlock_level: 5\n    desc: 提升伤病处理吞吐与稳定性，可支撑小规模集体护理。\n    effects: [中级医疗]\n    balance:\n      cost: 中\n      limit: 复杂手术仍需外科台\n\n  survive.pharma_replicator_t0:\n    name: "💊药剂复构台T0"\n    category: 生存\n    unlock_level: 5\n    desc: 可复构常见药物与基础耗材，缓解药品断供压力。\n    effects: [基础药品供给]\n    balance:\n      cost: 中\n      limit: 稀有药与高危药物不可批量生成\n\n  comfort.social_hearth_room:\n    name: "🔥群体暖炉会客厅"\n    category: 舒适\n    unlock_level: 5\n    desc: 提供可社交的温暖会客环境，缓和隔离导致的关系断裂。\n    effects: [社交舒适提升]\n    balance:\n      cost: 低\n      limit: 间接收益，不直接加战力\n\n  expand.shelter_radius_20f_s2:\n    name: "🛡️20层庇护半径S2"\n    category: 扩展\n    unlock_level: 5\n    desc: 20层可纳入庇护的房间名额提升，秩序影响力向同层扩散。\n    effects: [20层安全范围二次扩展]\n    balance:\n      cost: 中\n      limit: 扩展越快，治理压力越高\n\n  expedition.relay_cache_box:\n    name: "📦中继补给箱"\n    category: 远征\n    unlock_level: 5\n    desc: 可在楼层关键点布设临时补给箱，提升探索回程成功率。\n    effects: [中程远征续航]\n    balance:\n      cost: 中\n      limit: 易被夺取，需要守护\n\n  limit.support_quota_gamma:\n    name: "📊维持配额γ"\n    category: 限制\n    unlock_level: 5\n    desc: 调度模型更新后，达标协作者的维持贡献再次小幅增长。\n    effects: [bonus_days_per_qualified_survivor +0.5]\n    balance:\n      cost: 中\n      limit: 超过人数阈值后触发递减收益\n\n  safe.tactical_jammer_node:\n    name: "📻战术干扰节点"\n    category: 安全\n    unlock_level: 6\n    desc: 对局部通信进行短时压制，打断敌对协同与远程呼叫。\n    effects: [局部通信干扰]\n    balance:\n      cost: 中\n      limit: 使用窗口短，冷却较长\n\n  survive.surgery_table_t0:\n    name: "🔬外科台T0"\n    category: 生存\n    unlock_level: 6\n    desc: 支持中等复杂度外科处理，显著提升重伤存活率。\n    effects: [外科处理能力]\n    balance:\n      cost: 高\n      limit: 依赖专业流程与耗材\n\n  comfort.holo_stage_chamber:\n    name: "🎭全息舞台舱"\n    category: 舒适\n    unlock_level: 6\n    desc: 在封闭环境中复现演出、景观与情境互动，恢复“被文明拥抱”的感觉。\n    effects: [沉浸娱乐提升]\n    balance:\n      cost: 中\n      limit: 能耗较高\n\n  expand.shelter_radius_19f_s1:\n    name: "🛡️19层庇护半径S1"\n    category: 扩展\n    unlock_level: 6\n    desc: 庇护能力首次下贯至19层，形成跨层安全节点。\n    effects: [19层安全范围初次扩展]\n    balance:\n      cost: 高\n      limit: 初始名额较少\n\n  expand.heating_radius_19f_s1:\n    name: "♨️19层供暖半径S1"\n    category: 扩展\n    unlock_level: 6\n    desc: 供暖网络跨层下沉，19层指定房间可获得稳定温控。\n    effects: [19层恒温范围初次扩展]\n    balance:\n      cost: 高\n      limit: 供暖与安防并不绑定\n\n  expedition.weather
