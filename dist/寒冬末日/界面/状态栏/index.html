”提供社会运转稳定度\n    base_days: 1\n    base_imp_threshold: 70\n    bonus_days_per_qualified_survivor: 1\n    qualified_rule: 幸存者Imp >= imp_threshold 且处于受管辖状态\n    scaling:\n      threshold_reduction_per_tier: 5\n      days_bonus_per_tier: 0.5\n      max_tier: 5\n    caps:\n      min_threshold: 45\n      max_bonus_days_per_survivor: 2\n      max_total_maintenance_days: 21\n    anti_snowball:\n      diminishing_return_after_survivors: 8\n      diminishing_factor: 0.5\n\nlevels:\n  "1":\n    label: 霜墙火种\n    unlocks:\n      - safe.sealed_bulkhead\n      - safe.foyer_aegis_grid\n      - survive.thermal_loop_seed\n      - survive.water_air_loop_seed\n      - survive.basic_ration_fabricator\n      - comfort.quiet_mind_channel\n      - expand.core_safe_zone_anchor\n      - limit.imp_support_protocol_alpha\n  "2":\n    label: 稳态筑巢\n    unlocks:\n      - safe.peephole_mesh\n      - safe.corridor_echo_probe\n      - survive.sanitation_capsule\n      - survive.heat_budget_allocator\n      - comfort.archive_gallery_local\n      - expand.utility_interface_s1\n      - limit.threshold_tuning_beta\n  "3":\n    label: 玄关前哨\n    unlocks:\n      - safe.nonlethal_latch\n      - safe.panic_path_lamp\n      - survive.clinic_pod_t0\n      - comfort.circadian_symphony\n      - expand.shelter_radius_20f_s1\n      - expand.heating_radius_20f_s1\n      - limit.support_quota_beta\n  "4":\n    label: 楼层洞察\n    unlocks:\n      - safe.nightglass_swarm\n      - safe.hallway_threat_score\n      - survive.nutri_variety_primer\n      - comfort.digital_arcadia_v1\n      - expand.resource_interface_20f_s1\n      - expedition.signal_scout_pack\n      - limit.threshold_tuning_gamma\n  "5":\n    label: 合作化秩序\n    unlocks:\n      - safe.response_drill_grid\n      - survive.clinic_pod_t1\n      - survive.pharma_replicator_t0\n      - comfort.social_hearth_room\n      - expand.shelter_radius_20f_s2\n      - expedition.relay_cache_box\n      - limit.support_quota_gamma\n  "6":\n    label: 跨层联结\n    unlocks:\n \n    desc: 建立基础热循环，2001核心区维持稳定体感温度，显著降低寒冷导致的健康损耗。\n    effects: [核心区恒温, 寒冷伤害缓解]\n    balance:\n      cost: 低\n      limit: 仅核心区\n\n  survive.water_air_loop_seed:\n    name: "💧空气-净水双循环"\n    category: 生存\n    unlock_level: 1\n    desc: 启动初级空气净化与净水回路，确保基础可呼吸与可饮用条件。\n    effects: [基础净水, 基础净化]\n    balance:\n      cost: 低\n      limit: 对污染峰值响应较慢\n\n  survive.basic_ration_fabricator:\n    name: "🍞基础口粮织造器"\n    category: 生存\n    unlock_level: 1\n    desc: 提供稳定但单调的高热量口粮，保障最低生存线。\n    effects: [饥饿缓解, 基础供给]\n    balance:\n      cost: 低\n      limit: 口味与营养结构单一\n\n  comfort.quiet_mind_channel:\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    name: "📐维持协议α"\n    category: 限制\n    unlock_level: 1\n    desc: 启用“高Imp协作人口”维持规则：每名达标幸存者可额外维持伊甸运行天数。\n    effects: [维持系统启用]\n    balance:\n      cost: 中\n      limit: 初始阈值高（Imp>=70）\n\n  safe.peephole_mesh:\n    name: "🔍门外蜂眼网"\n    category: 安全\n    unlock_level: 2\n    desc: 门外近距盲区被蜂眼镜头补齐，可识别尾随与伏击动作。\n    effects: [盲区补足]\n    balance:\n      cost: 低\n      limit: 仅门外短距\n\n  safe.corridor_echo_probe:\n    name: "📶走廊回声探针"\n    category: 安全\n    unlock_level: 2\n    desc: 通过声纹回声估算走廊活动密度，提前规避短时拥堵与冲突点。\n    effects: [风险预估]\n    balance:\n      cost: 低\n      limit: 精度受环境噪声影响\n\n  survive.sanitation_capsule:\n    name: "🧼卫生净化舱"\n    category: 生存\n    unlock_level: 2\n    desc: 建立基础消杀流程，降低常见感染风险并改善居住卫生水平。\n    effects: [感染风险下降]\n    balance:\n      cost: 低\n      limit: 仅基础病原防护\n\n  survive.heat_budget_allocator:\n    name: "🔥热量配额调度器"\n    category: 生存\n    unlock_level: 2\n    desc: 对供暖进行时段化调度，减少无效能耗并提升夜间舒适稳定性。\n    effects: [供暖效率提升]\n    balance:\n      cost: 低\n      limi
