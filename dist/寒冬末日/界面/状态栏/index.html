的衣物，系统将在数分钟内为您量身定制。从舒适的家居服到华丽的礼服，从性感的内衣到各种职业制服，所有衣物都由您随心定义。\n\n⚕️初级医疗舱⚕️\n简介：一个独立的医疗隔间被激活。内部配备有高精度身体扫描仪和自动诊断系统，可快速诊断绝大多数常见疾病和轻微外伤（如感冒发烧、割伤、扭伤），并自动配置、注射对症药物进行治疗。\n\n🛡️庇护范围同步协议🛡️\n简介：“伊甸”获得对整栋公寓环境管网的深度控制权。将部分公寓房间纳入【生存庇护范围】，为其同步供暖、通风与空气过滤。\n- 名额：20层可同步 3 个房间。\n- 效果：被同步房间成为“温暖而可呼吸”的据点\n- 限制：仅提供环境维持与基础生存保障，不等同于 2001 室的绝对安防\n\n🎭全息娱乐剧院🎭\n简介：在客厅区域激活一个全息投影舞台，配合环绕立体声系统，提供沉浸式的感官享受。\n\n---\n### 庇护所等级 4: 秩序武装 (Armament of Order)\n\n---\n🤖“看守者”自动巡逻机器人🤖\n简介：一种小型、静音的双足巡逻机器人，可在庇护所内部及门口走廊进行24小时不间断巡逻。配备非致命电击武器和摄像探头，能够自动驱离未经授权的闯入者，并将实时画面传回观察接口。\n\n🛡️庇护范围扩展·20层🛡️\n简介：环境管网的同步带宽提升，“伊甸”可同时维持更多房间的供暖与通风。\n- 名额：20层可同步 6 个房间。\n\n---\n### 庇护所等级 5: 追随者体系 (Follower System)\n简介: 您的权柄开始向外延伸。您现在有能力为您的忠诚追随者提供一个赖以生存的“家”，建立属于您的末日秩序。\n\n---\n🏘️“伊甸荚舱”制造模块🏘️\n简介：一项专为确立您领袖地位而设的核心能力。您可以在扩展区制造可部署的“伊甸荚舱”。每个荚舱都是一个独立的微型庇护所，拥有恒温空调、舒适的单人床、独立卫浴（无限热水）和基础的照明系统。它们可以被部署在公寓楼内或外部安全区域，作为您赐予追随者的专属居所。荚舱的所有能源与资源均需由您的主庇护所进行配给，其居住权限完全由您掌控。\n\n📊追随者管理系统📊\n简介：一个集成了生物识别与心理评估的智能管理界面。您可以实时查看每位追随者的健康状态、忠诚度、技能特长与当前需求，并据此分配任务、发放奖励或进行“调整”，确保团队的绝对服从与高效运作。\n\n🍽️集体餐饮合成器🍽️\n简介：扩展万象合成终端的功能，允许批量合成定制化的餐食。您可以预设菜单，系统将自动为所有追随者准备营养均衡、口味适宜的饭菜，并通过荚舱的投送系统分发，大幅减轻您的管理负担。\n\n🛡️庇护范围扩展·整层覆盖🛡️\n简介：对 20 层环境管网完成完全接管，同步效率与稳定性质变。\n- 名额：20层可同步 12 个房间（整层覆盖）。\n\n---\n### 庇护所等级 6: 武装力量 (Armed Force)\n简介: 您获得了真正意义上的致命武力，从一个富有的幸存者，转变为拥有武装力量的末日军阀。\n\n---\n🔬外科手术台🔬\n简介：初级医疗舱升级。新增一套全自动外科手术设备，能够处理更严重的伤势，如枪伤、骨折固定、阑尾炎切除等中等复杂度的外科手术，极大地提升了您和您追随者的生存率。\n\n🛡️庇护范围扩展·跨楼层🛡️\n简介：同步管网向下贯通，伊甸开始具备对 19 层房间的环境维持能力。\n- 名额：19层可同步 3 个房间（此后每提升 1 级再 +3，上限 12）。\n\n🎯战术训练模拟舱🎯\n简介：一个虚拟现实训练装置。您和您的卫队可以在完全安全的模拟环境中进行武器射击、小队配合、CQB战术等训练，快速提升实战能力，而无需消耗实际弹药或承担受伤风险。\n\n---\n### 庇护所等级 7: 远征准备 (Expedition Prep)\n简介: 庇护所开始为走出公寓、探索这个面目全非的世界做准备。\n\n---\n🚗“先驱者”载具制造单元🚗\n简介：庇护所内一个巨大的扩展区被解锁，成为载具车库。同时，您获得了一台载具制造器，能够生产第一代末日探索载具“先驱者-I”。这是一款具备全地形履带、密封增压驾驶室（可抵御雪晶腐蚀）、大容量储物空间和基础外部装甲的六轮探索车。\n\n🌡️外部环境分析仪🌡️\n简介：安装在载具和无人机上的高级传感器阵列。能够实时分析外部空气中的雪晶浓度、辐射水平、有毒气体成分，并预测局部天气变化，为您的远征提供至关重要的环境情报。\n\n---\n### 庇护所等级 8: 移动堡垒 (Mobile Fortress)\n简介: 质变的时刻。您的家不再被束缚于原地，它本身就成为了最强大的末日座驾。\n\n---\n⚙️动力驱动系统 Mk.I⚙️\n简介：庇护所底部伸出数条巨大的、如同蜈蚣般的节肢状液压驱动
