配备有高精度身体扫描仪和自动诊断系统，可快速诊断绝大多数常见疾病和轻微外伤（如感冒发烧、割伤、扭伤），并自动配置、注射对症药物进行治疗。\n\n🛡️庇护范围同步协议🛡️\n简介：“伊甸”获得对整栋公寓环境管网的深度控制权。将部分公寓房间纳入【生存庇护范围】，为其同步供暖、通风与空气过滤。\n- 名额：20层可同步 3 个房间。\n- 效果：被同步房间成为“温暖而可呼吸”的据点\n- 限制：仅提供环境维持与基础生存保障，不等同于 2001 室的绝对安防\n\n🎭全息娱乐剧院🎭\n简介：在客厅区域激活一个全息投影舞台，配合环绕立体声系统，提供沉浸式的感官享受。\n\n---\n### 庇护所等级 4: 秩序武装 (Armament of Order)\n\n---\n🤖“看守者”自动巡逻机器人🤖\n简介：一种小型、静音的双足巡逻机器人，可在庇护所内部及门口走廊进行24小时不间断巡逻。配备非致命电击武器和摄像探头，能够自动驱离未经授权的闯入者，并将实时画面传回观察接口。\n\n🛡️庇护范围扩展·20层🛡️\n简介：环境管网的同步带宽提升，“伊甸”可同时维持更多房间的供暖与通风。\n- 名额：20层可同步 6 个房间。\n\n---\n### 庇护所等级 5: 追随者体系 (Follower System)\n简介: 您的权柄开始向外延伸。您现在有能力为您的忠诚追随者提供一个赖以生存的“家”，建立属于您的末日秩序。\n\n---\n🏘️“伊甸荚舱”制造模块🏘️\n简介：一项专为确立您领袖地位而设的核心能力。您可以在扩展区制造可部署的“伊甸荚舱”。每个荚舱都是一个独立的微型庇护所，拥有恒温空调、舒适的单人床、独立卫浴（无限热水）和基础的照明系统。它们可以被部署在公寓楼内或外部安全区域，作为您赐予追随者的专属居所。荚舱的所有能源与资源均需由您的主庇护所进行配给，其居住权限完全由您掌控。\n\n📊追随者管理系统📊\n简介：一个集成了生物识别与心理评估的智能管理界面。您可以实时查看每位追随者的健康状态、忠诚度、技能特长与当前需求，并据此分配任务、发放奖励或进行“调整”，确保团队的绝对服从与高效运作。\n\n🍽️集体餐饮合成器🍽️\n简介：扩展万象合成终端的功能，允许批量合成定制化的餐食。您可以预设菜单，系统将自动为所有追随者准备营养均衡、口味适宜的饭菜，并通过荚舱的投送系统分发，大幅减轻您的管理负担。\n\n🛡️庇护范围扩展·整层覆盖🛡️\n简介：对 20 层环境管网完成完全接管，同步效率与稳定性质变。\n- 名额：20层可同步 12 个房间（整层覆盖）。\n\n---\n### 庇护所等级 6: 武装力量 (Armed Force)\n简介: 您获得了真正意义上的致命武力，从一个富有的幸存者，转变为拥有武装力量的末日军阀。\n\n---\n🔬外科手术台🔬\n简介：初级医疗舱升级。新增一套全自动外科手术设备，能够处理更严重的伤势，如枪伤、骨折固定、阑尾炎切除等中等复杂度的外科手术，极大地提升了您和您追随者的生存率。\n\n🛡️庇护范围扩展·跨楼层🛡️\n简介：同步管网向下贯通，伊甸开始具备对 19 层房间的环境维持能力。\n- 名额：19层可同步 3 个房间（此后每提升 1 级再 +3，上限 12）。\n\n🎯战术训练模拟舱🎯\n简介：一个虚拟现实训练装置。您和您的卫队可以在完全安全的模拟环境中进行武器射击、小队配合、CQB战术等训练，快速提升实战能力，而无需消耗实际弹药或承担受伤风险。\n\n---\n### 庇护所等级 7: 远征准备 (Expedition Prep)\n简介: 庇护所开始为走出公寓、探索这个面目全非的世界做准备。\n\n---\n🚗“先驱者”载具制造单元🚗\n简介：庇护所内一个巨大的扩展区被解锁，成为载具车库。同时，您获得了一台载具制造器，能够生产第一代末日探索载具“先驱者-I”。这是一款具备全地形履带、密封增压驾驶室（可抵御雪晶腐蚀）、大容量储物空间和基础外部装甲的六轮探索车。\n\n🌡️外部环境分析仪🌡️\n简介：安装在载具和无人机上的高级传感器阵列。能够实时分析外部空气中的雪晶浓度、辐射水平、有毒气体成分，并预测局部天气变化，为您的远征提供至关重要的环境情报。\n\n---\n### 庇护所等级 8: 移动堡垒 (Mobile Fortress)\n简介: 质变的时刻。您的家不再被束缚于原地，它本身就成为了最强大的末日座驾。\n\n---\n⚙️动力驱动系统 Mk.I⚙️\n简介：庇护所底部伸出数条巨大的、如同蜈蚣般的节肢状液压驱动足。您的整个庇护所（公寓房间）现在可以从建筑结构上脱离，以缓慢但稳定的速度在城市废墟中移动，成为一个真正意义上的移动堡垒。\n\n💥重型军械库💥\n简介：军火熔炉升级。解锁了突击步枪、狙击步枪、霰弹枪和手榴弹等更具威力的武器制造权限，您的武装力量得到全面强化。\n\n⚖️内部重力稳定系统⚖️\n简介：在庇护所移动时，该系统能自动调节内部重力场，消除加速、减速、颠簸带来的不适感，确保内部人员如履平地。同时，它还能模拟不同的重力环境，用于训练或特殊实验。\n\n---\n### 庇护所等级 9: 完全自持 (Total Self-Sufficiency)\n简介: 庇护所进化为一座近乎完美的生态闭环方舟，其医疗科技已超越旧世界。\n\n---\n⚛️“创世纪”能源核心⚛️\n简介：庇护所的核心能源升级为一座微型、安全、零污染的聚变反应堆。它能提供近乎无限的庞大能源，足以支持所有系统（包括移动）高强度运行，并拥有巨大的能源冗余。\n\n🧬专家级自动医师🧬\n简介：外科手术台最终升级。新增的生物再生模块使其能够执行高难度的再生手术，如断肢再接续、受损器官修复等。理论上，只要大脑未死亡，任何非致命的物理损伤都可以被逆转。\n\n🌿生态循环农场🌿\n简介：一个利用先进水培和气培技术的室内垂直农场。它可以高效生产新鲜蔬菜、水果甚至小型粮食作物，不仅丰富了您的食谱，更实现了食物来源的完全自给，不依赖物质重组单元。\n\n---\n### 庇护所等级 10: 行走伊甸 (Walking Eden)\n简介: 您的庇护所已成为这个冰封星球上的奇迹，是行走的文明火种，是您意志所及的权柄象征。\n\n---\n🚀动力驱动系统 Mk.II🚀\n简介：液压驱动足被反重力引擎所取代。您的庇护所现在可以离地数米悬浮，并以更快的速度、更强的机动性在任何地形上“航行”，无视一切地面障碍。\n\n🌌光学迷彩力场🌌\n简介：庇护所外部可以生成一层扭曲光线和热信号的力场，使其在视觉上和热成像上完全隐形。您可以悄无声-息地出现在任何地方，或是在众目睽睽之下消失无踪。\n\n🌍“净化者”环境探针🌍\n简介：您可以发射一种特殊的能量探针。在探针效果范围内（半径约50米），它可以在短时间内中和雪晶的腐蚀性，融化积雪，净化水源，创造出一片小型的、临时的“安全区”。这是您向外界彰显并施展影响力的强大工具。\n\n⏳时空稳定锚⏳\n简介：庇护所的最神秘科技之一。启动后，可以在庇护所周围形成一个稳定的时空场，极大程度地抵抗外部时间流速异常、空间扭曲等极端现象，确保您在面对未知超自然威胁时保有最后的避难所。\n\n</庇护所升级能力>\n');function Sl(e){'function'==typeof updateVariablesWith&&updateVariablesWith(t=>(_.set(t,Rr,e),t),{type:'chat'})}function Vl(){const e=Go();let t=!1;(0,o.watch)(()=>e.data.世界.日期,async n=>{const o=String(n??'').trim();if(o&&!t){t=!0;try{const t=await async function(){try{const e=('function'==typeof getVariables?getVariables({type:'chat'}):{})??{},t=_.get(e,Rr,{});return yl.parse(t)}catch{return yl.parse({})}}();if(!t.last_roll_date){return void Sl({last_roll_date:o,days_since_upgrade:bl(e.data.庇护所.距离上次升级)})}if(t.last_roll_date===o)return;await waitGlobalInitialized('Mvu');const n=getCurrentMessageId(),r=Mvu.getMvuData({type:'message',message_id:n}),a=_.get(r,'stat_data',{});a&&'object'==typeof a||_.set(r,'stat_data',{});const s=El(_.get(a,['庇护所','庇护所等级'],e.data.庇护所.庇护所等级)),i=Number.isFinite(t.days_since_upgrade)?Math.max(0,Math.floor(t.days_since_upgrade)):bl(_.get(a,['庇护所','距离上次升级'],e.data.庇护所.距离上次升级)),l=i>=7,c=l?null:Math.floor(11*Math.random()),u=l||(7===c||10===c),
