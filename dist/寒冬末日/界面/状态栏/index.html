总表\n  world: 寒冬末日-星穹秩序\n  authoring_note: 严格YAML；该文件是庇护所能力的唯一总表（UI与脚本应按能力键查询描述）。1-10级已按六大系统完成重构，高阶能力统一收束为区域控制权成长。\n  source_of_truth: true\n\nrules:\n  level_range: [1, 10]\n  categories: [能源, 安全, 维生, 生活, 社交, 开拓]\n  system_lines: [energy, security, sustain, life, social, expansion]\n  progression_style: 小步快走\n  balancing_principles:\n    - 低等级优先生存，不给压制级战斗能力\n    - 单级能力数量适中，避免跨级质变过猛\n    - 强能力必须绑定成本、门槛或冷却\n    - 生活类不直接转化为战斗优势\n    - 开拓类强调“能推进”，不保证“无损拿下”\n    - 前五级优先体现“有优势但仍需进取”的成长压力\n\nmaintenance:\n  imp_support:\n    description: 伊甸维持系统由“高意愿协作人口”提供社会运转稳定度\n    base_days: 1\n    base_imp_threshold: 70\n    bonus_days_per_qualified_survivor: 1\n    qualified_rule: 幸存者Imp >= imp_threshold 且处于受管辖状态\n    scaling:\n      threshold_reduction_per_tier: 5\n      days_bonus_per_tier: 0.5\n      max_tier: 5\n    caps:\n      min_threshold: 45\n      max_bonus_days_per_survivor: 2\n      max_total_maintenance_days: 21\n    anti_snowball:\n      diminishing_return_after_survivors: 8\n      diminishing_factor: 0.5\n\nlevels:\n  "1":\n    label: 房间求生\n    unlocks:\n      - energy.core_heat_grid_t1\n      - security.entry_bulkhead_t1\n      - sustain.basic_survival_loop_t1\n      - life.rest_privacy_t1\n      - social.rule_seed_t1\n      - expansion.core_anchor_t1\n  "2":\n    label: 核心区稳态\n    unlocks:\n      - energy.load_dispatch_t2\n      - security.nearfield_watch_t2\n      - sustain.hygiene_medical_t2\n      - life.clean_rhythm_t2\n      - social.shift_ration_protocol_t2\n      - expansion.threshold_interface_t2\n  "3":\n    label: 走出房门\n    unlocks:\n      - energy.hallway_heat_reach_t3\n      - security.hallway_control_t3\n      - sustain.group_care_t3\n      - life.community_rhythm_t3\n      - social.admission_protocol_t3\n      - expansion.floor20_anchor_t3\n  "4":\n    label: 楼层感知\n    unlocks:\n      - energy.floor_budget_t4\n      - security.floor_awareness_t4\n      - sustain.multi_patient_support_t4\n      - life.civil_buffer_t4\n      - social.contact_trade_window_t4\n      - expansion.floor20_control_zone_t4\n  "5":\n    label: 小共同体成形\n    unlocks:\n      - energy.anchor_network_t5\n      - security.rapid_response_t5\n      - sustain.community_support_t5\n      - life.settlement_identity_t5\n      - social.population_strata_t5\n      - expansion.floor20_governance_zone_t5\n  "6":\n    label: 跨层触达\n    unlocks:\n      - energy.crossfloor_spine_t6\n      - security.frontier_layers_t6\n      - sustain.midcare_supply_t6\n      - life.crossfloor_civil_order_t6\n      - social.multizone_protocol_t6\n      - expansion.floor19_forward_anchor_t6\n  "7":\n    label: 外勤成形\n    unlocks:\n      - energy.expedition_support_t7\n      - security.outer_ring_patrol_t7\n      - sustain.field_recovery_chain_t7\n      - life.reentry_recovery_loop_t7\n      - social.external_contact_channels_t7\n      - expansion.outfield_route_t7\n  "8":\n    label: 区域优势\n    unlocks:\n      - energy.area_grid_advantage_t8\n      - security.zone_control_grid_t8\n      - sustain.large_scale_supply_t8\n      - life.settlement_gradient_t8\n      - social.regional_credit_t8\n      - expansion.route_node_hegemony_t8\n  "9":\n    label: 楼栋核心\n    unlocks:\n      - energy.building_stability_core_t9\n      - security.building_deterrence_arch_t9\n      - sustain.community_production_loop_t9\n      - life.civil_core_atmosphere_t9\n      - social.governance_credit_regime_t9\n      - expansion.building_takeover_grid_t9\n  "10":\n    label: 区域秩序中心\n    unlocks:\n      - energy.regional_dispatch_core_t10\n      - security.regional_threat_shield_t10\n      - sustain.high_order_relief_system_t10\n      - life.cultural_hearth_t10\n      - social.regional_rule_network_t10\n      - expansion.order_center_radiance_t10\n\nabilities:\n  energy.core_heat_grid_t1:\n    name: "♨️核心供暖电网T1"\n    category: 能源\n    unlock_level: 1\n    system_line: energy\n    tier: 1\n    growth_target: 让2001核心区具备最低生存级供暖与供电。\n    player_advantage: 有稳定温度和基础开机能力，不再完全受外界寒潮摆布。\n    insufficiency: 只能维持核心区，不能外扩供能，系统负载冗余很低。\n    desc: 维持2001核心区的基础供暖与最低供电，确保人能活、系统能开机。\n    effects: [核心区供暖, 最小供电]\n    balance:\n      cost: 低\n      limit: 仅核心区\n    upkeep:\n      - 负荷冗余低\n      - 超载时优先保障核心生存功能\n    summary:\n      prompt_brief: "可维持2001核心区的基础供暖与最低供电，保证人能活、系统能开机；范围仅核心区，无法支撑外扩。"\n    boundary:\n      cannot:\n        - "不能写成整层稳定供暖或整栋持续供电"\n        - "不能写成无限能源或无成本常驻高负载"\n        - "不能把核心区外也写成同等供能效果"\n    writing_contract:\n      must_avoid:\n        - "避免写成万能能源中枢"\n        - "避免省略超载与负荷压力"\n\n  security.entry_bulkhead_t1:\n    name: "🛡️核心入口防线T1"\n    category: 安全\n    unlock_level: 1\n    system_line: security\n    tier: 1\n    growth_target: 让2001门口不再是一踹就开的薄弱点。\n    player_advantage: 能延缓破门、争取观察与应对时间。\n    insufficiency: 只能守住入口，守不住整层，也无法替代主动清场。\n    desc: 强化2001核心入口的门体、门闩与缓冲防线，提升强闯门槛。\n    effects: [入口强化, 争取时间]\n    balance:\n      cost: 低\n      limit: 仅入口有效\n    upkeep:\n      - 长时间承压会损耗门体结构\n    summary:\n      prompt_brief: "可强化2001核心入口防护并延缓强闯，为观察、后撤和反应争取时间；仅入口有效，不能覆盖整层。"\n    boundary:\n      cannot:\n        - "不能写成整层无死角防御"\n        - "不能写成自动反杀或永久压制所有入侵者"\n        - "不能把入口防线写成走廊级控制权"\n    writing_contract:\n      must_avoid:\n        - "避免写成开门即秒杀的自动炮塔系统"\n        - "避免把局部防线写成整层统治"\n\n  sustain.basic_survival_loop_t1:\n    name: "🍞基础生存循环T1"\n    category: 维生\n    unlock_level: 1\n    system_line: sustain\n    tier: 1\n    growth_target: 确保口粮、净水、空气与卫生都达到最低生存线。\n    player_advantage: 可以稳定保住自己和极少数人的生命底线。\n    insufficiency: 只能维持基础配给，无法承托伤病、多人收容或高质量生活。\n    desc: 提供基础口粮、净水、空气净化与最低卫生保障，维持少量人口不崩盘。\n    effects: [基础口粮, 基础净水, 空气净化]\n    balance:\n      cost: 低\n      limit: 仅少量人口最低生存线\n    upkeep:\n      - 配给单一\n      - 人口增加会迅速压缩余量\n    summary:\n      prompt_brief: "可提供基础口粮、净水、空气净化与最低卫生保障，保证少量人口不因基础生存要素直接崩盘；产出与承载都很有限。"\n    boundary:\n      cannot:\n        - "不能写成无限制供养多人"\n        - "不能写成一次解决全部食物、饮水、卫生问题"\n        - "不能写成高品质生活供给系统"\n    writing_contract:\n      must_avoid:\n        - "避免写成万能工厂或无限后勤"\n        - "避免忽略人口增加带来的系统压力"\n\n  life.rest_privacy_t1:\n    name: "🛁热水清洁间T1"\n    category: 生活\n    unlock_level: 1\n    system_line: life\n    tier: 1\n    growth_target: 让主角第一次拥有末日里别人享受不到的热水清洁条件。\n    player_advantage: 可以洗热水澡、换上温热干净的衣物，立刻拉开与外部幸存者的生活质量差距。\n    insufficiency: 热水量和使用时段都很紧，只够核心区少数人短时享受，远谈不上奢侈生活。\n    desc: 在2001核心区提供热水淋浴、温热毛巾与基础换洗位，让主角第一次拥有外界幸存者享受不到的体面生活。\n    effects: [热水清洁, 温热换洗, 体面生活]\n    balance:\n      cost: 低\n      limit: 热水量与时段都有限\n    upkeep:\n      - 依赖核心区稳定水热循环\n    summary:\n      prompt_brief: "可在2001核心区提供稀缺的热水清洁与换洗条件，让主角第一次享受末日下别人没有的体面生活；热水量和时段都有限，只够少数人短时使用。"\n    boundary:\n      cannot:\n        - "不能写成从1级开始就拥有无上限豪华浴场"\n        - "不能写成所有人随时都能享受稳定热水生活"\n        - "不能把基础热水清洁写成完整乐园生活"\n    writing_contract:\n      must_avoid:\n        - "避免把初级生活优势写成高阶享乐区"\n        - "避免忽略水热配额和使用顺位"\n\n  social.rule_seed_t1:\n    name: "🎧近域监听台T1"\n    category: 社交\n    unlock_level: 1\n    system_line: social\n    tier: 1\n    growth_target: 让主角先获得门口和短距走廊的情报优势，而不是只会被动开门。\n    player_advantage: 可以偷听门外动静、捕捉短距语音和情绪波动，为接触、交易和威慑抢到先手。\n    insufficiency: 监听范围极小，且只能得到零碎线索，远远不到全局掌控。\n    desc: 对2001门口与短距走廊进行被动监听，抓取语音碎片、脚步变化与即时情绪信号。\n    effects: [门外监听, 语音碎片, 情绪先手]\n    balance:\n      cost: 低\n      limit: 仅覆盖门口与短距走廊\n    summary:\n      prompt_brief: "可监听门口与短距走廊的动静、语音与情绪波动，让主角在接触和试探前先拿到情报优势；范围很小，只能获得零碎线索。"\n    boundary:\n      cannot:\n        - "不能写成从1级开始就能监控整层或整栋"\n        - "不能写成直接读取所有人完整想法"\n        - "不能把近域监听写成无死角情报网"\n    writing_contract:\n      must_avoid:\n        - "避免把监听写成读心术"\n        - "避免忽略遮挡、噪音和监听盲区"\n\n  expansion.core_anchor_t1:\n    name: "📍核心安全锚点T1"\n    category: 开拓\n    unlock_level: 1\n    system_line: expansion\n    tier: 1\n    growth_target: 把2001定义为一切庇护与控制能力的基准原点。\n    player_advantage: 让后续所有外扩、纳管、供暖、防线都有明确起点。\n    insufficiency: 这只是原点，不等于已经具备向外控制能力。\n    desc: 将2001定义为庇护、供能、防线与接管的统一原点。\n    effects: [安全原点, 外扩起点]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n    summary:\n      prompt_brief: "可将2001定义为绝对安全锚点，为后续供暖、防线、收容与外扩提供原点；自身不等于已经完成外扩。"\n    boundary:\n      cannot:\n        - "不能写成已经控制整层或整栋"\n        - "不能默认附带供暖、防线、治理全部同步外扩"\n        - "不能把原点写成现成地盘"\n    writing_contract:\n      must_avoid:\n        - "避免把锚点写成自动永久安全区"\n        - "避免跳过从房间向外推进的过程"\n\n  energy.load_dispatch_t2:\n    name: "⚙️负载调度网T2"\n    category: 能源\n    unlock_level: 2\n    system_line: energy\n    tier: 2\n    growth_target: 建立核心区的配电优先级与热量预算。\n    player_advantage: 能把有限能源用在刀刃上，夜间和紧急状态更稳。\n    insufficiency: 仍然没有多余冗余，错配和超载会快速拖垮系统。\n    desc: 对核心区供暖与配电进行优先级调度，减少浪费并提升关键时段稳定性。\n    effects: [配电优先级, 热量预算]\n    balance:\n      cost: 低\n      limit: 仍受总负荷限制\n    upkeep:\n      - 调度错误会放大波动\n    summary:\n      prompt_brief: "可对核心区供暖与配电进行优先级调度，减少浪费并提升关键时段稳定性；仍受总负荷限制，无法像充裕能源那样随意开机。"\n    boundary:\n      cannot:\n        - "不能写成能源彻底充裕"\n        - "不能写成开多少系统都不会超载"\n        - "不能把调度优化写成新增大量能源"\n    writing_contract:\n      must_avoid:\n        - "避免把节流写成扩容"\n        - "避免忽略错配和超载风险"\n\n  security.nearfield_watch_t2:\n    name: "🔍门外近域观察T2"\n    category: 安全\n    unlock_level: 2\n    system_line: security\n    tier: 2\n    growth_target: 把感知从门内推进到门外和短距走廊。\n    player_advantage: 能识别尾随、伏击、走廊短时风险，不再完全被动挨打。\n    insufficiency: 只能看见近域，不是全楼监控，也不保证情报绝对准确。\n    desc: 对门外和短距走廊进行近域观察与风险预估，辅助接触、避让和拦截。\n    effects: [近域观察, 风险预估]\n    balance:\n      cost: 低\n      limit: 仅覆盖近距\n    summary:\n      prompt_brief: "可对门外和短距走廊进行近域观察与风险预估，辅助判断接触、避让和拦截；只覆盖近距，不是全楼监控。"\n    boundary:\n      cannot:\n        - "不能写成整层实时监控"\n        - "不能写成情报绝对准确、无盲区"\n        - "不能把近域观察写成远距追踪"\n    writing_contract:\n      must_avoid:\n        - "避免写成全图视野"\n        - "避免省略噪声、遮挡和误判"\n\n  sustain.hygiene_medical_t2:\n    name: "🧼卫生医疗闭环T2"\n    category: 维生\n    unlock_level: 2\n    system_line: sustain\n    tier: 2\n    growth_target: 建立基础消杀、轻伤处理与失温/感染处置流程。\n    player_advantage: 轻伤病不再等于连锁崩盘，收容一个伤员也有了现实基础。\n    insufficiency: 只能处理基础和轻中度问题，重伤与多人救治仍会迅速超载。\n    desc: 建立基础消杀、轻伤处理与失温感染处置流程，让核心区具备最小医疗闭环。\n    effects: [基础消杀, 轻伤处理, 感染控制]\n    balance:\n      cost: 中\n      limit: 仅能处理轻中度问题\n    upkeep:\n      - 依赖基础耗材和轮值照护\n    summary:\n      prompt_brief: " n    tier: 3\n    growth_target: 从“保住几个人”升级为“能维持一个小群体”。\n    player_advantage: 可以处理多人的基础照料、轻伤病与配给波动。\n    insufficiency: 人口一多、病情一重、回收一断，系统仍会迅速吃紧。\n    desc: 对小规模群体提供配给、照料与基础伤病维持，支撑共同体雏形。\n    effects: [小群体配给, 伤病维持]\n    balance:\n      cost: 中\n      limit: 承载上限不高\n    upkeep:\n      - 对轮值与配给制度依赖明显\n    summary:\n      prompt_brief: "可对小规模群体提供配给、照料与基础伤病维持，支撑最初的共同体雏形；承载上限不高，超量很快会引发系统吃紧。"\n    boundary:\n      cannot:\n        - "不能写成可以轻松养活大批人口"\n        - "不能写成多人伤病也不会超载"\n        - "不能把雏形共同体写成稳定大据点"\n    writing_contract:\n      must_avoid:\n        - "避免把共同体雏形写成成熟福利体系"\n        - "避免忽略人口和伤病的连锁压力"\n\n  life.community_rhythm_t3:\n    name: "🎬影音休憩厅T3"\n    category: 生活\n    unlock_level: 3\n    system_line: life\n    tier: 3\n    growth_target: 让庇护所第一次拥有能让人主动停留的娱乐空间。\n    player_advantage: 可以提供小型影院、音乐播放和柔性沙发休憩区，让角色们第一次因为舒服和好玩而想进入庇护所。\n    insufficiency: 仍只是小体量娱乐厅，谈不上高规格沉浸体验，也无法覆盖所有人的口味。\n    desc: 建立小型影音休憩厅，整合投影、音乐播放、柔性座椅与暖光氛围。\n    effects: [小型影院, 音乐播放, 休憩吸附]\n    balance:\n      cost: 中\n      limit: 体量有限且内容有限\n    summary:\n      prompt_brief: "可在庇护所内提供小型影院、音乐播放与休憩厅，让角色们第一次因为舒服和好玩而想主动留下；体量仍小，离高规格娱乐还很远。"\n    boundary:\n      cannot:\n        - "不能写成从3级开始就拥有顶级影院与大型娱乐场"\n        - "不能写成只靠休憩厅就能消除所有压力和冲突"\n        - "不能把基础娱乐写成旧世界完整复现"\n    writing_contract:\n      must_avoid:\n        - "避免把小型娱乐厅写成综合乐园"\n        - "避免忽略不同角色对娱乐内容的偏好差异"\n\n  social.admission_protocol_t3:\n    name: "📼场景回放台T3"\n    category: 社交\n    unlock_level: 3\n    system_line: social\n    tier: 3\n    growth_target: 让主角第一次能回放短时段内的关键场景，建立证据与判断优势。\n    player_advantage: 可以回看近域里刚发生的对话、动作和冲突片段，在谈判、责问和筛选对象时更占主动。\n    insufficiency: 回放窗口很短，且只能调取已记录区域，不能回溯整层过去。\n    desc: 对近域记录进行短时回放，重看关键对话、肢体动作和冲突前后片段。\n    effects: [短时回放, 证据片段, 判断优势]\n    balance:\n      cost: 中\n      limit: 回放窗口短且仅限已记录区域\n    summary:\n      prompt_brief: "可回放近域里刚发生的对话、动作和冲突片段，让主角在谈判、责问和筛选对象时更占主动；回放窗口很短，只限已记录区域。"\n    boundary:\n      cannot:\n        - "不能写成任意时间任意地点的全量回溯"\n        - "不能写成从回放中直接获得完整真相"\n        - "不能把短时回放写成时空回溯神迹"\n    writing_contract:\n      must_avoid:\n        - "避免把回放台写成无上限录像库"\n        - "避免忽略记录盲区和信息缺帧"\n\n  expansion.floor20_anchor_t3:\n    name: "🏢20层庇护节点T3"\n    category: 开拓\n    unlock_level: 3\n    system_line: expansion\n    tier: 3\n    growth_target: 让20层少量房间第一次进入庇护半径。\n    player_advantage: 你开始拥有门外可经营的点位，而不是只有一个房间。\n    insufficiency: 名额有限，维护困难，任何外扩都要付出真实成本。\n    desc: 将20层少量房间纳入初级庇护半径，形成最早的门外据守节点。\n    effects: [少量外扩节点, 初级庇护半径]\n    balance:\n      cost: 中\n      limit: 名额有限\n    summary:\n      prompt_brief: "可将20层少量房间纳入初级庇护半径，形成最早的门外据守节点；名额和维护能力都有限，无法一口气铺开整层。"\n    boundary:\n      cannot:\n        - "不能写成整层尽入掌握"\n        - "不能写成外扩节点毫无维护成本"\n        - "不能把据守点写成稳定治理区"\n    writing_contract:\n      must_avoid:\n        - "避免把点状节点写成整层控制权"\n        - "避免忽略名额和维护上限"\n\n  energy.floor_budget_t4:\n    name: "📊楼层能耗预算T4"\n    category: 能源\n    unlock_level: 4\n    system_line: energy\n    tier: 4\n    growth_target: 让楼层节点供能进入可管理状态，而不是临时拼命顶住。\n    player_advantage: 可以在多节点之间做真实调度，支持外部控制区维持。\n    insufficiency: 每次扩节点都意味着更高天气、人力、维护压力。\n    desc: 对20层多个节点的供暖与供能做预算调度，支持局部控制区稳定维持。\n    effects: [多节点调度, 控制区维持]\n    balance:\n      cost: 中\n      limit: 外扩越多压力越高\n    summary:\n      prompt_brief: "可对20层多个节点的供暖与供能做预算调度，支持局部控制区稳定维持；外扩越多，系统越容易因天气和负载吃紧。"\n    boundary:\n      cannot:\n        - "不能写成多节点供能后就进入高冗余时代"\n        - "不能写成天气和外扩不再重要"\n        - "不能把预算调度写成区域能源霸权"\n    writing_contract:\n      must_avoid:\n        - "避免把多节点调度写成全域稳态"\n        - "避免忽略扩张与能耗的线性压力"\n\n  security.floor_awareness_t4:\n    name: "👁️楼层威胁感知T4"\n    category: 安全\n    unlock_level: 4\n    system_line: security\n    tier: 4\n    growth_target: 让你第一次能对20层进行中距离预警和威胁排序。\n    player_advantage: 可以主动判断哪块危险点先清、哪类人该接触、哪类人该拦截。\n    insufficiency: 不是全知视角，恶劣环境和复杂局势仍会制造误判。\n    desc: 对20层局部进行中距离预警、威胁评分与风险排序，辅助决定行动优先级。\n    effects: [中距预警, 威胁排序]\n    balance:\n      cost: 中\n      limit: 并非全知\n    summary:\n      prompt_brief: "可对20层局部进行中距离预警、威胁评分与风险排序，辅助决定接触、避让和清理优先级；并非全知，误判仍会存在。"\n    boundary:\n      cannot:\n        - "不能写成楼层全知视角"\n        - "不能写成永远不会误判和漏判"\n        - "不能把局部感知写成整栋掌控"\n    writing_contract:\n      must_avoid:\n        - "避免把预警写成神谕"\n        - "避免忽略环境与人心的不确定性"\n\n  sustain.multi_patient_support_t4:\n    name: "🏥多人维持支持T4"\n    category: 维生\n    unlock_level: 4\n    system_line: sustain\n    tier: 4\n    growth_target: 让庇护所能承接更复杂的伤病和更多的基础配给需求。\n    player_advantage: 可以开始稳定承托一个小共同体，而不是一两名个体。\n    insufficiency: 药品、食物、净化和照护都开始进入真实瓶颈管理。\n    desc: 为一个小共同体提供更稳定的配给、净化、药品与基础照护。\n    effects: [多人照护, 稳定配给]\n    balance:\n      cost: 中\n      limit: 长期承压明显\n    upkeep:\n      - 药品、照护和净化压力同步增长\n    summary:\n      prompt_brief: "可为一个小共同体提供更稳定的配给、净化、药品与基础照护，承托多人持续生存；系统会在药品、食物和照护负荷上持续承压。"\n    boundary:\n      cannot:\n        - "不能写成多人长期照护没有瓶颈"\n        - "不能写成大规模共同体也可轻松兜住"\n        - "不能忽略药品和照护资源消耗"\n    writing_contract:\n      must_avoid:\n        - "避免把小共同体承托写成成熟福利国家"\n        - "避免省略维持多人时的管理压力"\n\n  life.civil_buffer_t4:\n    name: "🎤舞台酒廊T4"\n    category: 生活\n    unlock_level: 4\n    system_line: life\n    tier: 4\n    growth_target: 让庇护所第一次出现可以表演、聚会和展示魅力的生活舞台。\n    player_advantage: 可以提供小型舞台、酒廊氛围与社交娱乐空间，让角色在这里唱歌、跳舞、放松、取悦或竞争关注。\n    insufficiency: 仍只是局部生活场景，不可能用一个舞台解决所有情绪创伤和人际矛盾。\n    desc: 打造带舞台与酒廊氛围的生活区，让表演、聚会和社交娱乐成为庇护所的一部分。\n    effects: [小型舞台, 酒廊氛围, 魅力展示]\n    balance:\n      cost: 中\n      limit: 仅是局部娱乐生活场景\n    summary:\n      prompt_brief: "可在庇护所内提供小型舞台和酒廊氛围，让角色在这里表演、放松、取悦或竞争关注，进一步强化这里的生活吸引力；这仍只是局部生活场景，不能化解所有矛盾。"\n    boundary:\n      cannot:\n        - "不能写成一个舞台就把庇护所变成完整繁华夜生活区"\n        - "不能写成舞台活动天然带来绝对忠诚"\n        - "不能把局部娱乐空间写成区域统治力本身"\n    writing_contract:\n      must_avoid:\n        - "避免把舞台酒廊写成乌托邦夜总会"\n        - "避免忽略表演、关注与争宠也会制造矛盾"\n\n  social.contact_trade_window_t4:\n    name: "💞情绪画像库T4"\n    category: 社交\n    unlock_level: 4\n    system_line: social\n    tier: 4\n    growth_target: 把碎片情报升级为人物情绪与偏好画像，形成稳定的情感优势。\n    player_advantage: 可以更快判断角色的软肋、偏好、恐惧和讨好点，在交易、收容与暧昧互动中更容易拿到高质量反馈。\n    insufficiency: 画像依赖持续观察和样本积累，初次接触的人物仍可能误判。\n    desc: 为接触对象沉淀情绪、偏好、恐惧和关系反应画像，强化后续互动的命中率。\n    effects: [偏好画像, 恐惧标签, 情感先手]\n    balance:\n      cost: 中\n      limit: 依赖持续观察与样本积累\n    summary:\n      prompt_brief: "可为接触对象建立情绪、偏好与恐惧画像，让主角在交易、收容与情感互动中获得明显优势；画像依赖持续观察，初次接触仍可能误判。"\n    boundary:\n      cannot:\n        - "不能写成一眼看透所有人内心"\n        - "不能写成画像永远正确、永不变化"\n        - "不能把情绪画像写成对他人的绝对控制"\n    writing_contract:\n      must_avoid:\n        - "避免把画像库写成读心数据库"\n        - "避免忽略角色状态会随事件变化"\n\n  expansion.floor20_control_zone_t4:\n    name: "🗺️20层控制区T4"\n    category: 开拓\n    unlock_level: 4\n    system_line: expansion\n    tier: 4\n    growth_target: 让20层局部从“可去”升级为“可经营、可保、可纳管”。\n    player_advantage: 你第一次拥有真正可经营的门外控制区。\n    insufficiency: 控制区仍是局部点状，无法默认整层都被你掌控。\n    desc: 在20层形成局部控制区，支撑供能、防线、配给与接触的联动经营。\n    effects: [控制区经营, 局部纳管]\n    balance:\n      cost: 中\n      limit: 控制区仍是点状和局部的\n    summary:\n      prompt_brief: "可在20层形成局部控制区，支撑供能、防线、配给与接触的联动经营；控制区是点状和局部的，不等于整层尽入掌握。"\n    boundary:\n      cannot:\n        - "不能写成整层完整控制权"\n        - "不能写成控制区自带绝对稳定"\n        - "不能把局部经营写成区域统治"\n    writing_contract:\n      must_avoid:\n        - "避免把局部控制区写成全楼地盘"\n        - "避免忽略控制区外的危险和真空"\n\n  energy.anchor_network_t5:\n    name: "🔋锚点供能网络T5"\n    category: 能源\n    unlock_level: 5\n    system_line: energy\n    tier: 5\n    growth_target: 让核心区与楼层节点形成稳定维持网络。\n    player_advantage: 你开始拥有真正的多点稳态运转能力。\n    insufficiency: 负荷、天气、人口和扩张速度都会决定网络是否掉线。\n    desc: 让核心区与20层节点形成稳定供能与维持网络，支撑更长时间的多点运转。\n    effects: [多点稳态运转, 网络供能]\n    balance:\n      cost: 高\n      limit: 网络仍受负荷与天气制约\n    summary:\n      prompt_brief: "可让核心区与20层节点形成稳定供能与维持网络，支撑更长时间的多点运转；网络仍受负荷、天气和人口结构制约。"\n    boundary:\n      cannot:\n        - "不能写成高阶稳态后就不再有能源压力"\n        - "不能写成想扩到哪就扩到哪"\n        - "不能把楼层网络写成跨层成熟体系"\n    writing_contract:\n      must_avoid:\n        - "避免把稳定网络写成无限网络"\n        - "避免忽略网络掉线与维护成本"\n\n  security.rapid_response_t5:\n    name: "🚨快速响应防线T5"\n    category: 安全\n    unlock_level: 5\n    system_line: security\n    tier: 5\n    growth_target: 让防线从“单点防住”成长为“局部区域能守住”。\n    player_advantage: 可以对走廊、节点和控制区进行更快的防守、修补和压制响应。\n    insufficiency: 仍然无法把整个楼层写成自动清场和完全支配的区域。\n    desc: 对20层控制区进行快速防守、修补和局部压制响应，让你守住的是一片区域而不只是一个门。\n    effects: [快速防守, 局部压制, 防线修补]\n    balance:\n      cost: 高\n      limit: 仍非整层自动清场\n    summary:\n      prompt_brief: "可对20层控制区进行快速防守、修补和局部压制响应，让你守住的是一片区域而不只是一个门；仍然不能视作整层自动清场。"\n    boundary:\n      cannot:\n        - "不能写成整层自动清场系统"\n        - "不能写成对所有敌对力量都绝对压制"\n        - "不能把区域防线写成楼栋级支配权"\n    writing_contract:\n      must_avoid:\n        - "避免把区域防线写成无敌领域"\n        - "避免忽略反扑、报复和连续冲突压力"\n\n  sustain.community_support_t5:\n    name: "🥣共同体维持体系T5"\n    category: 维生\n    unlock_level: 5\n    system_line: sustain\n    tier: 5\n    growth_target: 支撑稳定人口、配给、基础药物和持续照护。\n    player_advantage: 你终于能“养共同体”，而不是只能救人后继续超载。\n    insufficiency: 一旦人口结构失衡或补给中断，系统仍会连锁出问题。\n    desc: 支撑稳定人口的配给、基础药物、照护与日常生存，让庇护所真正进入共同体维持阶段。\n    effects: [稳定人口配给, 持续照护]\n    balance:\n      cost: 高\n      limit: 人口结构失衡会引发连锁问题\n    population_dependency:\n      - 多活一个人也是负荷与资本的双重增加\n    summary:\n      prompt_brief: "可支撑稳定人口的配给、基础药物、照护与日常生存，让庇护所真正进入共同体维持阶段；人口结构失衡和补给断裂仍会引发连锁问题。"\n    boundary:\n      cannot:\n        - "不能写成稳定人口后就进入无限供养"\n        - "不能写成补给断裂也不会出事"\n        - "不能把共同体维持写成大规模城市保障"\n    writing_contract:\n      must_avoid:\n        - "避免把共同体维持写成无代价福利"\n        - "避免忽略人口结构和补给链的核心地位"\n\n  life.settlement_identity_t5:\n    name: "♨️恒温享乐层T5"\n    category: 生活\n    unlock_level: 5\n    system_line: life\n    tier: 5\n    growth_target: 让庇护所的生活品质从舒适升级为让人上瘾的末日稀缺享受。\n    player_advantage: 热水浴、柔软寝具、精致餐饮角和稳定娱乐被整合为一层，角色会明显意识到住进来等于得到外界完全没有的生活。\n    insufficiency: 享乐感越强，越会引发依赖、嫉妒与争夺，不能默认所有人因此就忠诚。\n    desc: 整合热浴、软寝具、精致餐饮角与稳定娱乐为恒温享乐层，首次形成系统性的末日奢侈生活。\n    effects: [热浴享乐, 精致起居, 强吸附生活]\n    balance:\n      cost: 高\n      limit: 会引发依赖与争夺\n    upkeep:\n      - 高品质生活设施需要持续水热与物资投入\n    summary:\n      prompt_brief: "可将热水浴、舒适寝具、精致餐饮角和稳定娱乐整合成恒温享乐层，让角色明显意识到住进来等于得到外界完全没有的生活；这会引发依赖与争夺，不等于天然忠诚。"\n    boundary:\n      cannot:\n        - "不能写成享乐层一开所有角色就自动效忠"\n        - "不能写成高品质生活没有维护与分配压力"\n        - "不能把享乐层写成终局乐园"\n    writing_contract:\n      must_avoid:\n        - "避免把享乐感写成洗脑效果"\n        - "避免忽略奢侈体验会制造比较和嫉妒"\n\n  social.population_strata_t5:\n    name: "📈IMP共鸣加成T5"\n    category: 社交\n    unlock_level: 5\n    system_line: social\n    tier: 5\n    growth_target: 让庇护所第一次对角色好感与依赖形成系统级增益。\n    player_advantage: 在庇护所内被照料、娱乐、安抚和优待的角色，其IMP增长会得到稳定加成，主角第一次真正拥有情感经营红利。\n    insufficiency: 这只是加成，不是洗脑；越界、失信和羞辱依旧会让IMP大幅下跌。\n    desc: 通过环境安抚、舒适体验和情绪引导，为受庇护角色提供稳定的IMP增长加成。\n    effects: [IMP增长加成, 情感经营红利, 安抚加成]\n    balance:\n      cost: 高\n      limit: 不能抵消越界行为的负面IMP后果\n    population_dependency:\n      - 需要角色持续接受庇护与正向互动才能吃满加成\n    summary:\n      prompt_brief: "可让在庇护所内被照料、娱乐和优待的角色获得稳定的IMP增长加成，使主角第一次真正拥有情感经营红利；这不是洗脑，越界和失信依旧会让IMP大幅下跌。"\n    boundary:\n      cannot:\n        - "不能写成从此所有角色IMP只涨不跌"\n        - "不能写成加成会无视边界、羞辱和背叛"\n        - "不能把IMP加成写成绝对服从开关"\n    writing_contract:\n      must_avoid:\n        - "避免把IMP系统写成魅惑术"\n        - "避免忽略越界行为仍会造成强烈负反馈"\n\n  expansion.floor20_governance_zone_t5:\n    name: "🏙️20层治理区T5"\n    category: 开拓\n    unlock_level: 5\n    system_line: expansion\n    tier: 5\n    growth_target: 让20层从控制点升级为可稳定经营、收编和接管的治理区。\n    player_advantage: 你第一次拥有真正意义上的门外地盘。\n    insufficiency: 这只是楼层级治理的起点，更大的地盘会带来更系统性的反扑与消耗。\n    desc: 让20层形成稳定治理区，支撑控制、收编、纳管与持续经营。\n    effects: [楼层治理区, 收编接管, 持续经营]\n    balance:\n      cost: 高\n      limit: 仅是楼层级治理起点\n    summary:\n      prompt_brief: "可让20层形成稳定治理区，支撑控制、收编、纳管与持续经营，意味着你第一次真正拥有门外地盘；这只是楼层级治理起点，不代表后续扩张没有代价。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼甚至片区已经完全归你"\n        - "不能写成治理区稳定后就没有反扑与消耗"\n        - "不能把楼层级地盘写成区域级秩序中心"\n    writing_contract:\n      must_avoid:\n        - "避免把第一次拥有地盘写成终局统治"\n        - "避免忽略收编、接管和维持的长期代价"\n\n  energy.crossfloor_spine_t6:\n    name: "⚡跨层供能脊线T6"\n    category: 能源\n    unlock_level: 6\n    system_line: energy\n    tier: 6\n    growth_target: 让20层核心区与19层前沿节点形成可调度的跨层供能关系。\n    player_advantage: 首次把庇护所从单层网络推进为立体系统，前沿节点真正能接上后方能力。\n    insufficiency: 跨层损耗、检修难度与故障连锁明显上升，不能把两层都写成同等稳定。\n    desc: 建立20层至19层的跨层供能脊线，为前沿据点、封锁点和临时收容位提供持续电热支持。\n    effects: [跨层供能, 前沿节点维持, 立体调度]\n    balance:\n      cost: 高\n      limit: 跨层损耗高且调度复杂\n    upkeep:\n      - 前沿节点越多，主干负荷越紧\n      - 故障会优先波及非核心节点\n    summary:\n      prompt_brief: "可建立20层至19层的跨层供能脊线，让前沿据点真正接上后方电热支持；跨层损耗和故障连锁明显上升，无法把多层都写成同等稳态。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼稳态满载供能"\n        - "不能写成跨层后仍然无损耗、无检修压力"\n        - "不能把前沿节点写成等同2001核心区的永久稳定区"\n    writing_contract:\n      must_avoid:\n        - "避免把跨层供能写成免费扩容"\n        - "避免忽略跨层主干一旦受损就会牵连前沿节点"\n\n  security.frontier_layers_t6:\n    name: "🧱前沿分层防线T6"\n    category: 安全\n    unlock_level: 6\n    system_line: security\n    tier: 6\n    growth_target: 让19层前沿节点与20层核心区形成分层预警和互相支援。\n    player_advantage: 防线从平面走廊变成立体网络，可以更早识别并拖住跨层威胁。\n    insufficiency: 这只是分层防守，不是整栋封控；前沿拉太长时仍会出现漏点和迟滞。\n    desc: 在20层核心区、楼梯口和19层前沿节点之间建立分层预警、封锁与撤回保护链。\n    effects: [跨层预警, 分层封锁, 撤回保护]\n    balance:\n      cost: 高\n      limit: 仍存在跨层盲点\n    upkeep:\n      - 前沿节点需要持续巡检与轮值\n    summary:\n      prompt_brief: "可在核心区、楼梯口与19层前沿节点之间建立分层预警和撤回保护链，让防线首次具备立体感；仍有跨层盲点，不能视作整栋封控。"\n    boundary:\n      cannot:\n        - "不能写成整栋楼自动封锁与无死角镇压"\n        - "不能写成所有跨层入侵都会被提前无损拦下"\n        - "不能把分层防线写成区域级绝对威慑"\n    writing_contract:\n      must_avoid:\n        - "避免把立体防线写成全图控制"\n        - "避免忽略前沿节点被持续试探后的疲劳与磨损"\n\n  sustain.midcare_supply_t6:\n    name: "🩺多点救治补给T6"\n    category: 维生\n    unlock_level: 6\n    system_line: sustain\n    tier: 6\n    growth_target: 让中级医疗和多点补给第一次能同时存在。\n    player_advantage: 可以扛住更复杂伤病与更多人口，不必每个伤员都往2001核心区挤。\n    insufficiency: 仍受耗材、护理人手和转运效率限制，复杂病例会迅速吃光冗余。\n    desc: 让核心区与前沿节点形成中级医疗、伤员转运和多点补给闭环，支撑跨层行动后的持续处理。\n    effects: [中级医疗, 多点补给, 伤员转运]\n    balance:\n      cost: 高\n      limit: 耗材与照护压力大\n    population_dependency:\n      - 需要稳定护理与搬运人手\n    summary:\n      prompt_brief: "可形成核心区与前沿节点之间的中级医疗、伤员转运和多点补给闭环，支撑跨层行动后的持续处理；耗材和护理压力很大，复杂病例仍会迅速超载。"\n    boundary:\n      cannot:\n        - "不能写成跨层体系一成形就等于大型医院"\n        - "不能写成复杂伤病和多人救治都能轻松兜住"\n        - "不能忽略耗材、人手与转运效率的硬限制"\n    writing_contract:\n      must_avoid:\n        - "避免把多点救治写成无代价扩容"\n        - "避免把中级医疗写成高阶奇迹治疗"\n\n  life.crossfloor_civil_order_t6:\n    name: "🌿跨层温室庭院T6"\n    category: 生活\n    unlock_level: 6\n    system_line: life\n    tier: 6\n    growth_target: 让庇护所第一次出现近似室外桃源的生活景观，而且能跨层延展。\n    player_advantage: 可以在核心区与前沿区之间维持温室庭院、暖光步道和仿户外休闲角，让人第一次觉得这里不像避难所，而像被保护起来的另一个世界。\n    insufficiency: 这种桃源感仍是人工维持的局部景观，覆盖范围有限，且非常吃能源与维护。\n    desc: 在跨层节点中建设温室庭院、暖光步道与仿户外休闲角，制造末日里极罕见的“室外感”生活区。\n    effects: [温室庭院, 暖光步道, 仿户外休闲]\n    balance:\n      cost: 高\n      limit: 范围有限且耗能极高\n    upkeep:\n      - 景观、温度与空气循环需要持续维护\n    summary:\n      prompt_brief: "可在核心区与前沿区之间维持温室庭院、暖光步道与仿户外休闲角，让人第一次觉得这里像被保护起来的室外桃源；范围有限且极其吃能源维护。"\n    boundary:\n      cannot:\n        - "不能写成跨层后就拥有无限延展的人工乐园"\n        - "不能写成前沿区也与核心区享受同等完整桃源体验"\n        - "不能把局部庭院写成真正征服了外部世界"\n    writing_contract:\n      must_avoid:\n        - "避免把温室庭院写成自然恢复奇迹"\n        - "避免忽略景观维护本身就是重负担"\n\n  social.multizone_protocol_t6:\n    name: "📡跨层监控网T6"\n    category: 社交\n    unlock_level: 6\n    system_line: social\n    tier: 6\n    growth_target: 把情报优势从近域观察升级为跨层全息监控与记录。\n    player_advantage: 可以跨20层与19层查看实时全息画面、调取重点区域记录，显著增强对目标、交易对象和内部成员的掌控。\n    insufficiency: 仍不是全知系统，只覆盖接入区域；盲区、断点和误读仍然存在。\n    desc: 将核心区、前沿点和楼层接口纳入跨层监控网，统一提供实时画面、重点记录与目标追踪。\n    effects: [跨层监控, 重点记录, 人物追踪]\n    balance:\n      cost: 高\n      limit: 仅覆盖接入区域\n    summary:\n      prompt_brief: "可跨20层与19层查看实时全息画面并调取重点区域记录，显著增强主角对目标、交易对象和内部成员的掌控；仍只覆盖接入区域，盲区和误读依旧存在。"\n    boundary:\n      cannot:\n        - "不能写成跨层监控后就没有任何信息死角"\n        - "不能写成想看谁就能看到谁的全部经历"\n        - "不能把监控网写成全地图情报支配"\n    writing_contract:\n      must_avoid:\n        - "避免把监控写成全知视角"\n        - "避免忽略接入范围、遮挡与数据缺口"\n\n  expansion.floor19_forward_anchor_t6:\n    name: "📍19层前沿锚点T6"\n    category: 开拓\n    unlock_level: 6\n    system_line: expansion\n    tier: 6\n    growth_target: 让19层正式成为可经营、可防守、可收编的前沿据点，而不是一次性踏板。\n    player_advantage: 跨层扩张第一次有现实落脚点，可以布局前沿、试探收编路线。\n    insufficiency: 前沿锚点仍然脆弱，守住它就意味着承担更长补给线和更高冲突密度。\n    desc: 在19层建立正式前沿锚点，支撑前哨据守、节点经营和跨层收编路线。\n    effects: [19层前沿据点, 收编路线, 跨层落脚点]\n    balance:\n      cost: 高\n      limit: 前沿补给线长且冲突密度高\n    summary:\n      prompt_brief: "可在19层建立正式前沿锚点，让跨层扩张第一次有现实落脚点，并开始试探收编路线；前沿补给线更长、冲突更密，仍远不是稳定地盘。"\n    boundary:\n      cannot:\n        - "不能写成19层一落锚就等于整层完全归你"\n        - "不能写成前沿据点天然稳固、不会被切断"\n        - "不能把跨层落脚点写成区域级治理中心"\n    writing_contract:\n      must_avoid:\n        - "避免把前沿锚点写成终局据点"\n        - "避免忽略前沿补给和轮值带来的持续消耗"\n\n  energy.expedition_support_t7:\n    name: "🔋外勤能源包线T7"\n    category: 能源\n    unlock_level: 7\n    system_line: energy\n    tier: 7\n    growth_target: 让庇护所能源第一次能稳定支持短程外勤反复出动。\n    player_advantage: 外勤装备、临时保温和返程补能开始连成一条链，内部优势可以被带出门外。\n    insufficiency: 回收和补能压力显著增加，外勤距离与频次仍受严格限制。\n    desc: 形成外勤装备供能、临时保温和返程补能链，支撑短程外勤的反复出动与回收。\n    effects: [外勤供能, 临时保温, 返程补能]\n    balance:\n      cost: 高\n      limit: 回收与补能压力显著\n    upkeep:\n      - 高频出动会压缩内部冗余\n      - 返程失败会让损失成倍放大\n    summary:\n      prompt_brief: "可形成外勤装备供能、临时保温和返程补能链，让短程外勤能反复出动并把内部优势投射到门外；回收和补能压力显著增加，距离与频次仍受严格限制。"\n    boundary:\n      cannot:\n        - "不能写成能源支持一成形就可全天候远征"\n        - "不能写成外勤装备永不掉线、永不回收"\n        - "不能把短程外勤支撑写成跨区域投送能力"\n    writing_contract:\n      must_avoid:\n        - "避免把外勤包线写成无限续航"\n        - "避免忽略返程、补能和回收失败的代价"\n\n  security.outer_ring_patrol_t7:\n    name: "🚨外围机动警戒T7"\n    category: 安全\n    unlock_level: 7\n    system_line: security\n    tier: 7\n    growth_target: 让警戒从楼内前沿推进到楼体外围与短程外勤撤回线。\n    player_advantage: 可以更早发现接近威胁，并为外勤队伍提供撤回保护和机动防守。\n    insufficiency: 外围警戒仍不是控场霸权，遭遇复杂包夹或极端天气时照样可能被压穿。\n    desc: 建立楼体外围、撤回线和临时外勤点之间的机动警戒与撤退掩护体系。\n    effects: [外围警戒, 撤回掩护, 机动防守]\n    balance:\n      cost: 高\n      limit: 复杂地形和天气会削弱效果\n    upkeep:\n      - 需要持续巡逻与情报更新\n    summary:\n      prompt_brief: "可建立楼体外围、撤回线和临时外勤点之间的机动警戒与掩护体系，让外勤不再完全裸奔；复杂地形和极端天气仍会让外围警戒失效。"\n    boundary:\n      cannot:\n        - "不能写成外出后全程绝对安全"\n        - "不能写成外围警戒就等于区域完全封锁"\n        - "不能把机动防守写成主动清场与无伤镇压"\n    writing_contract:\n      must_avoid:\n        - "避免把外围警戒写成全面统治"\n        - "避免忽略天气、死角和持续巡逻的疲劳成本"\n\n  sustain.field_recovery_chain_t7:\n    name: "⛑️外勤回收救护T7"\n    category: 维生\n    unlock_level: 7\n    system_line: sustain\n    tier: 7\n    growth_target: 建立外勤医疗、临时补给和返程救护的专用链路。\n    player_advantage: 可显著降低外出任务中的可避免死亡，让资源与伤员都有更高回收率。\n    insufficiency: 对致命创伤只能争取时间，不能把外勤风险写成可随意承受。\n    desc: 为外勤队伍配置急救、保温、补水和返程救护流程，提升任务后的存活与回收效率。\n    effects: [外勤急救, 返程救护, 回收效率]\n    balance:\n      cost: 高\n      limit: 对致命创伤仅能争取时间\n    population_dependency:\n      - 需要训练过的外勤照护人员\n    summary:\n      prompt_brief: "可为外勤队伍建立急救、保温、补水和返程救护流程，显著提升任务后的存活与回收效率；对致命创伤只能争取时间，外勤风险依然真实。"\n    boundary:\n      cannot:\n        - "不能写成外勤后送体系一成形就不再死人"\n        - "不能写成补给与急救无限、无冷却"\n        - "不能忽略外勤照护人员与耗材本身也会被拖垮"\n    writing_contract:\n      must_avoid:\n        - "避免把回收救护写成无上限保险"\n        - "避免省略训练、人手和耗材的门槛"\n\n  life.reentry_recovery_loop_t7:\n    name: "🍿旧世界影院T7"\n    category: 生活\n    unlock_level: 7\n    system_line: life\n    tier: 7\n    growth_target: 让庇护所第一次能高质量复现旧世界的文化娱乐体验。\n    player_advantage: 可以提供高质量影院、沉浸音响和精选旧世界影像，让角色在末日里重新体验文明记忆，这会极大增强庇护所吸引力。\n    insufficiency: 影院只能带来短时沉浸，不能真正把人带回旧世界，且怀旧也可能触发失落与情绪波动。\n    desc: 建设高质量旧世界影院，以沉浸音响和精选影像重建文明时代的文化娱乐体验。\n    effects: [高质量影院, 沉浸音响, 文明怀旧]\n    balance:\n      cost: 高\n      limit: 只能提供短时沉浸体验\n    summary:\n      prompt_brief: "可提供高质量影院、沉浸音响与精选旧世界影像，让角色在末日里重新体验文明记忆，极大增强庇护所吸引力；这只能带来短时沉浸，无法真正回到旧世界。"\n    boundary:\n      cannot:\n        - "不能写成影院一开就治愈所有创伤"\n        - "不能写成旧世界影像等同真实世界回归"\n        - "不能把文化娱乐写成无代价精神统治工具"\n    writing_contract:\n      must_avoid:\n        - "避免把影院写成精神治疗万能药"\n        - "避免忽略怀旧也会激起失落和脆弱"\n\n  social.external_contact_channels_t7:\n    name: "📺谈判直播台T7"\n    category: 社交\n    unlock_level: 7\n    system_line: social\n    tier: 7\n    growth_target: 让情报优势可以被主动展示和利用，变成交易与心理压制工具。\n    player_advantage: 可以向对手或交易对象定向展示实时全息直播、精选证据与环境画面，在谈判时制造更强的情报压迫与情绪优势。\n    insufficiency: 暴露得越多，被反向分析和渗透的风险也越高，不能把直播展示当成无代价压制。\n    desc: 在谈判中调用直播台，定向投放实时画面、证据切片与场景展示，放大心理压力与情绪优势。\n    effects: [证据展示, 定向直播, 心理压迫]\n    balance:\n      cost: 高\n      limit: 展示越多越有反向暴露风险\n    summary:\n      prompt_brief: "可向对手或交易对象定向展示实时全息直播、精选证据与环境画面，在谈判时制造更强的情报压迫与情绪优势；展示越多，被反向分析和渗透的风险也越高。"\n    boundary:\n      cannot:\n        - "不能写成直播展示一出对方就必然屈服"\n        - "不能写成你可以无代价展示所有底牌"\n        - "不能把谈判直播写成区域级绝对话语权"\n    writing_contract:\n      must_avoid:\n        - "避免把展示优势写成强制洗脑"\n        - "避免忽略暴露底牌后的反制与渗透风险"\n\n  expansion.outfield_route_t7:\n    name: "🗺️短程外拓路线T7"\n    category: 开拓\n    unlock_level: 7\n    system_line: expansion\n    tier: 7\n    growth_target: 让楼层网络第一次真正伸出楼外，形成短程外拓路线。\n    player_advantage: 外部安全点、补给点和可争夺节点开始进入你的实际行动半径。\n    insufficiency: 路线只是可用，不是稳固；任何一次断线、暴雪或伏击都可能把优势打回楼内。\n    desc: 建立从楼层网络通向楼外安全点、补给点和争夺节点的短程外拓路线。\n    effects: [楼外路线, 外部补给点, 可争夺节点]\n    balance:\n      cost: 高\n      limit: 路线稳定性受天气和敌意影响\n    summary:\n      prompt_brief: "可建立通向楼外安全点、补给点和争夺节点的短程外拓路线，让庇护所第一次真正伸出楼外；路线并不稳固，断线、暴雪和伏击都可能把优势打回楼内。"\n    boundary:\n      cannot:\n        - "不能写成路线一开就等于周边都归你"\n        - "不能写成外部节点会自动长期安全"\n        - "不能把短程外拓路线写成成熟区域交通网"\n    writing_contract:\n      must_avoid:\n        - "避免把路线建立写成征服完成"\n        - "避免忽略天气、伏击和线路维护的长期成本"\n\n  energy.area_grid_advantage_t8:\n    name: "⚙️区域能源优势T8"\n    category: 能源\n    unlock_level: 8\n    system_line: energy\n    tier: 8\n    growth_target: 让多节点运转不再只是勉强维持，而是开始形成局部能源优势。\n    player_advantage: 你能更稳定地维持多点开机、多区供暖和关键节点连续运行。\n    insufficiency: 这是局部优势，不是无限能源；极端天气和错误调度仍可能把整个网络拖入波动。\n    desc: 将楼层网络、外勤补能点和前沿据点纳入更稳定的区域级能源调度体系。\n    effects: [多节点稳态, 区域供能优势, 连续运行]\n    balance:\n      cost: 极高\n      limit: 极端天气和误调度仍会引发波动\n    upkeep:\n      - 网络越大，检修窗口越珍贵\n    summary:\n      prompt_brief: "可把楼层网络、外勤补能点和前沿据点纳入更稳定的区域级能源调度体系，开始形成局部能源优势；这仍不是无限能源，极端天气和误调度照样会拖垮网络。"\n    boundary:\n      cannot:\n        - "不能写成多节点稳态就等于能源无上限"\n        - "不能写成所有区域都可长期满负荷运行"\n        - "不能把局部能源优势写成全地图能源统治"\n    writing_contract:\n      must_avoid:\n        - "避免把区域调度写成无脑常开"\n        - "避免忽略检修窗口和误调度的系统代价"\n\n  security.zone_control_grid_t8:\n    name: "🛡️控面防守网络T8"\n    category: 安全\n    unlock_level: 8\n    system_line: security\n    tier: 8\n    growth_target: 让防守从守点正式转入控面，建立区域级联动反应能力。\n    player_advantage: 可以组织主动压制、局部围堵和区域防守，真正开始主导一片区域的冲突节奏。\n    insufficiency: 你能控面，不等于能抹去所有威胁；多点同时爆发仍会把反应链条拉满。\n    desc: 把楼层核心、楼外路线和关键节点接入同一套控面预警、围堵和支援网络。\n    effects: [控面预警, 主动压制, 区域防守]\n    balance:\n      cost: 极高\n      limit: 多点同时爆发会压垮反应链条\n    upkeep:\n      - 需要持续情报喂养和轮换值守\n    summary:\n      prompt_brief: "可把楼层核心、楼外路线和关键节点接入同一套控面预警与支援网络，真正开始主导一片区域的冲突节奏；多点同时爆发仍会压垮反应链条。"\n    boundary:\n      cannot:\n        - "不能写成一旦控面就无须再担心反扑"\n        - "不能写成区域防守等于区域清场"\n        - "不能把局部控面写成整栋楼乃至片区绝对镇压"\n    writing_contract:\n      must_avoid:\n        - "避免把控面写成无敌领域"\n        - "避免省略多点同时爆发时的反应上限"\n\n  sustain.large_scale_supply_t8:\n    name: "🍲规模供给体系T8"\n    category: 维生\n    unlock_level: 8\n    system_line: sustain\n    tier: 8\n    growth_target: 稳定支撑更大人口与更复杂的配给结构。\n    player_advantage: 庇护所终于能像真正共同体那样处理多层级人口、伤病和资源分配。\n    insufficiency: 规模一大，浪费、腐败、错配与中断都会放大，不能把大体系写成自动顺滑。\n    desc: 建立覆盖多节点、多身份人口和多级配给的规模供给体系，提升对复杂共同体的承载力。\n    effects: [大人口配给, 复杂补给, 共同体承载]\n    balance:\n      cost: 极高\n      limit: 错配和中断会引发更大连锁反应\n    population_dependency:\n      - 需要稳定执行层和仓储调度能力\n    summary:\n      prompt_brief: "可建立覆盖多节点、多身份人口和多级配给的规模供给体系，让庇护所真正具备复杂共同体承载力；体系越大，错配、中断和内部消耗也会被同步放大。"\n    boundary:\n      cannot:\n        - "不能写成人口一多反而没有后勤难题"\n        - "不能写成规模体系天然杜绝浪费和腐败"\n        - "不能把共同体规模供给写成城市级无限后勤"\n    writing_contract:\n      must_avoid:\n        - "避免把规模供给写成自动化丰饶"\n        - "避免忽略仓储、调度和执行层的核心作用"\n\n  life.settlement_gradient_t8:\n    name: "🗺️折景旅游舱T8"\n    category: 生活\n    unlock_level: 8\n    system_line: life\n    tier: 8\n    growth_target: 让庇护所第一次能提供近似亲临旧世界的高阶折叠空间旅游体验。\n    player_advantage: 可以短时间带角色进入高拟真旧世界场景，像逛商场、海边、街区或节日夜景一样享受外界已不复存在的生活。\n    insufficiency: 体验时长有限、负荷极高，且再真实也只是折景，不是重新获得真正的世界。\n    desc: 通过折景旅游舱高拟真复现旧世界场景，提供近似亲临其境的短时奢侈体验。\n    effects: [旧世界折景, 高拟真旅游, 沉浸吸附]\n    balance:\n      cost:
