最舒适的温度，让您彻底隔绝外界的严寒。\n\n📡对外观察接口📡\n简介：位于玄关的集成系统，包含一块高清显示屏和一套双向通信设备。您可以安全地在室内与门外的访客对话，并通过遍布公寓楼内外的微型无人机（此时仅有监视功能）观察周边情况。\n\n📤单向物资投送仓📤\n简介：位于玄关墙壁上的一个小型投送装置。\n\n---\n### 庇护所等级 2: 安全掌控 (Secure & Control)\n\n\n---\n\n🌐数字天堂🌐\n简介：庇护所建立了一个独立的局域网络，并链接到一个存储着旧世界海量数据的服务器。您可以随时访问几乎所有的电影、电视剧、音乐、游戏和电子书籍。网络稳定，体验流畅，告别末世的枯燥乏味。\n\n👁️全天候侦察网络👁️\n简介：监视无人机群升级。增加了红外热成像与夜视功能，并扩大了侦察范围，覆盖整个小区。您现在可以更清晰、更全面地掌握周边所有幸存者的动态。\n\n🛰️“哨兵”预警系统🛰️\n简介：一套集成在侦察网络中的高级预警系统。当无人机侦测到任何潜在威胁（如大规模人群聚集、武器开火、异常热源）靠近庇护所一定范围时，系统会立即通过全息投影和语音向您发出警报，并提供实时战术分析。\n\n---\n### 庇护所等级 3: 奢华纪元 (Era of Luxury)\n简介: 您正式步入末日中的“帝王”生活。物质享受达到顶峰，基础的医疗保障也已到位，您的生存优势变得无可动摇。\n\n---\n💎万象合成终端：文明垄断💎\n简介：物质重组单元的质变进化。在外界仅能依靠冻土与雪水苟延残喘时，该终端允许您生产旧世界所有顶奢消耗品（如A5级和牛、限量版波尔多红酒、特制雪茄）。更重要的是，它能合成带有**“生物激素诱导”**属性的辅助品。在极寒末日，这种绝对的生存阶级差异，将让任何孤傲的校花或高冷的教师在生理与心理上彻底对您产生**“美食依附”**。\n\n👕环境织造机：第二层皮肤👕\n简介：超越传统物理隔离的生产单元。它能制造厚度仅如蝉翼、却能发射稳定“热场力”的特制纤维。这意味着角色在零下五十度的室内也能身着轻薄性感的旧时代衣物，彻底解放被臃肿冬装束缚的肉体。同时，织物内嵌的纳米触感传感器可由主控端调节，实现对穿着者**全天候的生理状态监控与微妙触觉反馈控制**。\n\n⚕️生化医疗站：基因进化⚕️\n简介：配备高精度纳米医疗阵列。除了彻底免疫感冒、发烧及雪晶初级感染外，它最核心的功能是**“基因修复与容颜常驻”**。它能通过内循环代谢调节，逆转末世极寒带来的皮肤粗燥、脱发与组织衰老，让庇护所内的女性保持甚至超越灾难前的巅峰美貌。在文明崩塌的世界，这种“永驻青春”的诱惑是您建立**女性顺从体系**的最强筹码。\n\n🛡️庇护范围同步协议🛡️\n简介：“伊甸”获得对整栋公寓环境管网的深度控制权。将部分公寓房间纳入【生存庇护范围】，为其同步供暖、通风与空气过滤。\n- 名额：20层可同步 3 个房间。\n- 效果：被同步房间成为“温暖而可呼吸”的据点\n- 限制：仅提供环境维持与基础生存保障，不等同于 2001 室的绝对安防\n\n🎭全息娱乐剧院🎭\n简介：在客厅区域激活一个全息投影舞台，配合环绕立体声系统，提供沉浸式的感官享受。\n\n---\n### 庇护所等级 4: 秩序武装 (Armament of Order)\n\n---\n🤖“看守者”自动巡逻机器人🤖\n简介：一种小型、静音的双足巡逻机器人，可在庇护所内部及门口走廊进行24小时不间断巡逻。配备非致命电击武器和摄像探头，能够自动驱离未经授权的闯入者，并将实时画面传回观察接口。\n\n🛡️庇护范围扩展·20层🛡️\n简介：环境管网的同步带宽提升，“伊甸”可同时维持更多房间的供暖与通风。\n- 名额：20层可同步 6 个房间。\n\n---\n### 庇护所等级 5: 追随者体系 (Follower System)\n简介: 您的权柄开始向外延伸。您现在有能力为您的忠诚追随者提供一个赖以生存的“家”，建立属于您的末日秩序。\n\n---\n🏘️独立生命维持模块：恩赐量化🏘️\n简介：每一间“伊甸荚舱”的氧气纯度、淡水流量、热量等级都由主控制室实时量化调节。这不再是宿舍，而是阶级划分的物理工具。您可以为表现优异的角色提供富氧环境和适宜湿度，而让忤逆者在稀薄寒冷的空气中进行“反省”。**“呼吸权”的配给**是您作为末日孤王对追随者施行的最高奖赏与惩戒。\n\n📊追随者监控矩阵：意志解析📊\n简介：通过内嵌于各区域的次声波扫描与生物电感应，实时量化角色的心理状态。系统不仅显示【忠诚度】和【健康值】，更能捕捉到潜意识中的【服从意愿】与【欲望波峰】。AI会精准提示您：谁正在进行危险的内心权衡，谁的道德枷锁正因饥饿而松动，谁正处于最适合被“标记”和“彻底占有”的生理周期。\n\n🌐全环境集成网络：上帝视角🌐\n简介：接入公寓内所有公共及私密区域的隐蔽采集终端。您能实时监听任何据点内的窃窃私语，观察角色在独处时的真实表情。通过亚音频引导技术，您甚至可以悄无声息地微调追随者的睡眠深度与梦境内容，从潜意识层面瓦解反抗意志，确立您的唯一主导权。\n\n🍽️集体餐饮合成器🍽️\n简介：扩展万象合成终端的功能，允许批量合成定制化的餐食。您可以预设菜单，系统将自动为所有追随者准备营养均衡、口味适宜的饭菜，并通过荚舱的投送系统分发，大幅减轻您的管理负担。\n\n🛡️庇护范围扩展·整层覆盖🛡️\n简介：对 20 层环境管网完成完全接管，同步效率与稳定性质变。\n- 名额：20层可同步 12 个房间（整层覆盖）。\n\n---\n### 庇护所等级 6: 武装力量 (Armed Force)\n简介: 您获得了真正意义上的致命武力，从一个富有的幸存者，转变为拥有武装力量的末日军阀。\n\n---\n🔬外科手术台🔬\n简介：初级医疗舱升级。新增一套全自动外科手术设备，能够处理更严重的伤势，如枪伤、骨折固定、阑尾炎切除等中等复杂度的外科手术，极大地提升了您和您追随者的生存率。\n\n🛡️庇护范围扩展·跨楼层🛡️\n简介：同步管网向下贯通，伊甸开始具备对 19 层房间的环境维持能力。\n- 名额：19层可同步 3 个房间（此后每提升 1 级再 +3，上限 12）。\n\n🎯战术训练模拟舱🎯\n简介：一个虚拟现实训练装置。您和您的卫队可以在完全安全的模拟环境中进行武器射击、小队配合、CQB战术等训练，快速提升实战能力，而无需消耗实际弹药或承担受伤风险。\n\n---\n### 庇护所等级 7: 远征准备 (Expedition Prep)\n简介: 庇护所开始为走出公寓、探索这个面目全非的世界做准备。\n\n---\n🚗“先驱者”载具制造单元🚗\n简介：庇护所内一个巨大的扩展区被解锁，成为载具车库。同时，您获得了一台载具制造器，能够生产第一代末日探索载具“先驱者-I”。这是一款具备全地形履带、密封增压驾驶室（可抵御雪晶腐蚀）、大容量储物空间和基础外部装甲的六轮探索车。\n\n🌡️外部环境分析仪🌡️\n简介：安装在载具和无人机上的高级传感器阵列。能够实时分析外部空气中的雪晶浓度、辐射水平、有毒气体成分，并预测局部天气变化，为您的远征提供至关重要的环境情报。\n\n---\n### 庇护所等级 8: 移动堡垒 (Mobile Fortress)\n简介: 质变的时刻。您的家不再被束缚于原地，它本身就成为了最强大的末日座驾。\n\n---\n⚙️动力驱动系统 Mk.I⚙️\n简介：庇护所底部伸出数条巨大的、如同蜈蚣般的节肢状液压驱动足。您的整个庇护所（公寓房间）现在可以从建筑结构上脱离，以缓慢但稳定的速度在城市废墟中移动，成为一个真正意义上的移动堡垒。\n\n💥重型军械库💥\n简介：军火熔炉升级。解锁了突击步枪、狙击步枪、霰弹枪和手榴弹等更具威力的武器制造权限，您的武装力量得到全面强化。\n\n⚖️内部重力稳定系统⚖️\n简介：在庇护所移动时，该系统能自动调节内部重力场，消除加速、减速、颠簸带来的不适感，确保内部人员如履平地。同时，它还能模拟不同的重力环境，用于训练或特殊实验。\n\n---\n### 庇护所等级 9: 完全自持 (Total Self-Sufficiency)\n简介: 庇护所进化为一座近乎完美的生态闭环方舟，其医疗科技已超越旧世界。\n\n---\n⚛️“创世纪”能源核心⚛️\n简介：庇护所的核心能源升级为一座微型、安全、零污染的聚变反应堆。它能提供近乎无限的庞大能源，足以支持所有系统（包括移动）高强度运行，并拥有巨大的能源冗余。\n\n🧬专家级自动医师🧬\n简介：外科手术台最终升级。新增的生物再生模块使其能够执行高难度的再生手术，如断肢再接续、受损器官修复等。理论上，只要大脑未死亡，任何非致命的物理损伤都可以被逆转。\n\n🌿生态循环农场🌿\n简介：一个利用先进水培和气培技术的室内垂直农场。它可以高效生产新鲜蔬菜、水果甚至小型粮食作物，不仅丰富了您的食谱，更实现了食物来源的完全自给，不依赖物质重组单元。\n\n---\n### 庇护所等级 10: 行走伊甸 (Walking Eden)\n简介: 您的庇护所已成为这个冰封星球上的奇迹，是行走的文明火种，是您意志所及的权柄象征。\n\n---\n🚀动力驱动系统 Mk.II🚀\n简介：液压驱动足被反重力引擎所取代。您的庇护所现在可以离地数米悬浮，并以更快的速度、更强的机动性在任何地形上“航行”，无视一切地面障碍。\n\n🌌光学迷彩力场🌌\n简介：庇护所外部可以生成一层扭曲光线和热信号的力场，使其在视觉上和热成像上完全隐形。您可以悄无声-息地出现在任何地方，或是在众
