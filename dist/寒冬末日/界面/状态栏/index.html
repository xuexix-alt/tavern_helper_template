bility_master\n  name: 伊甸庇护所能力总表\n  world: 寒冬末日-星穹秩序\n  authoring_note: 严格YAML；该文件是庇护所能力的唯一总表（UI与脚本应按能力键查询描述）\n  source_of_truth: true\n\nrules:\n  level_range: [1, 10]\n  categories: [安全, 生存, 舒适, 扩展, 远征, 限制]\n  progression_style: 小步快走\n  balancing_principles:\n    - 低等级优先生存，不给压制级战斗能力\n    - 单级能力数量适中，避免跨级质变过猛\n    - 强能力必须绑定成本、门槛或冷却\n    - 舒适类不直接转化为战斗优势\n    - 远征类强调“能出去”，不保证“无损回来”\n\nmaintenance:\n  imp_support:\n    description: 伊甸维持系统由“高意愿协作人口”提供社会运转稳定度\n    base_days: 1\n    base_imp_threshold: 70\n    bonus_days_per_qualified_survivor: 1\n    qualified_rule: 幸存者Imp >= imp_threshold 且处于受管辖状态\n    scaling:\n      threshold_reduction_per_tier: 5\n      days_bonus_per_tier: 0.5\n      max_tier: 5\n    caps:\n      min_threshold: 45\n      max_bonus_days_per_survivor: 2\n      max_total_maintenance_days: 21\n    anti_snowball:\n      diminishing_return_after_survivors: 8\n      diminishing_factor: 0.5\n\nlevels:\n  "1":\n    label: 霜墙火种\n    unlocks:\n      - safe.sealed_bulkhead\n      - safe.foyer_aegis_grid\n      - survive.thermal_loop_seed\n      - survive.water_air_loop_seed\n      - survive.basic_ration_fabricator\n      - comfort.quiet_mind_channel\n      - expand.core_safe_zone_anchor\n      - limit.imp_support_protocol_alpha\n  "2":\n    label: 稳态筑巢\n    unlocks:\n      - safe.peephole_mesh\n      - safe.corridor_echo_probe\n      - survive.sanitation_capsule\n      - survive.heat_budget_allocator\n      - comfort.archive_gallery_local\n      - expand.utility_interface_s1\n      - limit.threshold_tuning_beta\n  "3":\n    label: 玄关前哨\n    unlocks:\n      - safe.nonlethal_latch\n      - safe.panic_path_lamp\n      - survive.clinic_pod_t0\n      - comfort.circadian_symphony\n      - expand.shelter_radius_20f_s1\n      - expand.heating_radius_20f_s1\n      - limit.support_quota_beta\n  "4":\n    label: 楼层洞察\n    unlocks:\n      - safe.nightglass_swarm\n      - safe.hallway_threat_score\n      - survive.nutri_variety_primer\n      - comfort.digital_arcadia_v1\n      - expand.resource_interface_20f_s1\n      - expedition.signal_scout_pack\n      - limit.threshold_tuning_gamma\n  "5":\n    label: 合作化秩序\n    unlocks:\n      - safe.response_drill_grid\n      - survive.clinic_pod_t1\n      - survive.pharma_replicator_t0\n      - comfort.social_hearth_room\n      - expand.shelter_radius_20f_s2\n      - expedition.relay_cache_box\n      - limit.support_quota_gamma\n  "6":\n    label: 跨层联结\n    unlocks:\n      - safe.tactical_jammer_node\n      - survive.surgery_table_t0\n      - comfort.holo_stage_chamber\n      - expand.shelter_radius_19f_s1\n      - expand.heating_radius_19f_s1\n      - expedition.weather_trace_array\n      - limit.threshold_tuning_delta\n  "7":\n    label: 远征启步\n    unlocks:\n      - safe.perimeter_drone_ring\n      - survive.field_med_kit_line\n      - comfort.deep_rest_suite\n      - expand.resource_interface_19f_s1\n      - expedition.pioneer_vehicle_mk1\n      - expedition.mobile_relief_pod\n      - limit.support_quota_delta\n  "8":\n    label: 机动堡垒\n    unlocks:\n      - safe.heavy_nonlethal_turret\n      - survive.pharma_replicator_t1\n      - comfort.virtual_biome_voyage\n      - expand.shelter_radius_20f_s3\n      - expedition.long_range_sensor_mast\n      - expedition.convoy_dock_node\n      - limit.threshold_tuning_epsilon\n  "9":\n    label: 自持方舟\n    unlocks:\n      - safe.counterstrike_doctrine_lock\n      - survive.eco_farm_vertical\n      - survive.surgery_table_t1\n      - comfort.hydro_thermal_pool\n      - expand.shelter_radius_19f_s2\n      - expedition.pioneer_vehicle_mk2\n      - limit.support_quota_epsilon\n  "10":\n    label: 行走伊甸\n    unlocks:\n      - safe.optic_veil_field\n      - survive.genesis_core_regulator\n      - comfort.ark_theatre_infinite\n      - expand.omni_interface_network\n      - expedition.stratos_probe_lance\n      - expedition.frontier_command_hub\n      - limit.maintenance_compact_omega\n\nabilities:\n  safe.sealed_bulkhead:\n    name: "🛡️密封霜墙门闩"\n    category: 安全\n ce:\n      cost: 低\n      limit: 精度受环境噪声影响\n\n  survive.sanitation_capsule:\n    name: "🧼卫生净化舱"\n    category: 生存\n    unlock_level: 2\n    desc: 建立基础消杀流程，降低常见感染风险并改善居住卫生水平。\n    effects: [感染风险下降]\n    balance:\n      cost: 低\n      limit: 仅基础病原防护\n\n  survive.heat_budget_allocator:\n    name: "🔥热量配额调度器"\n    category: 生存\n    unlock_level: 2\n    desc: 对供暖进行时段化调度，减少无效能耗并提升夜间舒适稳定性。\n    effects: [供暖效率提升]\n    balance:\n      cost: 低\n      limit: 不能提高绝对供暖上限\n\n  comfort.archive_gallery_local:\n    name: "📚离线档案长廊"\n    category: 舒适\n    unlock_level: 2\n    desc: 激活旧世界离线影像与文献库，提供低带宽文化娱乐与学习资源。\n    effects: [娱乐与信息恢复]\n    balance:\n      cost: 低\n      limit: 内容更新慢\n\n  expand.utility_interface_s1:\n    name: "🔌基础资源接口S1"\n    category: 扩展\n    unlock_level: 2\n    desc: 开通最小对外资源接口，可对外提供低强度水电支援。\n    effects: [小规模水电接口]\n    balance:\n      cost: 中\n      limit: 吞吐低、暴露风险上升\n\n  limit.threshold_tuning_beta:\n    name: "🧮阈值校准β"\n    category: 限制\n    unlock_level: 2\n    desc: 对维持规则进行第一轮校准，适度降低达标Imp阈值，提高可调度性。\n    effects: [imp_threshold -5]\n    balance:\n      cost: 中\n      limit: 仅降低阈值，不增加单人产能\n\n  safe.nonlethal_latch:\n    name: "🪤非致命束止栓"\n    category: 安全\n    unlock_level: 3\n    desc: 玄关新增可控束止器，对闯入目标实施定点禁锢，便于审讯与驱离。\n    effects: [非致命控制提升]\n    balance:\n      cost: 中\n      limit: 连续触发存在冷却\n\n  safe.panic_path_lamp:\n    name: "🚨惊厥路径警示灯"\n    category: 安全\n    unlock_level: 3\n    desc: 在核心动线中投射高可见引导，紧急情况下减少踩踏与误判。\n    effects: [紧急撤离效率提升]\n    balance:\n      cost: 低\n      limit: 仅内部生效\n\n  survive.clinic_pod_t0:\n    name: "⚕️临床舱T0"\n    category: 生存\n    unlock_level: 3\n    desc: 提供常见外伤与轻中度感染处置，建立最小医疗闭环。\n    effects: [基础医疗]\n    balance:\n      cost: 中\n      limit: 不支持复杂外科\n\n  comfort.circadian_symphony:\n    name: "🌙昼夜韵律编排"\n    category: 舒适\n    unlock_level: 3\n    desc: 根据作息自动调节光色、音景与气味，减少失眠和情绪失衡。\n    effects: [休息质量提升]\n    balance:\n      cost: 低\n      limit: 对重度创伤无直接治疗效果\n\n  expand.shelter_radius_20f_s1:\n    name: "🛡️20层庇护半径S1"\n    category: 扩展\
