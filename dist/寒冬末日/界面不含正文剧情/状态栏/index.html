n    unlock_level: 1\n    desc: 核心入口获得双层气密门闩与合金滑轨，能抵御大多数暴力破门与低温冲击。\n    effects: [入口防护+1, 破门延迟]\n    balance:\n      cost: 低\n      limit: 仅核心入口生效\n\n  safe.foyer_aegis_grid:\n    name: "⚡玄关静电裁断网"\n    category: 安全\n    unlock_level: 1\n    desc: 玄关地板植入低致伤静电网，识别敌意动作后触发麻痹性击退。\n    effects: [非致命制止, 入侵减速]\n    balance:\n      cost: 低\n      limit: 对重装目标效果有限\n\n  survive.thermal_loop_seed:\n    name: "🌡️恒温循环底座"\n    category: 生存\n    unlock_level: 1\n    desc: 建立基础热循环，2001核心区维持稳定体感温度，显著降低寒冷导致的健康损耗。\n    effects: [核心区恒温, 寒冷伤害缓解]\n    balance:\n      cost: 低\n      limit: 仅核心区\n\n  survive.water_air_loop_seed:\n    name: "💧空气-净水双循环"\n    category: 生存\n    unlock_level: 1\n    desc: 启动初级空气净化与净水回路，确保基础可呼吸与可饮用条件。\n    effects: [基础净水, 基础净化]\n    balance:\n      cost: 低\n      limit: 对污染峰值响应较慢\n\n  survive.basic_ration_fabricator:\n    name: "🍞基础口粮织造器"\n    category: 生存\n    unlock_level: 1\n    desc: 提供稳定但单调的高热量口粮，保障最低生存线。\n    effects: [饥饿缓解, 基础供给]\n    balance:\n      cost: 低\n      limit: 口味与营养结构单一\n\n  comfort.quiet_mind_channel:\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    name: "📐维持协议α"\n    category: 限制\n    unlock_level: 1\n    desc: 启用“高Imp协作人口”维持规则：每名达标幸存者可额外维持伊甸运行天数。\n    effects: [维持系统启用]\n    balance:\n      cost: 中\n      limit: 初始阈值高（Imp>=70）\n\n  safe.peephole_mesh:\n    name: "🔍门外蜂眼网"\n    category: 安全\n    unlock_level: 2\n    desc: 门外近距盲区被蜂眼镜头补齐，可识别尾随与伏击动作。\n    effects: [盲区补足]\n    balance:\n      cost: 低\n      limit: 仅门外短距\n\n  safe.corridor_echo_probe:\n    name: "📶走廊回声探针"\n    category: 安全\n    unlock_level: 2\n    desc: 通过声纹回声估算走廊活动密度，提前规避短时拥堵与冲突点。\n    effects: [风险预估]\n    bala
