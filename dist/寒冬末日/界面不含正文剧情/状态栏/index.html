\n    name: "🎧静心白噪通道"\n    category: 舒适\n    unlock_level: 1\n    desc: 提供基础降噪与睡前音景，缓和长期高压下的精神紧绷。\n    effects: [压力缓解]\n    balance:\n      cost: 低\n      limit: 不提供强娱乐刺激\n\n  expand.core_safe_zone_anchor:\n    name: "📍核心安全锚点"\n    category: 扩展\n    unlock_level: 1\n    desc: 定义2001为绝对安全锚点，后续所有扩展范围均以此为基准。\n    effects: [范围系统初始化]\n    balance:\n      cost: 低\n      limit: 无直接外扩能力\n\n  limit.imp_support_protocol_alpha:\n    name: "📐维持协议α"\n    category: 限制\n    unlock_level: 1\n    desc: 启用“高Imp协作人口”维持规则：每名达标幸存者可额外维持伊甸运行天数。\n    effects: [维持系统启用]\n    balance:\n      cost: 中\n      limit: 初始阈值高（Imp>=70）\n\n  safe.peephole_mesh:\n    name: "🔍门外蜂眼网"\n    category: 安全\n    unlock_level: 2\n    desc: 门外近距盲区被蜂眼镜头补齐，可识别尾随与伏击动作。\n    effects: [盲区补足]\n    balance:\n      cost: 低\n      limit: 仅门外短距\n\n  safe.corridor_echo_probe:\n    name: "📶走廊回声探针"\n    category: 安全\n    unlock_level: 2\n    desc: 通过声纹回声估算走廊活动密度，提前规避短时拥堵与冲突点。\n    effects: [风险预估]\n    balance:\n      cost: 低\n      limit: 精度受环境噪声影响\n\n  survive.sanitation_capsule:\n    name: "🧼卫生净化舱"\n    category: 生存\n    unlock_level: 2\n    desc: 建立基础消杀流程，降低常见感染风险并改善居住卫生水平。\n    effects: [感染风险下降]\n    balance:\n      cost: 低\n      limit: 仅基础病原防护\n\n  survive.heat_budget_allocator:\n    name: "🔥热量配额调度器"\n    category: 生存\n    unlock_level: 2\n    desc: 对供暖进行时段化调度，减少无效能耗并提升夜间舒适稳定性。\n    effects: [供暖效率提升]\n    balance:\n      cost: 低\n      limit: 不能提高绝对供暖上限\n\n  comfort.archive_gallery_local:\n    name: "📚离线档案长廊"\n    category: 舒适\n    unlock_level: 2\n    desc: 激活旧世界离线影像与文献库，提供低带宽文化娱乐与学习资源。\n    effects: [娱乐与信息恢复]\n    balance:\n      cost: 低\n      limit: 内容更新慢\n\n  expand.utility_interface_s1:\n    name: "🔌基础资源接口S1"\n    category: 扩展\n    unlock_level: 2\n    desc: 开通最小对外资源接口，可对外提供低强度水电支援。\n    effects: [小规模水电接口]\n    balance:\n      cost: 中\n      limit: 吞吐低、暴露风险上升\n\n  limit.threshold_tuning_beta:\n    name: "🧮阈值校准β"\n    category: 限制\n    unlock_level: 2\n    desc: 对维持规则进行第一轮校准，适度降低达标Imp阈值，提高可调度性。\n    effects: [imp_
