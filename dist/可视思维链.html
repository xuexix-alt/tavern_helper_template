<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Astro</title>
    <style>
      :root {
        --astro-bg-dark: #0b0d17;
        --astro-bg-panel: #15192b;
        --astro-accent: #00f0ff; /* 赛博青/星际蓝 */
        --astro-accent-dim: rgba(0, 240, 255, 0.15);
        --astro-text-main: #e0e6ed;
        --astro-text-sub: #94a3b8;
        --astro-border: rgba(148, 163, 184, 0.15);
        --astro-glow: 0 0 15px rgba(0, 240, 255, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        background: transparent;
        padding: 6px;
        margin: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        color: var(--astro-text-main);
      }

      /* 主容器 */
      .astro-collapsible {
        width: 100%;
        background: linear-gradient(160deg, var(--astro-bg-dark) 0%, #1a1f35 100%);
        border-radius: 12px;
        border: 1px solid var(--astro-border);
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.3s ease;
        position: relative;
        isolation: isolate;
      }

      .astro-collapsible:hover {
        transform: translateY(-1px);
        border-color: rgba(0, 240, 255, 0.3);
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5), var(--astro-glow);
      }

      /* 扫描线纹理叠加 */
      .astro-collapsible::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.02) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.5;
      }

      /* Canvas 背景层 */
      .star-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.8;
      }

      /* 头部区域 */
      .astro-header {
        position: relative;
        padding: 14px 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(21, 25, 43, 0.6);
        border-bottom: 1px solid transparent;
        transition: background 0.3s ease;
        z-index: 2;
        user-select: none;
      }

      .astro-header:hover {
        background: rgba(21, 25, 43, 0.8);
      }

      .astro-collapsible.expanded .astro-header {
        border-bottom: 1px solid var(--astro-border);
        background: rgba(21, 25, 43, 0.9);
      }

      /* 标题组合 */
      .astro-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .astro-label {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }

      .astro-sublabel {
        font-size: 10px;
        color: var(--astro-accent);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        opacity: 0.8;
        margin-top: 2px;
      }

      /* 行星图标容器 */
      .planet-wrap {
        position: relative;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 行星 SVG */
      .planet-svg {
        width: 32px;
        height: 32px;
        z-index: 2;
        filter: drop-shadow(0 0 5px rgba(0, 180, 255, 0.5));
        transition: transform 0.5s ease;
      }

      .astro-header:hover .planet-svg {
        transform: rotate(-10deg) scale(1.05);
      }

      /* 轨道光点动画 */
      .orbit-dot {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        animation: rotateOrbit 8s linear infinite;
        pointer-events: none;
        z-index: 1;
      }

      .orbit-dot::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 3px;
        height: 3px;
        background: var(--astro-accent);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--astro-accent);
        transform: translate(-50%, -50%);
      }

      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* 右侧控制区 */
      .astro-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* 模式切换按钮 */
      .mode-toggle {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--astro-accent);
        cursor: pointer;
        opacity: 1;
        transition: all 0.3s ease;
        border-radius: 4px;
        background: rgba(0, 240, 255, 0.05);
      }

      .mode-toggle:hover {
        background: rgba(0, 240, 255, 0.15);
        box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
      }

      .mode-toggle svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /* 切换箭头 */
      .toggle-btn {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--astro-accent);
        transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        opacity: 0.7;
      }

      .toggle-btn svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }

      .astro-header:hover .toggle-btn {
        opacity: 1;
        filter: drop-shadow(0 0 5px var(--astro-accent));
      }

      .astro-collapsible.expanded .toggle-btn {
        transform: rotate(180deg);
      }

      /* 内容区域 */
      .astro-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        background: rgba(11, 13, 23, 0.5);
        position: relative;
        z-index: 2;
      }

      .astro-content-inner {
        padding: 20px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--astro-text-sub);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 400px;
        overflow-y: auto;
        font-family: 'Consolas', 'Monaco', 'Andale Mono', monospace; /* 科技感字体 */
      }

      /* 滚动条美化 */
      .astro-content-inner::-webkit-scrollbar {
        width: 4px;
      }
      .astro-content-inner::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      .astro-content-inner::-webkit-scrollbar-thumb {
        background: rgba(0, 240, 255, 0.3);
        border-radius: 2px;
      }
      .astro-content-inner::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 240, 255, 0.6);
      }

      /* 底部收起条 */
      .astro-footer {
        padding: 8px 0;
        text-align: center;
        font-size: 12px;
        color: #5d6d7e;
        cursor: pointer;
        background: linear-gradient(180deg, transparent, rgba(0, 240, 255, 0.03));
        border-top: 1px solid rgba(255, 255, 255, 0.03);
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .astro-footer:hover {
        color: var(--astro-accent);
        background: rgba(0, 240, 255, 0.05);
      }

      /* 装饰性元素 */
      .corner-decor {
        position: absolute;
        width: 8px;
        height: 8px;
        border-color: var(--astro-accent);
        border-style: solid;
        pointer-events: none;
        opacity: 0.5;
        transition: opacity 0.3s;
      }
      .astro-collapsible:hover .corner-decor { opacity: 1; }

      .top-left { top: 0; left: 0; border-width: 1px 0 0 1px; border-radius: 12px 0 0 0; }
      .top-right { top: 0; right: 0; border-width: 1px 1px 0 0; border-radius: 0 12px 0 0; }
      .bottom-left { bottom: 0; left: 0; border-width: 0 0 1px 1px; border-radius: 0 0 0 12px; }
      .bottom-right { bottom: 0; right: 0; border-width: 0 1px 1px 0; border-radius: 0 0 12px 0; }

      /* =========================================
         LITE MODE / 极简模式样式覆盖
         ========================================= */
      body.lite-mode .astro-collapsible {
        background: #0f121e; /* 纯色背景 */
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 1px solid #2a3040;
      }
      
      body.lite-mode .astro-collapsible:hover {
        transform: none; /* 禁用位移 */
        border-color: #3a4050;
      }

      /* 隐藏/禁用高消耗元素 */
      body.lite-mode .astro-collapsible::after, /* 扫描线 */
      body.lite-mode .corner-decor,             /* 角标装饰 */
      body.lite-mode .star-canvas,              /* Canvas星空 */
      body.lite-mode .orbit-dot,                /* 轨道动画 */
      body.lite-mode .planet-svg filter,        /* SVG滤镜 */
      body.lite-mode .astro-header:hover .toggle-btn, /* 阴影 */
      body.lite-mode .astro-label,              /* 文字光晕 */
      body.lite-mode .planet-svg                /* 阴影 */
       { 
        display: none !important;
        filter: none !important;
        text-shadow: none !important;
        box-shadow: none !important;
        animation: none !important;
      }
      
      /* 降级后的元素样式 */
      body.lite-mode .planet-svg {
         opacity: 0.8; 
      }
      
      body.lite-mode .astro-header {
        background: #15192b;
      }
      
      body.lite-mode .astro-content {
        background: #111420;
      }
      
      /* 极简模式下按钮变灰 */
      body.lite-mode .mode-toggle {
        color: #5d6d7e;
        background: transparent;
        opacity: 0.6;
      }
      
      body.lite-mode .mode-toggle:hover {
        color: var(--astro-text-main);
        background: rgba(255,255,255,0.05);
      }

      /* 响应式 */
      @media (max-width: 480px) {
        .astro-header { padding: 12px; }
        .astro-label { font-size: 14px; }
        .planet-wrap { width: 32px; height: 32px; }
        .planet-svg { width: 26px; height: 26px; }
      }
      
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="astro-collapsible" id="astroCollapsible">
      <!-- 装饰角标 -->
      <div class="corner-decor top-left"></div>
      <div class="corner-decor top-right"></div>
      <div class="corner-decor bottom-left"></div>
      <div class="corner-decor bottom-right"></div>

      <canvas class="star-canvas" id="starCanvas" aria-hidden="true"></canvas>

      <div
        class="astro-header"
        onclick="toggleCollapsible()"
        role="button"
        aria-expanded="false"
        aria-controls="astroContent"
        tabindex="0"
      >
        <div class="astro-title-group">
          <div class="planet-wrap" aria-hidden="true">
             <div class="orbit-dot"></div>
             <!-- SVG Planet Icon -->
             <svg class="planet-svg" viewBox="0 0 64 64" fill="none">
               <defs>
                 <linearGradient id="planetBody" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                   <stop offset="0" stop-color="#4fd1c5" />
                   <stop offset="0.5" stop-color="#3182ce" />
                   <stop offset="1" stop-color="#1a365d" />
                 </linearGradient>
                 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                   <feGaussianBlur stdDeviation="3" result="blur" />
                   <feComposite in="SourceGraphic" in2="blur" operator="over" />
                 </filter>
               </defs>
               <!-- Rear Ring -->
               <path d="M 8,32 A 28,10 0 1,1 56,32 A 28,10 0 1,1 8,32" stroke="rgba(79, 209, 197, 0.3)" stroke-width="2" fill="none" stroke-dasharray="2 2" />
               <!-- Body -->
               <circle cx="32" cy="32" r="14" fill="url(#planetBody)" filter="url(#glow)" />
               <!-- Front Ring Highlight -->
               <path d="M 8,32 A 28,10 0 0,0 56,32" stroke="rgba(79, 209, 197, 0.9)" stroke-width="2" fill="none" stroke-linecap="round" />
             </svg>
          </div>
          <div class="astro-label">
            <span>ASTRO</span>
            <span class="astro-sublabel">思维链分析 // SYSTEM READY</span>
          </div>
        </div>
        
        <!-- 右侧控制区 -->
        <div class="astro-controls">
          <!-- 性能模式切换按钮 -->
          <div class="mode-toggle" id="modeToggle" onclick="toggleMode(event)" title="切换极简/高性能模式">
             <!-- 闪电图标 -->
             <svg viewBox="0 0 24 24">
                <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
             </svg>
          </div>
          
          <div class="toggle-btn">
            <svg viewBox="0 0 24 24">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="astro-content" id="astroContent">
        <div class="astro-content-inner">$1</div>
        <div class="astro-footer" onclick="toggleCollapsible()">▲ CLOSE TERMINAL</div>
      </div>
    </div>

    <script>
      // === content escape ===
      function escapeHtml(unsafe) {
        return unsafe.replace(/[&<>"']/g, function(match) {
          return {
            '&': '&'+'amp;',
            '<': '&'+'lt;',
            '>': '&'+'gt;',
            '"': '&'+'quot;',
            "'": '&'+'#039;'
          }[match];
        });
      }

      const contentElement = document.querySelector('.astro-content-inner');
      contentElement.innerHTML = escapeHtml(contentElement.innerHTML);

      let starApi;

      // === 模式管理 ===
      // 初始化：检查 LocalStorage
      (function initMode() {
        const savedMode = localStorage.getItem('astroMode');
        if (savedMode === 'lite') {
          document.body.classList.add('lite-mode');
        }
      })();

      function toggleMode(e) {
        e.stopPropagation(); // 阻止冒泡，避免触发折叠
        const body = document.body;
        const isLite = body.classList.toggle('lite-mode');
        
        // 保存状态
        localStorage.setItem('astroMode', isLite ? 'lite' : 'full');
        
        // 控制星空动画（极简模式下暂停以节省资源）
        if (starApi) {
          isLite ? starApi.pause() : starApi.resume();
        }
      }

      function toggleCollapsible() {
        const collapsible = document.getElementById('astroCollapsible');
        const header = collapsible.querySelector('.astro-header');
        const content = document.getElementById('astroContent');
        const contentInner = content.querySelector('.astro-content-inner');
        const footer = content.querySelector('.astro-footer');
        
        const isExpanded = collapsible.classList.contains('expanded');

        if (isExpanded) {
          collapsible.classList.remove('expanded');
          header.setAttribute('aria-expanded', 'false');
          content.style.maxHeight = '0px';
        } else {
          collapsible.classList.add('expanded');
          header.setAttribute('aria-expanded', 'true');
          
          const innerHeight = Math.min(contentInner.scrollHeight, 400); 
          const footerHeight = footer.offsetHeight;
          const totalHeight = innerHeight + footerHeight + 20; 
          content.style.maxHeight = totalHeight + 'px';
        }
        
        setTimeout(updateIframeHeight, 410);
      }

      function updateIframeHeight() {
        if (starApi && starApi.resize) starApi.resize();
        const bodyHeight = document.body.scrollHeight;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'resizeIframe', height: bodyHeight }, '*');
        }
      }

      // 星空 Canvas 逻辑
      function initStarCanvas() {
        const canvas = document.getElementById('starCanvas');
        if (!canvas) return {};
        const ctx = canvas.getContext('2d');
        let w = 0, h = 0, dpr = 1, stars = [], rafId = 0, animate = true;
        let cssW = 0, cssH = 0;
        
        // 初始状态：如果是极简模式，则默认为暂停状态
        let paused = document.body.classList.contains('lite-mode');

        function createStar() {
            const x = Math.random() * w;
            const y = Math.random() * h;
            const r = (Math.random() * 0.8 + 0.2) * dpr; 
            const baseAlpha = 0.2 + Math.random() * 0.6;
            const driftX = (Math.random() - 0.5) * 0.05 * dpr;
            const driftY = (Math.random() - 0.5) * 0.05 * dpr; 
            const blueish = Math.random() > 0.7; 
            return { x, y, r, baseAlpha, driftX, driftY, blueish };
        }

        function resize() {
            // 如果是暂停/极简模式，不进行 Resize 计算，减少开销
            if (paused) return;

            const rect = canvas.getBoundingClientRect();
            const nextDpr = Math.min(window.devicePixelRatio || 1, 2);
            if (Math.round(rect.width) === Math.round(cssW) && Math.round(rect.height) === Math.round(cssH)) return;
            
            dpr = nextDpr;
            w = canvas.width = rect.width * dpr;
            h = canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            cssW = rect.width;
            cssH = rect.height;

            const target = Math.floor((w * h) / 3000); 
            if (stars.length < target) {
                for(let i = stars.length; i < target; i++) stars.push(createStar());
            } else {
                stars.length = target;
            }
        }

        function step() {
            // 关键：如果暂停（极简模式）或不支持动画，直接停止循环
            if (!animate || paused) return;

            ctx.clearRect(0, 0, w, h);
            
            for (const s of stars) {
                s.x += s.driftX;
                s.y += s.driftY;
                
                if (s.x < 0) s.x = w;
                if (s.x > w) s.x = 0;
                if (s.y < 0) s.y = h;
                if (s.y > h) s.y = 0;

                const twinkle = Math.sin(Date.now() * 0.002 + s.x) * 0.2;
                const alpha = Math.max(0.1, Math.min(1, s.baseAlpha + twinkle));
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.blueish ? '#a5f3fc' : '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            rafId = requestAnimationFrame(step);
        }

        const media = window.matchMedia('(prefers-reduced-motion: reduce)');
        function updateMotion() {
            animate = !media.matches;
            if(animate && !paused) {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(step);
            } else {
                cancelAnimationFrame(rafId);
                ctx.clearRect(0, 0, w, h);
            }
        }

        resize();
        updateMotion();
        window.addEventListener('resize', resize);
        
        // 返回控制接口
        return { 
            resize, 
            pause: () => { 
                paused = true; 
                cancelAnimationFrame(rafId); 
                ctx.clearRect(0, 0, w, h); // 清空画布
            },
            resume: () => { 
                paused = false; 
                resize(); // 恢复时可能需要重新计算尺寸
                if(animate) step(); 
            }
        };
      }

      // 键盘交互支持
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          const activeElement = document.activeElement;
          if (activeElement && activeElement.classList.contains('astro-header')) {
            event.preventDefault();
            toggleCollapsible();
          }
        }
      });

      window.addEventListener('load', () => {
        starApi = initStarCanvas();
        updateIframeHeight();
      });

      // 内容变化监听
      const contentInnerEl = document.querySelector('.astro-content-inner');
      const observer = new MutationObserver(() => {
        const collapsible = document.getElementById('astroCollapsible');
        if (collapsible.classList.contains('expanded')) {
            const content = document.getElementById('astroContent');
            const footer = content.querySelector('.astro-footer');
            const innerHeight = Math.min(contentInnerEl.scrollHeight, 400);
            content.style.maxHeight = (innerHeight + footer.offsetHeight + 20) + 'px';
            updateIframeHeight();
        }
      });
      observer.observe(contentInnerEl, { childList: true, subtree: true, characterData: true });
    </script>
  </body>
</html>
