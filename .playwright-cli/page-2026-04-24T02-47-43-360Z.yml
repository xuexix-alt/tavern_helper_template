                                - paragraph [ref=f8e314]: “然后他顶到某个地方的时候，你会浑身发麻，从头皮一路麻到脚趾尖。那时候你会忍不住夹紧他，想把他勒在里头，越紧越好。”
                                - paragraph [ref=f8e315]: 幺妹听得脸颊泛红，眼睛却更亮了。
                                - paragraph [ref=f8e316]: “……那要怎么夹？”
                                - paragraph [ref=f8e317]: 陈雪浅笑了一下——那笑容里带着过来人的熟稔。
                                - paragraph [ref=f8e318]: “你现在看着。”
                                - paragraph [ref=f8e319]: 她深吸一口气，腰身不动，下体却内部用力——幺妹看到姐姐的腹肌明显收紧了一下，连带着小哥哥也猛地闷哼了一声。
                                - paragraph [ref=f8e320]: “感觉到了吗？就是用底下那一圈肉去裹他、吸他。你先空手练，找那个用力的感觉。以后你在上面的时候，他舒不舒服，全看你这一下。”
                                - paragraph [ref=f8e321]: 幺妹用力点了点头，目光里多了一份跃跃欲试的期待。
                                - paragraph
                                - paragraph [ref=f8e322]: 客房E里再次安静下来，只余下陈雪尚未平息的低低喘息。
                                - paragraph [ref=f8e323]: 晨光已经从窗帘缝隙移到了墙面，照亮了床铺上三道交错的身影与床单上洇开的湿润痕迹。空气里混杂着汗水与体液的气味，温热的、带着一股鲜活的人气。
                                - paragraph [ref=f8e324]: 陈雪没有从粗棍上下来。她俯趴在小哥哥胸口，下巴搁在他锁骨窝里，懒洋洋地不想动。
                                - paragraph [ref=f8e325]: 幺妹坐在一旁，目光落在姐姐光裸的后背上，不知道在想什么。
                                - paragraph [ref=f8e326]: 远处客厅传来水烧开的声音。
                                - paragraph [ref=f8e327]: 然后又是安静。
