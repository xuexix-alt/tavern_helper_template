                                - paragraph [ref=f16e111]:
                                  - code [ref=f16e112]: 地点·星穹国际公寓20层·9527年12月14日·星期日·凌晨03:12
                                - paragraph [ref=f16e113]: 走廊里的温度大概不到零下三十。
                                - paragraph [ref=f16e114]: 伊甸的防寒防护服T1把寒气挡在外面，硬底靴踩在大理石地面上发出很轻的沙沙声。20层走廊的应急照明早在第四天就灭了，现在唯一的光源是走廊尽头那扇窗户透进来的雪光——灰蓝色的，像稀释过的墨水。
                                - paragraph [ref=f16e115]: 2004室的门和其他房间一样，是一扇深棕色的木门，门牌号已经歪了，只靠一颗螺丝挂着。门缝底下没有光渗出来。
                                - paragraph [ref=f16e116]: 他在脑子里调出指令。
                                - paragraph [ref=f16e117]:
                                  - code [ref=f16e118]: sk001·一二三木头人
                                  - text: ——对象范围：2004室。场域内所有角色失去行动能力，持续6小时。
                                - paragraph [ref=f16e119]: 指令生效没有任何声音。没有光芒，没有震动，没有那种“特殊的事情发生了”的仪式感。只是2004室内部突然变得更安静了——原本还有一点窸窸窣窣的布料摩擦声，现在什么都没有了。
                                - paragraph [ref=f16e120]: 门把手拧不开。从里面反锁的。
                                - paragraph [ref=f16e121]: 防寒防护服的手套在门板上按了按，木质门板在低温下变得很脆，锁舌的位置发出轻微的嘎吱声。肩膀撞上去，一次。门框周围结的冰碴碎了一地，锁扣崩开，门向内弹开了大概二十厘米。
                                - paragraph [ref=f16e122]: 2004室内部比走廊暖和一些，但也没暖到哪儿去。客厅大概四五度左右，窗户用胶带贴了四层，玻璃上全是冰花。角落里堆着三个睡袋，其中一个睡袋的拉链开着，里面是空的。
                                - paragraph [ref=f16e123]: 三个人。
                                - paragraph [ref=f16e124]: 佐伯龙一靠在窗边的墙上。他面朝门，眼睛睁着，嘴巴微微张开，像是要说什么但说不出来。他的右手搭在工具箱上，手指保持着即将握住扳手的姿势，但关节僵住了。
                                - paragraph [ref=f16e125]: 他醒着。在小哥哥进来之前就醒着。
                                - paragraph [ref=f16e126]: 佐伯诗织和佐伯惠理挤在最大的那个睡袋里。诗织的脸朝着天花板，黑色的长发散在睡袋的拉链边上，嘴唇微微动了一下。惠理在姐姐旁边，马尾压在脑袋底下，眼睛瞪得很大，眼眶里有水光在打转。
                                - paragraph [ref=f16e127]: 她们也醒着。三个人都醒着。
                                - paragraph [ref=f16e128]: 凌晨三点，他们都没睡。
                                - paragraph [ref=f16e129]: 房间里弥漫着一股什么东西发酵了的酸味，混合着汗水和旧衣服的味道。厨房角落的垃圾桶里塞着三个压缩饼干的包装袋，旁边的水桶只剩大概一指节深的水。龙一手边放着的一盒退烧药，铝箔包装已经空了。
                                - paragraph [ref=f16e130]: 诗织的声音最先传出来，很细，像是从喉咙缝里挤出来的。
                                - paragraph [ref=f16e131]: “……你是谁。”
