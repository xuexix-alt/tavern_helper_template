            - paragraph [ref=e472]: 她显然是想让话题自然地延续下去，寻找任何能和小哥哥产生互动的支点。
            - paragraph [ref=e473]: 诗织则安静地站在靠近货架末端的位置，并没有加入关于饭团或者包子的热烈讨论。她微微低着头，步幅很小地走到加热柜前，动作极其轻柔也极其精准，取出了两罐温热的无糖豆奶。她今天穿着那件一尘不染的浅蓝色衬衫，上面套着白色针织开衫，整个人在冷色调的灯光下显得有些苍白却又异常得体。
            - paragraph [ref=e474]:
              - img
              - button "生成图片" [ref=e475] [cursor=pointer]
            - paragraph [ref=e476]: 诗织的目光在豆奶的成分标签上停留了差不多两秒钟，随后便转过身，一言不发地走向了收银台。
            - paragraph [ref=e477]: 这是这对双胞胎姐妹一贯的相处模式。一个负责用声音和动作去填满所有的空间，而另一个负责在极度的节制中梳理这些杂乱的秩序。小哥哥顺手在货架上拿了一块培根三明治，又从加热柜里拿出一瓶黑咖啡，不紧不慢地跟在她们身后。
            - paragraph [ref=e478]: 收银台前，惠理正将腋下夹着的包提到胸前，准备去翻找里面的手机。她嘴里还念叨着饭团和草莓牛奶的价钱，手指在包里摸索着。
            - paragraph [ref=e479]: 小哥哥脚步未停，直接越过了惠理的肩膀，将自己手里的三明治和咖啡放在了收银台上。紧接着，他手腕一翻，屏幕上亮起的付款码直接对准了收银员手中的扫描仪。
            - paragraph [ref=e480]: “滴——”
            - paragraph [ref=e481]: 轻脆的一声扫码提示音，瞬间切断了惠理嘴里的碎碎念。收银员麻利地将饭团、热豆奶、三明治还有咖啡装进同一个印着便利店Logo的塑料袋里，向前推了推。
            - paragraph [ref=e482]: 惠理伸在包里摸手机的动作彻底僵在了原地。
            - paragraph [ref=e483]: 她的那双杏眼猛地睁大，视线下意识地从小哥哥的手机屏幕移动到那个装满早餐的袋子上，又不可置信地顺着小哥哥的夹克衣袖一点点上移，最后定格在他的侧脸轮廓上。
            - paragraph [ref=e484]: “欸？等、等等！你干嘛一起付钱啊！”
            - paragraph [ref=e485]: 她的声音不自觉地拔高了八度，随后似乎意识到了这里是公共场合，又有些慌张地压了下去。几根没有扎进马尾的碎发在因为急促的呼吸而微微颤动，那颗位于左眼角正下方的小痣，此刻正随着她因为过度情绪起伏而扬起的眼角，像是一颗随时会掉落的欢快泪珠般跃动。
            - paragraph [ref=e486]: 几乎只是在两三秒的时间里，肉眼可见的红晕直接从惠理的颧骨处蔓延开来，一路烧到了耳根。那种鲜艳的红色，甚至比她身上的橙色卫衣还要抢眼。
            - paragraph [ref=e487]:
              - img
              - button "生成图片" [ref=e488] [cursor=pointer]
            - paragraph [ref=e489]: “说好的一起去学校，怎么能让你买单……搞得像是什么奇怪的约会一样，笨蛋……”
            - paragraph [ref=e490]: 这最后的半句话被她心虚地咽在了嗓子里，只有声带在极为细微地震动。她用力攥紧了手里的背包带子，试图用一层极力伪装的不满来掩盖内心剧烈失衡的节拍。
            - paragraph [ref=e491]: 而站在惠理身侧半步距离的诗织，在听到付款提示音的那一瞬，手里的动作也停顿了大约两秒。
            - paragraph [ref=e492]: 她的表情依然像封冻的湖水，没有产生哪怕惠理那般夸张的起伏。但如果靠得足够近去观察，就会发现她微微偏过了那张犹如工艺品般精致的脸庞，将视线从闪烁的收银系统上平移开来，极其自然地垂向了地面。
            - paragraph [ref=e493]: 在那件妥帖的浅蓝色衬衫领口处，由于呼吸频率的停滞，精致的锁骨下隐约起伏了一瞬。
            - paragraph [ref=e494]: “谢谢。”
            - paragraph [ref=e495]: 她用一种仅限他们三人能够听清的音量轻声说道。诗织的黑眼眸里流转过一种极度压缩的情感波动。她并不擅长也不习惯用言语去夸赞什么，但她一定会在心底的某本并不存在的账薄里，用最清晰的笔触将这份微小的人情和照顾记录下来。
            - paragraph [ref=e496]: 诗织伸出那柔软白皙的手指，安静而又自然地接过了塑料袋的提手，不仅是在分担重量，也是为了避免惠理因为过度的慌乱而将早餐碰掉在地上。
            - paragraph [ref=e497]: “下次如果有需要跑腿或者搬东西的事，可以叫惠理去。”
            - paragraph [ref=e498]: 诗织抬起下颌，用一种类似于宣布天气预报般平缓的语气，在转过身准备走向大门时补充了这一句。
            - paragraph [ref=e499]: 这句话犹如一颗扔进火药桶的火星，迅速将被小动作拿捏得死死的惠理重新点燃。她立刻像只遭到背刺的猫一样跳了起来。
            - paragraph [ref=e500]: “为什么是我去跑腿啊！姐姐你现在是在拿我抵债吗？”
            - paragraph [ref=e501]: “因为你刚才一直吵着要买草莓牛奶。”
            - paragraph [ref=e502]: 诗织甚至没有回头看气鼓鼓的妹妹，径直推开了便利店那扇沉重的玻璃门。她的背影看起来如此平坦稳重，走路的步幅不大，每一步却异常扎实。而在那层静谧之下，只有她自己清楚，那句“可以叫惠理去”的真正潜台词，其实是用行动默许了三个人的生活轨道可以进一步交汇。
            - paragraph [ref=e503]: 小哥哥看着前方这一动一静的背影。
            - paragraph [ref=e504]: 这对双胞胎无疑是两块质地完全不同的拼图。惠理所有的能量都会如同太阳辐射般直接向外挥发，任何好感与慌张都无所遁形；而诗织则是将所有的温度向内聚拢，压缩成一堵秩序分明的沉默高墙，然后独自在这堵墙壁后仔细消化一切。
            - paragraph [ref=e505]: 用一顿简单的早餐去打破那层薄弱的邻里隔阂，这笔交易实在太划算了。她们不知道，在这微不足道的社交互动背后，正是为将来拉拢那个拥有极高价值的技术工种父亲，佐伯龙一，所布下的最坚固的锚点。在三个月后温度跌破极限的世界里，没有哪一种忠诚，会比女儿身陷其中的羁绊来得更加稳固。
            - paragraph [ref=e506]: 两人在前面的街口停下了脚步，那是通往大学校园与商业街的分岔路。
            - paragraph [ref=e507]: 风中卷着属于这座城市初秋特有的干爽气息，红绿灯发出规律的跳动声。一切都显得繁荣、忙碌且富有生机。
            - paragraph [ref=e508]: “我今天上午有点其他方面的琐事要办，就不去学校了。”小哥哥用最平淡的语调切断了继续同行的可能，他需要把今天的精力放在更迫切的物资考察上。
            - paragraph [ref=e509]: 惠理的肩膀垂了一点点，手里那袋草莓牛奶也被她捏得有些变形。但她瞬间又扬起一个试图驱散一切阴霾的笑容。
            - paragraph [ref=e510]: “那……那你自己注意安全嘛，记得吃早餐！”她咬着右边的小虎牙，朝他挥了挥手。
            - paragraph [ref=e511]: 诗织则是退后了半步，站在惠理身后。她没有再开口说任何一句叮嘱的话，仅仅是在小哥哥转身的那一霎那，目光定格在他的背影上，大约过了三秒钟，然后才悄无声息地收回视线。
            - paragraph [ref=e512]:
              - img
              - button "生成图片" [ref=e513] [cursor=pointer]
            - paragraph [ref=e514]: 小哥哥没有回头。属于《冰箱计划》的筹备倒计时，在他脑内滴答作响。每一个看似安逸的早晨，都是为深渊所积攒的筹码。
