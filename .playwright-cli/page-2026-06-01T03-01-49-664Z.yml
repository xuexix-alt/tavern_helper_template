          - generic [ref=e230]:
            - paragraph [ref=e231]: 2026年9月14日，星期天。九月的天空蓝得像是被人用滤镜调过，几朵懒洋洋的云趴在公寓楼顶不肯动。小哥哥站在2001室的落地窗前，手里捏着一只深灰色陶瓷杯，里面飘出黑咖啡的焦香。楼下街道上，一辆搬家公司的卡车正缓缓倒进车位，几个工人叼着烟开始卸货。再远一点，星穹商场的电子屏滚动着秋装上新广告。
            - paragraph [ref=e232]: 世界正常得令人发指。
            - paragraph [ref=e233]: 他把杯子举到嘴边抿了一口，苦味顺着舌根滑下去。七天前，这杯咖啡还是用那只买了三年没洗过几次的咖啡机煮的，现在则出自一个叫“万象合成终端”的玩意儿。味道一模一样，不，应该说更稳定。每次水量、温度、萃取时间都像被尺子量过。精准，但总觉得缺了点人味儿。
            - paragraph [ref=e234]: 准确地说，是缺少“末日前的人味儿”。
            - paragraph [ref=e235]: 小哥哥转身靠在窗框上，目光落在客厅中央那扇本不该存在的金属舱门上。七天前，也就是9月7号晚上，他半夜被一阵轻微的震动吵醒，以为是地震，结果发现整间2001室正在以一种违反物理常识的方式扩展重组。第二天醒来，家里多了个只会说“我是伊甸”的超级AI，然后这个AI花了整整四十分钟告诉他：三个月后，全球气候会像被拔了插头的冰柜，温度断崖式下跌，然后连锁反应把整个现代文明冻成一坨坚硬的屎。
            - paragraph [ref=e236]: 当时他觉得这比朋友圈里转发的“XX星座本周运势”还扯。
            - paragraph [ref=e237]: 但现在他看着冰箱里凭空多出来的一大包似乎永不枯竭的面粉袋，以及在完全没有接通市政供暖的情况下、室内仍能维持26度的空调面板，不得不承认，这事儿好像是真的。
            - paragraph [ref=e238]: 最初的震惊过去之后，剩下的是漫长而黏稠的沉默。上班没心情，游戏打不进去，连外卖都吃不出咸淡。他试着跟一个关系不错的同事侧面提起“如果三个月后有超级寒潮怎么办”，对方笑他是不是看多了科幻片，然后给他发了个“末日求生攻略”的表情包。从那一刻起，小哥哥明白了：这件事只能烂在自己肚子里。
            - paragraph [ref=e239]: 说服别人？怎么说服？指着天气预报说“你看今天21度很舒适吧？三个月后零下五十度”吗？会被当成需要心理干预的对象。
            - paragraph [ref=e240]: 于是他花了整整三天整理思路。恐慌没用，逃避更没用。唯一的路是把这次先知优势转化成实实在在的生存资本。他在手机备忘录里开了一个加密笔记，标题是《冰箱计划》——因为他觉得这个世界三个月后就会变成一个大冰箱。
            - paragraph [ref=e241]: 第一条：囤物资。食物、水、药品、能源、防寒装备、工具，六类缺一不可。第二条：攒人。在这个公寓里，有几个邻居是他需要优先拉拢的。是靠提供无可替代的价值。第三条：藏底牌。伊甸的存在绝对不能暴露，至少在建立绝对信任之前不能。
            - paragraph [ref=e242]: 他把备忘录合上，走到万象合成终端的操作面板前。屏幕亮起，显示今日可合成：面粉、大米、纯水、罐头（猪肉/牛肉/蔬菜随机）。这玩意儿每天能合成一定量的基础食材，但功率有限，养三四个人还行，要是想喂饱一栋楼那就是做梦。大规模的物资储备还是得靠正经渠道购买。他算了算银行卡余额，中产的家底，三个月压缩开支，能囤出相当可观的量。
            - paragraph [ref=e243]: 问题是，怎么囤才不显得像个神经病？
            - paragraph [ref=e244]: “咚咚咚。”门被敲响了。
            - paragraph [ref=e245]: 近域监听台在脑海里自动标记：女性，约四十岁，情绪平稳，脚步声偏轻，判断为穿着室内拖鞋。小哥哥把终端界面关掉，走到金属安防门前。
            - paragraph [ref=e246]: 这扇门也是伊甸的产物。看起来跟公寓其他房门没什么区别，但门芯嵌了一层他看不懂的材料，门闩结构精密得像是从航天器上拆下来的。他拉开门，门外站着林月华，围着那条标志性的深蓝色棉布围裙，双手捧着一个白色的保温盒。
            - paragraph [ref=e247]: “小哥哥，刚出锅的饺子。白菜猪肉馅儿的，趁热吃。”她把保温盒递过来，带着点儿不容拒绝的笑意，往他身后瞄了一眼，“一个人在家？今天没加班啊？”
            - paragraph [ref=e248]:
              - img
              - text: "image###sfw, 1girl, solo, solo focus, ${\"name\":\"Lin Yuehua\", \"angle\":\"from front\", \"upperBody\":\"sfw\", \"lowerBody\":\"hidden\"}$, ((male pov)), upper body, looking at viewer, front view, (gentle smile:1.2), friendly expression, soft eyes, mature woman, (curvy figure:1.1), indoor, apartment, open door, doorway, holding, (holding insulated box:1.2), offering food, hands forward, white insulated box, (steam:0.8), warm atmosphere, detailed background, wall, carpet, soft lighting, sidelighting, depth of field, domestic, neighbor, dark blue cotton apron, apron, tied waist, masterpiece, best quality, ultra-detailed, photorealistic###"
            - paragraph [ref=e249]: “月华姐，每次都麻烦你。”小哥哥接过盒子，掌心隔着塑料层感受到滚烫的温度。这大概是他在这个公寓里接收到的最高频的善意。
            - paragraph [ref=e250]: “说什么麻烦，你上次不是还帮我修好了那台加湿器嘛。”林月华摆摆手，顺带纠正道，“卫国说那东西内部线路全乱了，你一个人给理顺了，手艺不错。”
            - paragraph [ref=e251]: “哪里，运气好而已。”
