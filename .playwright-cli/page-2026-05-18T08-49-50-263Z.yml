            - paragraph [ref=e332]: 这句恭维说得不算高明，但胜在真诚。赵卫国翻杂志的手指停了一拍，没有回应，但肩膀的线条似乎松了那么。
            - paragraph [ref=e333]: 林月华倒是笑了，眼角挤出两道浅浅的纹路。她端起绿茶抿了一口，说：“你别夸他，他这人不禁夸，一夸就板着脸装没听见，其实心里美着呢。”说着她看了眼墙上的挂钟，时针刚过三点，“对了小哥哥，你晚上要不要留下来吃个便饭？我正准备做红烧排骨，多一个人也就多添双筷子的事。不过家里没什么好菜，你将就一下。”
            - paragraph [ref=e334]: 这个邀请来得比预期的快。小哥哥差点直接答应，但转念一想，今天是初次正式拜访，留饭可能过于冒进。更何况赵卫国刚才的戒心虽然略有松动，但那双审视的眼睛还在。留下来吃饭，意味着要在人家夫妻的私人晚餐时间占据一席之地，这步子迈得有点大。
            - paragraph [ref=e335]: “嫂子太客气了。”他把橙汁放下，杯底在玻璃茶几上碰出清脆的一声，“今天就不打扰了，我就是过来坐坐，聊几句就走。下次有机会一定尝尝您的手艺，之前那几块雪花酥我到现在还惦记着。”
            - paragraph [ref=e336]: 林月华听他提起雪花酥，先是怔了怔，然后脸上的笑意浓了几分。“那个啊，那个是去年圣诞节时试做的，放了蔓越莓干和杏仁片。你爱吃的话，过几天我再做一些，做好了让卫国给你送过去。”
            - paragraph [ref=e337]: “那太麻烦了……”
            - paragraph [ref=e338]: “不麻烦。”林月华轻轻摇头，语气温和却有一种不容推辞的笃定，“反正我在家也是闲着。外面天冷，就得多吃点甜的。”
            - paragraph [ref=e339]: 外面天冷？小哥哥下意识瞥了一眼窗外。九月的午后阳光正暖，窗台上那盆绿萝的叶子被晒得油亮亮的。林月华说的“天冷”显然不是指今天，是某种更宽泛的、主妇式的对季节变化的敏感，她大概已经开始操心秋天之后的冬天了。
            - paragraph [ref=e340]: 这份操心让他心里微微一动，但他脸上不动声色，只是笑着说：“那我就厚着脸皮等着了。”
            - paragraph [ref=e341]: 接下里的十分钟里，话题散漫地在各种日常琐事间游走：楼下新开的便利店东西比连锁超市贵但二十四小时营业，小区物业通知下个月要清洗外墙所以得关好窗户，暖气管道今年冬天不知道会不会出问题。林月华主导着大部分对话，声音柔和而流畅，永远是简短直接的功能性发言，比如“那个便利店老板是东北人”或“暖气管道去年就锈了”；小哥哥则扮演一个合格的倾听者，在合适的地方点头、提问、或者贡献一两个自己的见闻。
            - paragraph [ref=e342]: 聊到小区物业的时候，林月华叹了口气。“说起来，前两天停电的事你知道吧？那天晚上黑了，我正好在切菜，差点切到手。这种公寓楼吧，看起来光鲜，其实管线都老了，也不知道物业什么时候能彻底检修一遍。”
            - paragraph [ref=e343]: “那天停电了吗？”小哥哥装傻。他当然知道——2001室的伊甸系统全程运转如常，他甚至没察觉到市政电网的短暂崩溃，直到后来看到手机里业主群炸了锅。但他不能说这个，只能顺着林月华的话往下接，“我当时睡着了，完全没感觉。”
            - paragraph [ref=e344]: “年轻人睡眠就是好。”林月华感慨了一句。
            - paragraph [ref=e345]: 赵卫国开口：“那天停了大概四十分钟。只有十八到二十层停了，应该是这栋楼的供电分支线出了问题。”他的语气平淡，却天然带着一种专业人士的笃定，让人没法质疑。
            - paragraph [ref=e346]: “那以后还可能停吗？”小哥哥顺势问道。
            - paragraph [ref=e347]: 赵卫国想了想，答了三个字：“说不好。”
            - paragraph [ref=e348]: 这个回答让小哥哥心里的算盘珠子拨动了几下。如果供电不稳定，那节阶段三的发电设备采购就得提上日程了。不过现在还远不到谈这些的时候，他只是把这个信息收进脑子里，准备回去后再慢慢盘算。
            - paragraph [ref=e349]: 挂钟的时针指向三点四十的时候，小哥哥觉得差不多了。初次拜访不宜太久，太久容易显得别有用心，虽然他来串门的目的确实不只是叙旧，但至少不能让人觉得他别有用心。他站起身，把空了的橙汁杯放在托盘边上。
            - paragraph [ref=e350]: “那我先回去了，今天叨扰了。”
            - paragraph [ref=e351]: “说的什么话。”林月华也站起来，理了理衣摆上其实并不存在的褶皱，“有空常来坐，别客气。反正我天天都在家。”
            - paragraph [ref=e352]: 赵卫国从杂志上抬起眼，看了小哥哥一眼，然后微微点了点头。这轻得几乎看不出来，但对于一个习惯用双臂抱胸表达防御姿态的人来说，已经算是一种认可。
            - paragraph [ref=e353]: 林月华把小哥哥送到门口，手搭在门把手上犹豫了一下，然后仿佛不经意地加了一句：“你一个人住，吃饭别总凑合。年轻人身体要紧。”
            - paragraph [ref=e354]: “知道了，谢谢嫂子。”小哥哥在门口转身，朝她挥了挥手，余光扫到赵卫国已经走到妻子身后，一只手自然而然地扶在她肩膀上，像是在宣告某种边界，又像是在给她一个依靠。
            - paragraph [ref=e355]: 门关上后，走廊重新恢复寂静。小哥哥踩着那啪嗒啪嗒的拖鞋声往回走，穿过2002、2004、2005室紧闭的房门，最后停在2001室门口。他伸手按在门把上的生物识别区，门锁发出极细微的咔嗒声，气密门安静地滑开，露出玄关暖黄色的灯光。
            - paragraph [ref=e356]: 他走进门，把门在身后关上，然后靠着门板长长地呼出一口气。
            - paragraph [ref=e357]: 月华嫂子比想象中好说话，但赵卫国那双眼睛绝对不好糊弄。想要取得这对夫妻的信任，光靠饼干和闲聊远远不够，得拿出实实在在的价值来。
            - paragraph [ref=e358]: 不过至少今天这第一步，迈得还算稳当。
