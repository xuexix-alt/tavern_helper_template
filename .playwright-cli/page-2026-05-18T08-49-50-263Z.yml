            - paragraph [ref=e502]: 接下来的气氛比之前任何一次见面都更松快。赵卫国重新拿起老花镜继续看参数表，偶尔念出一个问题让小哥哥帮忙在手机上查数据。林月华坐在一旁，手里捧着茶杯，听两个男人聊那些她听不太懂的电压和功率，却不显得无聊。她的目光在丈夫和小哥哥之间来回游移，最后落在茶几上那碟还没吃完的苹果上，站起来又去切了两颗猕猴桃。
            - paragraph [ref=e503]: 小哥哥告辞的时候已经是下午五点多。林月华把他送到门口，手里还拿着那盒伯爵红茶的盒子，盖子已经拆开了，显然刚才又泡了一杯。她站在门框边上，张了张嘴好像想说什么，最后只是伸手帮他把防寒服的领子翻了翻，那动作和刚才喂丈夫吃苹果一样自然。
            - paragraph [ref=e504]: “下次来不用带东西。”她说。
            - paragraph [ref=e505]: “知道了。”小哥哥点了点头，然后跨出门去。
