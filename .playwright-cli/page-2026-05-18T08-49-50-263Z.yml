            - paragraph [ref=e480]: 从玄关的监听到林月华那声叹息，到小哥哥拎着两个精品超市的纸袋站在 2003 室门口，中间只隔了不到四十分钟。伊甸的音轨分析标得清清楚楚：林月华在厨房里翻找了大概三分钟，然后小声嘀咕了句“密封袋又用完了”，语气里的烦躁值被标到了 6.7。对于一个说话永远不紧不慢的主妇来说，这已经算是相当程度的情绪波动了。赵卫国那会儿正在书房里拆一个旧配电箱，螺丝刀拧得咔咔响，根本没听见。
            - paragraph [ref=e481]: 这简直是瞌睡送枕头。小哥哥把手机往口袋里一揣，套上防寒服就出了门。公寓楼底下的便利店肯定没有林月华看得上眼的牌子，他直接开车去了两个街区外那家 Ole，在厨房用品区拎了一套日本进口的硅胶密封袋，又在茶品区挑了一盒有机伯爵红茶。收银的小姑娘扫条码的时候多看了他一眼，大概觉得一个年轻男人买这种主妇专用品有点奇怪，但也没多问。回去的路上他顺便在万象终端上合了两罐黄桃罐头，标签用的是超市自有品牌，生产日期和保质期都印得像模像样，塞在纸袋最底下当添头。
            - paragraph [ref=e482]: 现在他站在 2003 室门口，右手提着纸袋，左手在门板上敲了三下。门内传来林月华由远及近的脚步声，然后是短暂的停顿，又在看猫眼。接着门锁咔嗒旋开，那张温婉的脸从门缝里探出来，杏眼里还带着点刚才翻箱倒柜没找着东西的残留情绪，但看到是小哥哥的瞬间，意外感明显压过了烦躁。
            - paragraph [ref=e483]: “小哥哥？”她把门拉宽了些，视线自然落在那个印着 Ole 标志的纸袋上，“怎么又过来了？上午不是才——”
            - paragraph [ref=e484]: “路上刚好看到点东西，觉得嫂子应该用得上。”小哥哥把纸袋举高了一点，纸袋底部那盒密封袋的棱角在袋口若隐若现。他说这话的时候没用什么“正好路过”之类的客套话，反正大家都知道这栋楼底下只有便利店，Ole 的商品不可能恰好出现在自家楼下。他选择直接承认，反而显得诚恳。
            - paragraph [ref=e485]: 林月华怔了一下，然后下意识伸手接过纸袋。她打开看了一眼，密封袋的品牌是她惯用的那个日本牌子，大号加厚款，盒盖上还印着“双重密封锁条”的字样。她抬头看小哥哥的时候，脸上的表情变了几个来回：先是惊讶，然后是某种被言中了的微妙窘迫，一个人怎么会知道我家缺密封袋，最后这些情绪全化成了无奈又好笑的神色。
            - paragraph [ref=e486]: “你是会算命还是怎么的。”她摇了摇头，侧身让他进门，“进来吧，我正好烧了水。”
            - paragraph [ref=e487]: 客厅还是上次那个整洁得让人不好意思坐的样子。赵卫国坐在沙发上，膝盖摊着一本翻毛了边的电气工程手册。他看到小哥哥进来，照例是那种像验收建材一样的审视目光，但这次点了下头，还说了句“坐”，简短得像个标点符号。对于赵卫国而言，这已经算是相当热情的欢迎了。
            - paragraph [ref=e488]: 小哥哥在沙发另一边坐下。林月华把纸袋放在茶几上，先掏出那盒伯爵红茶，翻到背面看了一眼配料表，然后满意地嗯了一声。“这个牌子不错，我之前在精品超市试喝过一次，但卫国说红茶都一个味儿，不让我买。”
            - paragraph [ref=e489]: “那是因为你买了太多茶叶，柜子里还有三盒没拆封的。”赵卫国头也不抬地接了一句。
            - paragraph [ref=e490]: “那三盒是绿茶，一个是碧螺春，一个是龙井，还有一个是同事从台湾带的高山茶。”林月华把红茶放在茶几上，语气里带着那种“你永远搞不清楚家里有什么”的无奈，但嘴角是弯的，“红茶是红茶，绿茶是绿茶，不一样的。”
            - paragraph [ref=e491]: 小哥哥适时插了一句：“上次嫂子泡的茶挺好喝的，这次看到这个牌子就顺手拿了，也不知道合不合口味。”
            - paragraph [ref=e492]: “合。”林月华已经走到茶水台前，把茶包拆出来丢进白瓷茶壶里。热水注入壶口时腾起的白色蒸汽裹着佛手柑的香气，在客厅里漫开。她端了三个杯子回来，一杯递给赵卫国，一杯放在小哥哥面前，自己那杯贴在鼻尖下闻了闻，然后露出一副“果然没看错”的满足表情。
            - paragraph [ref=e493]: 赵卫国端起杯子啜了一口，没说话，但上唇沾到茶水之后微微动了一下，像是勉强认可了就算换一种茶叶也不是不能喝的事实。小哥哥看在眼里，心想这位前建筑工人的味觉大概和他说话一样，能省则省。
            - paragraph [ref=e494]: “你买这些东西花了多少钱。”林月华把纸袋里的东西一样样摆出来：密封袋、红茶、两罐黄桃罐头。她抓起罐头翻了翻保质期，然后皱了皱眉，“这些东西可不便宜，你一个人住，花钱这么大方可不行。”
            - paragraph [ref=e495]: “没多少钱。”小英雄摆了摆手，然后换了个话题，“其实过来还有点事想请教卫国哥。上次聊到供电隐患，我回去翻了翻网上能查到的资料，找到几张工业级柴油发电机的参数表，但那些参数我看不太懂，想请卫国哥帮忙过过眼。”
