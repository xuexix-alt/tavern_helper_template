            - paragraph [ref=e411]: “正要敲门呢。”林月华先笑了。今天她穿的是那件米白色针织开衫，长发照旧盘成毫不毛糙的发髻，木簪稳稳当当别在脑后。左手提着一个浅蓝色的纸袋，上面印着一家精品超市的商标，袋口上沿露出透明的食品密封盒，可以隐约看到盒子里整整齐齐码着几排方方正正的雪花酥，每块都切成大拇指大小，表面嵌着蔓越莓干的暗红色和杏仁片的乳白。她右手还拎着另一只小些的纸袋，密封盒里装的是切好的水果，橙肉和猕猴桃片按颜色间隔排好，浇了薄薄一层蜂蜜。
            - paragraph [ref=e412]: “嫂子太客气了。”小哥哥侧身让出通道，比了个请进的手势，“快进来坐坐，正好我泡了咖啡，给您倒一杯。”
            - paragraph [ref=e413]: 林月华犹豫了大概半个呼吸。她的脚尖微微朝门里挪了一下，又收回去，目光快速扫了一眼玄关里头那一溜整洁的走廊，然后落在门边的鞋柜上。小哥哥注意到她这个细微的动作，立刻补了一句：“不用换鞋，回头我拖地就行。”
            - paragraph [ref=e414]: 这个台阶给得很及时。林月华说了声“那就打扰了”，跨进玄关，把两只纸袋叠放在鞋柜旁边的矮柜上，顺手捋了捋耳边的碎发。她的视线在玄关那几扇关着的客房门上停了一下，没有多问，只是安静地跟在小哥哥身后穿过第二道气密门，走进核心区的客厅。客厅那面伪装成落地窗的全景屏幕正轮播着初秋的城市风光，窗外是湛蓝的天和远处写字楼的玻璃幕墙，但视觉效果逼真得像是真有那么一扇窗。林月华站在原地看了两秒，语气里有点意外：“你家的采光真好，这个高度看出去比我那边舒服多了。”
            - paragraph [ref=e415]: 小哥哥差点接一句“这是假的”，但话到嘴边硬生生咽了回去，改成了：“当初买这间就是看中朝南。”
            - paragraph [ref=e416]: 他从开放厨房的料理台上取了一只干净的马克杯，从保温壶里倒出刚煮好的美式咖啡，又在杯碟上搁了两块消化饼干。热水和咖啡豆都是伊甸万象终端合成的，品质稳定得像专业咖啡店的出品，但这件事林月华不需要知道，他只把它当成普通手冲端到她面前。林月华接过杯子的时候，指尖碰到杯壁，低头看了一眼杯内泛着细密油脂的液体，眼底有一闪而过的惊讶，但没说什么，只是端着杯子在沙发边坐下来，姿态是惯常那种半边落座，随时准备起身的姿势。
