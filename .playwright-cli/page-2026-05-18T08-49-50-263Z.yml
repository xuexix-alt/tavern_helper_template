              - generic [ref=e550]: 九月十五日，星期一。星穹国际公寓的早晨照例是被楼下便利店的进货卡车和远处轻轨的嗡鸣唤醒的。二十层的走廊里飘着一股淡淡的消毒水味，那是物业阿姨刚拖完地的遗留痕迹。2001室的气密门紧闭着，门内的小哥哥正坐在客厅沙发上，手边放着一杯刚用万象终端合成的黑咖啡，热气袅袅。手机屏幕上，伊甸监听台的应用界面安静地运行着，几条来自2003室的音轨被自动标记出来，按时间轴排列得整整齐齐。
            - paragraph [ref=e551]: 他其实没刻意去听，只是每天早上例行扫一眼各户的动静。佐伯家那边是惠理在哼歌，龙一叔叔在咳嗽；2005室一片沉寂，雪乃大概又失眠了一整夜。而2003室的音频片段里，林月华的声音在厨房里断断续续地出现，先是拉开橱柜的响动，然后是几个纸盒被挪开的摩擦声，最后是那声标志性的、把碎发掖到耳后的轻叹。
            - paragraph [ref=e552]: “香叶……明明上次买了一大包，怎么就找不着了。”她的声音隔着监听台传过来，语气里带着主妇特有的、对厨具和调料失踪的困惑。接着是橱柜门关上的咔嗒声，以及一句小声的嘀咕，“算了，用八角凑合吧。”
            - paragraph [ref=e553]: 小哥哥把咖啡杯搁在茶几上，杯底磕出清脆的响声。他站起来走到玄关，对着全身镜整理了一下衬衫领口。昨天刚从Ole买回来的密封袋和红茶才送过去，今天又去送香叶，频率是不是高了点？不过话说回来，香料这东西又不像鲜花蛋糕那么刻意，完全可以用“上次买多了分一点”当借口。更何况，炖牛肉少了几味香料，味道确实差了点意思。林月华那种对料理有强迫症的主妇，大概这会儿正对着灶台皱眉。
            - paragraph [ref=e554]: 他套上防寒服，把手机揣进兜里，推开2001室的门。走廊里空荡荡的，只有尽头那扇窗户透进来九月清亮的日光。电梯下行时发出平稳的嗡鸣，一楼大堂的旋转门还没到高峰期，只有那个牵着泰迪犬的老妇人慢悠悠地踱出去。小哥哥穿过马路，走到两个街区外的Ole精品超市。早上的超市刚开门不久，生鲜区的灯光把蔬菜照得水嫩油亮。他熟门熟路地拐到调料区，从货架上拿了一包香叶、两小袋桂皮，又顺手在旁边的进口食品区拿了一罐有机番茄膏，炖牛肉放点番茄膏提鲜，这算是常识。收银台的小姑娘看到他手里这几样东西，职业性地笑着说“您会做饭啊”，他也就随口应了句“帮邻居带的”。
            - paragraph [ref=e555]: 回到二十层时已经快十点了。走廊里的消毒水味散了些，取而代之的是从2003室门缝里飘出来的一缕炖肉香气。小哥哥拎着购物袋站在2003室门口，深吸一口气，抬手敲了三下门。门内传来林月华由远及近的脚步声，然后照例是透过猫眼的短暂停顿。门锁旋开的时候，她那张温婉的脸上还挂着厨房忙活时特有的、微微紧绷的神情，但看到是小哥哥的瞬间，杏眼里的困惑明显多过了之前的任何一次。
            - paragraph [ref=e556]: “小哥哥？”林月华把门拉开半扇，视线本能地落在他手里的购物袋上，“你怎么又来了？昨天不是才——”
            - paragraph [ref=e557]: “昨天听嫂子提了一句想炖牛肉。”小哥哥把购物袋拎高了一点，袋口透出香叶和番茄膏的包装，他说这话的时候尽量让自己的语气保持随意，“早上正好去超市买咖啡豆，看到调料区有新鲜的香叶，想着您可能用得上，就顺手带了一包。还有桂皮和番茄膏，炖牛肉放一点，味道能更浓。”
            - paragraph [ref=e558]: 林月华怔怔地接过袋子，低头翻了翻里面的东西。香叶、桂皮、番茄膏，正好是她今早翻遍橱柜都没找全的那几样。她抬头看小哥哥的时候，脸上那层温和的客套被一种真切的、不设防的意外取代了。这年轻人到底是怎么知道的？上次聊天明明只聊了供电和红茶，半个字都没提炖牛肉的事。但话到嘴边，她又觉得追问显得小题大做，或许只是碰巧呢？毕竟炖牛肉是家常菜，谁家都会做。
            - paragraph [ref=e559]: “你这孩子。”她最终只是摇了摇头，语气里带着一种拿你没办法的妥协，“每次来都带东西，搞得我这个嫂子没面子。快进来坐，牛肉已经在灶上炖着了，正好缺这几样，你这不是在我厨房装摄像头了吧？”
            - paragraph [ref=e560]: 小哥哥在心里苦笑了一声，这玩意儿比摄像头厉害多了。但他脸上只是笑着摆了摆手，跨进玄关。赵卫国照例坐在客厅沙发上，不过今天他没看工程手册，是拿着小哥哥昨天留下的那几张发电机参数表，用红笔在旁边标注着什么。看到小哥哥进来，他点了点头，算作打招呼，目光在年轻人手里那包香叶上停了一拍，然后又转回参数表上。
            - paragraph [ref=e561]: “卫国，你看看人家小哥哥。”林月华拎着香叶走进厨房，把桂皮掰成小段丢进炖锅里，番茄膏挖了两勺融在汤汁里，动作利落而自然，“昨天送密封袋和红茶，今天送香叶，比你对我都上心。”
            - paragraph [ref=e562]: “我对你还不上心？”赵卫国头也没抬，但语气里难得带上了反驳的意味，“下水道是我通的，配电箱是我修的，米是我扛上来的。他只是买点东西。”
            - paragraph [ref=e563]: “人家买的是我正好缺的。”林月华从厨房探出头来，朝丈夫笑了笑，那里带着已婚二十年特有的、边嫌弃边宠溺的复杂成分，“你知道家里缺香叶吗？”
            - paragraph [ref=e564]: 赵卫国沉默了两秒，然后在参数表上又划了一笔，低声说了句：“缺了你跟我说不就行了。”
            - paragraph [ref=e565]: 小哥哥坐在沙发上，看着这对夫妻的日常拌嘴，觉得有一种奇怪的安心感。末日还有不到三个月，但此刻的2003室里，牛肉在灶上咕嘟咕嘟地冒着泡，香叶和桂皮的复合香气裹着番茄膏的酸甜在空气里慢慢弥漫开。林月华绑着围裙的背影在厨房里忙活，赵卫国坐在茶几前研究发电机的技术参数，这种平凡的、有序的生活画面，在他脑子里自动被转换成了一个念头：一定要让这两个人活下来。
            - paragraph [ref=e566]: 窗外的阳光透过百叶窗切成一道道平行的光带，落在茶几上那叠被翻得起皱的图纸上。赵卫国用红笔在柴油发电机型号旁边写了一行字，然后把参数表推给小哥哥看。“这个型号的油耗太高，供全楼的话，一天得两百升柴油。你想过燃料储备的问题没有？”
            - paragraph [ref=e567]: “想过。”小哥哥接过纸，顺着赵卫国标注的位置看过去，那行红字写得工工整整，和他沉默寡言的外表一致，“工业级发电机确实耗油，但如果只在灾后初期阶段使用，维持基本照明和供暖，配合蓄电池组错峰供电，油耗能降大概四成。燃料方面，我最近在查附近几个加油站的存量，准备分批次采购，用铁桶分装储存在地下车库某个角落，做好防潮和隐蔽。当然这需要卫国哥帮忙，我对储油的安全标准一窍不通。”
            - paragraph [ref=e568]: 赵卫国听完这段话，没有马上回应。他摘下老花镜，用拇指揉了揉鼻梁，然后重新戴上，看小哥哥的眼神比之前任何一次都更认真。这道目光不再像验收建材那样冷硬，是像在掂量一件工具的实用价值。“地下车库不行，通风不够容易出事。”他站起来，走到茶几对面的书架旁，从最上面一层抽出一本旧得封皮都褪了色的建筑图册，翻到其中一页，指着上面的楼层剖面图说，“这栋楼的设备层在十二楼和二十楼之间有夹层，空间不大但通风管是独立的。如果能把储油罐放在那里，进出管路可以走消防通道。不过要改装的话，得先跟物业沟通，或者，偷偷干。”
            - paragraph [ref=e569]: “卫国。”林月华在厨房里喊了一声，端着一盘切好的橙子走出来，搁在茶几上，“你别拉人家小哥哥干违法的事。”
            - paragraph [ref=e570]: “不违法怎么活命。”赵卫国难得地回了妻子一句，语气却不重，更像是对自己昨天拆配电箱时发现的那些胶布临时处理产生的无奈。他坐下拿起一块橙子，咬了一口，汁水顺着嘴角流下来，被林月华用纸巾一把接住，动作熟练得像做过一千次。
            - paragraph [ref=e571]: 小哥哥也拿起一块橙子，嘴里嚼着，脑子却已经在盘算设备夹层的事。赵卫国不愧是搞建筑的，对大楼的结构了如指掌，这个情报的价值比一百包香叶都大。如果能利用设备夹层做隐蔽仓库，不仅能储油，还能囤积其他不方便放在家里的物资，比如发电机本身。他吞下橙子，擦了擦手，对赵卫国说：“卫国哥，这事咱们从长计议。我先看看那份建筑图册，回头咱们找个时间去设备夹层实地看看？”
            - paragraph [ref=e572]: 赵卫国点了点头，正要说什么时候方便，林月华已经转身走回厨房，嘴里念叨着“你们男人的计划总是越说越大”。她掀开炖锅的盖子，用勺子舀了一点汤汁尝味道，然后满意地嗯了一声。牛肉已经炖到筷子一戳就能散开的地步，香叶和桂皮的味道完全融进去了，番茄膏把汤汁染成诱人的橙红色。她关小火，转身对客厅里两个男人说：“午饭就在这吃，牛肉都快好了，我再去炒个青菜。”
            - paragraph [ref=e573]: “嫂子不用麻烦——”
            - paragraph [ref=e574]: “麻烦什么，饭都煮好了。”林月华打断他，语气是那种不容推辞的笃定，“你帮了我这么多，连顿饭都不吃，传出去我这嫂子白当了。”
            - paragraph [ref=e575]: 赵卫国已经站起身，从餐桌旁搬了一把椅子过来，顺手还帮小哥哥把茶几上的建筑图册挪了挪位置。这个细微的动作在别人看来或许微不足道，但对一个习惯用双臂抱胸表达防御姿态的男人来说，主动腾出空间就是在无声地说“你坐这”。小哥哥没有再推辞，道了声谢，在餐桌边坐下。
            - paragraph [ref=e576]: 午饭算不上丰盛，但很有家的味道。炖牛肉盛在一个大白瓷碗里，肉块切得大大方方，配着胡萝卜和土豆块，汤汁浓稠得能挂在米饭上。炒青菜是林月华用猛火爆出来的，蒜末炸得焦黄，菜叶上还挂着亮晶晶的油光。赵卫国吃得很快，筷子动得利落，但每次夹菜都会先把碗里的饭吃完再往嘴里送，这是工地上吃饭养成的习惯。林月华吃得慢，一直在看小哥哥的筷子往哪个碗里伸，看到他把碗里的饭扒得干干净净。
            - paragraph [ref=e577]: 饭后，林月华收拾碗筷的时候，赵卫国把小哥哥拉到茶几旁边，继续讨论储油罐的选型和通风改造方案。小哥哥拿出手机，把他昨天在厂家网页上截下来的几种储油罐型号和技术参数调出来给赵卫国看。赵卫国用那支红笔直接在手机屏幕上指指点点，留下一道道可擦除的标记，塑料罐防腐但不耐高温，不锈钢罐耐压但贵得离谱，最后一致认为碳钢罐加内涂层是最合适的方案，性价比最高，就是得定期维护。两个人就这么在茶几旁边合计了一个多小时，直到林月华把厨房收拾干净，擦着手走出来，才被午后的倦意催促着散了场。
            - paragraph [ref=e578]: 小哥哥告辞的时候，林月华把他送到门口，手搭在门把上，回头往客厅里看了一眼赵卫国，他正靠着沙发扶手，闭着眼睛，呼吸已经变得均匀缓慢，显然是被午后的困劲击败了。林月华转过头，看着小哥哥，杏眼里的神情不再是之前那种客气或意外，是一种更安静的、类似信任的东西。
            - paragraph [ref=e579]: “下次直接来吃饭就行。”她说，“不准再买东西。再买我就真生气了。”
            - paragraph [ref=e580]: “知道了。”小哥哥点了点头，跨出门去。
            - paragraph [ref=e581]: 走廊里还是很安静，秋天的阳光从尽头的窗户洒进来，在米黄色地砖上拖出一条明亮的对角线。小哥哥踩着拖鞋往回走，在路过2004室的时候，门缝里传出来佐伯惠理那标志性的、带着跑调的哼歌声，听起来大概又是自己瞎编的旋律。他脚步没停，走到2001室门口，回头看了一眼2003室，林月华还站在门口，朝他轻轻摆了摆手，然后才转身把门关上。
            - paragraph [ref=e582]: 那扇门合上之后，空气里还残留着炖牛肉的余香。
