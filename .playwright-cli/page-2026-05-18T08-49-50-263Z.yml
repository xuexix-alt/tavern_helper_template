              - generic [ref=e231]: 我们来看看用户的任务。用户要求开始创作灾变前夕的剧情，根据开局第一幕的需求，我需要写一篇具有沉浸感的开场故事。当前时间是公元2026年9月14日14:00，末日天数-90，社会一切正常。小哥哥7天前获得伊甸庇护所，开始从震惊走向接受和策划。我需要展现社会常态氛围、小哥哥的心态变化、邻里群像，以及初步的布局思路，同时严格遵守边界约束，不能提前暴露末日或伊甸，不能跳跃到灾后。文风要轻小说，有内心独白但不用特殊符号。让我先对齐变量，然后开始正文。
            - paragraph [ref=e232]: 九月的午后，瑞峰市的天空澄澈得像一块被擦过的蓝玻璃，连一片多余的云都找不到。星穹国际公寓大堂的旋转门不停地转动着，穿西装的上班族、牵着宠物狗的老妇人、推着婴儿车的年轻母亲，每个人都在按照各自的轨道运行。一楼便利店的自动门叮咚一声打开，走出来一个抱着三瓶矿泉水和一袋吐司面包的大学生，他正低头看手机，差点撞上门口的盆栽。
            - paragraph [ref=e233]: 小哥哥站在二十楼自己房间的落地窗前，看着远处市中心高耸的写字楼群。那些玻璃幕墙反射着下午的日光，像一片片嵌在天际线上的棱镜。楼下的主干道上车流密集，出租车、私家车、公交车挤成一条缓缓蠕动的金属河。这画面太正常了，正常到让人几乎觉得七天前发生的事只是一场荒诞的梦。
            - paragraph [ref=e234]: 但2001室内部的某些细节，正在无声地否定这个想法。
            - paragraph [ref=e235]: 玄关的鞋柜旁边多了一个原本不存在的凹槽，凹槽里嵌着一块巴掌大的金属面板，上面有淡蓝色的环形呼吸灯在缓慢地明灭。客厅原本的墙壁上多了一道封闭的气密门，门框是某种看不出材质的暗灰色合金，摸上去冰凉但并不刺骨。厨房角落的料理台被替换成了流线型的操作终端，看起来像某种概念家电展上的未来产品，只是上面没有任何品牌的logo。从上周日到今天，小哥哥花了整整七天时间，才勉强说服自己这不是什么整蛊节目组的隐藏摄像机，他试过敲打墙壁，试过用手机拍下来发到网上搜图，试过用各种角度拍照想找出破绽。什么都没找到。这个名叫“伊甸”的东西，用平板的合成语音把一场即将在三个月后降临的全球气候灾难告诉了他。
            - paragraph [ref=e236]: 十二月十四日。超级寒潮。文明瓦解。
            - paragraph [ref=e237]: 最初那两天，他几乎每晚都失眠。白天照常去上班，对同事挤出正常的微笑，在会议上做完自己的工作汇报，午休时还跟同事一起去楼下吃了碗牛肉面。但一回到公寓就完全变了一个人，反复检查伊甸的每一处细节，把那个合成音发出的每一个字都在脑子里重放十几遍。到了第三天，震惊和怀疑开始褪去，取而代之的是一种奇怪的冷静。他不是科学家，无法从气候模型上验证伊甸的说法。他不是政府官员，没有渠道去核实什么全球级别的灾变预警。他只是一个住在星穹国际公寓2001室的普通上班族，月薪刚过万，房贷还有二十年，车贷还剩三年。但伊甸的力量是真切的。那扇打不开的气密门，那台能凭空合成面粉和罐头的神秘终端，那个能听到门外走廊动静的监听系统，它们不可能是幻觉。
            - paragraph [ref=e238]: 小哥哥转过身，视线扫过客厅茶几上摊开的笔记本。那是从第四天开始写的，最初只是潦草的几行字，记录伊甸提到的灾变时间点和类型。到了第六天，笔记本已经多了好几页内容，字迹也从潦草变得工整。他甚至在第七天画了一张简易的表格，分成了物资、人脉、伊甸能力、资金四个区块。这是他的初步布局设想，虽然还很粗糙，但他知道必须抓紧每一分每一秒。
            - paragraph [ref=e239]: 七天前，他对末日的认知还停留在电影和小说里。现在，他开始用一些从未用过的词汇做最精确的计划。
            - paragraph [ref=e240]: 资金是第一个问题。他不是亿万富翁，不能直接买下整层楼来做据点改造。但中产的身份也有一个好处，不太引人注目。太大的动静会引起邻居和物业的注意，而他现在最不想做的事就是暴露任何异常。他翻看着笔记本，上面列了几种可能的物资囤积方向：食物、药品、能源设备、工具。每一样都需要钱，但更需要的是一份不引起怀疑的采购计划。
            - paragraph [ref=e241]: 第二个问题是人。这座公寓里住着不少人，有些是他的邻居，有些只是偶尔在电梯里碰见过。纪宁，住在2002室，楼里的几位住户偶尔会在走廊遇上她。陈宇也住2002室。林月华和赵卫国在2003室，赵卫国是沉默寡言的中年男人。佐伯诗织和佐伯惠理在2004室，惠理看起来是那种容易被辨别的性格类型，嗓门不大但语气里总带着明显的上扬尾音。雪乃和凌音在2005室，雪乃是大学老师。他们都是再普通不过的普通人，此刻正在各自的房间里过着各自的生活，对这些事毫无察觉，对他这间2001室里的秘密更是一无所知。
            - paragraph [ref=e242]: 小哥哥走到玄关，看了一眼墙上的金属面板。伊甸的监视台正在工作，走廊方向的音频信号被转换成几行简单的分析文字，显示在面板的小屏幕上。过去一小时，走廊里有大约三次脚步声，其中两次是女性，一次是男性。一次女性脚步声伴随着塑料袋的响动，类似某种购物袋的摩擦声。伊甸无法识别具体是谁，只能给出这些最基本的声学分析。
            - paragraph [ref=e243]: 但也足够了。至少在这一刻，他不需要出门就能感知到走廊的动静。
            - paragraph [ref=e244]: 他回到客厅，在沙发上坐下来，翻开笔记本到新的一页。桌子上放着从万象合成终端取出来的一袋面粉和一罐压缩饼干。这是伊甸按照每日配给量生产的，量不大，但如果在末日降临后每天都有稳定产出，维持几个人口粮的生存不是问题。只不过终端只能产出基础食材和纯水，肉、鸡蛋、蔬菜、调味料这些东西，还需要从外部采购储备。他拿起笔，在物资栏里写下蛋白质来源、维生素补充、盐和调味品储备。然后又在旁边标注了一个括弧，写了冻干蔬菜的可行性。
            - paragraph [ref=e245]: 接下来的三个月，他要把这间2001室改造成末日降临后能在寒潮中安全撑过初期阶段的据点。伊甸已经有了供暖接口，可以维持室内的温度，但供暖范围只有2001室，不能外接。这意味着任何在末日初期需要收容的人，都必须进入2001室。而2001室的空间是有限的，即便伊甸改造后多了一些空间，要容纳更多人仍然是一个需要仔细考量的问题。
            - paragraph [ref=e246]: 金属安防门可以挡住强行闯入，但只能挡住大门。如果有人从窗户强行闯入，或者有人在他离开时进入2001室，那扇门就帮不上忙。热水器每次只能使用十分钟然后冷却六个小时，这是严重的时间限制。防寒防护服只有一套，意味着他能独自在楼内行动时不受走廊寒气影响，但不能带人一起。
            - paragraph [ref=e247]: 这些都是约束，都是必须考虑的边界条件。
            - paragraph [ref=e248]: 小哥哥放下笔，靠在沙发背上，闭上眼睛让思绪自由流动几分钟。窗外的城市喧嚣隔着双层玻璃变成了一种模糊的白噪音，远处的车笛声、楼下便利店播放的音乐、某户人家开着的电视声。这些声音共同构成了一种令人安心的背景乐，是正常世界最后的呼吸。
            - paragraph [ref=e249]: 七天。这是他从震惊到行动所用的时间。现在是必须正式开展工作的阶段，既是情报收集，也是人脉经营，既是物资囤积，也是身份掩护。他不是什么超级英雄，就算有伊甸傍身，他也不想做什么孤胆救世主。他只是想在末日到来之前，争取到几个能够在灾变后相互支撑的伙伴，建立起能够维持基本生活的物资储备，让寒潮降临的那一刻不至于彻底沦为灾难。
            - paragraph [ref=e250]: 睁开眼睛时，墙上的时钟显示已经过了两点三十分钟。周末的下午总是过得很快，再过几个小时就要到晚饭时间了。他站起来，走向厨房，用万象合成终端取了一份合成干粮和一杯纯净水。终端运作时发出极其细微的嗡鸣声，只有站在旁边才能听到。这声音在别人耳中或许微不足道，但对他来说，每一次嗡鸣声都像是未来的鼓点，准时而缓慢地敲响倒计时的节拍。
