            - paragraph [ref=e405]: 九月中旬的日光从走廊尽头的窗户斜斜切进来，把二十层的走廊切成明暗两段。2001室的门紧闭着，门板上那圈金属边框在暖光里微微反着哑光，看上去和公寓里其他任何一户没什么区别。不过门内的小哥哥正坐在客厅沙发上，膝盖摊着一本翻到一半的户型图纸，手边那杯黑咖啡已经凉透了。他其实没怎么看图纸，大半心思都挂在伊甸那块监听界面上，走廊里的脚步声和偶尔传来的电梯嗡鸣被伊甸切成一条条音频轨道，按年龄和性别自动归类，再推到他的手机屏幕上。这东西用起来就像末日前刷短视频，只不过内容换成了邻居们的生活切片，而他头号关注的就是走廊里那扇贴着“欢迎”字样的2003室门。
            - paragraph [ref=e406]: 距离上次拜访已经过去差不多五天。这五天里他故意没再去敲门，让那包曲奇饼干的后劲自己发酵。林月华说过要做雪花酥，但这种事急不得，催了容易显得别有用心，不催反而体面。反正监听台里能听到她每天上午都会在厨房忙活，菜刀在砧板上切东西的声音利落干脆，偶尔夹杂她和赵卫国简短的对话，音轨上标注的情绪标签永远是“平静”。倒是赵卫国的状态更有意思，这位前建筑工人每天例行检查门窗时脚步很稳，但走到书房门口和小哥哥上次坐过的沙发之间会多停一拍，伊甸把他的情绪标注为“思虑”，听上去像是在回味什么。
            - paragraph [ref=e407]: 这天下午三点刚过一刻，监听台推了一条新的音轨过来。是2003室门锁旋转的声音，接着是林月华那双平底鞋踩在走廊地砖上的轻响，步幅不大，节奏稳定，朝2001这个方向来的。小哥哥把图纸往旁边一搁，快速扫了一眼手机上的情绪标签，伊甸给这串脚步声标了“期待”，顺带附了一行分析：手中提有物品，重量推测约五百克。五百克，那大概是两盒雪花酥的分量，还可能有别的。他站起来拍了拍裤子上不存在的灰，走到玄关处，对着那道气密门的生物识别区按了一下手指。门滑开的瞬间，林月华刚好在他门前站定，右手悬在半空，看样子正要敲门。
