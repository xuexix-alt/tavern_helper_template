            - paragraph [ref=e721]: 林月华看着丈夫这副模样，轻轻叹了口气，然后转向小哥哥，语气里带着一种拿他们俩没办法的无奈，“那我也去。万一那夹层里有老鼠虫子什么的，你们俩大男人能吓成什么样我可太清楚了。”
