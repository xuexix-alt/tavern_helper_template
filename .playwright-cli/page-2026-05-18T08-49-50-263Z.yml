            - paragraph [ref=e625]: 从2003室告辞出来，小哥哥踩着拖鞋啪嗒啪嗒穿过走廊，回到2001室门口。他把手掌按在生物识别区上，气密门无声滑开，玄关暖黄色的灯光在九月午后的日光里显得有些多余，但他还是习惯性地在进门后先站定三秒，确认身后走廊空无一人，才把门合上。
            - paragraph [ref=e626]: 监听台的手机界面上，2003室的音轨还在实时跳动。他把手机掏出来搁在鞋柜上，弯腰换鞋的时候，正好听见林月华的声音从扬声器里传出来，音质清晰得像是她就在玄关站着。
            - paragraph [ref=e627]: “这个年轻人挺难得的，做事有章法，还细心。你注意到没有，他刚才走的时候把茶杯端到厨房台面上放好了，连杯垫都对齐了茶几边沿。”林月华的语气里带着一种主妇特有的、对同类生活习惯的敏锐识别。
            - paragraph [ref=e628]: 赵卫国的回应隔了两秒才传过来，声音闷闷的，大概正靠在沙发上犯食困：“嗯。发电机参数也做足了功课，”
            - paragraph [ref=e629]: “难得听你夸人。”林月华笑了一声，然后是碗碟碰撞的声响，大概在收拾餐桌，“那改天请他来家里吃顿正式的，我炖个汤。”
            - paragraph [ref=e630]: “随便。”
            - paragraph [ref=e631]: 小哥哥把拖鞋套上，嘴角没忍住往上翘了翘。这两位邻居的对话简直像是送货上门的助攻，省了他一大截脑细胞。他走到客厅，在全景屏幕上随手选了一张秋季晴空的画面，又把茶几上散落的几张发电机图纸归拢到文件夹里，拿湿巾把桌面擦了一遍。既然打算请人来做客，就得让对方看到的是一个井井有条的生活空间，而不是一个堆满末日计划的秘密指挥部。
            - paragraph [ref=e632]: 不过“改天”这个词太模糊了，他等不了那么久。林月华和赵卫国的好感度就像两块刚出炉的年糕，放凉了再想捏就费劲了，得趁着热乎劲儿一口气捏出形状来。
            - paragraph [ref=e633]: 下午四点多的时候，他重新套上防寒服，从万象终端里合了一小袋手冲咖啡豆，又把之前从Ole买的那盒伯爵红茶剩下的几包装进一个深蓝色的小纸袋里。东西不贵重，但上门邀请空着手总觉得少了点什么。他穿过走廊，在2003室门口站定，敲了三下门。
            - paragraph [ref=e634]: 开门的还是林月华。她已经换掉了上午那件针织开衫，穿了一件浅灰色的家居长裙，头发重新盘过，几缕碎发搭在耳侧，整个人看起来比上午更放松了些。看到小哥哥手里又拎着东西，她先是一怔，然后无奈地摇了摇头，杏眼里却没什么真正的拒绝。
            - paragraph [ref=e635]: “你这孩子，中午才说过不准再买东西，怎么又——”
            - paragraph [ref=e636]: “不是买的。”小哥哥连忙把纸袋举到胸前，掏出那盒伯爵红茶在她眼前晃了晃，“上次买的红茶嫂子说好喝，我这还有几包，一个人喝不了那么多，放着也是浪费。顺便，想请嫂子跟卫国哥晚上去我那儿坐坐。”
            - paragraph [ref=e637]: 林月华接过纸袋，往里面看了一眼，然后又抬头看小哥哥，目光里多了一层了然。他不是来送东西的，是来递邀请函的。她把门拉宽，回头朝客厅方向喊了一声：“卫国，小哥哥请咱们晚上去他家喝茶，你去不去？”
            - paragraph [ref=e638]: 赵卫国的声音从沙发那边传来，比刚才清晰不少，大概已经睡醒了：“去。”一个字，干脆得像锤子敲钉子。
            - paragraph [ref=e639]: 林月华转过头，朝小哥哥笑了笑：“那就恭敬不如从命了。几点？我们收拾一下。”
            - paragraph [ref=e640]: “七点吧，吃过晚饭过来正好。我那儿没什么好招待的，就泡壶茶聊聊天。”
            - paragraph [ref=e641]: 敲定时间后小哥哥回了2001室，开始准备。万象合成终端在静音模式下运作，一小袋咖啡豆出现在料理台上，标签印着某个精品咖啡品牌的logo，看着和超市里买的没有任何区别。他把手冲壶洗干净，滤纸折好，又把客厅的灯光调成暖色调，让整个空间看起来更像一个普通年轻人该有的温馨公寓，而不是一座末日基地。全景屏幕轮播着傍晚时分的城市天际线，落地窗外假装有暮色渐沉，其实他知道那是假的，但林月华和赵卫国不会知道。
            - paragraph [ref=e642]: 晚上七点整，走廊里响起敲门声。是两下沉稳加一下轻巧，显然赵卫国敲了两下，林月华补了最后一下。小哥哥打开门，看到林月华换了一件米白色的针织开衫，头发重新盘得不苟，手里拎着一个白色的搪瓷保鲜盒。赵卫国站在她身后半步，依旧是那件洗得发白的工装衬衫，但袖子放下来了，领口也扣得整整齐齐，显然是被妻子督促过一番。他的眼神还是那种不动声色的审视，但进门时主动在鞋垫上蹭了蹭鞋底，这个细节小哥哥没有放过。
            - paragraph [ref=e643]: “带了自己做的南瓜羹，放的是黄冰糖，你尝尝。”林月华把保鲜盒放在玄关的矮柜上，视线扫过墙边那几个关着门的客房，但没有多问，只是安静地跟着小哥哥穿过第二道气密门走进核心区的客厅。走进来的瞬间，她的脚步明显顿了一下，抬起头看着那面巨大的全景屏幕，暮色中的城市灯光正次第亮起，逼真得让她忍不住轻轻吸了一口气。
            - paragraph [ref=e644]: “你这面窗户也太大了，视野真好，晚上坐这儿看风景比看什么电视都强。”林月华由衷地感叹了一句，然后目光落在客厅的布置上。
            - paragraph [ref=e645]: 小哥哥的客厅收拾得整洁而有序。沙发上的靠垫摆成了对称的角度，茶几上只放着一套手冲壶和几只马克杯，没有多余的杂物。书架上的书按尺寸高低排列，连书脊的间距都是均匀的。厨房的料理台上，调味罐按照身高顺序贴着标签码成一排，水槽边没有一滴水渍。这种井然有序的风格恰好戳中了林月华作为洁癖主妇的审美点。她在沙发边坐下来，环顾四周的神情从“这年轻人真有钱”慢慢变成了“这年轻人跟我一样强迫症”，后者显然比前者更能让她感到亲近。
            - paragraph [ref=e646]: “你这房子收拾得比我家还干净。”她说这话的时候语气里没有客套，更像是某种同类之间的会心一笑。
            - paragraph [ref=e647]: “一个人住，东西少，收拾起来省事。”小哥哥把手冲壶里的热水缓缓注入滤杯，咖啡粉受到热水的浸润膨胀成一个小小的鼓包，香气在客厅里漫开。他倒咖啡的动作不算娴熟，但胜在认真，滤杯里的水流保持得很稳，直到萃取出刚好三杯的量才停手。然后把那盒伯爵红茶泡了一壶备用，又端出三个小碟子，分别放了几块消化饼干、一小把杏仁和两勺林月华之前送的雪花酥。这套流程看起来像是在招待远道而来的老朋友，而不是隔壁住了几个月都没说过几句话的邻居。
            - paragraph [ref=e648]: 赵卫国坐在沙发另一端，手里捧着小哥哥递过来的一杯黑咖啡，抿了一口之后微微点了下头，没说话，但上唇沾到咖啡沫之后喉结滚动了一下，显然对味道没什么意见。他的目光在客厅里扫了一圈，最后停在了书架旁边那个被整理得整整齐齐的工具箱上。那是个普通的家用工具箱，但里面的扳手和螺丝刀按大小顺序嵌在卡槽里，手柄朝向全部一致，一看就是用了心收纳的。赵卫国把咖啡杯放下来，走过去蹲在那个工具箱前面，拿出一个活动扳手在手里掂了掂，然后在卡槽里重新放回去，终于开口说了今晚最长的一句话。
            - paragraph [ref=e649]: “这套工具不错，是德国牌子。不过这个活动扳手用得有点多，螺纹磨了，再过一阵子该换了。”
            - paragraph [ref=e650]: “卫国哥眼力好，这个确实用了好几年了。”小哥哥端着咖啡走到他旁边，没多说什么，但心里已经开始盘算要不要用万象终端合一套更高档的工具来投其所好。不过今晚的重点不是赵卫国的工具箱，是让林月华看到一个“靠谱年轻人”的完整画像。
            - paragraph [ref=e651]: 接下来的一个多小时里，话题在工具、咖啡、房间收纳和最近小区里停电的那些破事儿之间来回跳跃。林月华说起自己每周六上午会去精品超市采购，固定路线从蔬菜区走到日用品区，拿起商品先翻到背面看配料表，钠含量超过标准的直接放回去。小哥哥听完没说什么，打开厨房的一个储物柜，给她看自己按类别分装的干货罐子，红豆、绿豆、薏仁、木耳，每个罐子上都贴了手写的标签，日期标注到下个月的保质期截止日。林月华凑过去看了一排，然后把柜门重新关上，转过身来看着小哥哥，杏眼里有一种“你怎么不早说你是自己人”的感慨。
            - paragraph [ref=e652]: “你这习惯跟我一模一样。”她说这话的时候语气里没有夸赞，更像是在确认某个事实，“我做了二十年主妇，遇上能把储物柜收拾成这样的人，一只手数得过来。”
            - paragraph [ref=e653]: 赵卫国在旁边听着，喝完第二杯咖啡之后破天荒地没有默默放回杯垫，是把杯子往茶几上一搁，开了口：“会过日子的人少。”他看了看妻子，又看了看小哥哥，点了点头，那动作比之前任何一次都更明确，像是在盖一个质量的戳。
            - paragraph [ref=e654]: 林月华轻轻拍了拍丈夫的手背，转过来对小哥哥说：“以后有什么需要帮忙的，你直接跟我们说。卫国虽然话少，但动手的事他都能做。我呢，做饭洗衣服收拾屋子这些琐事，你一个人住总是忙不过来的，别客气。”
            - paragraph [ref=e655]: 这话落在小哥哥耳朵里，比任何交易条款都更值钱。林月华是个从不轻易承诺的人，她的“别客气”三个字，是二十个密封袋、五包香叶和无数次细节积累换来的信任。小哥哥把煮好的伯爵红茶倒进她面前的杯子里，说了句“那我就不客气了”，然后从茶几下面拿出一盒没拆封的独立包装坚果，拆开倒在碟子里推到两人面前。整个过程自然得像是在自己家招待住了很久的亲戚。
            - paragraph [ref=e656]: 临走的时候，林月华在玄关换鞋，想起什么似的从口袋里掏出手机，打开备忘录翻了翻，然后抬头看着小哥哥说：“对了，刚才说到停电的事，我有个想法。你看这样行不行，既然你说最近在囤一些应急的东西，那以后我去超市采购的时候，有遇到打折的常温食品或者日用品就给你也带一份，反正多买一份也不费事。你做那个什么物资清单的时候，可以算上我这一份。”
            - paragraph [ref=e657]: 小哥哥愣了一下。他没有提过“物资清单”这四个字，但上次聊天时他无意中说过自己在做一些生活物资的储备计划，大概林月华当时就记住了，还自己给这件事取了个正经名字。他笑了笑，点了点头，心里那台一直在默默运转的计算器弹出了一个新的数值，林月华的协作节点，已经悄无声息地解锁了。
            - paragraph [ref=e658]: 赵卫国站在玄关灯下，伸出手，把一张折得整整齐齐的纸条塞进小哥哥手里。那是他用红笔标注过的设备夹层位置图，折痕很新，大概是今晚出门前临时画的。他什么也没说，只是用那双布满老茧的大手在小哥哥肩膀上拍了一下，力道不重但很稳，然后转身先迈出了门。
            - paragraph [ref=e659]: 林月华跟在他身后，朝小哥哥摆了摆手，手里的搪瓷保鲜盒是空的，她说改天再来拿。走廊里的壁灯把她的影子拖得很长，在2003室门口停住，然后两个人一前一后消失在门板后面。
            - paragraph [ref=e660]: 2001室的气密门重新滑上。小哥哥靠在玄关的鞋柜旁边，把那张设备夹层的位置图展开看了一眼，然后又折好放进贴身的口袋里。餐桌上的咖啡杯还没收，杯底残留的咖啡渍在暖色灯光下泛着一层暗褐色的光泽，客厅里弥漫着咖啡豆和伯爵红茶混在一起的香气。
            - paragraph [ref=e661]: 他拿起手机，伊甸的界面弹出了一条新的数值更新。林月华的秩序刻印跳到了40，标签已经从灰色的“交易”切换成了淡蓝色的“协作”。赵卫国的数值也从32变成了35，虽然还没切换档位，但那张手绘的地图已经说了一切。
            - paragraph [ref=e662]: 小哥哥把手机放在茶几上，重新坐回沙发里，手指无意识地敲着沙发扶手。今天晚上没有谈任何关于末日的事，没有提三个月后的寒潮，没有提伊甸的存在。林月华和赵卫国对末日还一无所知，但他们已经开始主动往他的计划里添砖加瓦，这种基于信任的自发协作，比任何直接用情报砸出来的同盟都更牢固。
            - paragraph [ref=e663]: 下一步，该考虑怎么把这种信任网撒得更宽一些了。
