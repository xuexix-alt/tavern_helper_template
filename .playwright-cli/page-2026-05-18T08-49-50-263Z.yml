            - paragraph [ref=e798]: 去神化校验方面，小哥哥言行对齐了去阴谋、去邪恶、去极端化，他是以邻居和合作者的身份在推进准备工作。赵卫国是基于技术兴趣和实用主义参与进来，林月华是基于对小哥哥的信任和主妇的操心本能提供支持，都没有媚小哥哥的表现。
            - paragraph [ref=e799]: 角色认知隔离方面，赵卫国和林月华都不知道伊甸的存在和功能，他们只是认为小哥哥是一个有远见、做事有条理的年轻人。小哥哥也没有主动告知或演示伊甸的能力，保持了信息差。
            - paragraph [ref=e800]: 接下来规划正文。午饭应该在林月华家解决，这是上次说好的排骨汤。午饭后两点出发去建材市场，赵卫国会展现出完全不同于平时的状态，在熟悉的领域里他会变得话多、自信、甚至会主动砍价。小哥哥作为陪同者，需要适时展示自己的功课成果，让赵卫国看到他不是只会花钱买东西的年轻人。最后以一个温暖或有趣的细节收尾。
            - paragraph [ref=e801]: 现在开始输出正文。
            - paragraph [ref=e802]: 午饭是在林月华家吃的。排骨汤从上午就炖在灶上，汤汁已经收成了浓稠的琥珀色，山药块用筷子一夹就散成绵密的泥状。赵卫国呼噜呼噜喝了两碗，把碗往桌上一搁，站起来从鞋柜顶上摸出那串车钥匙，转头看着小哥哥说了句“走吧”。
            - paragraph [ref=e803]: 林月华把围裙解下来搭在椅背上，从厨房探出半个身子叮嘱道：“早点回来，晚上我把剩下的排骨汤热一热，你们回来正好喝。”她说完顿了顿，又补了一句，“卫国，别跟人吵起来。”
            - paragraph [ref=e804]: “我什么时候吵过。”赵卫国已经踩上那双厚底工作靴，头也不回地应了一句，推开门走进了走廊。
            - paragraph [ref=e805]: 九月中旬的午后日光从走廊尽头的窗户灌进来，在米黄色地砖上铺出一片晃眼的亮白。小哥哥套上那件伊甸出品的防寒服，跟在赵卫国身后穿过走廊。路过2004室的时候，门缝里飘出来佐伯惠理标志性的、带着跑调的哼歌声，听起来大概又在循环播放她自己编的某段旋律。赵卫国连脚步都没顿一下，小哥哥倒是下意识往那扇门瞥了一眼，但很快收回视线，加快了步子跟上前面那个肩膀厚实的背影。
            - paragraph [ref=e806]: 两人坐进赵卫国那辆开了快十年的深蓝色皮卡，车厢里弥漫着一股机油和旧皮革混在一起的气味。副驾驶座椅的弹簧已经没了弹性，坐上去整个人会往下沉半截。赵卫国发动引擎的时候，柴油机发出粗重的咳嗽声，然后稳定下来，变成一种沉闷的嗡鸣。他单手打方向盘把车倒出车位，另一只手从车门侧面的储物格里摸出一副磨旧了的墨镜戴上，动作利落得像是做过几千遍。
            - paragraph [ref=e807]: “城西那个建材市场我跑了十几年，大概有五六家做储罐的。”赵卫国把车拐上主干道，墨镜遮住了他大半张脸，但语气明显比平时在公寓里说话时要松弛一些，句子的长度也明显拉长了，“其中有一家姓刘的老板，以前我在工地上跟他合作过好几次。人滑头，但货不假。”
            - paragraph [ref=e808]: “那就先看他家的。”小哥哥坐在副驾驶上，膝盖上摊着那几张参数表，上面已经被赵卫国用红笔标了好几个选项。他把碳钢加内涂层的那款参数拿出来放在最上面，其余的折好塞回外套口袋。
            - paragraph [ref=e809]: 赵卫国从墨镜上方瞟了一眼那张纸，嘴角不明显地扯了一下，大概算是某种认可，然后重新把视线放回前方，没再说什么。皮卡穿过瑞峰市中心几条车流密集的主干道，渐渐驶入城市西侧那片被建材市场和五金店占据的街区。路两边的建筑变矮了，从玻璃幕墙的写字楼变成了仓库式的大棚和堆满管材的露天场地，空气里开始混进铁锈和切割金属的味道。几个穿着工装的工人蹲在路边吃盒饭，看到皮卡经过时抬头瞥了一眼，然后继续低头扒饭。
            - paragraph [ref=e810]: 建新建材城的停车场是一片被碾得坑坑洼洼的水泥地。赵卫国把车停在一个没有标志线的角落，熄火拔钥匙，推开车门时那股建材市场特有的气味，铁锈、油漆、新锯开的木板、和某种说不清的化学溶剂，立刻涌进车厢。赵卫国站在车门边上深深吸了一口气，肩膀明显松了下来。这大概是他在工地摸爬滚打了将近二十年之后，身体自动写进去的条件反射，只要闻到这味道就自动切换到工作模式。
            - paragraph [ref=e811]: “跟紧我。”他丢下三个字，大步朝市场入口走去。
            - paragraph [ref=e812]: 市场里面比外面看起来大得多。高高的钢架顶棚把直射的阳光过滤成一片均匀的灰白色，成排的店铺沿着主干道望不到头，每家店门口都摆着各自的样品：镀锌管材、不锈钢法兰、各种口径的阀门和弯头。空气里弥漫着切削液的味道和时不时响起的角磨机尖啸。几个穿着沾满油污工装的店家正蹲在店门口抽烟，看到赵卫国那个走路的架势，双手插在工装夹克口袋里，眼睛像扫描仪一样扫过每家店的样品，就知道这是个懂行的，没人上来搭讪。
            - paragraph [ref=e813]: 赵卫国领着小哥哥在市场里拐了两个弯，停在一家挂着“老刘储罐·管道配件”招牌的店铺门口。店面不大，但门口摆着的样品很全，从几百升的小型储水罐到两三千升的工业级储油罐一字排开。一个五十来岁的男人正坐在柜台后面翻报纸，听到脚步声抬起头，先是一愣，然后摘下老花镜站了起来。
            - paragraph [ref=e814]: “哟，老赵？”刘老板的声音带着生意人特有的热络，但这种热络里隐约透着警惕，大概是因为赵卫国的名声在他这行里向来不太好糊弄，“什么风把你吹来了？你不早就不干工地了吗？”
            - paragraph [ref=e815]: “早不干了，但东西还认得。”赵卫国没接他的客套，直接走到门口摆着的一个碳钢储油罐样品前面，用指节敲了敲罐体，发出沉闷的金属声响。然后他蹲下来，粗壮的手指在罐底的焊接缝上摸了一遍，站起来的时候手上沾了一层铁屑，在裤子上拍了拍，转头问道，“这个，两千升的，壁厚三毫米还是四毫米？”
            - paragraph [ref=e816]: 刘老板的眼珠转了一下，笑容僵了那么半拍。“三毫米的，配的是标准环氧树脂内涂层，耐温耐压都达标。老赵你眼光还是那么毒，这是我们店里卖得最好的款。”
            - paragraph [ref=e817]: “涂层做了几层？”赵卫国没理他的恭维，语气平淡。
            - paragraph [ref=e818]: “两层。”
            - paragraph [ref=e819]: “能不能加一层？我要三层，内涂层加厚到一点五倍。罐底焊接缝要全部做射线探伤，出报告。”赵卫国说完，从口袋里掏出那张小哥哥的参数表，展开摊在柜台上。纸面上被他用红笔标注过的碳钢罐型号旁边还加了一行小字，罐底钢架加厚，离地半米防潮。他看着刘老板，那双被墨镜遮过的眼睛重新露出那种验收建材时的锐利眼神，“你报个价。”
            - paragraph [ref=e820]: 刘老板张了张嘴，视线在赵卫国和小哥哥之间快速转了一个来回。大概是没见过赵卫国带一个年轻人来谈这种事，以前都是他一个人来，买了东西扛着就走，从不多说话。刘老板的手指在柜台上敲了几下，然后转身从文件柜里翻出一本报价单，翻开到其中一页，用手指指着一行数字，“老赵，老客户价，两千升碳钢罐标配备二层涂层是两万二，加一层涂层和探伤的话，得再加五千。配套的钢架和通风管接头另算，大概再多个几千块。总共可能得三万出头。”
            - paragraph [ref=e821]: “三万？”赵卫国摘下墨镜，往柜台上一搁，墨镜腿磕出清脆的响声。他没还价，只是拿起柜台上的计算器按了几个数字，然后把屏幕转过去给刘老板看，“你这个价格把通风管接头算成了不锈钢的。我要的是碳钢配橡胶密封圈的，价格差将近一半。另外钢架的工费你写了全部焊接，我只让你焊底座支撑，其余的用螺栓连接。重新算。”
            - paragraph [ref=e822]: 刘老板看着计算器屏幕上那串数字，脸上的表情从热络变成了无奈，然后从无奈变成了某种哭笑不得的佩服。他叹了口气，拿起计算器重新按了一遍，然后把最终的数字写在报价单的空白处，“两万八，包探伤报告和三层涂层，通风管接头按你说的碳钢配密封圈，钢架底座焊接其余螺栓连接。这个价格我真的不赚钱了，纯粹是看老赵你的面子。”
            - paragraph [ref=e823]: “行。”赵卫国把报价单拿起来，核对了一遍上面的每一个数字，然后折好塞进夹克内袋，转头看了小哥哥一眼，意思是该你说话了。
            - paragraph [ref=e824]: 小哥哥从外套口袋里掏出手机，打开备忘录里提前整理好的采购清单，上面除了储油罐之外，还列了通风管道、密封圈、法兰接头和螺栓的型号和数量。他指着屏幕上其中一行对刘老板说：“配套的通风管要六米长的碳钢管，直径两百毫米，配四个法兰接头和两套密封圈。螺栓要不锈钢的，数量按法兰的孔位配。另外还想订一个手摇泵，抽油用的，流量不用太大但得耐低温。”
            - paragraph [ref=e825]: 刘老板看了他一眼，又看了看赵卫国，然后拿起笔把清单上的每一项都标了价格和交货期，最后在最下面写了总金额。写完他看了看赵卫国，“定金两成，一周交货。”
            - paragraph [ref=e826]: 赵卫国接过单子看了一遍，然后嘴角动了动。他把单子交给小哥哥，站起来拍了拍刘老板的肩膀，力道不重但很稳，“周三之前把合同发过来，我让人确认一遍，没问题就打定金。”
            - paragraph [ref=e827]: “行行行，你说怎么弄就怎么弄。”刘老板把老花镜重新戴上，站起来送两人到店门口。回头的时候小哥哥注意到他擦了擦额头上的汗，这笔生意大概确实没赚几个钱，但赵卫国三个字在这片市场里的分量，足够让他不敢乱来。
            - paragraph [ref=e828]: 两个人走出建新建材城的时候已经快四点了。午后的日头偏西，停车场的水泥地上拖着长长的影子。赵卫国拉开皮卡车门，在上车之前停了一下，转过身看着小哥哥，那双布满老茧的手扶着车门上沿，犹豫了片刻才开口，嗓音比平时轻了那么半分。
            - paragraph [ref=e829]: “你那份清单整理得不错，能省好几轮口水。”
            - paragraph [ref=e830]: 这话从赵卫国嘴里说出来，大概相当于别人写一封上千字的表扬信。小哥哥系好安全带，转头朝他笑了笑，“卫国哥在前面把关，我也就是打打下手。”
            - paragraph [ref=e831]: 赵卫国没回应这句话，一直保持到皮卡拐出建材市场上了主路。他单手扶着方向盘，在等红灯的时候说了一句：“下次不用让你嫂子催，直接来敲我的门。”说完就又把头转向窗外，墨镜重新遮住了大半张脸，好像刚才的话只是随口一说的天气预报。
            - paragraph [ref=e832]: 回到星穹国际公寓的时候，走廊里的壁灯已经自动亮了。赵卫国掏出钥匙打开2003室的门，屋里飘出来排骨汤重新加热后更浓郁了的香气。林月华正站在厨房水槽旁边洗菜，听到门响转过头，杏眼里那抹期待在确认丈夫身后还跟着小哥哥时，变成了满意的笑意。
            - paragraph [ref=e833]: “回来了？正好，汤刚热好。坐吧。”她在围裙上擦了擦手，转身去拿碗。
            - paragraph [ref=e834]:
              - option "【A】交易会面路线&留在2003室吃晚饭，把建材市场拿到的报价单和合同草案拿给林月华过目，让她正式参与到储油罐采购决策中来，进一步巩固她的协作者身份认同。 【B】技术升级路线&饭后跟赵卫国去书房翻他那堆旧工程图纸，找找有没有关于大楼消防通道和备用管井的隐藏路径，为日后物资运输多备几条隐蔽路线。 【C】邻里关怀路线&趁晚饭后还没太晚，去敲2004室的门问候佐伯一家，带上林月华多炖的排骨汤，借机跟诗织和惠理建立接触，也为龙一叔叔的身体状况做个私下评估。 【D】情报整理路线&回到2001室后打开伊甸监听台，把今天在建材市场获取的供应商信息和报价录入备忘录，同时监听一下2004室和2005室的晚间动态，为接下来的邻里接触做足功课。" [ref=e835]
