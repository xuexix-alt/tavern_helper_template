              - text: "insertRow(4, {0: \"佐伯诗织\", 1: \"小哥哥初次正式拜访时送来的止痛药无缝衔接了父亲的用药缺口，在短暂的互动中确认了对方与自己相似的秩序感，主动提出制作物资互助方案并写在笔记本上，以极其内敛的方式迈出了协作的第一步\", 2: \"2026年9月16日\", 3: \"楼层20/2004室\", 4: \"认可/安心/关系突破\"})"
              - text: "insertRow(4, {0: \"佐伯惠理\", 1: \"暗恋对象首次登门拜访，全程处于亢奋与窘迫的叠加状态，摆的水果碟被姐姐拆台、拿错弯尺被小哥哥当场纠正，告别时对方一句陪你说说话让她当晚在日记本上写了大概三页纸\", 2: \"2026年9月16日\", 3: \"楼层20/2004室\", 4: \"雀跃/窘迫/幸福感爆棚\"})"
