            - paragraph [ref=e497]: 林月华看到丈夫这副模样，转过头来朝小哥哥笑了一下。那里带着点歉意，又带着点欣慰，大概意思是“不好意思他平时不这样”以及“谢谢你陪他聊这些”。她站起来，把纸袋里的东西收进厨房，然后打开橱柜开始归置。
            - paragraph [ref=e498]: 小哥哥和赵卫国的对话持续了大概二十分钟。赵卫国用他那标志性的短句逐条拆解发电机的输出功率、油耗、冷却方式和安装要求，偶尔会蹦出几个专业术语，说完之后会顿一下，确认小哥哥听懂了才继续往下讲。他说到一半的时候，林月华端了一碟切好的水果出来，捻了一块苹果塞进他嘴里，动作自然得像做了二十年的习惯。赵卫国嘴里含着苹果，停了一下，然后把苹果嚼碎咽下去，看着妻子说了句“太甜”。
            - paragraph [ref=e499]: “苹果本来就是甜的。”林月华在他旁边坐下来，手里拿着那块刚拆封的密封袋，举到光线下看印在盒子背面的大号字样，“这牌子我用了好几年，就是最近两家超市都没货。你怎么买到的。”
            - paragraph [ref=e500]: “开车去远一点的店转了一圈，碰运气。”小哥哥端起已经凉到温热的红茶喝了一口，“自家也需要储备一些生活用品，顺便的事。”
