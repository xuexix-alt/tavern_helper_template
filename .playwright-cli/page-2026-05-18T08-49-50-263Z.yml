            - paragraph [ref=e419]: “卫国哥费心了。”小哥哥打开密封盒，捏了一块雪花酥塞进嘴里，奶香和蔓越莓的酸甜在舌尖上同时炸开，酥皮的层次感比上次更好。他嚼完咽下去，竖起大拇指，“比上次还好吃，嫂子这手艺，出去开店都没问题。”
            - paragraph [ref=e420]: 林月华抿嘴笑了，眼角那两道细纹又浮现出来。她端起咖啡喝了一口，嘴唇在杯沿上压了压，然后放下杯子，语气还是那种不紧不慢的调子：“我哪会开什么店，也就是在家闲着瞎琢磨。你不嫌弃就好。”
            - paragraph [ref=e421]: 接下里的七八分钟里，话题照旧在生活杂事之间游走。林月华说起楼下那家二十四小时便利店的鲜奶涨价了将近一倍，小哥哥就说自己已经开始囤常温奶和奶粉；林月华说最近小区业主群里老有人抱怨水管出锈水，小哥哥就顺着把上次赵卫国提到的供电隐患又翻出来聊了几句。林月华听他提起供电的事，原本轻松的神情收了那么，把咖啡杯放在茶几上，杯底磕到杯垫发出一声轻响。
            - paragraph [ref=e422]: “说到这个，卫国前两天把家里的配电箱整个拆开了。”她双手交叠放在膝盖上，指节微微收紧，“他说这栋楼的供电分支线老化了不止一两处，物业之前报修过好多次，但每次都只是临时贴一层绝缘胶布凑合。他担心冬天一到，暖气一开全楼的电闸都得跳。”
            - paragraph [ref=e423]: 这番话让小哥哥心里那根弦一下子绷紧了。赵卫国的判断是专业人员的第一手情报，比业主群里的抱怨可靠得多。如果供电系统真的这么脆弱，那发电设备的采购优先级还得往前排，而且不能只买基础款，得考虑全公寓的功率覆盖。不过眼下他脸上的表情只是皱了下眉，点了点头：“卫国哥是行家，他这么说，那八成是真的。嫂子你们家要不要先备个小型发电机？我前阵子在网上看了一些型号，功率够一家人维持基本照明的。”
            - paragraph [ref=e424]:
              - text: 林月华没有马上回答。她把视线从茶几上的杯垫移到他脸上，杏眼里多了一层他之前没见过的认真。那目光不像是在打量，更像是在掂量一句话的份量。过了两三秒，她开口了，声音还是柔和，但句子比刚才短了，干净利落：“小哥哥，你其实不只是来串门的吧？”
              - text: 小哥哥被问得心里咯噔了一下，脸上却只是眨了眨眼，顺手把空了的雪化纸捡起来丢进垃圾桶，借着低头的时间把脑子里的词汇快速排列了一遍。抬头的时候，他让自己的语气保持平常聊天时那种随意，却又稍微加了那么层诚恳。
            - paragraph [ref=e425]: “嫂子眼力好。”他把掌心在膝盖上摊开，做了个无防备的姿态，“说实话，我确实不只是想叙旧。最近天气反常，物价也在涨，业主群里三天两头有人吐槽停水停电，我心里一直悬着。上次来你们家聊完，卫国哥说的那些供电隐患，加上我自己在楼道里也注意到一些管线老化的痕迹，越想越觉得不对劲。”他顿了顿，目光没从林月华脸上移开，“所以想着多走动走动，起码大家有个照应。万一以后真出什么意外，好做个商量。”
            - paragraph [ref=e426]: 这个说辞没有提到末日，也没有提伊甸，但每一句都是实话，只是被筛掉了一些暂时不能说的东西。林月华听完了没有立刻表态，她把重新端起来的咖啡杯贴在下唇上，视线垂向茶几上那碟没吃完的消化饼干，沉默了片刻。小哥哥注意到她的右手无名指无意识地摩挲着杯柄，那是赵卫国帮她按过肩膀的那只手。
            - paragraph [ref=e427]: 最后她开了口，语气比刚才又松回去了一些，但用词却比之前的任何一句闲聊更郑重：“你能这么想，卫国嘴上不说，心里应该也会认。他这几天在家里翻来覆去检查线路，就是一直在担心这些。你要是有什么想法，直接跟我们说就好，不用拐弯抹角。”
            - paragraph [ref=e428]: “好。”小哥哥点头，然后笑了笑，“那以后可能要经常叨扰了。”
            - paragraph [ref=e429]: “你这人。”林月华也笑了，笑完之后站起来，顺手把两个纸袋往小哥哥面前推了推，“雪花酥放密封盒里能放五六天，水果今天就得吃掉，别放久了。我先回去了，卫国下午要重新布线，家里乱七八糟的，我不在盯着他容易把客厅地板全翘了。”
            - paragraph [ref=e430]: 小哥哥把她送到门口。林月华在玄关穿好鞋，转过身朝他微微欠了欠身，说了句“下次来记得提前说一声，我给你泡茶”，然后踩着那双平底鞋沿着走廊往回走。她的背影在走廊尽头2003室的门前停了一下，掏出钥匙开了门，然后门在她身后轻轻合上，门垫上那块“欢迎”的字样被夕阳照得有些发白。
            - paragraph [ref=e431]: 2001室的气密门重新滑上。小哥哥背靠着门板，长长地呼出一口气，然后低头看了一眼手机上的伊甸界面。林月华的秩序刻印数值已经无声无息地跳过了20那条线，标签从“逃离”切换成了“交易”。他咬了咬后槽牙，把手机塞回口袋，脑子里已经转过五六个如何跟赵卫国谈设备采购的方案。
            - paragraph [ref=e432]: 这扇门打开得比他预想的慢，但它确确实实开了一条缝。
