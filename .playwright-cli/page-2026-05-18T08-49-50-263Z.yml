            - paragraph
            - paragraph [ref=e926]: 傍晚的走廊被壁灯染成一片均匀的暖橙色，二十层的空气里还残留着从2003室门缝飘出来的排骨汤香气。小哥哥踩着拖鞋啪嗒啪嗒穿过走廊，手里那卷赵卫国给的旧蓝图还带着书房里机油和旧纸张混在一起的气味。他在2004室门口停了一下，门缝里传出来佐伯惠理那标志性的、带着跑调的哼歌声，听起来大概又在循环播放她自己编的某段旋律，节奏忽快忽慢，像是唱歌的人同时在转圈。回到2001室后他把图纸卷放在茶几上，靠在沙发背上闭着眼睛让刚才在书房里灌进去的那些管道走向和暗室位置在脑子里慢慢沉淀下来。监听台的手机界面上2004室的音轨还在实时跳动，他把手机拿起来扫了一眼。佐伯惠理的声音标签后面跟着的情绪曲线，一会儿上扬一会儿低垂，大概是正在跟姐姐说今天在走廊里看到小哥哥从设备间出来的事，说到兴奋处音量猛地拔高然后压低，压低的那一段被伊甸标注为疑似提到本人时的音量骤降。诗织的回应则是一条几乎平直的线，只在惠理说到某个词的时候轻轻嗯了一声。
            - paragraph [ref=e927]: 他又等了大约一刻钟，估计2003室那边赵卫国已经靠在沙发上打起了呼噜、林月华正在厨房擦最后一遍灶台，走廊里暂时不会有人进出。然后他站起来走向万象合成终端，操作界面上医药模组的图标在静音模式下亮起，一小盒布洛芬出现在料理台上。他又从终端里取了几块独立包装的消化饼干和两包红茶，装进之前在Ole买东西时攒下的浅灰色纸袋里。止痛药的事是从监听里知道的。佐伯龙一常年在外跑工程，腰椎劳损是老毛病，诗织前两天在厨房跟惠理说父亲的止痛药快吃完了，语气平淡但句子的停顿比平时长了半拍。小哥哥把纸袋拎在手里掂了掂，分量不重，但对初次敲门来说足够了。
            - paragraph [ref=e928]: 推开2001室的门，走廊里安静得只剩下头顶壁灯变压器发出的细微电流嗡鸣。他在2004室门口站定，门板上贴着一张手写的温馨提示，字迹工整但笔锋偏细，大概是诗织写的，内容是请快递员按门铃时轻一些因为家里有长辈。小哥哥抬手在门板上敲了三下，节奏和敲2003室时一样，不紧不慢。
            - paragraph [ref=e929]: 门内传来脚步声，略重，门锁咔嗒一声旋开，门被拉开半扇，佐伯龙一那张被岁月刻出额头横纹的方脸出现在门缝里。他穿着一件灰色工装衬衫，袖子挽到小臂，左手还拿着一把螺丝刀，大概刚才正在修理什么东西。那双黑色的眼睛里没有赵卫国那种锐利的审视，是一种更沉稳的、像在看工程图纸评估结构安全性的打量。他看了小哥哥大概两秒，视线在年轻人手里那个浅灰色纸袋上停了一下，然后开口，声音低沉简短。
            - paragraph [ref=e930]: “有什么事？”
            - paragraph [ref=e931]: “龙一叔叔晚上好，我是隔壁2001的小哥哥。”他把纸袋拎高了一点，袋口露出布洛芬的白色药盒边角和消化饼干的包装，“最近在整理家里的储备，发现多了些东西，想着邻居间走动一下，顺便带了点东西过来。”
            - paragraph [ref=e932]: 龙一没有立刻接话，但目光在布洛芬的盒子上停了一下。他回头朝屋里看了一眼，然后用螺丝刀在手心轻轻敲了一下，把门拉宽了些，侧身让出通道。“进来坐吧。”
            - paragraph [ref=e933]: 2004室的客厅比2003室略小，但同样整洁有序。沙发上铺着一块米色沙发巾，茶几上摆着三只同款的陶瓷杯子，杯柄朝向同一个方向。书架上的书按开本大小排列，连书脊之间的间距都几乎一致，这种强迫症般的整齐感让刚从林月华家出来的小哥哥产生了一种恍惚的熟悉。客厅角落里支着一张折叠小桌，桌上摊着几本翻开的大学教材和一本摊开的笔记本，笔记本上写满了工整的笔记，旁边还放着一支没盖笔帽的黑色水笔，显然是刚才有人在用。
            - paragraph [ref=e934]: 厨房方向传来惠理的声音，音调上扬，带着那种藏了某个秘密又被发现后的慌乱尾音。“爸爸，是、是谁来了？是不是——”她的话在她从厨房门口探出半张脸的瞬间卡住了，杏眼瞪得溜圆，马尾因为转身太猛而甩到了肩膀上，左眼角下那颗极淡的小痣在她通红的脸颊上显得格外明显。她盯着门口的小哥哥，嘴巴张成小小的O型，然后飞快地把头缩了回去。厨房里传来一阵像是围裙蹭到门框的声音，然后是惠理压低了的、却因为情绪激动而压得不够低的嘀咕声。
            - paragraph [ref=e935]: “姐姐姐姐姐姐，是他！你怎么不早说！我围裙还没摘！围裙上那个番茄汁印子还在呢！完了完了完了……”
            - paragraph [ref=e936]: “你刚才不是在哼歌的时候就说他可能会来吗。”诗织的声音从客厅另一端传来，平稳得像一面被微风拂过但不起波纹的湖面。她原本坐在沙发上翻一本旧书，听到敲门声后把书合上放在茶几上，站起来的时候动作不紧不慢，手里的书签被仔细地夹在翻到的那一页。她今天穿的是那件白色针织开衫，长发披散在肩上，没有惠理那种飞翘的发尾，每一根头发都在它该在的位置。左眼角下那颗和妹妹一模一样的淡痣在她脸上静止不动，仿佛她所有的情绪都被压缩进了这个小小的点里。
            - paragraph [ref=e937]: “请坐。”诗织微微欠了欠身，做了一个请的手势，语气温和但用词简洁。她没有像林月华那样热情地招呼客人喝茶，也没有像赵卫国那样用审视的目光打量来客，只是安静地把茶几上那本旧书挪到一边，腾出放杯子的位置。然后她走进厨房，从惠理手里接过水壶，惠理因为手忙脚乱差点把水壶盖子掉地上，被诗织用一只手稳稳地接住了。
            - paragraph [ref=e938]: “姐！我自己来就行——”惠理红着脸试图夺回水壶，被诗织用一个轻轻按住手背的动作安抚住了。
            - paragraph [ref=e939]: “茶我来泡。”诗织说完，转身从橱柜里拿出三个茶杯，茶叶盒里有几种茶叶，龙井、乌龙、还有一小罐红茶。她抬头看了一眼客厅方向，用只有自己听得见的音量说了句“红茶吧”，然后把水壶里的热水注入茶壶。整个过程行云流水，没有多余的步骤，也没有任何刻意的展示。
            - paragraph [ref=e940]: 客厅里龙一在单人沙发坐下，那把螺丝刀被他搁在茶几下层的一张旧报纸上。他看着小哥哥，沉默了片刻，然后开口，嗓音低沉而平稳。“刚才在楼下碰到你们从设备间出来，那个姓赵的师傅，他以前是搞建筑的？”
            - paragraph [ref=e941]: “对，卫国哥在建筑公司干了将近二十年。”小哥哥在三人沙发上坐下来，把纸袋放在茶几上，布洛芬的盒子被推到了龙一能清楚看到的位置，“楼里供电分支线老化的问题，他一直在头疼。今天他带我去建新建材市场看储油罐，顺便谈了些设备的事。回来的路上听他说这栋楼当初设计时留了不少冗余结构，要是以后管线大规模出故障，能靠那些预留通道抢修。”
            - paragraph [ref=e942]: 龙一听完没有立刻回应。他伸出手把布洛芬的盒子拿起来，翻到背面看了一眼成分表，然后点了点头，把盒子放在茶几上，推回到小哥哥面前一半的位置。这的意思是东西收下了但得有个说法。他看着小哥哥，黑色眼睛里还是那种沉稳的审视，但嘴角的线条似乎比刚才略微松了那么半缕。
            - paragraph [ref=e943]: “储油罐？”他问，语速不快但问题直接，“你们是在做什么准备？”
            - paragraph [ref=e944]: 这个问题比小哥哥预想的更早抛出来。不过这也符合一个常年跑工程的工程师的思维方式，他不会在宠物狗和天气这种话题上浪费时间，看到需要解释的事情就会直接问。小哥哥端起诗织刚端过来的红茶抿了一口，滚烫的液体在舌尖上滚过一圈，他借着喝茶的时间把脑子里的措辞排列好，然后把杯子搁在茶几上。
            - paragraph [ref=e945]: “最近天气不太正常，物价也在涨，业主群里三天两头有人抱怨停水停电。卫国哥担心冬天一来全楼的电闸都得跳，所以提前做些应急准备。我这几个月也在囤些物资，冬天要是真停电停暖，家里有老人家的就很难熬了。”他说到手里的时候目光自然地落在龙一身上，然后移向茶几上那本摊开在书页上、旁边压着一个药品清单的旧台历，台历上昨天那格被圈了一个不规则的圆，旁边写着“父亲的药短缺”几个字，字迹纤细但清晰。
            - paragraph [ref=e946]: 诗织刚好端着另一杯红茶走过来，听到这句话的时候手指在杯柄上停了一下。她把杯子轻轻放在茶几上，然后抬头看了小哥哥一眼。这道目光不长，大概只有一秒出头，但足够让空气中多出一些没有被说出来的话。她垂下眼睛，把茶壶放回托盘上，然后在她原来的位置上坐下，拿起茶几上那本笔记本翻到空白的一页，笔尖在纸面上轻轻点了一下，却没有马上写字。
            - paragraph [ref=e947]: “应急准备是好事。”龙一点了点头，语气还是那种沉稳的陈述句，但这句话的长度比之前的问题多了好几个字，对于一个习惯用单字回复的工程师来说，大概相当于别人发了一篇长文认可，“我们这边也在做类似的打算，回头看看能怎么配合。”
            - paragraph [ref=e948]: 惠理从厨房探出头来，这次脸上的番茄汁印子擦掉了，但耳根还残留着刚才没褪干净的红。她端着一碟切成小块的水果走出来，碟子是浅蓝色的，里面整齐地码着苹果和猕猴桃的切片，摆成了两个同心圆圈，显然是花了一番心思的。她把碟子放在茶几上，然后飞快地扫了一眼姐姐，发现诗织正低头在笔记本上写字，没有抢她的话，这才鼓起勇气转过来看着小哥哥。
            - paragraph [ref=e949]: “那、那个，你刚才说的那些准备，我觉得挺好的！”她的开场白音量比正常大了半圈，说完意识到自己声音太大，又往回压了一些，结果后半句的音调变得有些飘忽，“但我们家也有在做！姐姐已经把物资分成四大类了，还做了登记表，比我做得好多了，我是说，我也有帮上忙！我今天还帮爸爸擦了所有的工具，一个螺丝都没少，啊不对，螺丝本来就是不会少的，我意思是工具都擦干净了……”
            - paragraph [ref=e950]: “惠理说得没错。”诗织从笔记本上抬起头，打断了妹妹的自爆式发言。她说话的时候目光在惠理脸上停了一拍，然后转向小哥哥，语速比惠理慢了一倍，但每个词都落得很稳，“父亲有腰椎旧伤，惠理今天帮忙搬了沙发垫做靠枕，比上次的靠枕更软一些。”她顿了顿，然后合上笔记本，嘴角有一个幅度向上弯了弯，“她想让你知道她也很有用。”
            - paragraph [ref=e951]: “姐姐！”惠理整个人像被戳破的气球一样往后仰了半截，马尾在空中画了个弧线，脸上刚褪下去的红色又涨了回来，这次蔓延到了脖子根，“你、你怎么把我想的话说出来了！不对！我没有那么想！我是说我确实帮忙了但只是想帮忙，不是为了让他知道，也不是不是，是帮忙本来就应该的——”她用双手捂住脸，从指缝里发出闷闷的、带着懊恼的笑声。
            - paragraph [ref=e952]: 龙一在旁边看着两个女儿这一出，轻轻叹了口气，端起茶杯喝了一口，然后转过头对小哥哥说：“她们从小就这样。”说完又喝了一口茶，沉默了片刻，然后补了一句，“水果是惠理特意切的，平时她不怎么摆盘。”
            - paragraph [ref=e953]: “爸爸！”惠理从指缝里露出两只眼睛瞪向父亲，声音拔高到一半又落下来，因为诗织在旁边轻轻笑了一声。那笑声不大，短得只够让人确认她确实是笑了，但惠理的耳朵明显捕捉到了这个声响，她放下手看着姐姐，杏眼瞪得溜圆，“姐你刚才笑了！你笑了对不对！”
            - paragraph [ref=e954]: 诗织没有回答，只是端起自己那杯已经半凉的茶喝了一口，然后把茶几上那盒布洛芬拿起来看了看成分说明，又看了看生产日期，最后把盒子放在茶几下层的一个小抽屉里，关上抽屉的动作轻柔而利落。她重新拿起笔记本，翻到其中一页，用那支黑色水笔在上面写了几行字。小哥哥余光扫到那一页的标题是物资存量目录，笔迹工整得像印刷品，但比打印的字更柔软。
            - paragraph [ref=e955]: “止痛药还能撑三天，这盒布洛芬刚好无缝接上。”诗织写完字把笔帽套回笔尖，抬头看着小哥哥，语气还是那种平稳的陈述句，“谢谢，这个时机很准，对我们来说很重要。”
            - paragraph [ref=e956]: “没什么，刚好家里有多备的。”小哥哥端起已经温热的红茶又喝了一口，“龙一叔叔的腰椎劳损是老毛病的话，光有药也不够，平时注意姿势和保暖更重要。我听说这栋楼冬天供暖不太稳定，到时候如果有什么需要帮忙的，直接敲门就行。”
            - paragraph [ref=e957]: “会的。”龙一把螺丝刀重新拿起来，握在手里掂了掂，然后站起来走到门口，靠在玄关的墙壁上，双臂交叉抱在胸前。这个姿势和赵卫国的防御性抱胸不同，龙一更像是在找一个合适的观察角度。他沉默了片刻，然后说了句“有空多来坐坐，年轻人。”说完就转身走进了阳台，留下一串沉稳的脚步声。
            - paragraph [ref=e958]: 惠理等父亲的脚步声远了，才轻轻呼了一口气，好像从水下憋了很久终于浮上来。她偷瞄了一眼小哥哥，发现对方正在看她刚才摆的那盘水果，赶紧把碟子往前推了推，动作快得差点把最外圈的一块猕猴桃推出碟沿。“吃、吃水果！这苹果是昨天买的，超市打折，但我挑的都是好的！每个都检查过了没有磕痕！”
            - paragraph [ref=e959]: “惠理。”诗织轻声叫了妹妹的名字。
            - paragraph [ref=e960]: “啊？”惠理转过去看着姐姐，以为又要被拆台。
            - paragraph [ref=e961]: “去把父亲工具箱里那把备用的卷尺拿来。”诗织说这话的时候目光没有离开笔记本，但语气里多了一点温和的命令感，不是对妹妹的命令，更像是在帮惠理找个事情做，让她不用继续手脚没地方放，“明天要重新量一下储物柜的深度。”
            - paragraph [ref=e962]: 惠理哦了一声，站起来往书房走，路过小哥哥身边的时候步幅明显比平时短了半截，然后在书房门口回头飞快地看了一眼小哥哥，发现对方正在看自己，立刻把头扭回去，马尾甩出一道弧线，嘴里嘀咕着“卷尺卷尺在哪，啊在这里——”声音越说越小。
            - paragraph [ref=e963]: 客厅里只剩下两个人。诗织把笔记本翻到新的一页，用笔尖在页首写下一行日期，然后搁下笔，抬起头看着小哥哥。她的杏眼里没有惠理那种闪躲和雀跃，也没有龙一那种审视，是一种更安静的、在确认某件事情的目光。
            - paragraph [ref=e964]: “惠理对我们家很重要。”她说，声音比刚才跟妹妹说话时稍微低了一点，但不带任何敌意或防御，“她看起来总是很吵很闹，实际上最怕安静。如果哪天她努力找话说的时候你心情不好不想理她，没关系，她不会真的在意。但请不要用沉默来回应她。”
            - paragraph [ref=e965]: 小哥哥把这个请求在心里掂了掂。这听起来像是在保护妹妹，但更多的是一种信任，把惠理的弱点摊开给他看，然后请求配合。对于诗织这种把情绪压缩到极致的人来说，这大概是她表达善意最直接的方式了。
            - paragraph [ref=e966]: “好。”他点了点头，“惠理很好相处，跟她说话不费力。”
            - paragraph [ref=e967]: 诗织低下头在笔记本上写了两行字。小哥哥注意到她写字速度比之前慢了些，好像每个笔画都在确认字形的准确性。她写完最后一个字，然后把笔记本往前推了一小截，让他可以看到上面的内容。那不是他以为的物资清单，是一行工整的字。
            - paragraph [ref=e968]: 补充资源清单，隔壁2001室邻居：基础药品可互通，应急物资采购信息可共享，发电设备安装时可提供人力支持。联系方式待确认。
            - paragraph [ref=e969]: “你确认后，这个清单就是正式方案了。”诗织把笔放回笔帽里，语气平静，但耳根有一层极淡的粉红色，那个颜色很浅，浅到如果不是坐在她对面近距离观察的话根本注意不到，“惠理说你在帮月华姐那边做应急准备，我们家虽然人少，但有父亲的技术和惠理的行动力，可以分担一些工作。”
            - paragraph [ref=e970]: 小哥哥拿起笔，在联系方式待确认旁边写了一行小字，字迹算不上好看但足够清晰：随时，直接敲2001的门。然后把笔记本推回去，站起来准备告辞。
            - paragraph [ref=e971]: 惠理刚好从书房出来，手里拿着一把卷尺，看到小哥哥站起来，先是愣了一下，然后杏眼里那点没藏好的失落闪了一下，但很快被嘴里的台词盖过去。“这就要走了？还没喝完茶呢！茶都凉了，不是，我是说刚泡的茶你才喝了两口——”
            - paragraph [ref=e972]: “下次来陪你多说几句。”小哥哥走到玄关，转身朝惠理笑了笑，“卷尺不是那个，那个是弯尺。卷尺应该在你爸工具箱左边第二个抽屉里。”
            - paragraph [ref=e973]: 惠理低头看了一眼手里的弯尺，然后整个人又涨红了一圈，这次从耳根红到了脖子，又蔓延到了锁骨。她飞快地把弯尺放回书房，一边找卷尺一边嘀咕着“他怎么知道卷尺在哪，不对他刚才说来陪我多说几句，等一下他说的是‘陪我’不是‘你们家’——不对不对不能多想——”，声音虽然压低了但门外的走廊里大概有三户人家都听见了。
            - paragraph [ref=e974]: 诗织把小哥哥送到门口。玄关的灯光从头顶洒下来，在她白色针织开衫上裁出一道柔和的阴影。她微微欠了欠身，说了一句声音不大但每个字都。“明天我会把物资互助方案的草稿整理出来，到时候给你看。”
            - paragraph [ref=e975]: 小哥哥点了点头，跨出门去。走廊里的壁灯把米黄色地砖照得发亮，2003室的门已经关了，2002室那扇门依旧寂静无声，2005室方向飘来极淡的酱汤味。他踩着拖鞋啪嗒啪嗒走回2001室，把手指按在生物识别区上，气密门滑开的瞬间，玄关的暖黄色灯光把他从头到脚裹了进去。
            - paragraph [ref=e976]: 茶几上那卷赵卫国给的旧蓝图还在，旁边放着他刚记录完的备用管井和暗室位置笔记。小哥哥在沙发上坐下来，拿起笔翻开新的一页，在物资规划那一栏的旁边加了一行批注：佐伯家的物资与人力资源已初步确认，诗织的物资管理能力堪称专业级别。
            - paragraph [ref=e977]: 窗外那块全景屏幕上的暮色已经彻底沉入深蓝，城市天际线上亮起了零星的灯光。他把笔搁下来，闭上眼，脑子里转过几个如何整合佐伯家的技术力和物资管理能力的方案。明天得抽空去见雪乃老师。这个念头一闪而过，他把手机拿起来看了一眼监听台，然后把屏幕按灭，耳机里隐约传来2004室惠理对姐姐崩溃式撒娇的余音和诗织平静地指出她把弯尺当卷尺这件事时惠理那声拖长了音的“姐——”。
            - paragraph [ref=e978]:
              - option "【A】关系结盟路线&次日一早带上由万象合成终端生产的实用生活物资前往2004室，与诗织就物资互助方案展开实质性的细节讨论，借机确立正式的邻里互助同盟关系，同时也让惠理有更多自然接触的机会而非在窘迫中越陷越深。 【B】整合理念路线&回到2001室后将从佐伯家获得的管理理念与林月华分享，让两位对物资整理都有强迫症的主妇型角色产生跨房间的协同效应，为日后物资管理的统一调度打下基础。 【C】继续扩展路线&趁热打铁隔天傍晚前往2005室拜访雪乃和凌音，以班主任与学生叙旧为由建立长期中断后的重新接触，评估这两位姐妹在末日准备中的可协作程度以及凌音的防御性态度有多深。 【D】情报分析路线&利用监听台收集佐伯家今晚的对话，分析诗织对小哥哥的真实评价以及惠理的暗恋程度有多深，同时关注雪乃和凌音在2005室的晚间动态，为下一轮人际扩展做足情报功课。" [ref=e979]
