            - paragraph [ref=e216]:
              - code [ref=e217]: 地点·星穹国际公寓20层2001室·9527年12月14日·星期日·08:30
            - paragraph [ref=e218]: 窗外还是那片灰白。
            - paragraph [ref=e219]: 不是阴天那种灰——是天空本身失去了颜色，像一张曝光过度的底片，只剩下模糊的光和漫无边际的雪雾。风裹着冰晶砸在玻璃上，发出沙沙的摩擦声，细密、连续，听久了会让人忘记沉默是什么感觉。
            - paragraph [ref=e220]: 2001室的主卧室里，温度计停在二十三度。
            - paragraph [ref=e221]: 他醒过来的时候，被子里还留着暖气管道送来的微温。床头柜上的水杯没有结冰。这个房间里的一切都在对抗窗外的世界——墙是暖的，地板是暖的，连呼吸的空气里都没有那种刺骨的寒气。
            - paragraph [ref=e222]: 走廊里有人在哭。
            - paragraph [ref=e223]: 声音是从门缝底下渗进来的，闷闷的，像被什么东西捂住了嘴。不是小孩子的哭声，是成年女人的。哭了大概十几秒就停了，换成一阵剧烈的咳嗽，然后是脚步声，拖着往楼梯口那边去了。
            - paragraph [ref=e224]: 十八楼的工程师李伟把消防斧卡在门框上当门闩，他的妻子张兰正往浸了水的棉被上浇最后一瓶矿泉水。十六岁的李静蹲在墙角，用从楼道里捡的炭笔在墙纸上画画。她画的是一棵开花的树，树干歪歪扭扭的，花是用炭笔戳的小圆点。张兰看了她一眼，没说话。
            - paragraph [ref=e225]: 十二楼的退休军官山本源把望远镜架在窗户的缝隙上。他的呼吸在镜片上凝成一层雾，但他没有擦——这个温度下镜头会冻住手指的皮肤。他观察的是楼下的停车场，那里有三具被雪埋了半截的尸体，昨天还是两具。
            - paragraph [ref=e226]: 十七楼的佐藤医生数了三遍胰岛素。最后三支。他的妻子惠子蜷在被子里，嘴唇发紫。他说再等两天，等风雪小一点就出趟门。惠子没有回答，只是把脸转向墙壁。
            - paragraph [ref=e227]: 2002室里，纪宁把昨天熨好的西装从衣柜里拿出来，铺在床上。衣服早就没有场合穿了，但她还是按照原来的习惯——每周三次，熨斗的蒸汽在零下四十度变成白色的雾，飘到天花板上就消失了。她的丈夫陈宇坐在客厅里修理一台坏掉的收音机，手指关节冻得发红，拧螺丝的动作很慢但很稳。收音机里什么声音都没有。
            - paragraph [ref=e228]: 2004室里，佐伯诗织在翻家里的库存清单。她说还剩六包压缩饼干、三听罐头、一瓶维生素片。她的妹妹惠理蹲在姐姐旁边，马尾辫垂在肩膀上，手里捏着一张画了笑脸的便签纸。父亲龙一检查完窗户的密封条，从工具箱里拿出一卷胶带，开始给门缝贴上第四层。
            - paragraph [ref=e229]: 2006室里，表姐陈雪把剩下的小半袋面粉倒进盆里。她说今天吃什么，幺妹说随便，能填肚子就行。陈雪骂了句脏话，然后把盆子端到角落去和面。幺妹看着表姐的背影，把自己的那份水倒进表姐的杯子里。
            - paragraph [ref=e230]: 2008室的门一直关着。
            - paragraph [ref=e231]: 2001室门口，近域监听的指示灯闪了一下。
            - paragraph [ref=e232]: 他听见了这些——不是全部，但足够拼出这层楼的样子。伊甸今天早上的音频摘要只有一行字：20层走廊，五人经过，三组对话，无威胁判定。
            - paragraph [ref=e233]: 走廊尽头那扇被改造成闸门气密舱的门还锁着。门外是穿堂风在楼道里回旋的呼啸声。门里是二十三度的恒温。
            - paragraph [ref=e234]: 万象合成终端发出轻轻的蜂鸣声，提示早餐的合成已经完成。
