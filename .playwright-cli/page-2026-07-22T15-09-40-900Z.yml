                                - strong [ref=f16e38]: 末日生存
                                - text: 题材故事开场剧情：未来某天，全球气候发生灾难性变化。末日中，小哥哥获得了名为“伊甸”的黑科技，帮助其度过末日，收拢追随者，恢复秩序。
                                - text: <故事设定> 灾难类型：全球气候发生灾难性降温，社会生产秩序崩塌，大部分人死于非命。 世界景象： 超自然极端天气：除经过伊甸等特殊改造的护具和装备防护外，基本无法在室外存活，无天气窗口 行动窗口：几乎没有外出机会，需伊甸特制护具 社会组织度：少量据点存在，但社会联系脆弱，无电力、无交通 生产残余度：近乎只剩库存消耗，无法稳定生产，无可靠交通工具 冲突密度：各残余幸存者组成小规模社区，但彼此冲突成为常态，且时常为争夺资源展开殊死争斗，一部分比较有武力的暴徒四处劫掠，弱肉强食下只有少部分社群能建立脆弱的基础秩序，社会治安更是无从谈起 外部威胁主因：人出到室外，要面临失温等环境威胁，灾难初期大部分人因此丧命。 外出死亡风险：无准备外出几乎等同送命，离开掩体本身就是极高风险行为。 据点化程度：存在少量中小型据点和局部控制区，但整体仍分散脆弱，随时可能被吞并、瓦解或改旗易帜。 社会基调： 社会组织度：少量据点存在，但社会联系脆弱，无电力、无交通 生产残余度：近乎只剩库存消耗，无法稳定生产，无可靠交通工具 冲突密度：各残余幸存者组成小规模社区，但彼此冲突成为常态，且时常为争夺资源展开殊死争斗，一部分比较有武力的暴徒四处劫掠，弱肉强食下只有少部分社群能建立脆弱的基础秩序，社会治安更是无从谈起 据点化程度：存在少量中小型据点和局部控制区，但整体仍分散脆弱，随时可能被吞并、瓦解或改旗易帜。 故事时间：公元2026年9月14日·14:00，这是小哥哥获得伊甸庇护所的第7天。
                                - text: <主人公背景> 小哥哥末日前住中国（在剧情中称为东和国）瑞峰市星穹国际公寓2001室，是一名未设定，灾变的1年后，因一次超自然原因获得了名为"伊甸庇护所"的超级科技实体，故事时间线锚定在小哥哥获得庇护所7天后展开
                                - text: <庇护所及其科技> 伊甸庇护所：内嵌在星穹国际公寓2001室里的黑科技实体，它具备人工智能的思维形态和以下能力： 可维持2001核心区的基础供暖与生活供电接口，范围仅2001室，不得外接。 一道用于强化2001核心入口的门体，用于防止强闯，仅入口有效，不能覆盖整层。 万象合成终端：元素重构级合成干粮、罐头、面粉、大米等基础食材和纯水的终端设备，T1款功率有限无法大规模生产。 热水器接口提供2001全屋热水淋浴、盥洗条件，T1款功率较小受时限限制，每次10分钟，冷却6小时。 提供2001门口与短距走廊的被动音频监听，供伊甸识别和分析，T1款只能依据声音判断年龄、性别、情绪状态 庇护所所处位置：中国（在剧情中称为东和国）瑞峰市星穹国际公寓2001室，末日前属于高端住宅。
