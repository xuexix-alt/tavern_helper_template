                                  - code [ref=f16e69]: 星穹国际公寓2001室·2026年9月14日·星期一·14:00
                              - paragraph [ref=f16e70]: 公元2025年的那个秋天，世界在短短四十八小时内彻底白了头。
                              - paragraph [ref=f16e71]: 起初只是气象台播报的一场异常寒流，紧接着是断崖式的降温，每小时下降十摄氏度。瑞峰市的街道上，那些穿着单薄风衣、手里还拿着冰拿铁的上班族，在试图跑向地铁站的途中，肺部就被吸入的极寒空气冻成了冰渣。那是人类文明最后的一场集体演出，无数人像被按了暂停键的蜡烛，在凝固的寒风中保持着奔跑或呼救的姿势，成为了城市里随处可见的冰雕。
                              - paragraph [ref=f16e72]: 一年后的今天，公元2026年9月14日。
                              - paragraph [ref=f16e73]: 星穹国际公寓，这座曾经代表着瑞峰市精英阶层生活高度的建筑，如今更像是一座竖立在废墟中的墓碑。外墙那层昂贵的Low-E玻璃早已被超低温冻出了密密麻麻的裂纹，狂风卷着细碎的冰晶在楼宇间疯狂抽打，发出如同野兽咀嚼骨头般的咯吱声。
                              - paragraph [ref=f16e74]: 二十层的走廊里，空气是浑浊且凝固的。墙壁上结了一层厚厚的白霜，那是住户们呼出的最后一点温热水汽在离开身体后瞬间凝结的残骸。每一扇房门都紧紧闭着，门缝里塞满了发霉的旧衣物和报纸，试图阻挡哪怕一丝寒气的渗入。
                              - paragraph [ref=f16e75]: 在这里，沉默不是美德，而是为了节省那一点点微薄的体能。
                              - paragraph [ref=f16e76]: 2002室，那个曾经在销售场上叱咤风云的纪宁，此刻正把自己裹在三层厚重的、带着霉味的被子里，只露出一双布满血丝的眼睛。她的丈夫陈宇，那个平日里沉默寡言的程序员，正蹲在客厅地板上，用一把生锈的裁纸刀拆卸着一个木质茶几。他动作机械且缓慢，每一刀下去都要停下来喘息良久。
                              - paragraph [ref=f16e77]: 那是他们仅剩的燃料了。为了烧掉这点木头煮开一小锅雪水，他们已经商量了整整一个上午。
                              - paragraph [ref=f16e78]: 而在2004室，佐伯诗织正紧紧抱着瑟瑟发抖的妹妹惠理。曾经作为舞者的惠理，那双轻灵的腿现在肿胀得像两根紫红色的萝卜，那是严重的冻疮。诗织机械地抚摸着妹妹的长发，眼神空洞地盯着天花板。她们的父亲佐伯龙一，那个沉默的工程师，正坐在门口，手里紧紧攥着一把扳手，警惕地听着走廊里的任何动静。
                              - paragraph [ref=f16e79]: 就在这片绝望的死寂中，2001室的那扇门，却显得格格不入。
                              - paragraph [ref=f16e80]: 那是一扇泛着冷冽金属光泽的重型气密门。不同于其他邻居门上贴着的催缴单或积攒的灰尘，这扇门干净得甚至能照出人影。最令人疯狂的是，只要靠近这扇门半米之内，就能感受到一种几乎被人类遗忘的触感——温暖。
                              - paragraph [ref=f16e81]: 小哥哥此时正坐在2001室那张柔软的组合沙发上。
                              - paragraph [ref=f16e82]: 屋内的空气经过伊甸系统的调节，维持在人体最舒适的二十四摄氏度。落地窗上的全景屏幕正模拟着夏威夷的海滩，蔚蓝的海浪拍打着金色的沙滩，阳光明媚得让人眩晕。这种温暖和明亮，在此时的地球上，无异于最奢侈的奇迹。
                              - paragraph [ref=f16e83]: 他手里拿着一块刚从“万象合成终端”里吐出来的干粮，虽然口感像干燥的压缩饼干，但胜在营养均衡且温热。
                              - paragraph [ref=f16e84]: 他身侧的虚空中，浮现着一圈淡蓝色的波纹。那是伊甸的近域监听界面。
                              - paragraph [ref=f16e85]: “检测到2002室内部有敲击声，频率较低，推测为破坏家具获取燃料。2004室检测到轻微啜泣声，女性，情绪稳定性指数极低。2008室慕小小，其房间内的生命体征波动异常，推测正在进行高频率的咒骂或由于极度寒冷导致的肌肉痉挛。”
                              - paragraph [ref=f16e86]: 伊甸那冷冰冰的机械音在客厅里回荡，带着一种剥离感。
                              - paragraph [ref=f16e87]: “二十层走廊检测到未知移动物体。热能感应显示，目标体温三十三点四摄氏度，处于严重失温边缘。距离2001室大门……三米。两米。一米。”
                              - paragraph [ref=f16e88]: “咚。”
                              - paragraph [ref=f16e89]: 一声沉闷的撞击声透过那道厚重的金属门，传进了小哥哥的耳朵里。那不是敲门，更像是某个精疲力竭的人最后脱力，身体靠在门板上滑落的声音。
                              - paragraph [ref=f16e90]: 小哥哥微微侧过头，看着监听界面。
                              - paragraph [ref=f16e91]: 在监听波纹的图像中，门外蜷缩着一个纤细的人影。由于体温过低，热能成像呈现出一种灰败的冷紫色。那是凌音，那个原本住在2005室、总是在电梯里对他脸红的小姑娘。她此刻正穿着一件极不合身的、大得离谱的羽绒服，双手死死抠着2001室的门缝，嘴唇翕动着，发出极其微弱的、几乎被走廊风声掩盖的呢喃。
                              - paragraph [ref=f16e92]: “救……救救我……姐姐……救救……”
                              - paragraph [ref=f16e93]: 2005室的门后，雪乃正绝望地贴着猫眼。她看着妹妹因为撑不住饥饿和寒冷，想要去向那个“有点古怪”的邻居求助，却在踏出门的一瞬间就被走廊里的寒气夺走了最后一丝力气。雪乃的手死死捂着嘴巴，眼泪在还没流出眼眶前就结成了冰晶。她不敢开门，她知道只要一开门，积蓄了一年的那点暖气就会瞬间消散，而她也会和妹妹一起死在那条冰封的走廊里。
                              - paragraph [ref=f16e94]: 2001室内的恒温系统轻轻发出一声低鸣，加湿器喷出一股细密的白雾。
                              - paragraph [ref=f16e95]: 小哥哥站起身，走到门前。透过伊甸的视角，他不仅能看到倒在地上的凌音，还能看到走廊尽头，1902室那三个模特正从门缝里探出惊恐而贪婪的目光。她们也感觉到了，2001室附近那不正常的温度。
                              - paragraph [ref=f16e96]: 这片死寂的冰原上，第一道裂缝已经产生。
                              - paragraph [ref=f16e97]: 他伸出手，悬在气密门的感应开关上方。伊甸的灯光微微闪烁，仿佛在等待他的指令。
                              - paragraph [ref=f16e98]: 是继续维持这一方净土的冷漠，还是在这个快要烂掉的世界里，重新拉起一道秩序的线？
                              - paragraph [ref=f16e99]: 门外，凌音的手指无力地滑落，指甲在金属门板上留下了一道极浅的、刺耳的划痕。
