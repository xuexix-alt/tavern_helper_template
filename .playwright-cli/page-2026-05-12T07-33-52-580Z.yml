                                - paragraph [ref=f27e73]:
                                  - time [ref=f27e74]:
                                    - code [ref=f27e75]: 星穹国际公寓20层2001室·9527年12月14日·星期三·08:37
                                - paragraph [ref=f27e76]: 门锁咔哒一声合拢，将走廊里带着蓝紫调的冰冷空气彻底隔绝在外。
                                - paragraph [ref=f27e77]: 玄关里的暖白灯光照在地上。2001室内，温度恒定在二十六度。没有风声。
                                - paragraph [ref=f27e78]: 他手里拿着刚才换来的一个土豆和一根白萝卜。土豆表皮干干的，带着泥。萝卜根部原本的冰碴子在室内的高温下开始融化，变成几滴水珠，顺着萝卜皮往下淌，滴在玄关的复合地板上。
                                - paragraph [ref=f27e79]: 他走到开放式厨房，把这两样东西放在流线型的料理台上。旁边就是万象合成终端的操作界面。
                                - paragraph [ref=f27e80]: 手指上还残留着塑料包装袋递出去时的触感。林月华接过干粮时，她的手指冻得发白，指节处透着僵硬的青色。那双手碰到干粮袋子的瞬间，手指下意识地收紧。而赵卫国接过食材、磕掉泥土的动作很稳，那双手掌宽大，指腹和虎口处结着厚实的老茧。
                                - paragraph [ref=f27e81]:
                                  - generic [ref=f27e82]: 正在加载图片…
                                - paragraph [ref=f27e83]: 他没有在厨房多停留，转身走回玄关旁边的墙壁。那里嵌着一块面板。
                                - paragraph [ref=f27e84]: 手指在屏幕上划过，启动了近域监听台。
                                - paragraph [ref=f27e85]: 屏幕亮起微光，显示出一条平缓波动的绿色音频线。走廊里的风声被系统过滤成了低频的背景音。
                                - paragraph [ref=f27e86]: 音频线突然跳动了一下。
                                - paragraph [ref=f27e87]: 系统自动在屏幕边缘弹出一行极小的白色字符：【捕捉到短距声源】。
