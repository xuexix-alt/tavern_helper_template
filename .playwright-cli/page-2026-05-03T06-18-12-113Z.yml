                                    - generic "🌙 月满如镜，思绪澄明 ✦ ˚ ✦" [ref=f48e113] [cursor=pointer]:
                                      - generic [ref=f48e114]: 🌙
                                      - generic [ref=f48e115]: 月满如镜，思绪澄明
                                      - generic [ref=f48e116]: ✦ ˚ ✦
                                  - paragraph [ref=f48e117]:
                                    - code [ref=f48e118]: 星穹国际公寓2001室·9527年12月14日·星期二·09:18
                                  - paragraph [ref=f48e119]: 客厅控制面板上的液晶屏无声地跳动了一下，原本漆黑的屏幕亮起了冷幽幽的蓝光。伊甸T1级可视对讲系统的广角摄像头捕捉到了门外的全景：雪乃正紧紧裹着那件灰色的针织开衫，尽管这在零下十五度的走廊里几乎起不到任何保暖作用。她那张曾经在讲台上优雅端庄的脸，此刻因为极度的寒冷而呈现出一种病态的青白色，鼻尖冻得通红，呼吸出的白雾不断模糊着她的视线。
                                  - paragraph [ref=f48e120]: 小哥哥指尖在触摸屏上轻轻一点，开启了单向通话通道。
                                  - paragraph [ref=f48e121]: “有事？”
                                  - paragraph [ref=f48e122]: 冰冷的电子合成音经过滤后，在死寂的走廊里显得格外突兀。雪乃显然没料到回应会来得这么快，更没料到声音会这么冷淡。她整个人像是被电击了一下，肩膀猛地一缩，原本绞在一起的手指因为用力过度而骨节泛白。她下意识地抬起头，视线在气密门周围寻找着麦克风的位置，眼神里透着一种被剥离了尊严后的惶恐。
                                  - paragraph [ref=f48e123]: “小哥哥同学……你、你在听吗？”
                                  - paragraph [ref=f48e124]: 雪乃的声音在颤抖，牙齿不自觉地打着架，发出轻微的咯咯声。她深吸了一口气，试图维持住作为班主任的那最后一点逻辑。“抱歉……这么早来打扰你。我知道，现在每一点物资都是……都是命。但是，凌音她已经……她已经快两天没吃东西了，她还年轻，身体熬不住。还有我婆婆，她昨晚就开始发烧，我……”
                                  - paragraph [ref=f48e125]: 她的话断在了这里，嗓音带上了一丝压抑的呜咽，但很快被她强行吞了回去。她紧紧抿着那双毫无血色的嘴唇，眼神低垂，盯着地面上的一块积雪残迹，像是在等待审判的囚徒。
                                  - paragraph [ref=f48e126]: “所以呢？”
                                  - paragraph [ref=f48e127]: 小哥哥的声音依然没有任何起伏，甚至没有通过对讲机传达出一丝同情。屏幕里的雪乃身子颤了颤，她抬头看向摄像头，似乎想要穿透这扇厚重的钢铁大门，看清门后那个曾经坐在教室后排、性格平和的学生的表情。但她看到的只有紧闭的金属纹路。
                                  - paragraph [ref=f48e128]: “我……我这里有一些我以前收藏的字画，还有……还有几张绝版的唱片。我知道这些现在可能没用，但我可以用它们换……换一点点面包，或者几块压缩干粮。只要一点点就行，求求你了。”
                                  - paragraph [ref=f48e129]: 雪乃一边说着，一边从开衫宽大的口袋里掏出一个用布包得严严实实的长条形物体。她的手冻得有些僵硬，动作显得笨拙而吃力。在寒风的侵袭下，她的双腿开始轻微地战栗，过膝的长裙在风中摆动，露出她那双穿着单薄丝袜、已经冻得发僵的小腿。
                                  - paragraph [ref=f48e130]: 监控画面里的雪乃显得那么渺小且无助。她立在2001室门外，背景是昏暗、冰冷、布满灰尘的走廊，而门内是恒温26度、充满香氛和热水的伊甸。这种巨大的反差在屏幕上被无限放大。
                                  - paragraph [ref=f48e131]: “那些东西，我不感兴趣。”
                                  - paragraph [ref=f48e132]: 小哥哥的声音通过对讲机再次响起，每一个字都像是冰渣子。
                                  - paragraph [ref=f48e133]: 雪乃的身体彻底僵住了。她捧着那个布包的手停在半空中，脸上的表情从哀求变成了某种近乎绝望的空洞。她张了张嘴，却发现自己所有的筹码在对方眼中一文不值。走廊里的风又大了些，呜呜地吹过。她缩了缩脖子，整个人看起来像是一朵被冻在冰块里的残花。
                                  - paragraph [ref=f48e134]: “那……那你需要什么？”
                                  - paragraph [ref=f48e135]: 雪乃低声问道，声音小得几乎要被风声淹没。她似乎意识到，在这个世界里，那些“旧时代”的体面和艺术已经彻底失去了价值。她抬起眼皮，目光中闪过一抹挣扎，随后是某种彻底豁出去的、带着死志的决绝。
                                  - paragraph [ref=f48e136]: “只要我有……只要我能给的……”
                                  - paragraph [ref=f48e137]: 她没有把话说完，只是那样立在门外，等待着那个掌握着她全家生死的、冰冷的回应。
