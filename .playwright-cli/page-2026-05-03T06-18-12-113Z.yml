                                - paragraph:
                                  - time
                                - code [ref=f48e62]: "```二·08:30``` </time> 星穹国际公寓2001室。厚重的气密舱门内，恒温26度的暖气无声地流淌着。万象合成终端发出一声轻微的蜂鸣，吐出一块包装简洁的压缩干粮和一瓶经过高精度净化的纯水。这是末日降临的一年后，在这座曾经被誉为瑞峰市地标的豪华公寓里，只有2001室还维持着某种近乎奢侈的、灾难前的体面。 一年前，全球气候骤变，那种名为“腐蚀雪晶”的超自然极端天气摧毁了一切。电力、交通、信号，在不到一个月的时间里悉数崩塌。城市变成了白色的坟墓，而活着的人，则成了墓穴里相互撕咬的野兽。雪狼帮在废墟中劫掠，“方舟”教会在末日里宣扬扭曲的救赎，拾荒者联盟则"
                                - paragraph [ref=f48e63]: 像鬣狗一样在雪层下翻找着旧时代的残余。
                                - paragraph [ref=f48e64]: 小哥哥坐在宽大的真皮沙发上，这是他获得“伊甸庇护所”的第七天。七天前，这个黑科技实体无声无息地寄生在了2001室，从此，这间屋子成了整栋公寓楼、甚至整个瑞峰市最安全的孤岛。
                                - paragraph [ref=f48e65]: “……嘶……哈……”
                                - paragraph [ref=f48e66]: 监听器里传来一阵低沉的喘息，那是伊甸T1级近域监听台捕捉到的、来自2001室门口走廊的声音。“陈宇，你……你慢点。”
                                - paragraph [ref=f48e67]: 那是2002室纪宁的声音。即便是在这种绝望的环境下，这位曾经的销售总监依然努力保持着语速的平稳，尽管那其中的虚弱已经掩盖不住了。
                                - paragraph [ref=f48e68]: “没事，我……我能行。这门，还得加固。那帮人……19楼那帮疯子，昨晚又在撬电梯井了。”
                                - paragraph [ref=f48e69]: 陈宇的声音粗砺得像砂纸摩擦，伴随着金属重物落在地板上的沉闷声响。这位固执的程序员，正拖着他那具因为长期营养不良而显得有些佝偻的身体，试图用不知从哪拆下来的铁皮加固自家的房门。
                                - paragraph [ref=f48e70]: “纪宁，你……你先进去。把那半罐黄桃罐头吃了。别省着，我……我不饿。”
                                - paragraph [ref=f48e71]: “陈宇，我们来梳理一下逻辑。”纪宁深吸了一口气，声音里带着一种近乎病态的理性的严谨，“按照目前的消耗速度，如果没有新的补给，我们最多还能撑三天。你把食物留给我，你的体力下降会更快，到时候一旦有人强闯，我们两个都活不了。所以，平分，这是最优解。”
                                - paragraph [ref=f48e72]: “行了，别废话了。我说不饿就不饿。”
                                - paragraph [ref=f48e73]: 陈宇生硬地打断了她，随后是重重的关门声。
                                - paragraph [ref=f48e74]: 走廊再次陷入了死寂，只有穿堂风从破碎的窗户缝里灌进来，发出呜呜的怪叫。
                                - paragraph [ref=f48e75]:
                                  - text: 2001室的控制面板上，伊甸的分析报告缓缓滚动着：
                                  - text: 【监测到2002室住户情绪波动：焦虑度78%，饥饿度85%。】
                                  - text: 【建议：利用当前资源优势进行初期秩序渗透。】
                                - paragraph [ref=f48e76]: 小哥哥站起身，走到主浴室。热水器接口已经冷却完毕，温热的水流冲刷着身体，这种在外界足以引发一场血腥争夺的洗浴，在这里只是日常。他看着镜子里的自己，七天的安稳生活让他恢复了不少精神，但门外的世界，却在不断地通过那细微的监控声提醒着他：秩序，必须由他来建立。
                                - paragraph [ref=f48e77]: 他想起2004室的佐伯姐妹。姐姐诗织总是沉默地打扫着走廊的积雪，试图维持那一点点可怜的尊严；妹妹惠理则会在没人的时候，偷偷对着2001室紧闭的房门发呆。还有2008室那个曾经的大明星慕小小，昨天他在门口安装简易感应器时，曾透过门缝瞥见过一眼。那个女人裹着昂贵的皮草大衣，蜷缩在沙发里，眼神涣散，手里死死攥着一支过期的口红，那是她最后的铠甲。
                                - paragraph [ref=f48e78]: “咚、咚咚。”
                                - paragraph [ref=f48e79]: 一阵极轻、极有节奏的敲门声打断了小哥哥的思绪。不是那种野蛮的砸门，也不是绝望的求救。
                                - paragraph [ref=f48e80]: “小哥哥同学，你在吗？”
                                - paragraph [ref=f48e81]: 那是雪乃老师的声音，2005室的住户，曾经小哥哥的班主任。她的声音隔着厚厚的气密门显得有些失真，但那种特有的、带着些许压抑的温柔感依然清晰。
                                - paragraph [ref=f48e82]: “是我，雪乃。我想……我想找你商量点事。关于……关于凌音，还有……还有一点私事。”
                                - paragraph [ref=f48e83]: 敲门声停下了，雪乃站在门外，呼吸有些急促。监听器捕捉到她紧紧抓着领口的声音，布料摩擦的悉索声显示出她内心的极度不安。
                                - paragraph [ref=f48e84]: “如果不方便的话……我就……我就在门口等一会儿。”
                                - paragraph [ref=f48e85]: 她没有走。20层的走廊温度大概在零下十五度左右，即便是这种被称为“缓冲区”的室内，普通人站上十分钟也会感到骨髓生疼。但她依然立在那里，像一朵在寒风中即将凋零的枯萎花朵，等待着2001室这道钢铁大门背后的裁决。
                                - group [ref=f48e87]:
                                  - generic "📜 星图已绘 - 航路已明" [ref=f48e88] [cursor=pointer]:
                                    - generic [ref=f48e89]: 📜
                                    - generic [ref=f48e90]: 星图已绘 - 航路已明
