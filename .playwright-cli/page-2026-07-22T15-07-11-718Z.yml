            - paragraph [ref=e358]: 小哥哥手里攥着那块微温的合成干粮，视线落在虚空中的监听波纹上。门外的凌音已经不再挣扎，她那只抠在门缝上的手缓缓垂落，指尖在金属板上拖出一条细长的白霜痕迹。
            - paragraph [ref=e359]: 在伊甸系统的通讯界面上，纪宁的头像闪烁了一下。即使是在这种朝不保夕的时刻，她的系统头像依然是末日前那张穿着米白色真丝衬衫、戴着珍珠耳钉的职业形象照。
            - paragraph [ref=e360]: “刚才私聊了什么？”
            - paragraph [ref=e361]: 纪宁的声音通过音频通道传了过来，依旧是那种偏低沉的女中音，咬字清晰得像是正在主持一场季度销售复盘会。只是，如果仔细听，能分辨出她呼吸间带着一种因为长期饥饿而产生的短促感。
            - paragraph [ref=e362]: “那个……如果你指的是你提出的那个‘提议’，我想我已经表达得足够清楚了。”
            - paragraph [ref=e363]: 2002室的背景音里传来了木材断裂的脆响。陈宇大概是又拆掉了一把椅子。纪宁顿了一下，似乎是换了个姿势，听筒里传来了布料摩擦的沙沙声。
            - paragraph [ref=e364]: “你说‘跟我睡一觉，你给我供应充足的食物’。”
            - paragraph [ref=e365]: 纪宁重复这句话的时候，语气平淡得没有起伏，像是在复述一个毫无竞争力的竞标方案。
            - paragraph [ref=e366]: “这种交换在目前的瑞峰市，或者说在星穹公寓，是缺乏基本履约保证的。且不说你手里所谓的‘充足食物’到底能维持多久，单从生理角度来看，在这种室温下，任何多余的体力消耗都是在缩短寿命。小哥哥，这种幻觉……嗯，你应该多喝点热水清醒一下。”
            - paragraph [ref=e367]: 她似乎是靠在了冷冰冰的墙上，发出一声极轻的叹息。
            - paragraph [ref=e368]: “不过，如果你手里真的有哪怕一罐过期的午餐肉，或者一瓶干净的饮用水……我们可以谈谈更有建设性的东西。比如我丈夫陈宇，他熟悉这一层的电路结构，如果你想让2001的‘奇迹’延续下去，或许你会需要他的技术。至于那种脱离现实的要求……那个，就当是低温引起的脑部充血吧。”
            - paragraph [ref=e369]: 2001室内的恒温系统嗡鸣着，将加湿器喷出的白雾推向落地窗。窗外的冰雪已经覆盖到了二十层的高度，那些扭曲的冰晶在玻璃上爬行，试图寻找进入这片温暖禁区的缝隙。
            - paragraph [ref=e370]: “咚。”
            - paragraph [ref=e371]: 门外又传来一声闷响。不是凌音，而是1902室的那几个模特。她们似乎终于忍不住了，正哆哆嗦嗦地挪到走廊中间。
            - paragraph [ref=e372]: “那个……2001的邻居？你在里面吗？”
            - paragraph [ref=e373]: 一个尖锐且发颤的女声隔着厚重的气密门传了进来，带着一种令人作呕的讨好。
            - paragraph [ref=e374]: “我们……我们看到凌音倒在你门口了。能不能……能不能让我们把她抬进去？我们也会帮着照顾她的……只要，只要你让我们在玄关待一会儿就好，求你了……”
            - paragraph [ref=e375]: 伊甸的近域监听台忠实地捕捉到了她们急促的呼吸。热感应显示，她们的体温也已经降到了临界点。这几个女人正互相搀扶着，眼神贪婪地盯着气密门那圈散发着微弱红光的感应带。
            - paragraph [ref=e376]: 雪乃在2005室的门后死死攥着门把手。她听到了1902室那些女人的声音，也听到了她们试图触碰凌音的动静。她的眼角抽动着，内心深处的某种东西正在被撕裂。凌音是她的妹妹，是她在这个世界上唯一的血脉，可那扇门外的严寒是死神的镰刀。
            - paragraph [ref=e377]: 纪宁在那边似乎也听到了动静，她的语速稍微加快了一点。
            - paragraph [ref=e378]: “2001门口有人？那个……小哥哥，如果你打算开门，我建议你先确认一下你手里有没有能压制她们的东西。人在快饿死的时候，比野兽更不可控。”
            - paragraph [ref=e379]: 她没有再说下去，通讯频道保持着开启状态，只有陈宇那边机械的劈砍声规律地传来。
            - paragraph [ref=e380]: 小哥哥站在门后，防护服就挂在旁边的挂钩上。那层冷冽的金属光泽在室内柔和的灯光下显得有些刺眼。凌音的体温在热感应图上已经从冷紫色向死灰转变。
            - paragraph [ref=e381]: 开门，意味着打破这层绝对安全的壳。不开门，凌音就会在三分钟内变成走廊里众多冰雕中的一员。
            - paragraph [ref=e382]: “救……救……”
            - paragraph [ref=e383]: 凌音的呢喃已经弱到几乎无法被识别，只有伊甸的音频增强系统还在顽强地捕捉那点微弱的振动。
