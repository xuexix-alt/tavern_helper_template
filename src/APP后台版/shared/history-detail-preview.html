<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>确认订单 - 剧情工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'PingFang SC',
          'Microsoft YaHei',
          -apple-system,
          sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 5100;
      }

      .modal-content {
        width: 100%;
        max-width: 440px;
        border-radius: 20px;
        border: 1px solid rgba(96, 165, 250, 0.25);
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(0, 0, 0, 0.92));
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.5);
        overflow: hidden;
      }

      /* Header */
      .modal-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }

      .header-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(96, 165, 250, 0.15);
        color: #60a5fa;
      }

      .header-title {
        flex: 1;
      }

      .header-title h2 {
        font-size: 16px;
        font-weight: 700;
        color: #e2e8f0;
      }

      .header-title p {
        font-size: 12px;
        color: rgba(226, 232, 240, 0.5);
        margin-top: 2px;
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(30, 41, 59, 0.6);
        color: #e2e8f0;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-back:hover {
        background: rgba(30, 41, 59, 0.9);
        border-color: rgba(96, 165, 250, 0.4);
      }

      /* Body */
      .modal-body {
        padding: 20px;
      }

      /* Order Card */
      .order-card {
        border-radius: 16px;
        padding: 18px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(30, 41, 59, 0.5);
        margin-bottom: 16px;
      }

      .order-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .order-name {
        font-size: 16px;
        font-weight: 700;
        color: #e2e8f0;
      }

      .order-sub {
        font-size: 12px;
        color: rgba(226, 232, 240, 0.5);
        margin-top: 4px;
      }

      .order-price {
        font-size: 20px;
        font-weight: 800;
        color: #fcd34d;
      }

      .order-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.15);
        color: #60a5fa;
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }

      .stat-card {
        border-radius: 14px;
        padding: 14px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(30, 41, 59, 0.5);
        text-align: center;
      }

      .stat-label {
        font-size: 11px;
        color: rgba(226, 232, 240, 0.5);
        margin-bottom: 6px;
      }

      .stat-value {
        font-size: 16px;
        font-weight: 700;
        color: #e2e8f0;
      }

      /* Actions */
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 8px;
      }

      .btn-cancel {
        padding: 12px 20px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(30, 41, 59, 0.6);
        color: #e2e8f0;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-cancel:hover {
        background: rgba(30, 41, 59, 0.9);
      }

      .btn-primary {
        padding: 12px 20px;
        border-radius: 12px;
        border: 1px solid rgba(96, 165, 250, 0.4);
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.9), rgba(139, 92, 246, 0.9));
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="modal-overlay">
      <div class="modal-content">
        <!-- Header -->
        <header class="modal-header">
          <div class="header-icon">
            <i class="fas fa-shopping-cart"></i>
          </div>
          <div class="header-title">
            <h2>确认订单</h2>
            <p>高管秘书剧本</p>
          </div>
          <button class="btn-back">
            <i class="fas fa-arrow-left"></i>
            返回
          </button>
        </header>

        <div class="modal-body">
          <!-- Order Info Card -->
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-name">林诗涵 · 都市白领</div>
                <div class="order-sub">高管秘书剧本</div>
              </div>
              <div class="order-price">¥388</div>
            </div>
            <div class="order-tags">
              <span class="tag">身份变换</span>
              <span class="tag">情感波折</span>
              <span class="tag">公开场合</span>
            </div>
          </div>

          <!-- Stats -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">好感度</div>
              <div class="stat-value">85/100</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">受孕概率</div>
              <div class="stat-value">18%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">复购次数</div>
              <div class="stat-value">3</div>
            </div>
          </div>

          <!-- Actions -->
          <div class="modal-actions">
            <button class="btn-cancel">取消</button>
            <button class="btn-primary">
              <i class="fas fa-paper-plane" style="margin-right: 6px"></i>
              再次预订
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
