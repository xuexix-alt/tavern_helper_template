<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发现 - 剧情工坊</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }

    .discover-view {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .discover-hero {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      background: rgba(15, 23, 42, 0.85);
      margin-bottom: 20px;
    }

    .hero-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6ee7b7;
    }

    .hero-title i {
      color: #10b981;
    }

    .hero-sub {
      font-size: 13px;
      color: rgba(226, 232, 240, 0.6);
    }

    .hero-actions {
      display: flex;
      gap: 10px;
    }

    .btn-outline, .btn-ghost, .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 14px;
      padding: 10px 16px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline {
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .btn-outline:hover {
      background: rgba(16, 185, 129, 0.1);
    }

    .btn-ghost:hover {
      background: rgba(30, 41, 59, 0.8);
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(5, 150, 105, 0.85));
      border-color: rgba(16, 185, 129, 0.4);
      color: #ecfdf5;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* Toolbar */
    .discover-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.6);
      min-width: 280px;
    }

    .toolbar-search i {
      color: rgba(226, 232, 240, 0.5);
    }

    .toolbar-search input {
      border: none;
      outline: none;
      background: transparent;
      color: #e2e8f0;
      font-size: 13px;
      flex: 1;
    }

    .toolbar-search input::placeholder {
      color: rgba(226, 232, 240, 0.4);
    }

    .toolbar-hint {
      font-size: 12px;
      color: rgba(226, 232, 240, 0.5);
    }

    /* Shop Grid */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .shop-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: start;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.8);
      cursor: pointer;
      transition: all 0.2s;
    }

    .shop-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.4);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .shop-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      font-size: 20px;
    }

    .shop-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .shop-name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
    }

    .tag.muted {
      background: rgba(148, 163, 184, 0.15);
      color: rgba(226, 232, 240, 0.6);
    }

    .shop-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: rgba(226, 232, 240, 0.5);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .meta-item i {
      font-size: 12px;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fecaca;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.2s;
      justify-self: end;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: rgba(226, 232, 240, 0.5);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-state p {
      margin-bottom: 16px;
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .shop-card {
        grid-template-columns: 1fr;
      }
      .shop-icon {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
