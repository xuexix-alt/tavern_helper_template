<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>角色详情 - 剧情工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'PingFang SC',
          'Microsoft YaHei',
          -apple-system,
          sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        color: #e2e8f0;
      }

      .app-view {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }

      /* Header */
      .app-header {
        background: rgba(15, 23, 42, 0.95);
        padding: 18px 20px;
        padding-top: max(18px, env(safe-area-inset-top));
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 195, 0, 0.2);
        flex-shrink: 0;
        backdrop-filter: blur(10px);
      }

      .title {
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #e2e8f0;
      }

      .title i {
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        transition: all 0.2s;
        color: #fbbf24;
      }

      .title i:hover {
        background: rgba(251, 191, 36, 0.15);
      }

      /* Content */
      .app-content {
        flex-grow: 1;
        padding: 0;
      }

      /* Shop Header Card */
      .shop-header-card {
        background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.05));
        border-radius: 20px;
        padding: 28px;
        margin: 16px;
        text-align: center;
        border: 1px solid rgba(251, 191, 36, 0.2);
        position: relative;
        overflow: hidden;
      }

      .shop-header-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0, transparent 70%);
        animation: pulse 6s ease-in-out infinite;
      }

      .shop-avatar-text {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        margin: 0 auto 14px;
        border: 4px solid #fbbf24;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: 800;
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        position: relative;
        z-index: 1;
      }

      .shop-name {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #fbbf24;
        position: relative;
        z-index: 1;
      }

      .shop-slogan {
        font-size: 14px;
        color: rgba(226, 232, 240, 0.7);
        position: relative;
        z-index: 1;
      }

      /* Restore Tip */
      .restore-tip {
        margin: 0 16px 12px 16px;
        padding: 12px 14px;
        border: 1px dashed #fbbf24;
        border-radius: 12px;
        background: rgba(251, 191, 36, 0.08);
        color: rgba(226, 232, 240, 0.7);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }

      .restore-tip i {
        color: #fbbf24;
      }

      /* List Section */
      .list-section {
        background: rgba(15, 23, 42, 0.8);
        padding: 20px;
        border-radius: 16px;
        margin: 0 16px 16px 16px;
        border: 1px solid rgba(251, 191, 36, 0.15);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .section-header h3 {
        margin: 0;
        font-size: 16px;
        color: #e2e8f0;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-header h3::before {
        content: '';
        display: block;
        width: 4px;
        height: 16px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        border-radius: 4px;
      }

      /* Package List */
      .package-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .package-card {
        background: rgba(30, 41, 59, 0.6);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        cursor: pointer;
        border: 1px solid rgba(148, 163, 184, 0.2);
        transition: all 0.2s;
      }

      .package-card:hover {
        transform: translateY(-2px);
        border-color: rgba(251, 191, 36, 0.5);
        box-shadow: 0 8px 20px rgba(251, 191, 36, 0.15);
      }

      .avatar-text {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: 700;
        color: #fbbf24;
        background: rgba(251, 191, 36, 0.15);
        border: 2px solid rgba(251, 191, 36, 0.3);
      }

      .info {
        flex-grow: 1;
        min-width: 0;
      }

      .name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #e2e8f0;
      }

      .desc {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 28px;
        align-items: center;
      }

      .package-tag {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 50px;
        border: 1px solid rgba(251, 191, 36, 0.3);
        font-weight: 600;
      }

      /* Empty State */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: rgba(226, 232, 240, 0.4);
      }

      .empty-state i {
        font-size: 40px;
        margin-bottom: 12px;
        opacity: 0.3;
      }

      /* Nav Bar */
      .nav-bar {
        display: flex;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.95);
        padding: 10px 16px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        flex-shrink: 0;
        backdrop-filter: blur(10px);
      }

      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: rgba(226, 232, 240, 0.6);
        font-size: 11px;
        padding: 6px 0;
        cursor: pointer;
        transition: all 0.2s;
      }

      .nav-item i {
        font-size: 20px;
        margin-bottom: 4px;
      }

      .nav-item.active {
        color: #fbbf24;
      }

      .nav-item:hover:not(.active) {
        color: rgba(226, 232, 240, 0.9);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-view">
      <!-- Header -->
      <header class="app-header">
        <div class="title">
          <i class="fas fa-arrow-left"></i>
          <span>角色详情</span>
        </div>
      </header>

      <div class="app-content">
        <!-- Shop Header -->
        <div class="shop-header-card">
          <div class="shop-avatar-text">
            <i class="fas fa-store"></i>
          </div>
          <div class="shop-name">都市白领剧本包</div>
          <div class="shop-slogan">办公 / 相识 / 企业故事 · 优质服务</div>
        </div>

        <!-- Restore Tip -->
        <div class="restore-tip">
          <i class="fas fa-undo-alt"></i>
          <span>误删角色包可回到原页面点击卡片重新找回</span>
        </div>

        <!-- Package List -->
        <div class="list-section">
          <div class="section-header">
            <h3>精选剧本</h3>
          </div>

          <div class="package-list">
            <!-- Package 1 -->
            <div class="package-card">
              <div class="avatar-text">
                <i class="fas fa-user-tie"></i>
              </div>
              <div class="info">
                <div class="name">高管秘书剧本</div>
                <div class="desc">
                  <span class="package-tag">身份变换</span>
                  <span class="package-tag">情感波折</span>
                  <span class="package-tag">公开场合</span>
                </div>
              </div>
            </div>

            <!-- Package 2 -->
            <div class="package-card">
              <div class="avatar-text">
                <i class="fas fa-briefcase"></i>
              </div>
              <div class="info">
                <div class="name">项目合作剧本</div>
                <div class="desc">
                  <span class="package-tag">关系突破</span>
                  <span class="package-tag">服装变换</span>
                </div>
              </div>
            </div>

            <!-- Package 3 -->
            <div class="package-card">
              <div class="avatar-text">
                <i class="fas fa-users"></i>
              </div>
              <div class="info">
                <div class="name">团建活动剧本</div>
                <div class="desc">
                  <span class="package-tag">反差萌</span>
                  <span class="package-tag">公开场合</span>
                  <span class="package-tag">情感波折</span>
                </div>
              </div>
            </div>

            <!-- Package 4 -->
            <div class="package-card">
              <div class="avatar-text">
                <i class="fas fa-building"></i>
              </div>
              <div class="info">
                <div class="name">企业年会剧本</div>
                <div class="desc">
                  <span class="package-tag">身份变换</span>
                  <span class="package-tag">服装变换</span>
                </div>
              </div>
            </div>

            <!-- Package 5 -->
            <div class="package-card">
              <div class="avatar-text">
                <i class="fas fa-handshake"></i>
              </div>
              <div class="info">
                <div class="name">商务谈判剧本</div>
                <div class="desc">
                  <span class="package-tag">关系突破</span>
                  <span class="package-tag">情感波折</span>
                </div>
              </div>
            </div>

            <!-- Package 6 -->
            <div class="package-card">
              <div class="avatar-text">
                <i class="fas fa-chart-line"></i>
              </div>
              <div class="info">
                <div class="name">业绩冲刺剧本</div>
                <div class="desc">
                  <span class="package-tag">反差萌</span>
                  <span class="package-tag">公开场合</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Nav Bar -->
      <nav class="nav-bar">
        <div class="nav-item">
          <i class="fas fa-home"></i>
          <span>首页</span>
        </div>
        <div class="nav-item active">
          <i class="fas fa-compass"></i>
          <span>发现</span>
        </div>
      </nav>
    </div>
  </body>
</html>
