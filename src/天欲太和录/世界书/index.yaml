# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/worldbook.zh.json
锚点: {}

条目:
  - 名称: 太和阴阳经设定
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 100
    激活概率: 100
    递归:
      不可被其他条目激活: false
      不可激活其他条目: false
    文件: 天欲太和录\太和阴阳经设定

  - 名称: 天欲阴阳录设定
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 99
    激活概率: 100
    递归:
      不可被其他条目激活: false
      不可激活其他条目: false
    文件: 天欲太和录\天欲阴阳录设定

  - 名称: 阴阳双修设定
    启用: true
    激活策略:
      类型: 蓝灯
      关键字:
        - 双修
        - 太和
        - 天欲
        - 女
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 1
      顺序: 98
    激活概率: 100
    递归:
      不可被其他条目激活: false
      不可激活其他条目: false
    文件: 天欲太和录\阴阳双修设定

  - 名称: "[mvu_update]变量输出格式"
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 997
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 变量\[mvu_update]变量输出格式

  - 名称: 变量列表
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 998
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 变量\变量列表.txt

  - 名称: "[mvu_update]变量更新规则"
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 999
    激活概率: 100
    递归:
      不可被其他条目激活: false
      不可激活其他条目: false
    文件: 变量\[mvu_update]变量更新规则

  - 名称: "[initvar]变量初始化勿开"
    启用: false
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 100
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 天欲太和录\[initvar]
