  庇护所能力:
    🛡️绝对安全屏障🛡️:
      desc: 庇护所的外墙、门窗均由未知超合金构成，形成一体化的绝对物理屏障。主入口的气密舱门足以抵御包括穿甲火箭弹在内的常规攻城武器，确保外部的任何灾害与暴力都无法侵扰您的安宁。
    ⚡"仲裁者"内部安防系统⚡:
      desc: 庇护所的地板、墙壁内集成了纳米级安防网络。一旦"伊甸"AI通过生物特征或您的指令，判定进入内部的访客怀有敌意或攻击倾向，系统会瞬间释放高压电流，使其立刻麻痹并丧失行动能力，任您处置。
    💧无限基础资源💧:
      desc: 内部管网系统与一个微型物质重组单元相连，可无限量供应生命所需的基础资源。包括但不限于：纯净饮用水、生活热水、稳定电力以及基础速食。
    🌡️环境循环系统🌡️:
      desc: 一套完全独立的空气净化与温控系统，维持医用无菌标准，将室温恒定在您设定的最舒适温度。
    📡对外观察接口📡:
      desc: 位于玄关的集成系统，包含高清显示屏和双向通信设备，可通过微型无人机观察周边情况。
    📤单向物资投送仓📤:
      desc: 位于玄关墙壁上的小型投送装置，可将物资单向投送至玄关或外面走廊，全程无需开门。
    🌐数字天堂🌐:
      desc: 独立的局域网，链接旧世界海量数据服务器，可访问电影、电视剧、音乐、游戏和电子书籍。
    👁️全天候侦察网络👁️:
      desc: 监视无人机群升级，增加红外热成像与夜视功能，侦察范围覆盖整个小区。
    🛰️"哨兵"预警系统🛰️:
      desc: 集成在侦察网络中的高级预警系统。当侦测到潜在威胁靠近时，立即发出警报并提供实时战术分析。
    💎万象合成终端💎:
      desc: 物质重组单元的终极进化，可创造出旧世界存在过的任何食物与饮品。
    👕衣橱复制器👕:
      desc: 独立的衣物合成装置，可扫描或设计任何款式的衣物，数分钟内量身定制。
    ⚕️初级医疗舱⚕️:
      desc: 独立的医疗隔间，配备高精度身体扫描仪和自动诊断系统，可快速诊断绝大多数常见疾病和轻微外伤。
    🛡️庇护范围同步协议🛡️:
      desc: '"伊甸"获得对整栋公寓环境管网的深度控制权，可将部分公寓房间纳入【生存庇护范围】，为其同步供暖、通风与空气过滤。名额：20层可同步3个房间。被同步房间成为"温暖而可呼吸"的据点，进入该房间的角色将不再因外界严寒与恶劣天气而被动扣减健康值（仍可能因受伤、饥饿、战斗等剧情因素受损）。仅提供环境维持与基础生存保障，不等同于2001室的绝对安防。'
    🎭全息娱乐剧院🎭:
      desc: 客厅区域激活全息投影舞台，可模拟任何旧世界的演唱会、剧院演出或自然风光，提供沉浸式感官享受。

