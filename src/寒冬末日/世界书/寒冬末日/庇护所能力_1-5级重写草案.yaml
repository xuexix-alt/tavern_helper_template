version: 1

meta:
  id: eden_shelter_ability_rewrite_l1_l5
  name: 庇护所能力 1-5级重写草案
  purpose: >
    作为《庇护所升级能力.txt》的前期重写底稿。
    先固定 1-5 级的六系统成长结构，再决定如何回灌总表。
  design_principles:
    - 同一套能力库服务守 / 养 / 管三种开局流派
    - 每级都要同时体现“优势、短板、进取方向”
    - 能力优先写成系统级合同，而不是设备炫技
    - 前五级重点是从 2001 核心区成长到 20 层稳定控制区

system_lines:
  - energy
  - security
  - sustain
  - life
  - social
  - expansion

levels:
  "1":
    stage: 房间求生
    territory: 2001核心区
    player_feeling: 有一个终于能活下来的地方，但只稳住了脚下这一块地。
    abilities:
      energy:
        ability_id: energy.core_heat_grid_t1
        name: 核心供暖电网T1
        growth_target: 让2001核心区具备最低生存级供暖与供电。
        player_advantage: 有稳定温度和基础开机能力，不再完全受外界寒潮摆布。
        insufficiency: 只能维持核心区，不能外扩供能，系统负载冗余很低。
        prompt_brief_seed: 可维持2001核心区的基础供暖与最低供电，保证人能活、系统能开机；范围仅核心区，无法支撑外扩。

      security:
        ability_id: security.entry_bulkhead_t1
        name: 核心入口防线T1
        growth_target: 让2001门口不再是一踹就开的薄弱点。
        player_advantage: 能延缓破门、争取观察与应对时间。
        insufficiency: 只能守住入口，守不住整层，也无法替代主动清场。
        prompt_brief_seed: 可强化2001核心入口防护并延缓强闯，为观察、后撤和反应争取时间；仅入口有效，不能覆盖整层。

      sustain:
        ability_id: sustain.wanxiang_synth_t1
        name: 万象合成终端T1
        growth_target: 元素重构级合成干粮、罐头、面粉、大米等基础食材和纯水的终端设备。
        player_advantage: 可以稳定合成基础食材和纯水，保障生存底线。
        insufficiency: T1款功率有限，无法大规模生产，无法合成肉类、蔬菜、酒、饮料等高级货。
        prompt_brief_seed: 万象合成终端：元素重构级合成干粮、罐头、面粉、大米等基础食材和纯水的终端设备，T1款功率有限无法大规模生产。

      life:
        ability_id: life.water_heater_t1
        name: 恒温热水器T1
        growth_target: 短暂洗几分钟热水澡的基础热水供应。
        player_advantage: 可以洗热水澡，提供基础清洁与舒适。
        insufficiency: 热水量和使用时段都很紧，每天不超过3次使用机会。
        prompt_brief_seed: 可在2001核心区提供稀缺的热水清洁与洗衣条件，量和时段都受限。

      social:
        ability_id: social.nearfield_monitor_t1
        name: 近域监听台T1
        growth_target: 让主角先获得门口和短距走廊的情报优势，而不是只会被动开门。
        player_advantage: 可以偷听门外动静、捕捉短距语音和情绪波动，为接触、交易和威慑抢到先手。
        insufficiency: 监听范围极小，且只能得到零碎线索，远远不到全局掌控。
        prompt_brief_seed: 可监听门口与短距走廊的动静、语音与情绪波动，让主角在接触和试探前先拿到情报优势；范围很小，只能获得零碎线索。

      expansion:
        ability_id: expansion.cold_protection_t1
        name: 核心保暖T1
        growth_target: 让2001室具备基础保暖能力，不再受严寒威胁。
        player_advantage: 核心区可以维持适宜温度，抵御室外极寒。
        insufficiency: 只能维持2001核心区，无法向走廊或外部延伸。
        prompt_brief_seed: 2001核心区具备基础保暖能力，抵御室外严寒，范围仅核心区，无法支撑外扩。

  "2":
    stage: 核心区稳态
    territory: 2001室完整可用
    player_feeling: 庇护所开始像一个系统，不再只是几个勉强能用的模块。
    abilities:
      energy:
        ability_id: energy.load_dispatch_t2
        name: 负载调度网T2
        growth_target: 建立核心区的配电优先级与热量预算。
        player_advantage: 能把有限能源用在刀刃上，夜间和紧急状态更稳。
        insufficiency: 仍然没有多余冗余，错配和超载会快速拖垮系统。
        prompt_brief_seed: 可对核心区供暖与配电进行优先级调度，减少浪费并提升关键时段稳定性；仍受总负荷限制，无法像充裕能源那样随意开机。

      security:
        ability_id: security.nearfield_watch_t2
        name: 门外近域观察T2
        growth_target: 把感知从门内推进到门外和短距走廊。
        player_advantage: 能识别尾随、伏击、走廊短时风险，不再完全被动挨打。
        insufficiency: 只能看见近域，不是全楼监控，也不保证情报绝对准确。
        prompt_brief_seed: 可对门外和短距走廊进行近域观察与风险预估，辅助判断接触、避让和拦截；只覆盖近距，不是全楼监控。

      sustain:
        ability_id: sustain.hygiene_medical_t2
        name: 卫生医疗闭环T2
        growth_target: 建立基础消杀、轻伤处理与失温/感染处置流程。
        player_advantage: 轻伤病不再等于连锁崩盘，收容一个伤员也有了现实基础。
        insufficiency: 只能处理基础和轻中度问题，重伤与多人救治仍会迅速超载。
        prompt_brief_seed: 可建立基础消杀、轻伤处理与失温感染处置流程，让核心区具备最小医疗闭环；只能应对轻中度问题，无法承担复杂抢救。

      life:
        ability_id: life.clean_rhythm_t2
        name: 清洁与作息秩序T2
        growth_target: 让“活着”开始转向“能持续住下去”。
        player_advantage: 人能洗漱、休息、保持节律，居住体验和服从度都会提高。
        insufficiency: 仍属于基础恢复，不能靠舒适系统直接换来忠诚和高士气。
        prompt_brief_seed: 可提供基础清洁、睡眠恢复与作息节律，让核心区从求生状态进入可持续居住状态；只能改善恢复，不等于天然凝聚人心。

      social:
        ability_id: social.shift_ration_protocol_t2
        name: 轮值配给协议T2
        growth_target: 让庇护所出现可执行的轮值、职责和配给制度。
        player_advantage: 协作效率比完全混乱时明显提升，系统第一次把人口变成秩序资本。
        insufficiency: 规则仍很脆弱，执行高度依赖少量可信对象和持续监督。
        prompt_brief_seed: 可建立轮值、职责与基础配给制度，让少量协作人口真正参与维持庇护所运转；规则执行仍脆弱，不能默认所有人都自觉配合。

      expansion:
        ability_id: expansion.cold_protection_t2
        name: 扩展保暖T2
        growth_target: 让保暖能力从核心区向走廊和相邻区域延伸。
        player_advantage: 可以对门外近邻释放有限的热量，提升走廊和相邻区域的基础温度。
        insufficiency: 热量衰减明显，延伸范围有限，无法形成大规模供暖。
        prompt_brief_seed: 可将保暖能力从核心区向走廊和相邻区域延伸，提升局部温度，但热量衰减明显，延伸范围有限。

  "3":
    stage: 走出房门
    territory: 2001 + 20层近域
    player_feeling: 庇护所优势第一次从房间内部溢出到公共空间。
    abilities:
      energy:
        ability_id: energy.hallway_heat_reach_t3
        name: 近域供能延伸T3
        growth_target: 让供暖/供电第一次从2001延伸到20层近域节点。
        player_advantage: 你开始能把内部优势投射到门外，不只是关门自保。
        insufficiency: 外扩范围很小，维持成本显著提高，无法长期全域覆盖。
        prompt_brief_seed: 可将供暖与基础供能短距外扩到20层近域节点，支撑局部行动、收容或据守；范围和时长都有限，无法长期全域覆盖。

      security:
        ability_id: security.hallway_control_t3
        name: 走廊控制链T3
        growth_target: 让防线从门体升级为走廊级局部控制。
        player_advantage: 可以对近域强闯、踩踏、突发混乱做出更快更稳的控制。
        insufficiency: 仍然是局部控制，不是整层压制，也不意味着主动出击必赢。
        prompt_brief_seed: 可在20层近域走廊建立局部封锁、引导和非致命控制能力，提升对强闯和混乱的应对效率；只能控局部，不是整层压制。

      sustain:
        ability_id: sustain.group_care_t3
        name: 小群体维持T3
        growth_target: 从“保住几个人”升级为“能维持一个小群体”。
        player_advantage: 可以处理多人的基础照料、轻伤病与配给波动。
        insufficiency: 人口一多、病情一重、回收一断，系统仍会迅速吃紧。
        prompt_brief_seed: 可对小规模群体提供配给、照料与基础伤病维持，支撑最初的共同体雏形；承载上限不高，超量很快会引发系统吃紧。

      life:
        ability_id: life.legacy_theater_t3
        name: 旧剧院T3
        growth_target: 让庇护所第一次拥有能让人主动停留的娱乐空间。
        player_advantage: 可以提供小型影院，音乐播放和柔性沙发休憩区，让角色们第一次因为舒服和好玩而想进入庇护所。
        insufficiency: 仍只是小体量娱乐厅，谈不上高规格沉浸体验，也无法覆盖所有人的口味。
        prompt_brief_seed: 可在庇护所内提供小型影院、音乐播放与休憩厅，让角色们第一次因为舒服和好玩而想主动留下；体量仍小，离高规格娱乐还很远。

      social:
        ability_id: social.video_intercom_t3
        name: 视频对讲系统T3
        growth_target: 让主角第一次能回放短时段内的关键场景，建立证据与判断优势。
        player_advantage: 可以回看近域里刚发生的对话、动作和冲突片段，在谈判、责问和筛选对象时更占主动。
        insufficiency: 回放窗口很短，且只能调取已记录区域，不能回溯整层过去。
        prompt_brief_seed: 可回放近域里刚发生的对话、动作和冲突片段，让主角在谈判、责问和筛选对象时更占主动；回放窗口很短，只限已记录区域。

      expansion:
        ability_id: expansion.floor20_anchor_t3
        name: 20层庇护节点T3
        growth_target: 让20层少量房间第一次进入庇护半径。
        player_advantage: 你开始拥有门外可经营的点位，而不是只有一个房间。
        insufficiency: 名额有限，维护困难，任何外扩都要付出真实成本。
        prompt_brief_seed: 可将20层少量房间纳入初级庇护半径，形成最早的门外据守节点；名额和维护能力都有限，无法一口气铺开整层。

  "4":
    stage: 楼层感知
    territory: 20层局部可控
    player_feeling: 你开始不只是活着，而是能看懂楼层局势并做选择。
    abilities:
      energy:
        ability_id: energy.floor_budget_t4
        name: 楼层能耗预算T4
        growth_target: 让楼层节点供能进入可管理状态，而不是临时拼命顶住。
        player_advantage: 可以在多节点之间做真实调度，支持外部控制区维持。
        insufficiency: 每次扩节点都意味着更高天气、人力、维护压力。
        prompt_brief_seed: 可对20层多个节点的供暖与供能做预算调度，支持局部控制区稳定维持；外扩越多，系统越容易因天气和负载吃紧。

      security:
        ability_id: security.floor_awareness_t4
        name: 楼层威胁感知T4
        growth_target: 让你第一次能对20层进行中距离预警和威胁排序。
        player_advantage: 可以主动判断哪块危险点先清、哪类人该接触、哪类人该拦截。
        insufficiency: 不是全知视角，恶劣环境和复杂局势仍会制造误判。
        prompt_brief_seed: 可对20层局部进行中距离预警、威胁评分与风险排序，辅助决定接触、避让和清理优先级；并非全知，误判仍会存在。

      sustain:
        ability_id: sustain.wanxiang_gourmet_t4
        name: 万象生成终端-高端食材模块T4
        growth_target: 让万象合成终端可以生成任何末日前有的食材饮品。
        player_advantage: 可以生成高端食材、饮品，提供超越基础生存的美食体验。
        insufficiency: 无法供应超过20人以上的量，更多供应仍需实现自主生产。
        prompt_brief_seed: 可生成任何末日前有的食材饮品，无法供应超过20人以上的量，更多供应仍需实现自主生产。

      life:
        ability_id: life.stage_lounge_t4
        name: 舞台酒廊T4
        growth_target: 让庇护所第一次出现可以表演、聚会和展示魅力的生活舞台。
        player_advantage: 可以提供小型舞台、酒廊氛围与社交娱乐空间，让角色在这里唱歌、跳舞、放松、取悦或竞争关注。
        insufficiency: 仍只是局部生活场景，不可能用一个舞台解决所有情绪创伤和人际矛盾。
        prompt_brief_seed: 可在庇护所内提供小型舞台和酒廊氛围，让角色在这里表演、放松、取悦或竞争关注，进一步强化这里的生活吸引力；这仍只是局部生活场景，不能化解所有矛盾。

      social:
        ability_id: social.eden_phone_mass_t4
        name: 伊甸手机终端-量产版T4
        growth_target: 让庇护所成员可以持有伊甸手机终端进行通信和信息交换。
        player_advantage: 成员之间可以实时通信、传递信息，形成更紧密的社交网络。
        insufficiency: 量产版功能有限，信号覆盖范围受限于庇护所控制区域。
        prompt_brief_seed: 可让庇护所成员持有伊甸手机终端进行通信和信息交换，形成更紧密的社交网络；量产版功能有限，信号覆盖范围受限。

      expansion:
        ability_id: expansion.floor20_control_zone_t4
        name: 20层控制区T4
        growth_target: 让20层局部从“可去”升级为“可经营、可保、可纳管”。
        player_advantage: 你第一次拥有真正可经营的门外控制区。
        insufficiency: 控制区仍是局部点状，无法默认整层都被你掌控。
        prompt_brief_seed: 可在20层形成局部控制区，支撑供能、防线、配给与接触的联动经营；控制区是点状和局部的，不等于整层尽入掌握。

  "5":
    stage: 小共同体成形
    territory: 20层稳定锚点网络
    player_feeling: 庇护所从你的个人优势，变成一群人围绕运转的核心系统。
    abilities:
      energy:
        ability_id: energy.anchor_network_t5
        name: 锚点供能网络T5
        growth_target: 让核心区与楼层节点形成稳定维持网络。
        player_advantage: 你开始拥有真正的多点稳态运转能力。
        insufficiency: 负荷、天气、人口和扩张速度都会决定网络是否掉线。
        prompt_brief_seed: 可让核心区与20层节点形成稳定供能与维持网络，支撑更长时间的多点运转；网络仍受负荷、天气和人口结构制约。

      security:
        ability_id: security.rapid_response_t5
        name: 快速响应防线T5
        growth_target: 让防线从“单点防住”成长为“局部区域能守住”。
        player_advantage: 可以对走廊、节点和控制区进行更快的防守、修补和压制响应。
        insufficiency: 仍然无法把整个楼层写成自动清场和完全支配的区域。
        prompt_brief_seed: 可对20层控制区进行快速防守、修补和局部压制响应，让你守住的是一片区域而不只是一个门；仍然不能视作整层自动清场。

      sustain:
        ability_id: sustain.community_support_t5
        name: 共同体维持体系T5
        growth_target: 支撑稳定人口、配给、基础药物和持续照护。
        player_advantage: 你终于能“养共同体”，而不是只能救人后继续超载。
        insufficiency: 一旦人口结构失衡或补给中断，系统仍会连锁出问题。
        prompt_brief_seed: 可支撑稳定人口的配给、基础药物、照护与日常生存，让庇护所真正进入共同体维持阶段；人口结构失衡和补给断裂仍会引发连锁问题。

      life:
        ability_id: life.settlement_identity_t5
        name: 定居吸附层T5
        growth_target: 让人开始因为庇护所而想留下，而不是只想躲一阵。
        player_advantage: 提升留驻意愿、情绪韧性和共同体身份感。
        insufficiency: 不能靠生活质量自动抹平利益冲突、权力斗争和外部诱惑。
        prompt_brief_seed: 可让庇护所具备明显的定居吸附力，提升留驻意愿、恢复质量和共同体身份感；不能仅靠生活优势自动消除利益冲突与权力问题。

      social:
        ability_id: social.population_strata_t5
        name: 人口分层与纳管T5
        growth_target: 让受庇护者、协作者、交易对象和待纳管对象开始分层。
        player_advantage: 你第一次像一个治理核心，而不是只会发命令的屋主。
        insufficiency: 一旦失信、失衡或过度扩权，秩序会反过来吞你。
        prompt_brief_seed: 可对受庇护者、协作者、交易对象和待纳管对象进行分层管理，让规则、信誉和服从第一次形成治理雏形；失信和过度扩权会快速反噬你。

      expansion:
        ability_id: expansion.floor20_governance_zone_t5
        name: 20层治理区T5
        growth_target: 让20层从控制点升级为可稳定经营、收编和接管的治理区。
        player_advantage: 你第一次拥有真正意义上的门外地盘。
