      管:
        score: 1.1
        note: 良好秩序直接提升生存率
      慰:
        score: 1.05
        note: 士气与恢复关系到庇护所持续运转
      守:
        score: 0.9
      扩:
        score: 0.8
      行:
        score: 0.7

    ai_brief_seed:
      环境体感: 寒冷、腐蚀与失温随时都在消耗生命
