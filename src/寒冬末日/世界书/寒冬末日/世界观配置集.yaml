version: 1

meta:
  id: world_mode_profiles
  name: 世界观配置集
  world: 寒冬末日-星穹秩序
  authoring_note: >
    开局描述世界观总览
    对后续剧情发展提供基调和限制
    设定要整体、连贯
  source_of_truth: true

rules:
  selection_timing: opening_only
  can_switch_after_sealed: false
  brief_generation_allowed: true
  brief_generation_scope:
    - 环境体感
    - 主要威胁
    - 社会状态
    - 路线提示
  brief_generation_forbidden:
    - 改写温度
    - 改写行动窗口
    - 改写社会残存度
    - 改写威胁主因
    - 改写生产残余度
    - 改写冲突密度
    - 发明新灾难规则
  interpretation_priority:
    - 数值范围优先于标签词
    - 若 label 与数值冲突，以数值为准
    - threat subtype 不得越界扩写

world_mode_axis_dictionary:
  version: 1

  超自然极端天气:
    unit: score_0_100
    labels:
      低:
        score_range: [0, 19]
        outdoor_survival:
          unprotected_minutes: [180, 360]
          protected_hours: [8, 24]
        description: 低温暴雪天气占多数，但人类行动能力尚存，交通、电力、生产设施少部分残余
      中低:
        score_range: [20, 39]
        outdoor_survival:
          unprotected_minutes: [60, 180]
          protected_hours: [4, 12]
        description: 皮肤和身体裸露室外有冻伤风险，无防寒护具外出无法生存，交通、电力、生产设施在持续严寒下逐渐瘫痪
      中:
        score_range: [40, 59]
        outdoor_survival:
          unprotected_minutes: [20, 60]
          protected_hours: [2, 6]
        description: 无防寒护具外出30分钟后失温，无法室外逗留和长距离（徒步1公里半径内移动）
      中高:
        score_range: [60, 74]
        outdoor_survival:
          unprotected_minutes: [5, 20]
          protected_hours: [1, 3]
        description: 极端低温下金属暴露风雪中也会失去坚韧，人无防护无法室外生存
      极高:
        score_range: [75, 89]
        outdoor_survival:
          unprotected_minutes: [1, 5]
          protected_hours: [0.5, 2]
        description: 除经过伊甸等特殊改造的护具和装备防护外，基本无法在室外存活，无天气窗口

  行动窗口:
    unit: hours_per_7_days
    labels:
      极短:
        hours_range: [0, 6]
        occurrences_per_7_days: [0, 1]
        description: 几乎没有外出机会，需伊甸特制护具
      短:
        hours_range: [6, 18]
        occurrences_per_7_days: [1, 2]
        description: 需要抢窗口（每周有1-2天晴天中午有1小时左右升温10度），需要防寒护具
      中:
        hours_range: [18, 36]
        occurrences_per_7_days: [2, 4]
        description: 每周有3-4天晴天中午有2小时左右升温15度，可规划无护具短行动（徒步1公里范围），
      长:
        hours_range: [36, 72]
        occurrences_per_7_days: [4, 7]
        description: 暴风雪每日间歇性来临，无法长期室外逗留，可以短暂巡逻、清剿、接触与回收
      稳定:
        hours_range: [72, 168]
        occurrences_per_7_days: [7, 14]
        description: 有概率遇到暴风雪天气，摧毁修好的基础设施、电力，积雪仍瘫痪大规模大范围交通

  社会残存度:
    unit: score_0_100
    labels:
      极低:
        score_range: [0, 19]
        structured_groups_ratio: [0.0, 0.1]
        trade_activity: [0.0, 0.1]
        description: 组织性几乎消失，只剩零散苟活，无电力、无生产、无交通
      低:
        score_range: [20, 39]
        structured_groups_ratio: [0.1, 0.25]
        trade_activity: [0.1, 0.25]
        description: 少量据点存在，但社会联系脆弱，无电力、无交通
      中:
        score_range: [40, 64]
        structured_groups_ratio: [0.25, 0.5]
        trade_activity: [0.25, 0.5]
        description: 只剩局部保持社会组织，社会交往方式只剩交易与协作惯性，生产力要素退化为仅剩自运行电力、局部个人交通工具、局部自循环水源
      高:
        score_range: [65, 100]
        structured_groups_ratio: [0.5, 0.8]
        trade_activity: [0.5, 0.8]
        description: 社会结构尚存，原社会结构受到剧烈冲击，人与人可争夺治理权。电力、水务、小规模交通

  生产残余度:
    unit: percent_of_pre_disaster_capacity
    labels:
      极低:
        capacity_range: [0, 5]
        description: 近乎只剩库存消耗，无法稳定生产，无可靠交通工具
      低:
        capacity_range: [5, 15]
        description: 只能维持零星修补、拆解和自循环手工生产，无可靠交通工具
      中:
        capacity_range: [15, 35]
        description: 少量组织化生产与维修制造能力，原始油气化交通工具
      高:
        capacity_range: [35, 60]
        description: 高维持成本下的残余工业/社区供给能力，稀缺电气化交通工具

  冲突密度:
    unit: major_incidents_per_10_days_per_region
    labels:
      低:
        incidents_range: [0, 1]
        description: 冲突主要发生在不同组织群体，但不是常态，且多为局部摩擦。规模较大的社区群体间以争夺社会主导权和生产资源发生争斗，小规模社区面临大社区的吞并剥削。社会秩序极为脆弱，治安状况聊胜于无
      中:
        incidents_range: [2, 4]
        description: 各残余幸存者组成小规模社区，但彼此冲突成为常态，且时常为争夺资源展开殊死争斗，一部分比较有武力的暴徒四处劫掠，弱肉强食下只有少部分社群能建立脆弱的基础秩序，社会治安更是无从谈起
      高:
        incidents_range: [5, 8]
        description: 基本无法维持社会秩序，有稳定武装能力和生产来源的社群对零散组织和个体的劫掠、暴力、奴役、盘剥是主旋律，交易只存在实力对等主体间，完全丛林法则弱肉强食
      极高:
        incidents_range: [9, 15]
        description: 暴力、杀戮是唯一的生存手段，只有杀戮和被杀、劫掠和被劫掠

  外部威胁主因:
    unit: enum
    labels:
      环境:
        allowed_subtypes: [失温, 冻伤, 病亡, 雪晶腐蚀]
      暴徒:
        allowed_subtypes: [掠夺者, 楼层暴徒, 武装团伙, 饥民围堵]
      异变体:
        allowed_subtypes: [雪晶畸变体, 僵尸, 基因异化生物]
      野化生物:
        allowed_subtypes: [冰野人, 雪狼, 雪豹, 齿虎]
      组织博弈:
        allowed_subtypes: [联盟争夺, 规则冲突, 管辖竞争, 渗透]
      交易秩序争夺:
        allowed_subtypes: [资源控制, 存量争夺, 生产垄断, 价格战争]

  外出死亡风险:
    unit: fatality_probability_per_unprepared_trip
    labels:
      低:
        range: [0.0, 0.1]
      中:
        range: [0.1, 0.3]
      高:
        range: [0.3, 0.6]
      极高:
        range: [0.6, 0.95]

  据点化程度:
    unit: structured_control_ratio
    labels:
      低:
        range: [0.0, 0.2]
      中:
        range: [0.2, 0.5]
      高:
        range: [0.5, 0.8]
      极高:
        range: [0.8, 1.0]

profiles:
  A:
    id: A
    key: siege_fortress
    name: 围猎堡垒型
    slogan: 自然压力下降，外部敌意上升
    core_pleasure: 战斗 / 防御 / 征服 / 清场
    recommended_main_route: 守
    secondary_routes: [扩, 行]

    environment:
      常态气温区间: '-5℃ ~ -15℃'
      暴雪频率: 中
      腐蚀雪晶活性: 低到中
      外出能力: 保留
      visibility_note: 低温仍危险，但不再等于出门即死

    axes:
      气候压力:
        label: 中
        score: 52
      行动窗口:
        label: 长
        hours_per_7_days: 48
      社会残存度:
        label: 低
        score: 32
      外部威胁主因:
        label: 暴徒
        subtype: 武装团伙
      生产残余度:
        label: 低
        capacity_percent: 12
      冲突密度:
        label: 高
        incidents_per_10_days_per_region: 6
      外出死亡风险:
        label: 中
        probability_per_unprepared_trip: 0.22
      据点化程度:
        label: 高
        structured_control_ratio: 0.62

    society:
      organization_trend: 小型武装团体、楼层据点、掠夺集团活跃
      moral_state: 文明残余迅速流失，强者秩序与恐惧威慑并存

    threat:
      threat_pack_mode: single_primary
      threat_pack_candidates:
        - 人祸包
        - 异变包
        - 野化包
      default_threat_pack: 人祸包
      packs:
        人祸包:
          - 武装掠夺者
          - 楼层暴徒
          - 流窜劫匪
        异变包:
          - 雪晶畸变体
          - 腐蚀性残留区
          - 失控实验产物
        野化包:
          - 野化猎群
          - 异常大型生物
          - 觅食迁徙兽群

    build_modifiers:
      point_base: 8
      imp_efficiency_modifier: 0.9
      expansion_risk_modifier: 1.3
      combat_pressure_modifier: 1.4
      logistics_pressure_modifier: 0.9

    playstyle_bias:
      守:
        score: 1.4
        note: 庇护所更像堡垒与清剿中心
      扩:
        score: 1.15
        note: 通过扫清威胁扩大控制面
      行:
        score: 1.1
        note: 适合巡逻、侦察、追猎
      养:
        score: 0.9
      管:
        score: 0.95
      慰:
        score: 0.85

    ai_brief_seed:
      环境体感: 低温危险但尚可行动，真正压迫感来自外部敌对存在
      主要威胁: 武装掠夺、袭击、围堵、清场冲突
      社会状态: 幸存者据点化，小团体互相试探、掠夺、吞并
