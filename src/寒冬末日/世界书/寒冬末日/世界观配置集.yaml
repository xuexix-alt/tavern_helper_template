      扩:
        score: 1.1
        note: 接口延展与楼层纳管空间更大
      行:
        score: 1.05
        note: 侦察、交易、接触外部势力收益更高
      慰:
        score: 1.05
        note: 稳定人心与提高协作度价值更大
      养:
        score: 0.95
      守:
        score: 0.95

    ai_brief_seed:
