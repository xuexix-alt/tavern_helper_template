  A:
    阶段一:
      资源压力: 中
      环境压力: 中
      暴力显性化: 高
      组织成型速度: 高
      交易活跃度: 中
      外出可行性: 中高
      narrative_focus: 武装试探、楼层冲突、早期据点化
    阶段二:
      资源压力: 高
      环境压力: 中
      暴力显性化: 高
      组织成型速度: 高
      交易活跃度: 中低
      外出可行性: 中
      narrative_focus: 劫掠、吞并、反击、清场
    阶段三:
      资源压力: 高
      环境压力: 中
      暴力显性化: 极高
      组织成型速度: 极高
      交易活跃度: 低
      外出可行性: 中
      narrative_focus: 强者据点、围猎网络、镇压与扩张
    阶段四:
      资源压力: 高
      环境压力: 中
      暴力显性化: 极高
      组织成型速度: 极高
