version: 1

meta:
  id: shelter_route_profiles
  name: 庇护所主流派起始偏置表
  world: 寒冬末日-星穹秩序
  authoring_note: >
    该配置用于开局构筑阶段，为主流派提供起始 build 偏置、世界镜头、
    开局冲突来源与禁漂移规则。AI 不应仅依据“流派名”自由发挥，
    必须读取这里的结构化偏置后再生成 opening seed 与初始世界状态。
  source_of_truth: true

rules:
  route_selection_timing: opening_only
  route_count_primary: 1
  route_count_secondary: [0, 2]
  route_lock_after_sealed: true
  interpretation_priority:
    - guaranteed_opening_elements 高于 flavor 文案
    - starting_liabilities 必须真实进入开局
    - forbidden_drift 高于 AI 的自由发挥
    - world_mode 与 route 若冲突，以 world_mode 硬参数为准，但 route 决定叙事镜头

route_dictionary:
  fields_meaning:
    core_fantasy: 玩家这一局主要爽点
    world_lens: AI 写世界时应优先强调的观察角度
    branch_bias: 六系统的初始偏置权重
    starter_package_candidates: 可用于抽取/分配的起始能力包
    guaranteed_opening_elements: 开局必须出现的系统要素
    starting_liabilities: 起始缺口/缺陷/短板，禁止省略
    opening_conflict_sources: 第一阶段优先生成的矛盾源
    npc_release_style: NPC 应该以什么状态被放入舞台
    forbidden_drift: AI 禁止把本流派写偏成什么样

profiles:
  后宫+养成:
    id: guard
    name: 后宫+养成
    role_type: primary
    core_fantasy: 攻略美女 / 堡垒、防线、压制、清场、征服威胁
    world_lens: >
      世界应首先被写成“威胁网络与防御需求”的集合。
      AI 优先描写危险源、观察接口、防线缺口、可控空间和待清理目标。
    recommended_world_modes: [B]
    fallback_world_modes: [C]

    branch_bias:
      security: 1.45
      expansion: 1.15
      energy: 1.05
      sustain: 0.90
      social: 0.95
      life: 0.75

    point_bias:
      security_cost_discount: 1
      expansion_cost_discount: 1
      life_cost_penalty: 1
      social_cost_penalty: 0

    starter_package_candidates:
      - security.entry_bulkhead_t1
      - security.nearfield_watch_t2
      - security.hallway_control_t3
      - expansion.floor20_anchor_t3
      - expansion.floor20_control_zone_t4

    guaranteed_opening_elements:
      - 至少存在一个明确敌对来源
      - 至少存在一个可观测但未清理的危险点
      - 庇护所核心区必须体现“安全但非全知”
      - 开局必须让玩家感觉“守得住”和“还没全稳住”同时成立
      - 第一阶段必须有清场/镇压/防线修补类选择

    starting_liabilities:
      - 人口协作基础偏弱
      - 高质量生活吸附力偏低
      - 情感经营与IMP加成手段不足
      - 容易依赖压制解决问题，后期可能引发反弹
      - 对外扩张会显著提高围堵和报复概率

    opening_conflict_sources:
      - 楼层暴徒试探
      - 走廊监控盲区
      - 物资投送暴露风险
      - 邻近据点敌意侦察
      - 受惊幸存者误判防御行为

    npc_release_style:
      primary_npc_state: 惶恐、防备、观望、试探
      hostile_npc_ratio: 高
      cooperative_npc_ratio: 低
      neutral_npc_ratio: 中
      note: NPC 应更多以威胁、麻烦、待判断对象进入舞台，而非天然可治理对象

    opening_task_bias:
      - 修补防线
      - 识别敌意
      - 确定优先清理目标
      - 建立最小压制秩序
      - 选择是否提前外扩

    forbidden_drift:
      - 禁止把"后宫+养成"路线写成轻松种田日常
      - 禁止开局就写成“所有敌人都被吓住”
      - 禁止把庇护所写成自动清场、自动支配、全图无死角
      - 禁止把情报与社交短板提前消解
      - 禁止把 NPC 大量写成主动依附

  种田+探索+势力培育:
    id: sustain
    name: 种田+探索+势力培育
    role_type: primary
    core_fantasy: 维持、扩大实力、探索未知领域、种田（恢复生产）、人口保全（扩大统治人口和区域）
    world_lens: >
      世界应首先被写成“系统平衡正在吃人”的环境。
      AI 优先描写供暖、净化、医疗、配给、疲劳、病痛和人口维持压力，
      同时突出向外探索与势力扩张的真实收益与风险。
    recommended_world_modes: [C]
    fallback_world_modes: [B]

    branch_bias:
      sustain: 1.50
      energy: 1.15
      life: 1.05
      social: 0.95
      security: 0.90
      expansion: 0.80

    point_bias:
      sustain_cost_discount: 1
      energy_cost_discount: 1
      security_cost_penalty: 1
      expansion_cost_penalty: 1

    starter_package_candidates:
      - energy.core_heat_grid_t1
      - energy.load_dispatch_t2
      - sustain.basic_survival_loop_t1
      - sustain.hygiene_medical_t2
      - life.clean_rhythm_t2

    guaranteed_opening_elements:
      - 至少出现一个真实生命维持压力
      - 至少出现一个需要取舍的配给或医疗问题
      - 至少出现一个“救谁 / 先维持哪里”的决策点
      - 庇护所必须表现为生命支持系统，而非万能工厂
      - 至少出现一个能体现“伊甸生活质量高于外界”的稀缺体验
      - 开局必须让玩家明确感知“多活一个人就是多一份系统资本”

    starting_liabilities:
      - 对外行动能力弱
      - 防御压制能力有限
      - 外部清场效率低
      - 资源循环一旦失衡会迅速连锁出问题
      - 对高协作人口依赖极强

    opening_conflict_sources:
      - 供暖不足
      - 病患抢救
      - 基础药品缺口
      - 配给分配争议
      - 临时收容导致系统超载

    npc_release_style:
      primary_npc_state: 虚弱、求生、依赖边缘、带伤、需要照料
      hostile_npc_ratio: 低
      cooperative_npc_ratio: 中
      neutral_npc_ratio: 高
      note: NPC 应更多作为“维持对象 / 配给对象 / 医疗对象 / 协作来源”进入舞台

    opening_task_bias:
      - 稳定温控与净化
      - 确定医疗优先级
      - 组织轮值与照料
      - 维持最小人口存活
      - 决定是否把高质量生活资源优先给某个关键对象
      - 决定是否冒险外出换取关键物资

    forbidden_drift:
      - 禁止把"种田+探索+势力培育"路线写成随手无限生产
      - 禁止把医疗与供暖写成无代价常驻外挂
      - 禁止开局就轻易外扩扫楼
      - 禁止把人口管理写成纯数字游戏而失去人物代价
      - 禁止削弱环境压力到不再重要

  日常+后宫+收集+情报优势:
    id: govern
    name: 日常+后宫+收集+情报优势
    role_type: primary
    core_fantasy: 情报先手（知道末日3个月后要来，提前做好准备）/ IMP经营（提前攻略女角色）/ 秩序接管（为末日到来做各种准备）/ 培植先发优势，保全更多自己青睐的NPC
    world_lens: >
      世界应首先被写成"一切如常但末日正在逼近"的双层舞台。
      AI 应当在"社会正常运转、人们关心工作与生活"的日常表层之上，
      让主角独自感受到三个月后的灾难阴影，并优先描写：
      哪些人在未来会成为关键角色、哪些资源此刻仍能轻易买到、
      哪些制度窗口正要关闭、哪些接触机会如果错过未来就再也没有。
    recommended_world_modes: [A]
    fallback_world_modes: [C, B]

    branch_bias:
      social: 1.50
      expansion: 1.10
      life: 1.05
      sustain: 0.95
      security: 0.95
      energy: 0.90

    point_bias:
      social_cost_discount: 1
      expansion_cost_discount: 0
      life_cost_discount: 0
      security_cost_penalty: 1

    starter_package_candidates:
      - social.rule_seed_t1
      - social.shift_ration_protocol_t2
      - social.admission_protocol_t3
      - expansion.threshold_interface_t2
      - expansion.floor20_anchor_t3

    guaranteed_opening_elements:
      - 至少存在两个未来会对主角有价值的邻居/同事/熟人，此刻都是普通状态
      - 至少存在一个现阶段可介入的"灾前布局"问题（囤积、房产、人脉、身份、证件、金融资产）
      - 至少存在一个可监听、观察或回放的关键对象
      - 至少存在一个利用伊甸黑科技但不引起外界注意的使用机会
      - 庇护所必须表现为"独享的未来知识 + 情感经营先手"的核心，而不是单纯工厂或堡垒
      - 开局必须让玩家看到"信息差、人心和 IMP 本身就是最稀缺的资产"

    starting_liabilities:
      - 伊甸能力尚未全开，一旦大规模动用就会暴露
      - 现金、人脉、法律身份仍受末日前社会规则约束，不能用"强硬接管"代替经营
      - 没人会因为"你说末日要来"就信你，预警本身就是重大信誉风险
      - 过早囤积、过度招募或异常采购会引起邻居、同事、警方、平台风控的注意
      - 情感经营需要时间沉淀，急于求成会直接把 IMP 打崩

    opening_conflict_sources:
      - 末日预警无法直接说出口，只能以借口或情境推动关键人做决定
      - 资金、物资、空间的预先囤积与日常收入 / 身份的矛盾
      - 想接近的关键对象此刻仍有自己的社交圈、工作、感情关系
      - 使用伊甸能力改变小范围事件时，如何不被周围人察觉
      - 3 个月窗口期的"先保谁、先经营谁、先囤什么"取舍

    npc_release_style:
      primary_npc_state: 日常、正常社交节奏、带有自己的欲望与烦恼，对灾难一无所知
      hostile_npc_ratio: 低
      cooperative_npc_ratio: 低
      neutral_npc_ratio: 高
      note: NPC 应更多作为"正常生活中的人"进入舞台，可观察、可接触、可经营，但不会因为末日预警立刻配合

    opening_task_bias:
      - 筛选并锁定值得长期经营的关键对象（未来后宫候补 / 核心伙伴）
      - 建立日常化的接触借口与信息采集渠道
      - 制定前三个月的囤积清单（物资、药品、燃料、黄金、现金、硬通货）
      - 判断哪些灾前人脉（警察、医生、物业、军方、金融、物流）值得提前铺垫
      - 规划伊甸能力在"不暴露"的前提下可以使用到什么程度

    forbidden_drift:
      - 禁止把"日常+后宫+收集+情报优势"路线写成纸上谈兵的空制度
      - 禁止开局就让所有 NPC 自动认同主角或主动依附
      - 禁止只写话术，不写情报先手与执行成本
      - 禁止把情感优势写成无代价洗脑
      - 禁止削弱"信息、人心、IMP与信誉"在本流派中的核心地位
      - 禁止在灾变前语境下让主角"公开警告末日"或"让多数人相信末日要来"
      - 禁止在本开局就出现极寒、暴雪、暴徒、异变体等灾后威胁作为当前发生事件
      - 禁止让伊甸的存在、能力、预警被任何第三方在本开局察觉或公开
