变量更新规则:
  世界:
    时间:
      check:
        - "计算剧情流逝后的时间点，严格保持 '时间段 - HH:MM' 格式。"
        - '进行一轮互动至少需要推进一段时间，不低于45分钟，超过部分根据本轮剧情给出'
        - '允许时间段：凌晨/清晨/上午/中午/下午/傍晚/夜间/深夜。'
    日期:
      check: '日期变更时，使用 `replace` 更新为新的日期字符串（格式：末日纪元，XXXX年XX月XX日）。'
    地址:
      check: '最小维护单元为房间，房间内部不更新。使用 replace'
  ${角色}:
    check: |-
      - {{user}}全字段无需更新，因为他是玩家
      - 新增角色有名有姓时：
        - 必须使用 `insert` 在 `/${姓名}` 创建【完整对象】（参考“已有字段”不得遗漏）。
        - 正文中出现即 `登场`。
      - **硬约束**：
        - 禁止对当前 `stat_data` 中不存在的角色使用 `replace` / `delta` / `remove`。
        - 新增角色时**只能先**执行 `insert /${姓名}`（完整对象）；创建成功后，才允许对 `/${姓名}/...` 做 `replace` / `delta` / `remove`。
      - 临时NPC转正为主要角色：
        - 剧情中已知晓角色姓名或称号，或者该角色已经多次出现可能常驻，允许将 `/临时NPC/姓名` 迁移到顶层 `/${姓名}`（改为已知的姓名）。
        - 方式A（推荐/可控）：先 `insert /${姓名}`（value 以临时NPC现有对象为基础，并**补齐缺失字段**），再 `remove /临时NPC/${原名称}`。
        - 方式B（可选）：`move`：`{ "op": "move", "from": "/临时NPC/原名称", "path": "/姓名" }`。
        - 若顶层已存在同名角色：按最新值覆盖，使用insert 全字段进行操作，删除/临时NPC/原名称。
      - 下级字段不得私自创设，以下是合法字段：
        - 姓名、关系、关系倾向、秩序刻印、秩序刻印更新原因、健康、健康更新原因、健康状况、衣着、舌唇、胸乳、私穴、神态样貌、动作姿势、内心想法、所在房间、登场状态
      - 维护所有剧情中出现的角色和临时NPC以下字段：
          关系:
            type: 无|拒绝|交易|顺从|忠诚|性奴
            check: |-
              - **初始赋值**：关系只能从「无/拒绝」开始（拒绝及以下）。
              - **关系档位判定**：关系由脚本按秩序刻印（Imp）阈值自动重算：Imp 0→无；Imp 1-19→拒绝；Imp 20-39→交易；Imp 40-59→顺从；Imp 60-89→忠诚；Imp 90-100→性奴。
              - **禁止越级/跨档**：除非完成明确的**任务奖励**，否则禁止跨等级突破（例如：拒绝→忠诚）；不要用 `replace` 强行越级改档。
                    - 发放跨档任务奖励时，使用 `replace` 将该角色的 Imp 提升到 对应阈值，脚本会自动解算

          关系倾向:
            type: 极易|易|中立|难|极难|不可
            check: |-
              - 关系倾向影响秩序刻印(Imp)变动幅度：极易时翻倍+、不-,不可时翻倍-、不+，反之亦然。其余在两者之间设置梯度
          秩序刻印更新原因:
            type: z.string()
            format: |-
              `+11, base +6 (忠诚正向) * (1+80%) = +11`
              `-8, base -4 (顺从负向) * (1+100%) = -8`
              `0, 无变化`
            check: |-
              - 先判定是增还是减，以符合关系约束与否而定，没有触发有关剧情时为'0, 无变化'。
              - 仅当本轮对 `/秩序刻印` 进行 delta/replace 时同步更新；无变化写 `0, 无变化`。
              - 关系档位→base_delta 区间：忠诚 {+6~+8 / 0~-2}；顺从 {+4~+6 / -4~-6}；交易 {+2~+5 / -4~-6}；拒绝 {0~+5 / -6~-20}。
              - 关系倾向修正：极易 [+80%, -0%]，易 [+60%, -20%]，中立 [+40%, -50%]，难 [+20%, -80%]，极难 [+10%, -100%]，不可 [+0%, -200%]（正向强制 0，负向翻倍）。
              - final_delta 计算（先算再写入 X，再对 `/秩序刻印` 做 delta）：
                - 若 base_delta > 0：final_delta = round(base_delta * (1 + 正向百分比))
                - 若 base_delta < 0：final_delta = -round(abs(base_delta) * (1 + abs(负向百分比)))
                - 若倾向为【不可】且 base_delta > 0：final_delta = 0
              - 单次变动硬帽：结果需截断到 [-10, 15]。
              - 【离场角色】不更新。
          秩序刻印:
            type: z.coerce.number().transform(v => _.clamp(v, -20, 100))
            range: [-20, 100]
            check: |-
              - 锚定秩序刻印更新原因中的数值。
          健康:
            type: number
            range: 0~100
            check: |-
              变动区间[-15,+10]健康值（受剧情和环境影响）。
              【登场角色】（登场状态="登场"）：
                - 你必须根据剧情事实手动决定本轮 `delta` 值（+/-），不要依赖脚本。
              - 健康值只受剧情因素和环境影响（角色进入受庇护场所并获得食物时，视为不再挨饿受冻，可不因环境恶劣扣减健康值，直到重新挨饿受冻）。
                - 死亡：健康降至 0触发死亡。
              - 违背**关系**设定发生性关系健康值-50，低于此值时角色死亡
              【离场角色】（登场状态="离场"）：
                - 基础健康衰减/恢复由脚本自动结算（同样受挨饿受冻理论约束）
                - AI不需要也不应手动修改。
                - 除非进行剧情性介入（远程投喂/治疗/受伤），否则保持离场状态
              【特殊区域】（玄关临时客房、核心区主卧/主浴）：
                - 这些区域视为受主角餐食、供暖庇护，不扣减环境影响的健康值改为缓慢恢复
                    - 【离场】角色：按“受庇护休整”逻辑结算（可缓慢恢复）
                    - 【登场】角色：按剧情但不进行减自然衰减
          健康更新原因:
            check: |-
              【登场角色】必须同步记录，格式：`+/-X, 原因`；无变化填 `0, 无变化`。
              - 若本轮更新了 `健康`，必须同时更新本字段。
              - 不要保留"初始状态"。
              【离场角色】由脚本自动写回：
          健康状况:
            type: 健康|亚健康|生病/受伤|重病/濒死|无|死亡
            check: 
              - 决定角色的精神状态和战斗力**生病/受伤/重病/濒死的角色参加搏斗h或被攻击会死亡
              - '由脚本根据健康值阈值自动重算写回（登场/离场/临时NPC均适用）。AI 不需要也不应手动维护该字段。'
          内心想法:
            check:
              - 内心想法应符合<角色身份与关系>的约束，比如：拒绝 关系阶段不允许有献身想法
              - 应该符合角色的人设
              - '每次互动后必须使用 `replace` 更新第一人称心声。'
              - '**禁止**神化{{user}}和角色精神崩溃、奴化'
              - 措辞有张力，符合“台词”特性
          衣着/神态样貌/动作姿势:
            check: |-
              - "正文中有记载时，使用 `replace` 覆盖原字符串。"
          所在房间:
            check: |-
              角色移动（进入/离开/换房）时，必须使用 `replace` 更新本字段。
              - 进入{{user}}所在的**楼层20/2001**也就是庇护所本体时。更新路径示例：{ "op": "replace", "path": "/雪乃/所在房间", "value": "玄关/临时客房A" }
                包含以下区域（严格对照）
                - 玄关/净化/隔离区  "净化/隔离区"是一个整体路径不可分割：示例：  { "op": "replace", "path": "/纪宁/所在房间", "value": "玄关/净化/隔离区" }
                - 玄关/临时客房A
                - 玄关/临时客房B
                - 核心区/客厅（公共区域）
                - 核心区/餐厅/厨房（万象合成终端）
                - 核心区/主卧室
                - 核心区/主浴室
              - 其他公寓房间：使用 `楼层{N}/房间号`（如楼层20/2002、楼层30/3001），操作示例：{ "op": "replace", "path": "/陈宇/所在房间", "value": "楼层20/2003" }
              - 其他户外地点：使用 `户外/地点`（示例：户外/停车场）。
              - 若离开公寓/位置未知：写空字符串 `""`（不要写“无/未知/外出”等非空占位）。
          登场状态:
            type: 登场|离场
            check:
              - 你必须根据角色是否在场使用 `replace` 切换 '登场' 或 '离场'。
              - 剧情明确离开/明确不在场/位置未知（所在房间写空字符串 ""）→ '离场'
              - 与{{user}}本轮有互动 → '登场'
              - 与{{user}}本轮无互动或未提及 → 默认 '离场'
              - 【庇护所内部例外】若角色所在房间属于庇护所内部（玄关/**、核心区/**、楼层20/2001），且剧情未明确离开 → 可默认
                '登场'
        死亡处理:
          check:
            - '健康值为 0 触发死亡'
            - '死亡时联动写明【健康更新（死亡）原因】'
            - '角色死亡时，使用 `replace` 将文本类字段置空；保留姓名与死亡状态。'
            - '刚结算为死亡的角色，正文中应予以播报，提醒玩家角色死亡'
    临时NPC:
      check: |-
        - 新登场：使用 `insert` 在 `/临时NPC/` 下创建以姓名（或昵称）为 Key 的完整对象(参考<[mvu_update]角色变量结构示意>)
          - 关系**初始赋值**限制为拒绝及以下。Imp 值初始为 10。
          - 所在房间：若剧情描述“进入玄关/在玄关等待/未分配房间”，推荐写 `玄关`。
          - 临时NPC死亡：允许使用 `remove` 删除对应路径（避免临时NPC无限膨胀）
          - 可转正：当临时NPC拥有姓名或者成为长期队友/主要角色时，使用remove操作“转正”为顶层主要角色（注意层级对齐）。
          - 临时NPC的变量结构和更新规则与核心角色一致
        - **转正规则**（临时NPC → 顶层主要角色）：
          - 方式A（推荐/显式）：先 `insert /姓名`（value 以临时NPC对象为基础并补齐缺字段），再 `remove /临时NPC/姓名`。
          - 方式B（可选）：`move`：`{ "op": "move", "from": "/临时NPC/姓名", "path": "/姓名" }`。
          - 若顶层已存在同名：禁止覆盖顶层对象；改为 `replace` 并按新数值处理变动了的变量。
  庇护所:
    今日投掷点数:
      check:
        - '脚本解算无需操作'
    庇护所等级:
      type: number
      range: [1, 10]
      check:
        - 发放任务奖励强制升级时，使用 `replace`
        - 需要联动调整【庇护所能力】
    距离上次升级:
      check: 由脚本维护AI无需处理
    庇护所能力:
      type: 'record<string, { name: string, desc: string }>'
      check: |-
        - 由脚本维护AI无需处理
    庇护所能力总述:
      check: 由脚本维护AI无需处理
    接口覆盖等价庇护范围:
      check: 由脚本维护AI无需处理
    接口覆盖范围:
      check: 由脚本维护AI无需处理
    可扩展区域:
      type: '{ 医疗翼: string, 制造工坊: string, 载具格纳库: string }'
      check: '随等级提升，由脚本维护AI无需处理'
    当前生存庇护范围:
      type: 'record<"20"|"19", string[]>'
      check: '本字段只显示，与庇护范围变更联动'
    庇护范围变更:
      type: '{ add?: record<"20"|"19", string[]>, remove?: record<"20"|"19", string[]>, note?: string }'
      check: |-
        - 这是【生存庇护范围】的“写入入口”
        - 操作：使用 `replace` 更新 `/庇护所/庇护范围变更`，value 格式：
            { "add": { "20": ["2002","2006"], "19": ["1902"] }, "remove": { "20": ["2007"], "19": [] }, "note": "可选备注" }
        - 规则：
            - 仅支持楼层 "20"/"19"；房号必须是字符串数组。
            - "2001" 为庇护所本体，默认受庇护；写入会被忽略/剔除。
            - 上限由庇护所等级决定（脚本会自动丢弃超额房间）。
        - 禁止：未接到玩家明示擅自变更
  楼层其他住户:
    言语:
      check: '每检测新的一天，更新。使用 `replace` 更新群体“民意”对{{user}}行为的反应。'
    行为:
      check: '每检测新的一天，使用 `replace` 更新群体基于{{user}}行为而产生的主要行为模式。'
  房间:
    type: 'object（readonly/derived）'
    check: |-
      - 由脚本维护，AI 无需也不应管理
      - **禁止**在 JSONPatch 中输出任何 `/房间/**` 更新（包括 `replace/delta/insert/remove`）
  主线任务:
    当前阶段:
      check: |-
        **阶段名称对照表**：
        - "阶段一：秩序的萌芽"（末日天数 1-10 日）
        - "阶段二：塔内孤王"（末日天数 11-20 日）
        - "阶段三：社区辐射"（末日天数 21-30 日）
        - "最终阶段：新世界的王"（末日天数 31 日之后）
        -
        "**更新规则**：完成所有当前阶段目标后，使用 `replace` 更新为**下一阶段的完整名称**。"
        "示例：当前阶段为「阶段一：秩序的萌芽」，全部目标完成后 → `replace` 为「阶段二：塔内孤王」。"

    阶段目标:
      type: 'record<string, { 描述: string, 当前值: number, 目标值: number }>'
      check: |-
        **阶段目标对照表（严格对照）**：

        **阶段一：秩序的萌芽**
        - key: "肃清20、19、21层的敌对幸存者" → { 描述: "肃清20、19、21层的敌对幸存者", 当前值: 0, 目标值: 3 }
        - key: "庇护至少3个核心女性角色或家庭" → { 描述: "庇护至少3个核心女性角色或家庭", 当前值: 0, 目标值: 3 }
        - key: "完成一个公寓内部的情报碎片任务" → { 描述: "完成一个公寓内部的情报碎片任务", 当前值: 0, 目标值: 1 }

        **阶段二：塔内孤王**
        - key: "垂直统一" → { 描述: "建立覆盖星穹国际公寓1-21层的可执行秩序网络", 当前值: 0, 目标值: 1 }
        - key: "激活生命线" → { 描述: "完成【备用发电机组】的探索与修复", 当前值: 0, 目标值: 1 }
        - key: "技术垄断" → { 描述: "解锁庇护所关键区域至2级（医疗翼/制造工坊）", 当前值: 0, 目标值: 1 }

        **阶段三：社区辐射**
        - key: "冲出牢笼" → { 描述: "在【制造工坊】中研发并建立【载具格纳库】", 当前值: 0, 目标值: 1 }
        - key: "建立前哨" → { 描述: "成功探索公寓外至少一个周边建筑并建立稳定前哨站", 当前值: 0, 目标值: 1 }
        - key: "接触外部势力" → { 描述: "与「拾荒者联盟」建立交易路线或击退「雪狼帮」", 当前值: 0, 目标值: 1 }

        **最终阶段：新世界的王**
        - key: "区域主导" → { 描述: "击溃「雪狼帮」或「方舟」教会中至少一个大型外部势力", 当前值: 0, 目标值: 1 }
        - key: "秩序建立" → { 描述: "建立至少100名幸存者的末日社区并使其高效运转", 当前值: 0, 目标值: 1 }
        - key: "文明火种" → { 描述: "庇护所至少三个关键区域升级至顶级", 当前值: 0, 目标值: 1 }

        **更新规则**：
        - **进度累加**：根据剧情进展，使用 `delta` 累加对应目标的 `当前值`。
        - **目标达成判定**：当 `当前值 >= 目标值` → 目标完成。
        - **状态标记**：目标完成后，使用 `replace` 将 `目标完成状态` 中对应的 key 设为 `true`。
        - **阶段升级**：当 `目标完成状态` 中**所有目标均为 true** → 触发阶段升级。

    目标完成状态:
      type: 'record<string, boolean>'
      check: |-
        - **格式**：`{ "0": false, "1": false, "2": false }`
        - **key 对应关系**：key `"0"` = 阶段目标数组中的**第一个**目标，key `"1"` = 第二个，key `"2"` = 第三个
        - **操作**：目标完成后，使用 `replace` 将对应 key 设为 `true`
        - **示例**：
          - 完成第一个目标"肃清20、19、21层的敌对幸存者" → `{ "op": "replace", "path": "/主线任务/目标完成状态/0", "value": true }`
          - 当 `0/1/2` 全部为 `true` → 阶段完成 → 下一轮应更新 `当前阶段`

    情报碎片:
      type: 'record<string, { 编号: string, 描述: string, 价值: string, 风险: string, 状态: 未探索|已探索|已完成 }>'
      check: |-
        **状态流转**：未探索 → 已探索 → 已完成

        **状态更新规则**：
        - **发现线索**（首次获得情报）：使用 `insert` 添加新碎片，状态设为 "未探索"
        - **开始探索**（玩家决定探索）：使用 `replace` 将状态改为 "已探索"
        - **完成探索**（成功获取奖励）：使用 `replace` 将状态改为 "已完成" → **必须同步发放奖励**

        **奖励发放（状态变为"已完成"时强制执行）**：
        1. **能力奖励**：若【价值】含技术解锁 → `insert` 到 `/庇护所/庇护所能力`
           - 名称必须与 <庇护所升级能力列表> 对齐（如"非致命防御制造器"、"轻型军火熔炉"）
        2. **关系奖励**：若【价值】含"强制调整为性奴" → `delta` Imp 至 100
        3. **心声同步**：`replace` 角色的 `内心想法`，反映心理转化

        **主线碎片链式更新**（INFO-M 前缀）：
