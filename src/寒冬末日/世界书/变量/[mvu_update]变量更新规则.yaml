    情报碎片:
      type: 'record<string, { 编号: string, 描述: string, 价值: string, 风险: string, 状态: 未探索|已探索|已完成 }>'
      check: |-
        **状态流转**：未探索 → 已探索 → 已完成

        **状态更新规则**：
        - **发现线索**（首次获得情报）：使用 `insert` 添加新碎片，状态设为 "未探索"
        - **开始探索**（玩家决定探索）：使用 `replace` 将状态改为 "已探索"
        - **完成探索**（成功获取奖励）：使用 `replace` 将状态改为 "已完成" → **必须同步发放奖励**

        **奖励发放（状态变为"已完成"时强制执行）**：
        1. **能力奖励**：若【价值】含技术解锁 → `insert` 到 `/庇护所/庇护所能力`
           - 名称必须与 <庇护所升级能力列表> 对齐（如"非致命防御制造器"、"轻型军火熔炉"）
        2. **关系奖励**：若【价值】含"强制调整为性奴" → `delta` Imp 至 100
        3. **心声同步**：`replace` 角色的 `内心想法`，反映心理转化

        **主线碎片链式更新**（INFO-M 前缀）：
        - 完成主线类碎片后，**必须** `replace` 替换为一个符合下一阶段需求的新碎片
        - 确保引导链不中断

        **类别对齐示例**：
        - 主线类：解锁绝对权限（电梯、能源、监控）
        - 人物类：基于档案补丁的致命打击（真相暴击、信仰坍塌、守护权转交）
        - 扩展类：量化资源名额（如20层同步名额永久+2）
        - 娱乐类：亚音频引导、潜意识意志瓦解、数字天堂色情全息化
        - 性爱类：解锁极端调教服饰与多人共侍权限

        **禁止**：不要重复添加已存在的情报碎片
