          - "阶段二：物资囤积与能源储备"（灾变前2个月-前1个月）
          - "阶段三：秩序建立与生产重建"（灾变前最后1个月）
        - B/C档（末日降临后）:
          - "阶段一：秩序的萌芽"（末日天数 1-10 日）
          - "阶段二：塔内孤王"（末日天数 11-20 日）
          - "阶段三：社区辐射"（末日天数 21-30 日）
          - "最终阶段：新世界的王"（末日天数 31 日之后）
        -
        "**更新规则**：完成所有当前阶段目标后，使用 `replace` 更新为**下一阶段的完整名称**。使用 EJS 条件 `worldModeId` 识别当前档位以选择正确的阶段名称链。"
        "示例：A档 当前阶段为「阶段一：先知说服与核心圈组建」，全部目标完成后 → `replace` 为「阶段二：物资囤积与能源储备」。"

    阶段目标:
      type: 'record<string, { 描述: string, 当前值: number, 目标值: number }>'
      check: |-
        **阶段目标对照表（严格对照）**：

        **A档 — 阶段一：先知说服与核心圈组建**
        - key: "说服信任建立" → { 描述: "Imp≥40角色数量达到3人", 当前值: 0, 目标值: 3 }
        - key: "女性角色攻略" → { 描述: "完成至少3名女性角色的攻略/说服任务", 当前值: 0, 目标值: 3 }
        - key: "发电设备采购" → { 描述: "完成可覆盖全公寓功率的发电设备采购与安装", 当前值: 0, 目标值: 1 }

        **A档 — 阶段二：物资囤积与能源储备**
        - key: "物资品类覆盖" → { 描述: "完成六大类生存物资储备", 当前值: 0, 目标值: 6 }
        - key: "独立能源储备" → { 描述: "建立完全独立于市政的能源储备系统", 当前值: 0, 目标值: 1 }
        - key: "团队扩张" → { 描述: "Imp≥40角色数量达到5人", 当前值: 0, 目标值: 5 }

        **A档 — 阶段三：秩序建立与生产重建**
        - key: "管理班底成型" → { 描述: "Imp≥40角色数量达到6人", 当前值: 0, 目标值: 6 }
        - key: "秩序体系搭建" → { 描述: "完成管理秩序体系建设（分工+分配+应急SOP）", 当前值: 0, 目标值: 1 }
        - key: "生产重建蓝图" → { 描述: "完成灾后生产秩序重建方案（时间线+生产链节点）", 当前值: 0, 目标值: 1 }

        **B/C档 — 阶段一：秩序的萌芽**
        - key: "建立基础安全秩序" → { 描述: "时间过去4日而未被任何攻击击垮", 当前值: 0, 目标值: 4 }
        - key: "3个角色Imp超过50" → { 描述: "庇护至少3个核心女性角色或家庭", 当前值: 0, 目标值: 3 }
        - key: "完成一情报碎片任务" → { 描述: "完成一个公寓内部的情报碎片任务", 当前值: 0, 目标值: 1 }

        **B/C档 — 阶段二：扩大搜索**
        - key: "恢复供暖供电" → { 描述: "通过庇护所庇护范围扩充为2001以外的1个房间提供庇护", 当前值: 0, 目标值: 1 }
        - key: "激活万象合成终端的-医疗模块'c" → { 描述: "万象合成终端医疗模块中的一次药品制作", 当前值: 0, 目标值: 1 }
        - key: "技术垄断" → { 描述: "解锁庇护所任意扩展区域（医疗翼/制造工坊/载具格纳库）", 当前值: 0, 目标值: 1 }

        **更新规则**：
        - **进度累加**：根据剧情进展，使用 `delta` 累加对应目标的 `当前值`。
        - **目标达成判定**：当 `当前值 >= 目标值` → 目标完成。
        - **状态标记**：目标完成后，使用 `replace` 将 `目标完成状态` 中对应的 key 设为 `true`。
        - **阶段升级**：当 `目标完成状态` 中**所有目标均为 true** → 触发阶段升级。

    目标完成状态:
      type: 'record<string, boolean>'
      check: |-
        - **格式**：`{ "0": false, "1": false, "2": false }`
        - **key 对应关系**：key `"0"` = 阶段目标数组中的**第一个**目标，key `"1"` = 第二个，key `"2"` = 第三个
        - **操作**：目标完成后，使用 `replace` 将对应 key 设为 `true`
        - 目标升级奖励：所有在场角色无视上限额外增加Imp20
        - 阶段升级奖励：庇护所立即升级1级
        - **示例**：
          - 完成第一个目标"肃清20、19、21层的敌对幸存者" → `{ "op": "replace", "path": "/主线任务/目标完成状态/0", "value": true }`
          - 当 `0/1/2` 全部为 `true` → 阶段完成 → 下一轮应更新 `当前阶段`
