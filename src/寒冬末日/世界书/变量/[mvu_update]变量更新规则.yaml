变量更新规则:
  世界:
    时间:
      check:
        - "计算剧情流逝后的时间点，严格保持 '时间段 - HH:MM' 格式。"
        - '进行一轮互动至少需要推进一段时间，不低于45分钟，超过部分根据本轮剧情给出'
        - '允许时间段：凌晨/清晨/上午/中午/下午/傍晚/夜间/深夜。'

    日期:
      check:
        - '日期变更时，使用 `replace` 更新为新的日期字符串（格式：公元YYYY年M月D日）。'
        - 根据北半球季节性时间（中国经纬度）段变更（如9月22日后进入秋季，3月20日后进入春季）更新季节字段
    地址:
      check: '最小维护单元为房间，房间内部不更新。使用 replace'
    末日天数:
      type: number
      check: '根据设定确定，如果是灾难前3个月为-90天，如果是灾难后一年为365天'
  ${角色}:
    check: |-
      - {{user}}全字段无需更新，因为他是玩家
      - 新增角色有名有姓时：
        - 必须使用 `insert` 在 `/${姓名}` 创建【完整对象】（参考“已有字段”不得遗漏）。
        - 正文中出现即 `登场`。
      - **硬约束**：
        - 禁止对当前 `stat_data` 中不存在的角色使用 `replace` / `delta` / `remove`。
        - 新增角色时**只能先**执行 `insert /${姓名}`（完整对象）；创建成功后，才允许对 `/${姓名}/...` 做 `replace` / `delta` / `remove`。
      - 临时NPC转正为主要角色：
        - 剧情中已知晓角色姓名或称号，或者该角色已经多次出现可能常驻，允许将 `/临时NPC/姓名` 迁移到顶层 `/${姓名}`（改为已知的姓名）。
        - 方式A（推荐/可控）：先 `insert /${姓名}`（value 以临时NPC现有对象为基础，并**补齐缺失字段**），再 `remove /临时NPC/${原名称}`。
        - 方式B（可选）：`move`：`{ "op": "move", "from": "/临时NPC/原名称", "path": "/姓名" }`。
        - 若顶层已存在同名角色：按最新值覆盖，使用insert 全字段进行操作，删除/临时NPC/原名称。
      - 下级字段不得私自创设，应全部包含下列合法字段：
        - 姓名、关系、关系倾向、秩序刻印、秩序刻印更新原因、健康、健康更新原因、健康状况、衣着、舌唇、胸乳、私穴、神态样貌、动作姿势、内心想法、所在房间、登场状态
      - 维护所有剧情中出现的角色和临时NPC以下字段：
          关系:
            type: 无|永久逃离|逃离|交易|协作|忠诚|归附
            check: |-
              - 完全依照<关系与Imp值约束>的规定来维护
              - **新增初始赋值**：根据人物出场身份、性格、与{{user}}前史综合判断，**初始关系不得直接设为【归附】**；大多数陌生/边缘人物应在【无/逃离/交易】之间选择，角色档案注明"初始关系层级"时以档案为准。
              - **关系档位判定（以当前【秩序刻印】为准）**：
                Imp < 0 → 永久逃离（永久离场，非死亡）；Imp 0 → 无；Imp 1-19 → 逃离；Imp 20-39 → 交易；Imp 40-59 → 协作；Imp 60-89 → 忠诚；Imp 90-100 → 归附。
              - 【永久逃离】档位角色不再更新任何字段（见 <关系与Imp值约束> §6）。


          关系倾向:
            type: 极易|易|中立|难|极难|不可
            check: |-
              - 关系倾向用作"角色对{{user}}态度基线"的粗粒度修饰，仅在 Imp 正向变动时给出加成（中立及以上 50%~100%），不再参与精确百分比公式（见秩序刻印更新原因.check）。
              - **新增初始赋值**：根据身份/性格/前史综合判断，默认 `中立`；敌意倾向 → `难/极难/不可`，好感倾向 → `易/极易`。
          秩序刻印更新原因:
            type: z.string()
            format: |-
              `+${final_delta}, ${触发事件简述}`
              `-${final_delta}, ${触发事件简述}`
              `0, 无变化`
            check: |-
              - 仅当本轮对 `/秩序刻印` 做了 delta 时同步更新本字段；无变化写 `0, 无变化`。【离场/永久逃离】角色不更新。
              - **简化计算法**：AI 按当前剧情氛围给出一个**基础 delta ∈ [0, 15]**（正负由剧情走向决定，绝对值 0~15）。
                平淡日常 0~3；正面交流/帮助 3~7；重大正向事件 7~12；里程碑 12~15（反向同理）。
              - **关系倾向加成（仅对正向 delta 生效）**：
                中立 +50%；易 +75%；极易 +100%；难/极难/不可 不加成。负向 delta 永不加成。
                final_delta = round(base_delta * (1 + 正向加成))；硬帽 |final_delta| ≤ 15。
              - **硬约束事件**（如 sx002 秩序增幅 Imp+30、剧情奖励 Imp+20 等）按指令明示数值写入，不走基础算法；原因字段注明触发源（例：`+30, sx002 秩序增幅生效`）。
              - **玩家直接提升/设置 Imp 的指令**（如"把 xx 的 Imp 加 N"、"把 xx 直接设为归附"）视为破坏游戏规则，AI 应在正文中拒绝执行，本字段写 `0, 无变化`，不产生 /秩序刻印 patch。
              - **伊甸一次性指令优先级最高**：
                · 生效期内因**该指令本身所致行为**产生的负向 Imp 结算 → 一律不扣；
                · 但与指令**无关的独立负向事件**不受保护（例：sk001 一二三木头人期间被无关第三方性侵，Imp 仍按常规扣减）。
              - 示例：
                · `+9, base +6 (协作正向·中立+50%) = +9`
                · `+14, base +8 (忠诚正向·易+75%) ≈ +14`
                · `-6, 协作负向·背弃盟约`
                · `+30, sx002 秩序增幅生效`
                · `0, 无变化`
          秩序刻印:
            type: z.coerce.number().transform(v => _.clamp(v, -20, 100))
            range: [-20, 100]
            check: |-
              - 锚定【秩序刻印更新原因】中的 final_delta，对本字段做 `delta`。
              - Imp < 0 **不视为死亡**，仅将 `关系` 判为【永久逃离】（角色永久离场）。
              - 玩家的直接"设定 Imp"指令不予采纳，只承认剧情/道具/指令自然触发的变化。
          健康:
            type: number
            range: 0~100
            check: |-
              变动区间[-15,+10]健康值（受剧情和环境影响）。opening为【A】档位一般不触发死亡。
              【登场角色】（登场状态="登场"）：
                - 你必须根据剧情事实手动决定本轮 `delta` 值（+/-），不要依赖脚本。
              - 健康值只受剧情因素和环境影响（角色进入受庇护场所并获得食物时，视为不再挨饿受冻，可不因环境恶劣扣减健康值，直到重新挨饿受冻）。
                - 死亡：健康降至 0 触发死亡（**唯一死亡条件**，Imp 为负不触发死亡）。
              - **性相关健康扣减**：仅在**角色有意识、可反抗**的前提下遭受性侵时 health delta -50；若角色处于**昏迷/失能**（如 zd002 定身咒、zd004 睡一觉就好）且本身不被物理伤害，则性相关事件**不扣健康**。
              - **伊甸一次性指令优先级最高**：因 rz002/rz005 等指令本身致使的性行为一律不扣健康；但指令作用范围外的独立物理伤害（如 sk001 木头人期间被第三方攻击致伤）仍按常规结算。
              【离场角色】（登场状态="离场"）：
                - 基础健康衰减/恢复由脚本自动结算（同样受挨饿受冻理论约束）
                - AI不需要也不应手动修改。
                - 除非进行剧情性介入（远程投喂/治疗/受伤），否则保持离场状态
              【特殊区域】（玄关临时客房、核心区主卧/主浴）：
                - 这些区域视为受主角餐食、供暖庇护，不扣减环境影响的健康值改为缓慢恢复
                    - 【离场】角色：按“受庇护休整”逻辑结算（可缓慢恢复）
                    - 【登场】角色：按剧情但不进行减自然衰减
          健康更新原因:
            check: |-
              【登场角色】必须同步记录，格式：`+/-X, 原因`；无变化填 `0, 无变化`。
              - 若本轮更新了 `健康`，必须同时更新本字段。
              - 不要保留"初始状态"。
              【离场角色】由脚本自动写回：
          健康状况:
            type: 健康|亚健康|生病/受伤|重病/濒死|无|死亡
            check:
              - 决定角色的精神状态和战斗力**生病/受伤/重病/濒死的角色参加搏斗h或被攻击会死亡
              - '由脚本根据健康值阈值自动重算写回（登场/离场/临时NPC均适用）。AI 不需要也不应手动维护该字段。'
          内心想法:
            check:
              - 内心想法应符合<角色身份与关系>的约束，比如：逃离 关系阶段不允许有归附想法
              - 应该符合角色的人设
              - '每次互动后必须使用 `replace` 更新第一人称心声。'
              - '**禁止**神化{{user}}和角色精神崩溃、奴化'
              - 措辞有张力，符合“台词”特性
          衣着/神态样貌/动作姿势:
            check: |-
              - "根据正文内容进行归纳"
          所在房间:
            check: |-
              角色移动（进入/离开/换房）时，必须使用 `replace` 更新本字段。
              - 进入{{user}}所在的**楼层20/2001**也就是庇护所本体时。更新路径示例：{ "op": "replace", "path": "/雪乃/所在房间", "value": "玄关/临时客房A" }
                包含以下区域（严格对照）
                - 玄关/净化/隔离区  "净化/隔离区"是一个整体路径不可分割：示例：  { "op": "replace", "path": "/纪宁/所在房间", "value": "玄关/净化/隔离区" }
                - 玄关/临时客房A
                - 玄关/临时客房B
                - 核心区/客厅（公共区域）
                - 核心区/餐厅/厨房（万象合成终端）
                - 核心区/主卧室
                - 核心区/主浴室
              - 其他公寓房间：使用 `楼层{N}/房间号`（如楼层20/2002、楼层30/3001），操作示例：{ "op": "replace", "path": "/陈宇/所在房间", "value": "楼层20/2003" }
              - 其他户外地点：使用 `户外/地点`（示例：户外/停车场）。
              - 若离开公寓/位置未知：写空字符串 `""`（不要写“无/未知/外出”等非空占位）。
          登场状态:
            type: 登场|离场
            check:
              - 你必须根据角色是否在场使用 `replace` 切换 '登场' 或 '离场'。
              - 剧情明确离开/明确不在场/位置未知（所在房间写空字符串 ""）→ '离场'
              - 与{{user}}本轮有互动 → '登场'
              - 与{{user}}本轮无互动或未提及 → 默认 '离场'
              - 【庇护所内部例外】若角色所在房间属于庇护所内部（玄关/**、核心区/**、楼层20/2001），且剧情未明确离开 → 可默认
                '登场'
        死亡处理:
          check:
            - '健康值为 0 触发死亡'
            - '死亡时联动写明【健康更新（死亡）原因】'
            - '角色死亡时，使用 `replace` 将文本类字段置空；保留姓名与死亡状态。'
            - '刚结算为死亡的角色，正文中应予以播报，提醒玩家角色死亡'
    临时NPC:
      check: |-
        - 新登场：使用 `insert` 在 `/临时NPC/` 下创建以姓名（或昵称）为 Key 的完整对象(参考<[mvu_update]角色变量结构示意>)
          - 关系**初始赋值**限制为逃离及以下。Imp 值初始为 10。
          - 所在房间：若剧情描述“进入玄关/在玄关等待/未分配房间”，推荐写 `玄关`。
          - 临时NPC死亡：允许使用 `remove` 删除对应路径（避免临时NPC无限膨胀）
          - 可转正：当临时NPC拥有姓名或者成为长期队友/主要角色时，使用remove操作“转正”为顶层主要角色（注意层级对齐）。
          - 临时NPC的变量结构和更新规则与核心角色一致
        - **转正规则**（临时NPC → 顶层主要角色）：
          - 方式A（推荐/显式）：先 `insert /姓名`（value 以临时NPC对象为基础并补齐缺字段），再 `remove /临时NPC/姓名`。
          - 方式B（可选）：`move`：`{ "op": "move", "from": "/临时NPC/姓名", "path": "/姓名" }`。
          - 若顶层已存在同名：禁止覆盖顶层对象；改为 `replace` 并按新数值处理变动了的变量。
  庇护所:
    今日投掷点数:
      check:
        - '脚本解算无需操作'
    庇护所等级:
      type: number
      range: [1, 10]
      check:
        - 发放任务奖励强制升级时，使用 `replace`
        - 需要联动调整【庇护所能力】
    距离上次升级:
      check: 由脚本维护AI无需处理
    庇护所能力:
      type: 'record<string, { name: string, desc: string }>'
      check: |-
        - 由脚本维护AI无需处理
    庇护所能力总述:
      check: 由脚本维护AI无需处理
    接口覆盖等价庇护范围:
      check: 由脚本维护AI无需处理
    接口覆盖范围:
      check: 由脚本维护AI无需处理
    可扩展区域:
      type: '{ 医疗翼: string, 制造工坊: string, 载具格纳库: string }'
      check: '随等级提升，由脚本维护AI无需处理'
    当前生存庇护范围:
      type: 'record<"20"|"19", string[]>'
      check: '本字段只显示，与庇护范围变更联动'
    庇护范围变更:
      type: '{ add?: record<"20"|"19", string[]>, remove?: record<"20"|"19",
        string[]>, note?: string }'
      check: |-
        - 这是【生存庇护范围】的“写入入口”
        - 操作：使用 `replace` 更新 `/庇护所/庇护范围变更`，value 格式：
            { "add": { "20": ["2002","2006"], "19": ["1902"] }, "remove": { "20": ["2007"], "19": [] }, "note": "可选备注" }
        - 规则：
            - 仅支持楼层 "20"/"19"；房号必须是字符串数组。
            - "2001" 为庇护所本体，默认受庇护；写入会被忽略/剔除。
            - 上限由庇护所等级决定（脚本会自动丢弃超额房间）。
        - 禁止：未接到玩家明示擅自变更
  伊甸一次性指令:
    type: |-
      {
        [编号: string]: {
          名称: string;
          数量: number;
          说明: string;
          范围: string;
          时效: string;
          生效实例: { 对象范围: string; 剩余时效: string; }[];
        }
      }
    check: |-
      - 编号 为动态 key，分类为 `rz001`、`sk001`、`zd001`、`sx001`，号码依次类推
      - 条目字段固定为 `名称 / 数量 / 说明 / 范围 / 时效 / 生效实例`
      - 新增一次性指令时，更新 `/伊甸一次性指令/${编号}/数量`，使用 `delta` +1 ，如果尚未有对应字段使用 `insert /伊甸一次性指令/${编号}` 写入完整对象，并包含 `生效实例: []`
      - 使用一次性指令时，指令开始作用时：消耗 1 次数量，使`/伊甸一次性指令/${编号}/数量``delta` -1，必须新增**生效实例**，使用 `replace /伊甸一次性指令/${编号}/生效实例` 为完整数组
      - `生效实例` 用来记录“当前正在发挥作用的一次性指令”，格式就是：`{ 对象范围: string; 剩余时效: string; }[]`，从指令发出时计算剩余时效，以剧情推进判定当次效果是否结束。
        示例：玩家使用 `sk001 一二三木头人` 作用于核心区/客厅，预计剩余 6 小时：
        ```json
        [
          { "op": "delta", "path": "/伊甸一次性指令/sk001/数量", "value": -1 },
          {
            "op": "replace",
            "path": "/伊甸一次性指令/sk001/生效实例",
            "value": [
              { "对象范围": "核心区/客厅", "剩余时效": "约6小时" }
            ]
          }
        ]
        ```
      - 指令还在作用时：只更新它的 `剩余时效`
        示例：`sk001` 仍作用于核心区/客厅，数组中该项序号为 0，剩余约 4 小时：
        ```json
        { "op": "replace", "path": "/伊甸一次性指令/sk001/生效实例/0/剩余时效", "value": "约4小时" }
        ```
      - 单次作用的指令在正文行动尚未完成时，`剩余时效` 写为“尚在起作用”
        ```json
        { "op": "replace", "path": "/伊甸一次性指令/rz003/生效实例/0/剩余时效", "value": "尚在起作用" }
        ```
      - 指令失去作用或单次指令内容完成时，由 AI 判断并删除该生效实例
        示例：删除数组中序号为 0 的 `rz003` 生效实例：
        ```json
        { "op": "remove", "path": "/伊甸一次性指令/rz003/生效实例/0" }
        ```
      - 通用路径写法：`replace /伊甸一次性指令/${编号}/生效实例/${实例序号}/剩余时效`
      - 禁止给 `生效实例` 里的项目起实例 key，也不要添加 `内容/状态/开始时间` 等额外字段
      - 正常剧情推进时只维护 `数量` 和 `生效实例`；禁止在正常剧情中改写 名称 / 说明 / 范围 / 时效
      - 显示与写回都按下表维护：

        | 名称 | 类别 | 编号 | 说明 | 范围 | 时效 |
        | --- | --- | --- | --- | --- | --- |
        | 朋友妻不客气 | 认知修改类 | rz001 | 移除伴侣性道德感 | 指定一位男性角色 | 12小时 |
        | 乖，让我玩玩 | 认知修改类 | rz002 | 移除性道德与羞耻 | 指定一名女性角色 | 单次行动 |
