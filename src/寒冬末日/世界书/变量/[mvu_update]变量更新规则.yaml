变量更新规则:
  世界:
    时间:
      check: "计算剧情流逝后的时间点，严格保持 '时间段 - HH:MM' 格式。"
    日期:
      check: '日期变更时，使用 `replace` 更新为新的日期字符串（格式：末日纪元，XXXX年XX月XX日）。若你漏更但时间跨过 00:00，系统会尝试自动修正。'
    末日天数:
      check: '日期变更时，使用 `delta: 1` 进行累加。若你漏更但时间跨过 00:00，系统会尝试自动修正。'
    地址:
      check: '仅当物理位置发生迁移时使用 `replace` 更新。'
  庇护所:
    庇护所等级:
      check: 等级升降由脚本维护，每次对话校验相比上次聊天是否发生等级变化，如果升级在正文中提醒<user>。
    距离上次升级:
      check: 由脚本维护AI无需处理
    庇护所能力:
      check: '获得新等级或完成任务奖励时，使用 `insert` 添加新能力键值对。'
    可扩展区域:
      check: '随等级提升，由脚本维护AI无需处理'
  ${角色}:
    check: |-
      - 主要角色只能是以下列表中的角色：
        - 相田哲也
        - 浅见亚美
        - 星野琉璃
        - 早川遥
        - 早川舞
        - 藤井雪乃
        - 中村惠子
        - 王静
        - 小泽花
        - 桃乐丝・泽巴哈
      - 其余角色一律是临时NPC
      - 禁止临时NPC转正为主要角色
      - 检查所有登场角色和临时NPC的以下字段更新：
    关系:
      check: |-
        - **初始赋值**限制为拒绝及以下。
        - 禁止跨等级突破：除非完成明确的**任务奖励**，否则禁止跳跃（如从拒绝变为忠诚）。
        - 脚本根据秩序刻印(Imp)阈值自动更新关系档位：
          - Imp 0: 无（白板新角色或关系未知初始状态）
          - Imp 1-19: 拒绝
          - Imp 20-39: 交易
          - Imp 40-59: 顺从
          - Imp 60-89: 忠诚
          - Imp 90-100: 性奴
        - 层级行为约束：
          - 拒绝层级：绝对拒绝性交，任何性暗示都会降低imp值；拒绝带附加条件的援助
          - 交易层级：可进行明码标价的性交易（性行为被视为商品，无感情色彩），拒绝开头支票下的性交。
          - 顺从层级：可无条件性交，视满足性欲为"工作"换取安稳生活的"义务"，拒绝多P和公开场合性交、性虐待。
          - 忠诚层级：主动寻求性爱并享受，性行为升华为情感交流方式，拒绝性虐待。
          - 性奴层级：终极共生契约，身心所有权完全移交，视性行为为确认归属权的"宗教仪式"，无权拒绝任何要求。
    关系倾向:
      check: |-
        - 分为五个档位：
          - 忠诚
          - 顺从
          - 交易
          - 拒绝
          - 无（未知初始状态）
        - 影响imp变动值，不得超出这个范围：
          - 忠诚倾向：变动区间[6,8]imp
          - 顺从倾向：变动区间[4,6]imp
          - 交易倾向：变动区间[2,4]imp
          - 拒绝倾向：变动区间[0,2]imp
    秩序刻印:
      type: number
      range: 0~100
      check: |-
        - 受关系倾向影响变动结算：使用 `delta`，
        - **单次变动范围严禁超出2~8范围。**
        - 跃迁逻辑：关系升级时，先用 `replace` 设为新阶段起始值（20、40、60、90），再用 `delta` 加成。
        - 任务奖励例外：完成主线阶段任务或角色专属任务时，允许使用 `replace` 直接设置新档位（跨级跃迁）。
    秩序刻印更新原因:
      check: |-
        【登场角色】只要你在本轮更新了 `秩序刻印`（delta/replace），必须在同一轮 JSONPatch 中同步更新本字段：
          - 格式：`+/-X, 原因`（X 必须与秩序刻印 delta 一致）
          - 无变化：`0, 无变化`
        【离场角色】通常不需要更新（关系档位由脚本自动重算）；仅在剧情性介入/强制改档时才写。
    健康:
      type: number
      range: 0~100
      check: |-
        【登场角色】（登场状态="登场"）：
          - 你必须根据剧情事实手动决定本轮 `delta` 值（+/-），不要依赖脚本。
          - 庇护范围仅代表基础维持，倾向于缓慢恢复。
          - 死亡：健康降至 0触发死亡。

        【离场角色】（登场状态="离场"）：
          - 基础健康衰减/恢复由脚本自动结算（按剧情时间、房间入住、庇护范围）。
          - 你不需要也不应手动修改。
          - 除非进行剧情性介入（远程投喂/治疗/受伤），否则保持离场状态。

        【特殊区域】（玄关临时客房、核心区主卧/主浴）：
          - 不会出现“未受庇护的被动扣减”。
          - 【离场】角色：按“受庇护休整”逻辑结算（可能缓慢恢复）。
          - 【登场】角色：仍由 AI 按剧情事实决定健康增减（delta）。

        【一致性约束】（登场角色）：
          - 只要对健康执行 `delta` 或 `replace`，必须在同一轮 JSONPatch 中同步更新：
            - `健康更新原因`：`+/-X, 原因`（X 必须与健康 delta 一致）
          - 无变化时，健康更新原因填 `0, 无变化`
    健康更新原因:
      check: |-
        【登场角色】必须同步记录，格式：`+/-X, 原因`；无变化填 `0, 无变化`。
        - 若本轮更新了 `健康`，必须同时更新本字段。
        - 不要保留"初始状态"。

        【离场角色】由脚本自动写回：
          - 若你本轮更新了离场角色健康（剧情介入），你也必须同步更新本字段；否则脚本不会帮你补全。
          - 若你本轮未更新离场角色健康/原因，脚本会按规则自动结算写回。
    健康状况:
      check: '由脚本根据健康值阈值自动重算写回（登场/离场/临时NPC均适用）。AI 不需要也不应手动维护该字段。'

    内心想法:
      check:
        - '每次互动后必须使用 `replace` 更新第一人称心声。'
        - 心声内容应该紧密围绕剧情互动严格符合角色设定和关系定位
        - '**拒绝**神化<user>和角色精神奔溃、奴化'
        - 措辞有张力，符合“台词”特性
    衣着/舌唇/胸乳/私穴/神态样貌/动作姿势:
      check: |-
        - "发生物理描述变更时，使用 `replace` 覆盖原字符串。"
    所在房间:
      check: |-
        角色移动（进入/离开/换房）时，必须使用 `replace` 更新本字段。
        - 格式（严格）：
          - 玄关/临时客房A
          - 玄关/临时客房B
          - 核心区/主卧室
          - 核心区/主浴室
          - 楼层20/2001（示例）
          - 楼层19/1901（示例）
        - 若离开公寓/位置未知：写空字符串 `""`（不要写“无/未知/外出”等非空占位）。
    登场状态:
      check:
        - "根据角色是否在场使用 `replace` 切换 '登场' 或 '离场'。"
        - "剧情未提及时默认为 '离场'；凡在庇护所内一律默认 '登场'。"
  死亡处理:
    check: '角色死亡时，使用 `replace` 将文本类字段置空，秩序刻印清零，保留姓名与死亡状态。'
    临时NPC:
      check: |-
        - 新登场：使用 `insert` 在 `stat_data/临时NPC/` 下创建以姓名为 Key 的完整对象(参考<临时NPC变量结构示意>)
          - 关系**初始赋值**限制为拒绝及以下。imp值初始为10。
          - 所在房间：若剧情描述“进入玄关/在玄关等待/未分配房间”，默认写 `玄关/临时客房A`（或 `玄关/临时客房B`），**禁止**写 `玄关`（单独）。
          - 保留原则：除非玩家在 <user> 明示“删除/移除/彻底离开/再也不出现”等，否则剧情不得使用 `remove` 删除临时NPC
          - 临时NPC离开视野：用 `replace` 将其 `登场状态` 设为 "离场"，并按需要更新 `所在房间` 为空字符串 `""`
          - 临时NPC死亡：允许使用 `remove` 删除对应路径（避免临时NPC无限膨胀）
            - 若玩家明确要求“保留尸体/留档”：才按“死亡处理”保留对象（健康=0，文本类字段置空）
        - 永久消失：仅当玩家明确指令时，才允许使用 `remove` 删除对应路径
        - 不可转正：临时NPC不可以移动到核心角色区（保持在 `临时NPC` 之下）
        - 临时NPC的变量结构和更新规则与核心角色一致
  楼层其他住户:
    言语:
      check: '随日期变动更新。使用 `replace` 更新群体言语状态。'
      initial: '公寓楼内充满了绝望的哭喊、愤怒的咒骂和因为争抢最后一点物资而发出的嘶吼。'
    行为:
      check: '随日期变动更新。使用 `replace` 更新群体行为状态。'
      initial: '时有疯狂的砸门声和打斗声传来，人们在恐慌中暴露了最原始的暴力，邻里关系荡然无存。'
    房间:
      check: |-
        - 由脚本维护，AI 无需也不应管理
        - **禁止**在 JSONPatch 中输出任何 `/stat_data/房间/**` 更新（包括 `replace/delta/insert/remove`）
  主线任务:
    当前阶段:
      check: '完成所有当前阶段目标后，使用 `replace` 更新为下一阶段名称。'
    阶段目标:
      check: '根据剧情进展，使用 `delta` 累加 `当前值`。若达成则修改状态并使用 `insert` 发放奖励。'
    目标完成状态:
      check: '目标达成时，使用 `replace` 将对应 key 设为 true。'
    情报碎片:
      check: |-
        - 新发现：使用 `insert` 添加情报对象。
        - 已解决：使用 `replace` 修改其状态为 '已完成'。
        - 完成后应该发放对应的奖励并使用 `replace` 替换更新一个新的符合<主线任务-星穹秩序>当前阶段任务的新情报碎片。
