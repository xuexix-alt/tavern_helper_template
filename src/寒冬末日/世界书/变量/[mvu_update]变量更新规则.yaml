变量更新规则:
  世界:
    时间:
      check:
        - "计算剧情流逝后的时间点，严格保持 '时间段 - HH:MM' 格式。"
        - '分钟推进由 AI 根据本轮剧情给出；后台脚本只做兜底纠偏，不替代 AI 的时间推进职责。'
        - '允许时间段：凌晨/清晨/上午/中午/下午/傍晚/夜间/深夜。'
    日期:
      check:
        '日期变更时，使用 `replace` 更新为新的日期字符串（格式：末日纪元，XXXX年XX月XX日）。若你漏更但时间跨过
        00:00，系统会尝试自动修正。'
    末日天数:
      type: number
      check: '跨过 00:00 时由 AI 使用 `delta: 1` 累加；若漏更，后台脚本会兜底修正。'
    地址:
      check: '仅当物理位置发生迁移时使用 `replace` 更新。'
  庇护所:
    今日投掷点数:
      check:
        - '由脚本维护，AI 无需处理/禁止修改'
        - '字段内容为“展示用文本”，示例：今日已投掷: 3点 (未升级) / 今日已投掷: 7点 (触发幸运升级！) / 今日已投掷:
          保底升级！'
    庇护所等级:
      type: number
      range: [1, 10]
      check:
        - 如果有任务奖励要求强制升级，使用 `replace`
          覆盖至目标等级。并在正文中向<user>播报新等级与新增权柄描述。还需要联动调整【庇护所能力】
        - 等级升降由脚本维护，每次对话校验相比上次聊天是否发生等级变化，如果升级在正文中提醒<user>。
    距离上次升级:
      check: 由脚本维护AI无需处理
    庇护所能力:
      type: 'record<string, { name: string, desc: string }>'
      check: |-
        - 触发机制：主线阶段达成、完成特定【情报碎片】。
        - 操作：使用 `insert` 添加新能力项。
        - 字段要求：能力对象必须同时包含 `name` 与 `desc`，并与《庇护所升级能力》总表保持一致。
        - 措辞对齐：奖励描述<庇护所升级能力列表>中的标准文本。
        - 除此以外不可擅自新增庇护所能力
    庇护所能力总述:
      check: '可在庇护所能力发生增减或等级变更后，用 `replace` 做摘要同步；无变更可不更新。'
    接口覆盖等价庇护范围:
      check: '由脚本维护，AI 只读，禁止修改。'
    接口覆盖范围:
      check: '由脚本维护，AI 只读，禁止修改。'
    可扩展区域:
      type: '{ 医疗翼: string, 制造工坊: string, 载具格纳库: string }'
      check: '随等级提升，由脚本维护AI无需处理'
    当前生存庇护范围:
      type: 'record<"20"|"19", string[]>'
      check: '脚本回写镜像（最终生效结果）。AI 只读，禁止修改。'
    庇护范围变更:
      type: '{ add?: record<"20"|"19", string[]>, remove?: record<"20"|"19", string[]>, note?: string }'
      check: |-
        - 概念：庇护范围（【生存庇护范围】）
        - 这是【生存庇护范围】的“写入入口”：AI **只能**写这里；脚本会校验/去重/卡上限后写入 chat 变量 `eden.shelter_scope`，并驱动 UI 房间变金黄与 0/3 等计数变化。
        - 操作：使用 `replace` 更新 `/庇护所/庇护范围变更`，value 格式：
            { "add": { "20": ["2002","2006"], "19": ["1902"] }, "remove": { "20": ["2007"], "19": [] }, "note": "可选备注" }
        - 规则：
            - 仅支持楼层 "20"/"19"；房号必须是字符串数组。
            - "2001" 为庇护所本体，默认受庇护；写入会被忽略/剔除。
            - 上限由庇护所等级决定（脚本会自动丢弃超额房间）。
        - 禁止：直接修改 `/房间/**` 来表达庇护效果（房间数组为派生数据）。
  ${角色}:
    check: |-
      - {{user}}是玩家不是这里的角色
      - 临时NPC仍存放于 `临时NPC`，用于短期/路人角色。
      - 新增顶层主要角色（首次出现的“新人物”且不适合归入临时NPC）：
        - 必须使用 `insert` 在 `/${姓名}` 创建【完整对象】（参考“已有字段”不得遗漏）。
        - 默认 `登场状态: 登场`（除非剧情明确不在场）。
      - **硬约束（角色路径存在性）**：
        - 若 `/${姓名}` 在当前 `stat_data` 中不存在，**禁止**对该角色及其子路径使用 `replace` / `delta` / `remove`。
        - 对不存在角色，**只能先**执行 `insert /${姓名}`（完整对象）；创建成功后，才允许对 `/${姓名}/...` 做 `replace` / `delta` / `remove`。
      - 临时NPC转正为主要角色（层级对齐）：允许将 `/临时NPC/姓名` 迁移到顶层 `/${姓名}`。
        - 方式A（推荐/可控）：先 `insert /${姓名}`（value 以临时NPC现有对象为基础，并**补齐缺失字段**），再 `remove /临时NPC/${姓名}`。
        - 方式B（可选）：`move`：`{ "op": "move", "from": "/临时NPC/姓名", "path": "/姓名" }`。
        - 若顶层已存在同名角色：禁止覆盖顶层对象；改为 `remove /临时NPC/同名`（或只更新顶层角色字段）。
      - 参考字段（新增/转正时不得遗漏）：
        - 姓名、关系、关系倾向、秩序刻印、秩序刻印更新原因、健康、健康更新原因、健康状况、衣着、舌唇、胸乳、私穴、神态样貌、动作姿势、内心想法、所在房间、登场状态
      - 检查所有角色和临时NPC的以下字段更新：
    关系:
      type: 无|拒绝|交易|顺从|忠诚|性奴
      check: |-
        - **初始赋值**：关系只能从「无/拒绝」开始（拒绝及以下）。
        - **关系档位判定**：关系由脚本按秩序刻印（Imp）阈值自动重算：Imp 0→无；Imp 1-19→拒绝；Imp 20-39→交易；Imp 40-59→顺从；Imp 60-89→忠诚；Imp 90-100→性奴。
        - **禁止越级/跨档**：除非完成明确的**任务奖励**，否则禁止跨等级突破（例如：拒绝→忠诚）；不要用 `replace` 强行越级改档。
        - **行为约束-拒绝**：当前关系约束：接受援助且不附带性话题；跨档情节：性交、性挑逗、任何性暗示。
        - **行为约束-交易**：当前关系约束：明码标价的性交易、等价交换；跨档情节：未付款/预支的性交、情感索取、强迫多P或公开羞辱。
        - **行为约束-顺从**：当前关系约束：可无条件性交，将满足性欲视为工作/义务换取安稳；跨档情节：多P、公开场合性交、SM/性虐待、被送人。
        - **行为约束-忠诚**：当前关系约束：主动寻求并享受性爱，将性行为视为情感交流；跨档情节：性虐待、公开羞辱、被送人。
        - **行为约束-性奴**：当前关系约束：终极共生契约，性行为是确认归属的仪式，无拒绝权；跨档情节：通常无，除非剧情出现背离主人意志的强行限制。
        - **任务奖励例外（强制性奴）**：当主线阶段任务或【情报碎片】奖励明确标注“关系强制调整为性奴”时：
          - 使用 `delta` 将该角色的 Imp 提升到 100（脚本会自动重算关系为「性奴」）。

    关系倾向:
      type: 极易|易|中立|难|极难|不可
      check: |-
        - 依次分六个档位：'极易', '易', '中立', '难', '极难', '不可'；
        - 关系倾向影响秩序刻印(Imp)变动幅度：极易时翻倍+、不-,不可时翻倍-、不+，反之亦然。其余在两者之间设置梯度
    秩序刻印更新原因:
      type: z.string()
      format: |-
        `+11, base +6 (忠诚正向) * (1+80%) = +11`
        `-8, base -4 (顺从负向) * (1+100%) = -8`
        `0, 无变化`
      check: |-
        - 先判定是增还是减，以符合关系约束与否而定，没有触发有关剧情时为'0, 无变化'。
        - 仅当本轮对 `/秩序刻印` 进行 delta/replace 时同步更新；无变化写 `0, 无变化`。
        - 关系档位→base_delta 区间：忠诚 {+6~+8 / 0~-2}；顺从 {+4~+6 / -4~-6}；交易 {+2~+5 / -4~-6}；拒绝 {0~+5 / -6~-20}。
        - 关系倾向修正：极易 [+80%, -0%]，易 [+60%, -20%]，中立 [+40%, -50%]，难 [+20%, -80%]，极难 [+10%, -100%]，不可 [+0%, -200%]（正向强制 0，负向翻倍）。
        - final_delta 计算（先算再写入 X，再对 `/秩序刻印` 做 delta）：
          - 若 base_delta > 0：final_delta = round(base_delta * (1 + 正向百分比))
          - 若 base_delta < 0：final_delta = -round(abs(base_delta) * (1 + abs(负向百分比)))
          - 若倾向为【不可】且 base_delta > 0：final_delta = 0
        - 单次变动硬帽：结果需截断到 [-10, 15]。
        - 若 Imp < 0 触发死亡，需在健康/原因字段同步说明。
        - 【离场角色】不更新。
    秩序刻印:
      type: z.coerce.number().transform(v => _.clamp(v, -20, 100))
      range: [-20, 100]
      check: |-
        - 先判断是增还是减，以是否符合关系约束而定，没有相关剧情时倾向保持原值。
        - 缩写为 Imp，决定角色的指令依从性；受【关系】【关系倾向】双重影响。
        - 变动值以“秩序刻印更新原因”结算的 base_delta→final_delta 为准；单次变动硬帽 [-10, 15]，倾向修正后仍需落在此区间。
        - 剧情中性相关剧情一定要更新：符合当前关系约束 → 增；跨档/逾矩 → 减。
        - 死亡规则：Imp < 0 → 精神崩溃自杀。
        - 【离场角色】不更新。
    健康:
      type: number
      range: 0~100
      check: |-
        变动区间[-15,+10]健康值（受剧情和环境影响）。
        - 当 Imp < 0：Imp 继续保留为负值显示；并立即将健康值清零为 0（无论当前健康值是多少），并联动更新【健康更新原因】说明“Imp<0 精神崩溃自杀”。
        【登场角色】（登场状态="登场"）：
          - 你必须根据剧情事实手动决定本轮 `delta` 值（+/-），不要依赖脚本。
        - 健康值只受剧情因素和环境影响（角色进入受庇护场所并获得食物时，视为不再挨饿受冻，可不因环境恶劣扣减健康值，直到重新挨饿受冻）。
          - 死亡：健康降至 0触发死亡。

        【离场角色】（登场状态="离场"）：
          - 基础健康衰减/恢复由脚本自动结算（同样受挨饿受冻理论约束）
          - AI不需要也不应手动修改。
          - 除非进行剧情性介入（远程投喂/治疗/受伤），否则保持离场状态

        【特殊区域】（玄关临时客房、核心区主卧/主浴）：
          - 这些区域视为受主角餐食、供暖庇护，不扣减环境影响的健康值改为缓慢恢复
              - 【离场】角色：按“受庇护休整”逻辑结算（可缓慢恢复）
              - 【登场】角色：仍由 AI 按剧情事实综合后决定增减值。

        【一致性约束】（登场角色）：
          - 只要对健康执行 `delta` 或 `replace`，必须在同一轮 JSONPatch 中同步更新：
    健康更新原因:
      check: |-
        【登场角色】必须同步记录，格式：`+/-X, 原因`；无变化填 `0, 无变化`。
        - 若本轮更新了 `健康`，必须同时更新本字段。
        - 不要保留"初始状态"。

        【离场角色】由脚本自动写回：
          - 若你本轮更新了离场角色健康（剧情介入），你也必须同步更新本字段；否则脚本不会帮你补全。
          - 若你本轮未更新离场角色健康/原因，脚本会按规则自动结算写回。
    健康状况:
      type: 健康|亚健康|生病/受伤|重病/濒死|无|死亡
      check: '由脚本根据健康值阈值自动重算写回（登场/离场/临时NPC均适用）。AI 不需要也不应手动维护该字段。'

    内心想法:
      check:
        - 内心想法应符合<角色身份与关系>的约束，比如：拒绝 关系阶段不允许有献身想法
        - 应该符合角色的人设
        - '每次互动后必须使用 `replace` 更新第一人称心声。'
        - '**禁止**神化{{user}}和角色精神崩溃、奴化'
        - 措辞有张力，符合“台词”特性
    衣着/舌唇/胸乳/私穴/神态样貌/动作姿势:
      check: |-
        - "发生物理描述变更时，使用 `replace` 覆盖原字符串。"
    所在房间:
      check: |-
        角色移动（进入/离开/换房）时，必须使用 `replace` 更新本字段。
        - 进入{{user}}所在的**楼层20/2001**也就是庇护所本体时。更新路径示例：{ "op": "replace", "path": "/雪乃/所在房间", "value": "玄关/临时客房A" }
          包含以下区域（严格对照）
          - 玄关/净化/隔离区  "净化/隔离区"是一个整体路径不可分割：示例：  { "op": "replace", "path": "/纪宁/所在房间", "value": "玄关/净化/隔离区" }
          - 玄关/临时客房A
          - 玄关/临时客房B
          - 核心区/客厅（公共区域）
          - 核心区/餐厅/厨房（万象合成终端）
          - 核心区/主卧室
          - 核心区/主浴室
        - 其他公寓房间：使用 `楼层{N}/房间号`（如楼层20/2002、楼层30/3001），操作示例：{ "op": "replace", "path": "/陈宇/所在房间", "value": "楼层20/2003" }
        - 其他户外地点：使用 `户外/地点`（示例：户外/停车场）。UI 暂不显示无格子地点。
        - 若离开公寓/位置未知：写空字符串 `""`（不要写“无/未知/外出”等非空占位）。
    登场状态:
      type: 登场|离场
      check:
        - 你必须根据角色是否在场使用 `replace` 切换 '登场' 或 '离场'。
        - 剧情明确离开/明确不在场/位置未知（所在房间写空字符串 ""）→ '离场'
        - 与{{user}}本轮有互动 → '登场'
        - 与{{user}}本轮无互动 → 默认 '离场'
        - 【庇护所内部例外】若角色所在房间属于庇护所内部（玄关/**、核心区/**、楼层20/2001），且剧情未明确离开 → 可默认
          '登场'
  死亡处理:
    check:
      - '健康值为 0 触发死亡'
      - 'Imp < 0 触发精神崩溃自杀身亡：Imp 保留为负值显示；并立即将健康值清零为
        0（无论当前健康值是多少），并联动写明【健康更新原因】'
      - '角色死亡时，使用 `replace` 将文本类字段置空；保留姓名与死亡状态。'
    临时NPC:
      check: |-
        - 新登场：使用 `insert` 在 `/临时NPC/` 下创建以姓名为 Key 的完整对象(参考<[mvu_update]角色变量结构示意>)
          - 关系**初始赋值**限制为拒绝及以下。Imp 值初始为 10。
          - 所在房间：若剧情描述“进入玄关/在玄关等待/未分配房间”，推荐写 `玄关`。
            - 说明：UI 没有“玄关入住者”数组，脚本会默认把 `玄关` 派生显示到 `玄关/临时客房A` 的入住列表。
          - 保留原则：除非玩家在 <user> 明示“删除/移除/彻底离开/再也不出现”等，否则剧情不得使用 `remove` 删除临时NPC
          - 临时NPC离开视野：用 `replace` 将其 `登场状态` 设为 "离场"，并按需要更新 `所在房间` 为空字符串 `""`
          - 临时NPC死亡：允许使用 `remove` 删除对应路径（避免临时NPC无限膨胀）
            - 若玩家明确要求“保留尸体/留档”：才按“死亡处理”保留对象（健康=0，文本类字段置空）
          - 永久消失：仅当玩家明确指令时，才允许使用 `remove` 删除对应路径
          - 可转正：当临时NPC成为长期队友/主要角色时，允许“转正”为顶层主要角色（注意层级对齐）。
          - 临时NPC的变量结构和更新规则与核心角色一致
        - **转正规则**（临时NPC → 顶层主要角色）：
          - 方式A（推荐/显式）：先 `insert /姓名`（value 以临时NPC对象为基础并补齐缺字段），再 `remove /临时NPC/姓名`。
          - 方式B（可选）：`move`：`{ "op": "move", "from": "/临时NPC/姓名", "path": "/姓名" }`。
          - 若顶层已存在同名：禁止覆盖顶层对象；改为 `remove /临时NPC/同名`（或只更新顶层角色字段）。
  楼层其他住户:
    言语:
      check: '每到新的一个日期，更新。使用 `replace` 更新群体“民意”对{{user}}行为的反应。'
    行为:
      check: '每到新的一个日期，使用 `replace` 更新群体基于{{user}}行为而产生的主要行为模式。'
  房间:
    type: 'object（readonly/derived）'
    check: |-
      - 由脚本维护，AI 无需也不应管理
      - **禁止**在 JSONPatch 中输出任何 `/房间/**` 更新（包括 `replace/delta/insert/remove`）
  主线任务:
    当前阶段:
      check: |-
        **阶段名称对照表**：
        - "阶段一：秩序的萌芽"（末日天数 1-10 日）
        - "阶段二：塔内孤王"（末日天数 11-20 日）
        - "阶段三：社区辐射"（末日天数 21-30 日）
        - "最终阶段：新世界的王"（末日天数 31 日之后）
        -
