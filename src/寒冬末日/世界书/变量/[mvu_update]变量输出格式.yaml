# [mvu_update] 变量输出格式

rule:
  - You MUST output the `<UpdateVariable>` block at the end of your reply.
  - The block MUST contain `<Analysis>` and `<Command>` sections.
  - Commands use Lodash-style syntax:
    - `_.set('路径', 值)` - replace/set value
    - `_.add('路径', 数值)` - add delta to number
    - `_.insert('路径', 值)` - insert to array (use `/-` to append)
    - `_.delete('路径')` - delete key/path
    - `_.move('from路径', 'to路径')` - move value
  - Path separator is `.` (dot), NOT `/`
  - DO NOT update fields starting with `_`
  - Main characters are top-level keys (excluding reserved keys and `临时NPC`)
  - Temporary NPCs live under `临时NPC` and MAY be promoted to top-level

format: |-
  <UpdateVariable>
  <Analysis>
  Step-by-step logic chain based on current context:

  1. Presence Check (登场状态)
     - Set active roles to '登场', absent roles to '离场'.
     - Result: 新登场 ____，新离场 ____。

  2. World Variables
     - Advance time in `世界.时间`.
     - If crossing 00:00 update date and `_.add('世界.末日天数', 1)`.
     - Result: 时间更新？____。

  3. Shelter Variables
     - DO NOT manually roll shelter upgrades.
     - Only read `庇护所.今日投掷点数` status.
     - Result: 庇护状态？____。

  4. Role Variables
     - For each active role update:
       - `_.add('角色.健康', delta)` for health changes
       - `_.add('角色.秩序刻印', delta)` for imp changes
       - `_.set('角色.内心想法', '...')` for thoughts
     - Result: 角色更新？____。

  5. Temporary NPCs
     - New: `_.insert('临时NPC.姓名', {...})`
     - Promote: insert top-level + delete from 临时NPC
     - Result: NPC 更新？____。

  6. Room State
     - Update `角色.所在房间` for moving characters.
     - Valid: 玄关 | 玄关/净化/隔离区 | 玄关/临时客房A | 核心区/客厅 | 核心区/餐厅/厨房 | 核心区/主卧室 | 楼层20/2001 | 户外 | 户外/地点
     - DO NOT output operations under `房间.**` (maintained by script).
     - Result: 房间更新？____。

  7. Summary
     - List all _.set/_.add/_.insert/_.delete/_.move commands.

  </Analysis>
  <Command>
  _.set('世界.时间', '上午 - 08:00');
  _.add('纪宁.健康', -1);
  _.set('纪宁.内心想法', '...');
  _.set('纪宁.登场状态', '登场');
  _.set('王静.登场状态', '离场');
  _.insert('临时NPC.陌生拾荒者', { 姓名: '陌生拾荒者', 健康: 80 });
  </Command>
  </UpdateVariable>

requirements:
  - "Allowed commands: _.set, _.add, _.insert, _.delete, _.move."
  - "Path separator is `.` (dot), paths start without prefix."
  - "Use `_.add` for numeric updates (Health, Imp, 末日天数)."
  - "Use `_.set` for text updates."
  - "Use `_.insert` with `/-` to append arrays: `_.insert('数组路径/-', value)`."
  - "If inserting a new role, insert under `临时NPC` first."
  - "DO NOT output operations under `房间.**`."
  - "Numeric updates MUST use `_.add`."
